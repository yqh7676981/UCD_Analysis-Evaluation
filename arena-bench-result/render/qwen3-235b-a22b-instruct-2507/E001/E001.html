<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>雅思核心词汇打卡</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background-color: #f5f7fa;
      color: #333;
      padding: 16px;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 20px 0;
      background-color: #4a90e2;
      color: white;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    .progress-container {
      margin-top: 10px;
      font-size: 0.9rem;
    }

    .word-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .card {
      perspective: 1000px;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 160px;
      transform-style: preserve-3d;
      transition: transform 0.6s ease;
      cursor: pointer;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front,
    .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
      text-align: center;
    }

    .card-front {
      background-color: #ffffff;
      color: #333;
    }

    .card-back {
      background-color: #4a90e2;
      color: white;
      transform: rotateY(180deg);
    }

    .word {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .definition {
      font-size: 1rem;
      margin-bottom: 6px;
    }

    .example {
      font-size: 0.9rem;
      font-style: italic;
    }

    .known-btn {
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #5cb85c;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .known-btn:active {
      background-color: #4cae4c;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    .nav-btn {
      flex: 1;
      padding: 12px;
      background-color: #4a90e2;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      margin: 0 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .nav-btn:active {
      background-color: #3a7bc8;
    }

    .day-indicator {
      text-align: center;
      margin: 10px 0;
      font-size: 0.9rem;
      color: #666;
    }

    @media (min-width: 480px) {
      .word-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>雅思核心词汇打卡</h1>
    <div class="progress-container">
      已掌握：<span id="progress-count">0</span>/20
    </div>
  </header>

  <div class="day-indicator">
    第 <span id="day-number">1</span> 天
  </div>

  <div class="word-grid" id="wordGrid"></div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn">上一页</button>
    <button class="nav-btn" id="nextBtn">下一页</button>
  </div>

  <script>
    // 词汇数据（模拟多天数据）
    const vocabularyData = [
      [
        { word: "abandon", definition: "v. 放弃，抛弃", example: "He abandoned his car in the snow." },
        { word: "benefit", definition: "n. 好处 v. 受益", example: "Exercise has many health benefits." },
        { word: "consequence", definition: "n. 结果，后果", example: "One consequence of global warming is rising sea levels." },
        { word: "debate", definition: "n./v. 辩论", example: "They debated the merits of the new policy." },
        { word: "efficient", definition: "adj. 高效的", example: "LED lights are more efficient than traditional bulbs." },
        { word: "flexible", definition: "adj. 灵活的", example: "She has a flexible work schedule." },
        { word: "generate", definition: "v. 产生，创造", example: "The wind turbines generate electricity." },
        { word: "highlight", definition: "v. 强调 n. 最精彩的部分", example: "The report highlights several key issues." },
        { word: "impact", definition: "n./v. 影响", example: "The new law will have a major impact on businesses." },
        { word: "justify", definition: "v. 证明…是正当的", example: "Can you justify spending so much money?" },
        { word: "maintain", definition: "v. 维持，保持", example: "It's important to maintain a healthy diet." },
        { word: "negative", definition: "adj. 负面的", example: "Smoking has many negative effects on health." },
        { word: "objective", definition: "n. 目标 adj. 客观的", example: "Her objective is to become a doctor." },
        { word: "perspective", definition: "n. 观点，视角", example: "From my perspective, the plan is flawed." },
        { word: "relevant", definition: "adj. 相关的", example: "Make sure your answer is relevant to the question." },
        { word: "significant", definition: "adj. 重要的，显著的", example: "There has been a significant increase in prices." },
        { word: "theory", definition: "n. 理论", example: "Darwin's theory of evolution is widely accepted." },
        { word: "underlie", definition: "v. 构成…的基础", example: "Social factors underlie many economic problems." },
        { word: "valid", definition: "adj. 有效的，合理的", example: "Your passport must be valid for at least six months." },
        { word: "yield", definition: "v. 产出，屈服", example: "The farm yields a large harvest each year." }
      ],
      [
        { word: "analyze", definition: "v. 分析", example: "Scientists analyze data to find patterns." },
        { word: "bias", definition: "n. 偏见", example: "Journalists should avoid bias in their reporting." },
        { word: "cite", definition: "v. 引用", example: "Always cite your sources in academic writing." },
        { word: "deduce", definition: "v. 推断", example: "From the evidence, we can deduce that he was lying." },
        { word: "emphasize", definition: "v. 强调", example: "The teacher emphasized the importance of punctuality." },
        { word: "factor", definition: "n. 因素", example: "Cost is an important factor when choosing a university." },
        { word: "global", definition: "adj. 全球的", example: "Climate change is a global issue." },
        { word: "hypothesis", definition: "n. 假设", example: "The scientist tested her hypothesis through experiments." },
        { word: "implement", definition: "v. 实施", example: "The company plans to implement new safety procedures." },
        { word: "interpret", definition: "v. 解释，理解", example: "Different people interpret art in different ways." },
        { word: "justify", definition: "v. 证明…是正当的", example: "How can you justify such behavior?" },
        { word: "locate", definition: "v. 定位，查找", example: "We located the source of the problem quickly." },
        { word: "monitor", definition: "v. 监控", example: "Doctors monitor patients' vital signs carefully." },
        { word: "notion", definition: "n. 概念", example: "The notion of freedom means different things to different people." },
        { word: "observe", definition: "v. 观察", example: "Biologists observe animal behavior in the wild." },
        { word: "participate", definition: "v. 参与", example: "All students are encouraged to participate in class discussions." },
        { word: "quantify", definition: "v. 量化", example: "It's difficult to quantify the benefits of education." },
        { word: "regulate", definition: "v. 管理，调节", example: "Governments regulate industries to protect consumers." },
        { word: "summarize", definition: "v. 总结", example: "Please summarize the main points of the article." },
        { word: "transform", definition: "v. 转变", example: "Technology has transformed the way we communicate." }
      ]
    ];

    // 存储用户进度
    let currentDay = parseInt(localStorage.getItem('ieltsCurrentDay') || '1') - 1;
    const knownStatus = JSON.parse(localStorage.getItem('ieltsKnownStatus')) || {};

    // 初始化当天掌握的单词数
    let knownCount = 0;

    // 渲染单词卡片
    function renderCards() {
      const grid = document.getElementById('wordGrid');
      grid.innerHTML = '';
      const words = vocabularyData[currentDay % vocabularyData.length];
      knownCount = 0;

      words.forEach((item, index) => {
        const cardId = `card-${currentDay}-${index}`;
        const isKnown = knownStatus[cardId] || false;
        if (isKnown) knownCount++;

        const card = document.createElement('div');
        card.className = `card ${isKnown ? 'flipped' : ''}`;
        card.innerHTML = `
          <div class="card-inner">
            <div class="card-front">
              <div class="word">${item.word}</div>
              <button class="known-btn">${isKnown ? '已掌握' : '标记为掌握'}</button>
            </div>
            <div class="card-back">
              <div class="definition">${item.definition}</div>
              <div class="example">${item.example}</div>
            </div>
          </div>
        `;
        grid.appendChild(card);

        // 翻转卡片
        const cardInner = card.querySelector('.card-inner');
        cardInner.parentElement.addEventListener('click', (e) => {
          if (e.target.classList.contains('known-btn')) return;
          card.classList.toggle('flipped');
        });

        // 标记掌握
        const knownBtn = card.querySelector('.known-btn');
        knownBtn.addEventListener('click', () => {
          knownStatus[cardId] = true;
          localStorage.setItem('ieltsKnownStatus', JSON.stringify(knownStatus));
          card.classList.add('flipped');
          knownBtn.textContent = '已掌握';
          updateProgress();
        });
      });

      updateProgress();
      document.getElementById('day-number').textContent = currentDay + 1;
      document.getElementById('prevBtn').disabled = currentDay === 0;
    }

    function updateProgress() {
      document.getElementById('progress-count').textContent = knownCount;
    }

    // 导航事件
    document.getElementById('prevBtn').addEventListener('click', () => {
      if (currentDay > 0) {
        currentDay--;
        localStorage.setItem('ieltsCurrentDay', currentDay + 1);
        renderCards();
      }
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      currentDay++;
      localStorage.setItem('ieltsCurrentDay', currentDay + 1);
      renderCards();
    });

    // 初始渲染
    renderCards();
  </script>
</body>
</html>
