<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>心情日记本</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            line-height: 1.6;
            padding: 15px;
            max-width: 100vw;
            overflow-x: hidden;
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #4a6fa5;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        .diary-section {
            background-color: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #555;
        }

        .mood-options {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .mood-btn {
            padding: 12px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            background-color: #e0e7ff;
            color: #4a6fa5;
            transition: all 0.2s ease;
            width: 45%;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .mood-btn.selected {
            background-color: #4a6fa5;
            color: white;
            transform: scale(1.05);
        }

        .mood-btn:hover {
            opacity: 0.9;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            resize: none;
            margin-bottom: 15px;
        }

        button.save-btn {
            background-color: #4a6fa5;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        button.save-btn:hover {
            background-color: #3a5a8c;
        }

        .report-section {
            background-color: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .chart-container {
            margin-top: 15px;
            height: 200px;
            position: relative;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .chart-bar {
            position: absolute;
            bottom: 0;
            width: 18%;
            background-color: #6b8ed6;
            border-radius: 8px 8px 0 0;
            transition: height 0.6s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .chart-labels {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #666;
        }

        .chart-bar:nth-child(1) { left: 2%; background-color: #8ecae6; }
        .chart-bar:nth-child(2) { left: 21%; background-color: #219ebc; }
        .chart-bar:nth-child(3) { left: 40%; background-color: #ffb703; }
        .chart-bar:nth-child(4) { left: 59%; background-color: #fb8500; }
        .chart-bar:nth-child(5) { left: 78%; background-color: #e63946; }

        .no-data {
            text-align: center;
            color: #aaa;
            font-style: italic;
            padding: 20px 0;
        }

        @media (max-width: 375px) {
            .mood-btn { width: 100%; }
            h1 { font-size: 1.6rem; }
            textarea { height: 80px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>心情日记本</h1>

        <div class="diary-section">
            <label for="mood-text">今天的心情：</label>
            <div class="mood-options">
                <button class="mood-btn" data-mood="开心">😄 开心</button>
                <button class="mood-btn" data-mood="平静">😌 平静</button>
                <button class="mood-btn" data-mood="焦虑">😰 焦虑</button>
                <button class="mood-btn" data-mood="低落">😢 低落</button>
            </div>
            <label for="diary-entry">写点什么吧：</label>
            <textarea id="diary-entry" placeholder="记录今天的点滴..."></textarea>
            <button class="save-btn" id="save-btn">保存今日心情</button>
        </div>

        <div class="report-section">
            <h2>本月心情统计</h2>
            <div class="chart-container" id="chart-container">
                <div class="no-data" id="no-data">暂无数据，记录第一天开始生成图表</div>
                <div class="chart-bar" id="happy-bar" style="display:none;">开心</div>
                <div class="chart-bar" id="calm-bar" style="display:none;">平静</div>
                <div class="chart-bar" id="anxious-bar" style="display:none;">焦虑</div>
                <div class="chart-bar" id="sad-bar" style="display:none;">低落</div>
                <div class="chart-bar" id="other-bar" style="display:none;">其他</div>
            </div>
            <div class="chart-labels">
                <span>开心</span>
                <span>平静</span>
                <span>焦虑</span>
                <span>低落</span>
                <span>其他</span>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const moodButtons = document.querySelectorAll('.mood-btn');
            const diaryInput = document.getElementById('diary-entry');
            const saveBtn = document.getElementById('save-btn');
            const happyBar = document.getElementById('happy-bar');
            const calmBar = document.getElementById('calm-bar');
            const anxiousBar = document.getElementById('anxious-bar');
            const sadBar = document.getElementById('sad-bar');
            const otherBar = document.getElementById('other-bar');
            const noData = document.getElementById('no-data');

            let selectedMood = '';

            // 选择心情标签
            moodButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    moodButtons.forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedMood = btn.getAttribute('data-mood');
                });
            });

            // 加载已有数据
            function loadData() {
                return JSON.parse(localStorage.getItem('moodDiaryData')) || {};
            }

            function saveData(data) {
                localStorage.setItem('moodDiaryData', JSON.stringify(data));
            }

            // 获取当前月份标识
            function getCurrentMonthKey() {
                const now = new Date();
                return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            }

            // 更新图表
            function updateChart() {
                const data = loadData();
                const monthKey = getCurrentMonthKey();
                const monthData = data[monthKey] || {};

                const totalCount = Object.values(monthData).reduce((sum, count) => sum + count, 0);

                if (totalCount === 0) {
                    noData.style.display = 'block';
                    hideAllBars();
                    return;
                }

                noData.style.display = 'none';

                // 显示并设置所有相关柱状图
                const moods = ['开心', '平静', '焦虑', '低落'];
                const bars = [happyBar, calmBar, anxiousBar, sadBar];

                for (let i = 0; i < moods.length; i++) {
                    const mood = moods[i];
                    const bar = bars[i];
                    const count = monthData[mood] || 0;
                    const percentage = (count / totalCount) * 100;

                    bar.style.height = `${percentage}%`;
                    bar.textContent = count.toString();
                    bar.style.display = 'flex';
                }

                // 处理“其他”类别（如果有）
                const otherCount = Object.keys(monthData).filter(mood => !moods.includes(mood))
                    .reduce((sum, mood) => sum + monthData[mood], 0);
                if (otherCount > 0) {
                    const otherPercentage = (otherCount / totalCount) * 100;
                    otherBar.style.height = `${otherPercentage}%`;
                    otherBar.textContent = otherCount.toString();
                    otherBar.style.display = 'flex';
                } else {
                    otherBar.style.display = 'none';
                }
            }

            function hideAllBars() {
                [happyBar, calmBar, anxiousBar, sadBar, otherBar].forEach(bar => {
                    bar.style.display = 'none';
                });
            }

            // 保存数据
            saveBtn.addEventListener('click', () => {
                if (!selectedMood) {
                    alert('请选择一个心情标签！');
                    return;
                }

                const entryText = diaryInput.value.trim();
                const dateKey = new Date().toDateString();
                const monthKey = getCurrentMonthKey();

                const data = loadData();

                // 存储每日条目
                if (!data.entries) data.entries = {};
                data.entries[dateKey] = {
                    mood: selectedMood,
                    text: entryText,
                    timestamp: new Date().toISOString()
                };

                // 统计本月数据
                if (!data[monthKey]) {
                    data[monthKey] = {};
                }
                data[monthKey][selectedMood] = (data[monthKey][selectedMood] || 0) + 1;

                saveData(data);
                updateChart();

                // 重置表单
                moodButtons.forEach(btn => btn.classList.remove('selected'));
                selectedMood = '';
                diaryInput.value = '';
                alert('已保存今日心情！');

                // 触发窗口滚动以查看图表（移动端友好）
                document.querySelector('.report-section').scrollIntoView({ behavior: 'smooth' });
            });

            // 初始化加载
            updateChart();
        });
    </script>
</body>
</html>
