<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>解压气泡 · 爆裂释放</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            background: linear-gradient(135deg, #0c0c2e, #1a1a4e, #0f0f38);
            overflow: hidden;
            touch-action: none;
            -webkit-overflow-scrolling: none;
            overscroll-behavior: none;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            background: transparent;
        }
        #counter {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            pointer-events: none;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 16px;
            border-radius: 30px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="counter">💥 0</div>
    <script>
        // ============================ 初始化 ============================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width = window.innerWidth;
        let height = window.innerHeight;
        let dpr = window.devicePixelRatio || 1;

        function setupCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        setupCanvas();

        // ============================ 状态 ============================
        const bubbles = [];
        const particles = [];
        const shockwaves = [];

        const MAX_BUBBLES = 30;
        const INITIAL_BUBBLES = 18;
        const SPAWN_INTERVAL = 0.7; // 秒
        let spawnAccum = 0;
        let popCount = 0;
        let lastTime = 0;
        let idCounter = 0;

        // 防止触摸和鼠标事件重复
        let ignoreMouse = false;

        // 音频
        let audioCtx = null;

        // ============================ 音效 ============================
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                audioCtx = new AudioContext();
                // 预生成噪声 buffer
                const bufferSize = audioCtx.sampleRate * 0.1;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.25));
                }
                audioCtx._noiseBuffer = buffer;
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playPop(brightness) {
            if (!audioCtx || audioCtx.state !== 'running') return;
            const now = audioCtx.currentTime;
            const baseFreq = 200 + brightness * 500;

            // 主音 (啵)
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(baseFreq, now);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.15, now + 0.09);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.09);

            // 噪声 (爆破感)
            if (audioCtx._noiseBuffer) {
                const noise = audioCtx.createBufferSource();
                noise.buffer = audioCtx._noiseBuffer;
                const gainNoise = audioCtx.createGain();
                gainNoise.gain.setValueAtTime(0.18, now);
                gainNoise.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                noise.connect(gainNoise);
                gainNoise.connect(audioCtx.destination);
                noise.start(now);
                noise.stop(now + 0.09);
            }
        }

        // ============================ 气泡 ============================
        function createBubble() {
            const margin = 6;
            const minR = 12;
            const maxR = Math.min(55, Math.min(width, height) * 0.08);
            const baseR = minR + Math.random() * (maxR - minR);

            // 随机位置 (避免重叠)
            let x, y, valid;
            let attempts = 0;
            const maxAttempts = 60;
            const r = baseR; // 检测时用固定半径，脉动后最大增加2px
            do {
                x = margin + r + Math.random() * (width - 2 * (margin + r));
                y = margin + r + Math.random() * (height - 2 * (margin + r));
                valid = true;
                for (const b of bubbles) {
                    const dx = x - b.x;
                    const dy = y - b.y;
                    const minDist = b.r + r + 6;
                    if (dx * dx + dy * dy < minDist * minDist) {
                        valid = false;
                        break;
                    }
                }
                attempts++;
                if (attempts > maxAttempts) break;
            } while (!valid);

            const hue = Math.random() * 360;
            const sat = 75 + Math.random() * 25;
            const lit = 60 + Math.random() * 25;

            return {
                id: idCounter++,
                x,
                y,
                baseR: baseR,
                r: baseR,
                phase: Math.random() * Math.PI * 2,
                h: hue,
                s: sat,
                l: lit,
                color: `hsl(${hue}, ${sat}%, ${lit}%)`,
                vx: (Math.random() - 0.5) * 1.4,
                vy: (Math.random() - 0.5) * 1.4,
                alive: true
            };
        }

        function spawnBubble() {
            if (bubbles.length >= MAX_BUBBLES) return;
            const b = createBubble();
            if (b) bubbles.push(b);
        }

        function initBubbles(count) {
            for (let i = 0; i < count; i++) spawnBubble();
        }
        initBubbles(INITIAL_BUBBLES);

        // ============================ 粒子 ============================
        function createParticles(x, y, h, s, l, count = 35) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1.5 + Math.random() * 5;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;
                const radius = 1.5 + Math.random() * 4;
                const alpha = 0.7 + Math.random() * 0.3;
                const decay = 0.012 + Math.random() * 0.025;
                // 颜色在色相附近偏移
                const h2 = (h + Math.random() * 50 - 25 + 360) % 360;
                const s2 = Math.min(100, Math.max(0, s + Math.random() * 30 - 15));
                const l2 = Math.min(100, Math.max(0, l + Math.random() * 30 - 15));
                particles.push({
                    x,
                    y,
                    vx,
                    vy,
                    r: radius,
                    color: `hsl(${h2}, ${s2}%, ${l2}%)`,
                    alpha: alpha,
                    decay: decay,
                    life: 1
                });
            }
        }

        // ============================ 冲击波 ============================
        function createShockwave(x, y, color) {
            const maxR = Math.min(width, height) * 0.35;
            shockwaves.push({
                x,
                y,
                r: 3,
                maxR: maxR,
                alpha: 1,
                color: color,
                speed: 4 + Math.random() * 3,
                lineWidth: 2.5 + Math.random() * 3
            });
        }

        // ============================ 更新 ============================
        function updateBubbles(dt) {
            const now = performance.now();
            for (let i = bubbles.length - 1; i >= 0; i--) {
                const b = bubbles[i];
                // 脉动
                b.r = b.baseR + Math.sin(now * 0.003 + b.phase) * 2;
                if (b.r < 2) b.r = 2;

                // 漂移
                b.x += b.vx * dt * 60;
                b.y += b.vy * dt * 60;

                // 边界反弹
                if (b.x - b.r < 0) { b.x = b.r; b.vx *= -1; }
                if (b.x + b.r > width) { b.x = width - b.r; b.vx *= -1; }
                if (b.y - b.r < 0) { b.y = b.r; b.vy *= -1; }
                if (b.y + b.r > height) { b.y = height - b.r; b.vy *= -1; }

                // 随机扰动
                if (Math.random() < 0.015) {
                    b.vx += (Math.random() - 0.5) * 0.25;
                    b.vy += (Math.random() - 0.5) * 0.25;
                    const maxSpd = 1.8;
                    if (Math.abs(b.vx) > maxSpd) b.vx = Math.sign(b.vx) * maxSpd;
                    if (Math.abs(b.vy) > maxSpd) b.vy = Math.sign(b.vy) * maxSpd;
                }
            }
        }

        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt * 60;
                p.y += p.vy * dt * 60;
                p.vy += 0.06 * dt * 60; // 重力
                p.alpha -= p.decay * dt * 60;
                p.r *= (1 - 0.005 * dt * 60);
                if (p.alpha <= 0 || p.r < 0.3) {
                    particles.splice(i, 1);
                }
            }
        }

        function updateShockwaves(dt) {
            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const w = shockwaves[i];
                w.r += w.speed * dt * 60;
                w.alpha = Math.max(0, 1 - (w.r / w.maxR));
                if (w.alpha <= 0 || w.r >= w.maxR) {
                    shockwaves.splice(i, 1);
                }
            }
        }

        // ============================ 绘制 ============================
        function drawBackground() {
            const grad = ctx.createRadialGradient(width * 0.5, height * 0.4, 0, width * 0.5, height * 0.4, Math.max(width, height) * 0.8);
            grad.addColorStop(0, '#1c1c4e');
            grad.addColorStop(0.5, '#13133a');
            grad.addColorStop(1, '#08082a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // 淡淡星光
            ctx.fillStyle = 'rgba(255,255,255,0.05)';
            for (let i = 0; i < 40; i++) {
                const sx = (i * 137.5 + 50) % width;
                const sy = (i * 97.3 + 20) % height;
                const sr = 0.5 + (i % 3) * 0.5;
                ctx.beginPath();
                ctx.arc(sx, sy, sr, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawBubbles() {
            for (const b of bubbles) {
                ctx.save();
                ctx.shadowColor = 'rgba(255,255,255,0.15)';
                ctx.shadowBlur = 20;

                // 径向渐变主体
                const light = `hsl(${b.h}, ${b.s}%, ${Math.min(100, b.l + 15)}%)`;
                const dark = `hsl(${b.h}, ${b.s}%, ${Math.max(0, b.l - 25)}%)`;
                const grad = ctx.createRadialGradient(
                    b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.1,
                    b.x, b.y, b.r
                );
                grad.addColorStop(0, light);
                grad.addColorStop(0.7, dark);
                grad.addColorStop(1, `hsl(${b.h}, ${b.s}%, ${Math.max(0, b.l - 35)}%)`);
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fill();

                // 高光
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(b.x - b.r * 0.25, b.y - b.r * 0.25, b.r * 0.18, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,0.35)`;
                ctx.fill();

                // 边缘光晕
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255,255,255,0.08)`;
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.restore();
            }
        }

        function drawParticles() {
            for (const p of particles) {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 6;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function drawShockwaves() {
            for (const w of shockwaves) {
                ctx.save();
                ctx.globalAlpha = w.alpha * 0.7;
                ctx.strokeStyle = w.color;
                ctx.lineWidth = w.lineWidth;
                ctx.shadowColor = w.color;
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
        }

        // ============================ 交互 ============================
        function handlePointer(x, y) {
            // 从上层到下层 (数组尾部向前)
            for (let i = bubbles.length - 1; i >= 0; i--) {
                const b = bubbles[i];
                const dx = x - b.x;
                const dy = y - b.y;
                if (dx * dx + dy * dy <= b.r * b.r) {
                    // 爆裂!
                    const brightness = Math.min(1, (b.r - 8) / 50);
                    const colorStr = b.color;
                    const px = b.x,
                        py = b.y,
                        ph = b.h,
                        ps = b.s,
                        pl = b.l;
                    bubbles.splice(i, 1);
                    popCount++;
                    document.getElementById('counter').textContent = `💥 ${popCount}`;
                    createParticles(px, py, ph, ps, pl, 20 + Math.floor(b.r * 0.9));
                    createShockwave(px, py, colorStr);
                    initAudio();
                    playPop(brightness);
                    break;
                }
            }
        }

        // 事件绑定
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            ignoreMouse = true;
            initAudio();
            for (let i = 0; i < e.touches.length; i++) {
                const t = e.touches[i];
                handlePointer(t.clientX, t.clientY);
            }
            setTimeout(() => { ignoreMouse = false; }, 350);
        }, { passive: false });

        canvas.addEventListener('mousedown', (e) => {
            if (ignoreMouse) return;
            initAudio();
            handlePointer(e.clientX, e.clientY);
        });

        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        window.addEventListener('resize', () => {
            setupCanvas();
            // 气泡位置保持不变，超出边界会在更新时反弹
        });

        // ============================ 主循环 ============================
        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
            lastTime = timestamp;

            // 补充气泡
            spawnAccum += dt;
            if (spawnAccum >= SPAWN_INTERVAL && bubbles.length < MAX_BUBBLES) {
                spawnAccum -= SPAWN_INTERVAL;
                spawnBubble();
            }

            // 更新
            updateBubbles(dt);
            updateParticles(dt);
            updateShockwaves(dt);

            // 绘制
            drawBackground();
            drawShockwaves();
            drawBubbles();
            drawParticles();

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);

        // 提示
        console.log('💥 解压气泡已启动 — 尽情戳爆它们吧！');
    </script>
</body>
</html>
