<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>喝水追踪</title>
    <style>
        /* ===== Reset & Base ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background: linear-gradient(165deg, #e8f4fc 0%, #d4ecf7 40%, #b8dff0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== App Container ===== */
        .app {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px 40px 32px 32px;
            box-shadow: 0 20px 60px rgba(30, 100, 180, 0.18),
                        0 8px 24px rgba(30, 80, 150, 0.08);
            padding: 28px 24px 32px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }

        /* ===== Header ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 0 4px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-icon {
            font-size: 28px;
            line-height: 1;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: #0a2a44;
            letter-spacing: 0.5px;
        }

        .header-date {
            font-size: 13px;
            color: #5b7a9a;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.6);
            padding: 4px 14px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }

        /* ===== Cup Section ===== */
        .cup-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 12px 0 8px;
            position: relative;
        }

        .cup-wrapper {
            position: relative;
            width: 180px;
            height: 240px;
            margin: 0 auto;
        }

        /* 杯子主体 */
        .cup-body {
            position: absolute;
            left: 15px;
            right: 15px;
            bottom: 0;
            top: 8px;
            background: rgba(255, 255, 255, 0.25);
            border: 3px solid rgba(100, 180, 230, 0.5);
            border-bottom: 3px solid rgba(100, 180, 230, 0.6);
            border-radius: 0 0 24px 24px;
            overflow: hidden;
            box-shadow:
                0 4px 20px rgba(0, 40, 80, 0.06),
                inset 0 2px 8px rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
        }

        /* 杯把 */
        .cup-handle {
            position: absolute;
            right: -4px;
            top: 45px;
            width: 28px;
            height: 70px;
            border: 3px solid rgba(100, 180, 230, 0.45);
            border-left: none;
            border-radius: 0 30px 30px 0;
            background: transparent;
            box-shadow: 2px 4px 12px rgba(0, 40, 80, 0.04);
        }

        /* 杯口高光 */
        .cup-rim {
            position: absolute;
            left: 8px;
            right: 8px;
            top: -2px;
            height: 6px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 4px;
            box-shadow: 0 1px 6px rgba(255, 255, 255, 0.3);
            z-index: 2;
        }

        /* 水位容器 */
        .water-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 0%;
            background: linear-gradient(180deg, #4fc3f7 0%, #0288d1 65%, #01579b 100%);
            transition: height 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-radius: 0 0 21px 21px;
            overflow: hidden;
            box-shadow: inset 0 8px 20px rgba(0, 60, 120, 0.2);
        }

        /* 水面波浪 */
        .wave {
            position: absolute;
            top: -12px;
            left: -50%;
            width: 200%;
            height: 22px;
            background: radial-gradient(ellipse at 50% 100%, rgba(255, 255, 255, 0.35) 0%, transparent 70%);
            border-radius: 45%;
            animation: waveMove 4s ease-in-out infinite alternate;
            pointer-events: none;
        }

        .wave::before {
            content: '';
            position: absolute;
            top: 2px;
            left: -20%;
            width: 140%;
            height: 100%;
            background: radial-gradient(ellipse at 50% 100%, rgba(255, 255, 255, 0.20) 0%, transparent 70%);
            border-radius: 40%;
            animation: waveMove 3.2s ease-in-out infinite alternate-reverse;
        }

        @keyframes waveMove {
            0% {
                transform: translateX(-8%) translateY(0px) scaleY(0.9);
            }
            100% {
                transform: translateX(8%) translateY(2px) scaleY(1.1);
            }
        }

        /* 水中的小气泡 (装饰) */
        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.20);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.10);
            pointer-events: none;
            animation: bubbleRise 6s ease-in-out infinite;
        }
        .bubble:nth-child(1) {
            width: 8px;
            height: 8px;
            left: 18%;
            bottom: 10%;
            animation-delay: 0.2s;
            animation-duration: 5.2s;
        }
        .bubble:nth-child(2) {
            width: 5px;
            height: 5px;
            left: 55%;
            bottom: 25%;
            animation-delay: 1.8s;
            animation-duration: 4.6s;
        }
        .bubble:nth-child(3) {
            width: 10px;
            height: 10px;
            left: 75%;
            bottom: 5%;
            animation-delay: 3.4s;
            animation-duration: 6.8s;
        }
        .bubble:nth-child(4) {
            width: 4px;
            height: 4px;
            left: 35%;
            bottom: 45%;
            animation-delay: 0.8s;
            animation-duration: 7.2s;
        }
        .bubble:nth-child(5) {
            width: 6px;
            height: 6px;
            left: 62%;
            bottom: 60%;
            animation-delay: 2.6s;
            animation-duration: 5.0s;
        }

        @keyframes bubbleRise {
            0% {
                transform: translateY(0%) translateX(0) scale(0.6);
                opacity: 0.0;
            }
            15% {
                opacity: 0.8;
                transform: translateY(-10%) translateX(4px) scale(1);
            }
            85% {
                opacity: 0.6;
                transform: translateY(-80%) translateX(-6px) scale(0.9);
            }
            100% {
                transform: translateY(-100%) translateX(2px) scale(0.4);
                opacity: 0.0;
            }
        }

        /* 玻璃高光 (左侧光条) */
        .glare {
            position: absolute;
            top: 12%;
            left: 6%;
            width: 10px;
            height: 55%;
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.50) 0%,
                    rgba(255, 255, 255, 0.08) 50%,
                    rgba(255, 255, 255, 0.35) 100%);
            border-radius: 20px;
            transform: skewX(-6deg);
            pointer-events: none;
            opacity: 0.7;
            filter: blur(1px);
        }

        /* 杯底阴影/底座 */
        .cup-base {
            position: absolute;
            left: 28px;
            right: 28px;
            bottom: -6px;
            height: 12px;
            background: rgba(100, 170, 220, 0.20);
            border-radius: 50%;
            filter: blur(4px);
            box-shadow: 0 2px 12px rgba(0, 40, 80, 0.06);
        }

        /* ===== Progress Info ===== */
        .progress-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 12px 0 6px;
            padding: 8px 0;
        }

        .progress-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .progress-number {
            font-size: 40px;
            font-weight: 800;
            color: #0a2a44;
            line-height: 1.1;
            letter-spacing: -1px;
        }

        .progress-number .current {
            color: #0288d1;
            transition: all 0.3s ease;
        }

        .progress-number .separator {
            color: #8aacc8;
            font-weight: 400;
            margin: 0 2px;
        }

        .progress-number .target {
            color: #5b7a9a;
        }

        .progress-label {
            font-size: 13px;
            color: #6d8fab;
            font-weight: 500;
            margin-top: 2px;
        }

        .progress-percent {
            font-size: 32px;
            font-weight: 800;
            color: #0a2a44;
            background: rgba(255, 255, 255, 0.5);
            padding: 2px 16px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            min-width: 80px;
            text-align: center;
        }

        .progress-percent .pct-value {
            color: #0288d1;
            transition: all 0.3s ease;
        }

        /* 水量显示 */
        .volume-info {
            text-align: center;
            font-size: 14px;
            color: #5b7a9a;
            font-weight: 500;
            margin-top: -2px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.35);
            padding: 2px 16px;
            border-radius: 20px;
            display: inline-block;
            backdrop-filter: blur(4px);
        }

        .volume-info span {
            font-weight: 700;
            color: #0a2a44;
        }

        /* ===== Main Button ===== */
        .btn-drink-wrap {
            margin: 10px 0 12px;
            display: flex;
            justify-content: center;
        }

        .btn-drink {
            width: 100%;
            padding: 18px 20px;
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(145deg, #29b6f6, #0288d1);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 8px 28px rgba(2, 136, 209, 0.35),
                        0 2px 8px rgba(2, 136, 209, 0.20);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
            -webkit-touch-callout: none;
            touch-action: manipulation;
            letter-spacing: 0.5px;
        }

        .btn-drink .icon {
            font-size: 28px;
            line-height: 1;
            transition: transform 0.3s ease;
        }

        .btn-drink:active {
            transform: scale(0.96);
            box-shadow: 0 4px 14px rgba(2, 136, 209, 0.25);
        }

        .btn-drink:active .icon {
            transform: rotate(-12deg) scale(1.1);
        }

        /* 按钮点击涟漪 */
        .btn-drink::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255, 255, 255, 0.3) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            border-radius: inherit;
        }

        .btn-drink:active::after {
            opacity: 1;
            transition: opacity 0s;
        }

        /* 按钮禁用状态 */
        .btn-drink:disabled {
            opacity: 0.5;
            transform: scale(0.97);
            box-shadow: 0 4px 12px rgba(2, 136, 209, 0.12);
            pointer-events: none;
            filter: grayscale(0.3);
        }

        /* ===== Target Controls ===== */
        .target-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.50);
            border-radius: 30px;
            padding: 10px 18px 10px 22px;
            backdrop-filter: blur(8px);
            margin-top: 4px;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .target-label {
            font-size: 15px;
            font-weight: 600;
            color: #2c4a6e;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .target-label .emoji {
            font-size: 18px;
        }

        .target-adjust {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .target-adjust .target-num {
            font-size: 22px;
            font-weight: 800;
            color: #0a2a44;
            min-width: 36px;
            text-align: center;
            line-height: 1;
        }

        .btn-adjust {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            font-size: 22px;
            font-weight: 600;
            color: #1a4a6e;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 30, 60, 0.06);
            transition: all 0.2s ease;
            touch-action: manipulation;
            line-height: 1;
        }

        .btn-adjust:active {
            transform: scale(0.88);
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 1px 4px rgba(0, 30, 60, 0.10);
        }

        .btn-adjust:disabled {
            opacity: 0.3;
            transform: scale(0.95);
            pointer-events: none;
        }

        /* ===== Reset Button ===== */
        .reset-wrap {
            display: flex;
            justify-content: center;
            margin-top: 6px;
        }

        .btn-reset {
            background: transparent;
            border: none;
            font-size: 13px;
            color: #7a9ab8;
            font-weight: 500;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-reset:active {
            background: rgba(255, 255, 255, 0.4);
            color: #2c5a7e;
        }

        .btn-reset .icon {
            font-size: 16px;
        }

        /* ===== Celebration Toast ===== */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 999;
        }

        .celebration.show {
            display: flex;
            animation: celebFade 2.4s ease forwards;
        }

        .celebration-content {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 24px 40px;
            border-radius: 60px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            text-align: center;
            font-size: 42px;
            font-weight: 700;
            color: #0a2a44;
            transform: scale(0.7);
            animation: celebPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            border: 1px solid rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            gap: 16px;
            line-height: 1.2;
        }

        .celebration-content .sub {
            font-size: 18px;
            font-weight: 500;
            color: #4a7a9a;
        }

        @keyframes celebFade {
            0%,
            60% {
                opacity: 1;
                pointer-events: none;
            }
            100% {
                opacity: 0;
                pointer-events: none;
            }
        }

        @keyframes celebPop {
            0% {
                transform: scale(0.6) translateY(20px);
                opacity: 0;
            }
            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        /* ===== Responsive ===== */
        @media (max-width: 420px) {
            .app {
                padding: 20px 16px 24px;
                border-radius: 32px 32px 24px 24px;
            }

            .cup-wrapper {
                width: 150px;
                height: 200px;
            }

            .cup-body {
                left: 12px;
                right: 12px;
                top: 6px;
                border-radius: 0 0 20px 20px;
            }

            .cup-handle {
                right: -6px;
                top: 38px;
                width: 22px;
                height: 58px;
            }

            .cup-rim {
                left: 6px;
                right: 6px;
                height: 5px;
            }

            .cup-base {
                left: 22px;
                right: 22px;
                bottom: -5px;
                height: 10px;
            }

            .progress-number {
                font-size: 34px;
            }

            .progress-percent {
                font-size: 26px;
                min-width: 68px;
                padding: 0 12px;
            }

            .btn-drink {
                padding: 14px 16px;
                font-size: 19px;
                border-radius: 50px;
            }

            .btn-drink .icon {
                font-size: 24px;
            }

            .target-controls {
                padding: 8px 14px 8px 18px;
            }

            .header-title {
                font-size: 18px;
            }
            .header-date {
                font-size: 12px;
                padding: 3px 12px;
            }
            .volume-info {
                font-size: 13px;
            }
            .celebration-content {
                font-size: 32px;
                padding: 18px 30px;
            }
            .celebration-content .sub {
                font-size: 15px;
            }
        }

        @media (max-width: 360px) {
            .cup-wrapper {
                width: 130px;
                height: 175px;
            }

            .cup-body {
                left: 10px;
                right: 10px;
                top: 5px;
                border-radius: 0 0 16px 16px;
            }

            .cup-handle {
                right: -8px;
                top: 32px;
                width: 18px;
                height: 48px;
                border-width: 2px;
            }

            .cup-rim {
                left: 4px;
                right: 4px;
                height: 4px;
            }

            .progress-number {
                font-size: 28px;
            }

            .progress-percent {
                font-size: 22px;
                min-width: 56px;
                padding: 0 10px;
            }

            .btn-drink {
                padding: 12px 14px;
                font-size: 17px;
                gap: 8px;
            }

            .btn-drink .icon {
                font-size: 20px;
            }

            .target-controls {
                padding: 6px 12px 6px 14px;
            }
            .target-adjust .target-num {
                font-size: 18px;
                min-width: 28px;
            }
            .btn-adjust {
                width: 34px;
                height: 34px;
                font-size: 18px;
            }
            .header-title {
                font-size: 16px;
            }
            .header-date {
                font-size: 11px;
                padding: 2px 10px;
            }
            .volume-info {
                font-size: 12px;
            }
            .progress-label {
                font-size: 11px;
            }
            .celebration-content {
                font-size: 26px;
                padding: 14px 24px;
            }
            .celebration-content .sub {
                font-size: 13px;
            }
        }

        /* 安全区域适配 */
        @supports (padding: max(0px)) {
            .app {
                padding-left: max(24px, env(safe-area-inset-left));
                padding-right: max(24px, env(safe-area-inset-right));
                padding-bottom: max(32px, env(safe-area-inset-bottom));
            }
        }

        /* 暗色模式微调 (保持清晰) */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(165deg, #0a1a2e 0%, #0d2840 40%, #0f3550 100%);
            }
            .app {
                background: rgba(20, 40, 60, 0.75);
                backdrop-filter: blur(24px);
                -webkit-backdrop-filter: blur(24px);
                border-color: rgba(255, 255, 255, 0.08);
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            }
            .header-title {
                color: #d4e8f5;
            }
            .header-date {
                color: #8aadc8;
                background: rgba(0, 0, 0, 0.25);
            }
            .progress-number {
                color: #d4e8f5;
            }
            .progress-number .current {
                color: #4fc3f7;
            }
            .progress-number .target {
                color: #7a9ab8;
            }
            .progress-percent {
                color: #d4e8f5;
                background: rgba(0, 0, 0, 0.20);
            }
            .progress-percent .pct-value {
                color: #4fc3f7;
            }
            .progress-label {
                color: #8aadc8;
            }
            .volume-info {
                color: #8aadc8;
                background: rgba(0, 0, 0, 0.15);
            }
            .volume-info span {
                color: #d4e8f5;
            }
            .target-controls {
                background: rgba(0, 0, 0, 0.20);
                border-color: rgba(255, 255, 255, 0.06);
            }
            .target-label {
                color: #8aadc8;
            }
            .target-adjust .target-num {
                color: #d4e8f5;
            }
            .btn-adjust {
                background: rgba(255, 255, 255, 0.08);
                color: #b0cde0;
            }
            .btn-adjust:active {
                background: rgba(255, 255, 255, 0.15);
            }
            .btn-reset {
                color: #6d8fab;
            }
            .btn-reset:active {
                color: #b0cde0;
                background: rgba(255, 255, 255, 0.06);
            }
            .cup-body {
                background: rgba(0, 30, 50, 0.25);
                border-color: rgba(100, 180, 230, 0.25);
            }
            .cup-handle {
                border-color: rgba(100, 180, 230, 0.20);
            }
            .glare {
                opacity: 0.25;
            }
            .celebration-content {
                background: rgba(10, 30, 50, 0.85);
                border-color: rgba(255, 255, 255, 0.10);
                color: #d4e8f5;
            }
        }

        /* ===== Utils ===== */
        .text-center {
            text-align: center;
        }
        .mt-1 {
            margin-top: 4px;
        }
        .mt-2 {
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="app" role="main">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <span class="header-icon">💧</span>
                <h1 class="header-title">喝水追踪</h1>
            </div>
            <div class="header-date" id="dateDisplay"></div>
        </header>

        <!-- Cup Visualization -->
        <section class="cup-section" aria-label="喝水进度可视化">
            <div class="cup-wrapper">
                <div class="cup-body">
                    <!-- 水位 -->
                    <div class="water-container" id="waterContainer">
                        <div class="wave"></div>
                        <div class="bubble"></div>
                        <div class="bubble"></div>
                        <div class="bubble"></div>
                        <div class="bubble"></div>
                        <div class="bubble"></div>
                    </div>
                    <!-- 玻璃高光 -->
                    <div class="glare"></div>
                    <!-- 杯口 -->
                    <div class="cup-rim"></div>
                </div>
                <!-- 杯把 -->
                <div class="cup-handle"></div>
                <!-- 杯底阴影 -->
                <div class="cup-base"></div>
            </div>
        </section>

        <!-- Progress -->
        <div class="progress-info">
            <div class="progress-stat">
                <div class="progress-number">
                    <span class="current" id="currentCount">0</span>
                    <span class="separator"> / </span>
                    <span class="target" id="targetCount">8</span>
                </div>
                <div class="progress-label">已喝杯数</div>
            </div>
            <div class="progress-stat">
                <div class="progress-percent">
                    <span class="pct-value" id="percentDisplay">0</span>%
                </div>
                <div class="progress-label">完成度</div>
            </div>
        </div>

        <!-- Volume -->
        <div class="text-center">
            <div class="volume-info">
                💦 总水量 <span id="volumeDisplay">0</span> ml / <span id="targetVolume">2000</span> ml
            </div>
        </div>

        <!-- Drink Button -->
        <div class="btn-drink-wrap">
            <button class="btn-drink" id="btnDrink" aria-label="喝一杯水">
                <span class="icon">🥤</span>
                <span>喝一杯</span>
            </button>
        </div>

        <!-- Target Adjust -->
        <div class="target-controls">
            <div class="target-label">
                <span class="emoji">🎯</span> 每日目标
            </div>
            <div class="target-adjust">
                <button class="btn-adjust" id="btnTargetMinus" aria-label="减少目标杯数">−</button>
                <span class="target-num" id="targetDisplay">8</span>
                <button class="btn-adjust" id="btnTargetPlus" aria-label="增加目标杯数">+</button>
            </div>
        </div>

        <!-- Reset -->
        <div class="reset-wrap">
            <button class="btn-reset" id="btnReset" aria-label="重置今日进度">
                <span class="icon">↻</span> 重置今日
            </button>
        </div>
    </div>

    <!-- Celebration Overlay -->
    <div class="celebration" id="celebration">
        <div class="celebration-content">
            <span>🎉</span>
            <span>
                目标达成!
                <div class="sub">太棒了，继续坚持！</div>
            </span>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ===== 常量 =====
            const ML_PER_CUP = 250;
            const STORAGE_KEY = 'water_tracker_data';
            const MIN_TARGET = 1;
            const MAX_TARGET = 30;

            // ===== DOM 引用 =====
            const waterContainer = document.getElementById('waterContainer');
            const currentCountEl = document.getElementById('currentCount');
            const targetCountEl = document.getElementById('targetCount');
            const targetDisplayEl = document.getElementById('targetDisplay');
            const percentDisplayEl = document.getElementById('percentDisplay');
            const volumeDisplayEl = document.getElementById('volumeDisplay');
            const targetVolumeEl = document.getElementById('targetVolume');
            const btnDrink = document.getElementById('btnDrink');
            const btnTargetPlus = document.getElementById('btnTargetPlus');
            const btnTargetMinus = document.getElementById('btnTargetMinus');
            const btnReset = document.getElementById('btnReset');
            const dateDisplayEl = document.getElementById('dateDisplay');
            const celebrationEl = document.getElementById('celebration');

            // ===== 状态 =====
            let target = 8;
            let current = 0;
            let today = '';

            // ===== 工具函数 =====
            function getTodayStr() {
                const d = new Date();
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${y}-${m}-${day}`;
            }

            function formatDateCN(dateStr) {
                const parts = dateStr.split('-');
                if (parts.length !== 3) return dateStr;
                return `${parts[0]}年${parseInt(parts[1])}月${parseInt(parts[2])}日`;
            }

            function getWeekdayCN() {
                const days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
                return days[new Date().getDay()];
            }

            // ===== 存储 =====
            function loadData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return null;
                    return JSON.parse(raw);
                } catch (_) {
                    return null;
                }
            }

            function saveData() {
                try {
                    const data = {
                        target: target,
                        current: current,
                        date: today
                    };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                } catch (_) { /* ignore */ }
            }

            // ===== 更新UI =====
            function updateUI(animate = true) {
                // 确保 current 不超过 target
                if (current > target) current = target;

                const pct = target > 0 ? (current / target) * 100 : 0;
                const pctClamped = Math.min(pct, 100);

                // 水位高度
                if (animate) {
                    waterContainer.style.transition = 'height 0.7s cubic-bezier(0.34, 1.56, 0.64, 1)';
                } else {
                    waterContainer.style.transition = 'none';
                }
                waterContainer.style.height = pctClamped + '%';

                // 数字
                currentCountEl.textContent = current;
                targetCountEl.textContent = target;
                targetDisplayEl.textContent = target;

                const percentRounded = Math.round(pctClamped);
                percentDisplayEl.textContent = percentRounded;

                const volume = current * ML_PER_CUP;
                const targetVol = target * ML_PER_CUP;
                volumeDisplayEl.textContent = volume;
                targetVolumeEl.textContent = targetVol;

                // 按钮状态 (达到目标后禁用)
                btnDrink.disabled = (current >= target);

                // 存储
                saveData();

                // 触发庆祝 (仅在达到目标且之前未达到时)
                // 庆祝逻辑在 addCup 中处理，避免重复触发
            }

            // ===== 庆祝效果 =====
            let celebrationTimeout = null;

            function showCelebration() {
                if (celebrationTimeout) {
                    clearTimeout(celebrationTimeout);
                    celebrationEl.classList.remove('show');
                }
                // 强制重排以重启动画
                void celebrationEl.offsetWidth;
                celebrationEl.classList.add('show');
                celebrationTimeout = setTimeout(() => {
                    celebrationEl.classList.remove('show');
                    celebrationTimeout = null;
                }, 2400);
            }

            // ===== 核心操作 =====
            function addCup() {
                if (current >= target) {
                    // 触觉反馈（轻轻震动）
                    if (navigator.vibrate) navigator.vibrate(10);
                    return;
                }

                const prev = current;
                current = Math.min(current + 1, target);
                updateUI(true);

                // 触觉反馈
                if (navigator.vibrate) navigator.vibrate(12);

                // 检查是否刚刚达到目标
                if (prev < target && current === target) {
                    // 延迟一点点让UI先更新
                    setTimeout(showCelebration, 300);
                }
            }

            function setTarget(newTarget) {
                const clamped = Math.min(MAX_TARGET, Math.max(MIN_TARGET, newTarget));
                if (clamped === target) return;
                target = clamped;
                // 如果当前超过新目标，自动调整
                if (current > target) {
                    current = target;
                }
                updateUI(true);
                // 更新按钮状态
                btnDrink.disabled = (current >= target);
            }

            function resetToday() {
                if (current === 0) {
                    // 如果已经是0，轻微反馈
                    if (navigator.vibrate) navigator.vibrate(8);
                    return;
                }
                current = 0;
                updateUI(true);
                btnDrink.disabled = false;
                if (navigator.vibrate) navigator.vibrate(15);
            }

            // ===== 日期检查 & 初始化 =====
            function initFromStorage() {
                const data = loadData();
                const todayStr = getTodayStr();

                // 显示日期
                dateDisplayEl.textContent = formatDateCN(todayStr) + ' ' + getWeekdayCN();
                today = todayStr;

                if (data && data.date === todayStr) {
                    // 同一天，恢复数据
                    target = data.target || 8;
                    current = data.current || 0;
                    if (target < MIN_TARGET) target = MIN_TARGET;
                    if (target > MAX_TARGET) target = MAX_TARGET;
                    if (current > target) current = target;
                } else {
                    // 新的一天，使用默认或上次的目标
                    if (data && data.target) {
                        target = data.target;
                        if (target < MIN_TARGET) target = MIN_TARGET;
                        if (target > MAX_TARGET) target = MAX_TARGET;
                    } else {
                        target = 8;
                    }
                    current = 0;
                }

                // 确保存储
                saveData();
                updateUI(false);
                btnDrink.disabled = (current >= target);
            }

            // ===== 事件绑定 =====
            // 喝一杯
            btnDrink.addEventListener('click', function(e) {
                // 传递点击坐标给涟漪效果
                const rect = this.getBoundingClientRect();
                const x = ((e.clientX || e.touches?.[0]?.clientX || rect.left + rect.width / 2) - rect.left) / rect.width *
                100;
                const y = ((e.clientY || e.touches?.[0]?.clientY || rect.top + rect.height / 2) - rect.top) / rect.height *
                100;
                this.style.setProperty('--x', x + '%');
                this.style.setProperty('--y', y + '%');
                addCup();
            });

            // 目标调整
            btnTargetPlus.addEventListener('click', function() {
                setTarget(target + 1);
            });

            btnTargetMinus.addEventListener('click', function() {
                setTarget(target - 1);
            });

            // 重置
            btnReset.addEventListener('click', function() {
                resetToday();
            });

            // ===== 键盘快捷键 (辅助) =====
            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Enter') {
                    // 如果焦点在按钮上，默认行为即可
                    if (document.activeElement === btnDrink) return;
                    // 否则模拟点击主按钮 (方便测试)
                    if (e.target === document.body) {
                        e.preventDefault();
                        btnDrink.click();
                    }
                }
                if (e.key === 'ArrowUp' || e.key === '+') {
                    e.preventDefault();
                    btnTargetPlus.click();
                }
                if (e.key === 'ArrowDown' || e.key === '-') {
                    e.preventDefault();
                    btnTargetMinus.click();
                }
                if (e.key === 'r' || e.key === 'R') {
                    if (!e.ctrlKey && !e.metaKey) {
                        btnReset.click();
                    }
                }
            });

            // ===== 触摸优化: 防止双击缩放 =====
            document.addEventListener('dblclick', function(e) {
                e.preventDefault();
            }, { passive: false });

            // ===== 启动 =====
            initFromStorage();

            // 定期检查日期变化 (每60秒)
            setInterval(function() {
                const now = getTodayStr();
                if (now !== today) {
                    // 日期变了，重新初始化
                    initFromStorage();
                }
            }, 60000);

            // 页面可见时刷新状态（从其他标签页返回时）
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    const now = getTodayStr();
                    if (now !== today) {
                        initFromStorage();
                    } else {
                        // 重新从存储加载，以防其他标签页修改了数据
                        const data = loadData();
                        if (data && data.date === today) {
                            if (data.target !== target || data.current !== current) {
                                target = data.target || target;
                                current = data.current || 0;
                                if (target < MIN_TARGET) target = MIN_TARGET;
                                if (target > MAX_TARGET) target = MAX_TARGET;
                                if (current > target) current = target;
                                updateUI(false);
                                btnDrink.disabled = (current >= target);
                            }
                        }
                    }
                }
            });

            console.log('💧 喝水追踪已启动！今日目标:', target, '杯');
        })();
    </script>
</body>
</html>
