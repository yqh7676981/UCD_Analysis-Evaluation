<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大学免费资源平台</title>
    <style>
        /* ===== 全局重置与变量 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2b6cb0;
            --primary-light: #ebf4ff;
            --primary-dark: #1a365d;
            --accent: #ed8936;
            --accent-light: #fffaf0;
            --gray: #4a5568;
            --light-gray: #f7fafc;
            --border: #e2e8f0;
            --shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            --radius: 12px;
            --transition: 0.3s ease;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, -apple-system, sans-serif;
            background: var(--light-gray);
            color: #1a202c;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== 头部 ===== */
        header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: white;
            padding: 2rem 1.5rem;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 0.3rem;
        }

        header h1 span {
            color: var(--accent);
        }

        header p {
            font-size: 1.05rem;
            opacity: 0.9;
            font-weight: 300;
        }

        /* ===== 过滤器 ===== */
        .filter-section {
            background: white;
            padding: 1.2rem 1.5rem;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 1rem 2rem;
            border-bottom: 1px solid var(--border);
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
        }

        .filter-group label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--gray);
            margin-right: 0.3rem;
        }

        .filter-btn {
            padding: 0.4rem 1rem;
            border: 2px solid var(--border);
            border-radius: 30px;
            background: white;
            color: var(--gray);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: var(--transition);
            outline: none;
        }

        .filter-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
        }

        .filter-btn.active {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }

        /* ===== 资源网格 ===== */
        .resources-section {
            flex: 1;
            max-width: 1280px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .resources-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        /* ===== 卡片 ===== */
        .card {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 1.5rem;
            transition: transform 0.2s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.8rem;
        }

        .card-type {
            font-size: 1.8rem;
            line-height: 1;
        }

        .card-semester {
            background: var(--primary-light);
            color: var(--primary-dark);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            border: 1px solid var(--primary);
            white-space: nowrap;
        }

        .card-subject {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 0.4rem;
        }

        .card-desc {
            color: var(--gray);
            font-size: 0.92rem;
            flex: 1;
            margin-bottom: 1.2rem;
            line-height: 1.5;
        }

        .card-link {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 0.5rem 1.2rem;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: var(--transition);
            align-self: flex-start;
        }

        .card-link:hover {
            background: var(--primary-dark);
            transform: scale(1.02);
        }

        /* ===== 空状态 ===== */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            color: var(--gray);
        }

        .no-results p {
            font-size: 1.1rem;
        }

        /* ===== 页脚 ===== */
        footer {
            background: var(--primary-dark);
            color: rgba(255, 255, 255, 0.85);
            text-align: center;
            padding: 1.2rem;
            font-size: 0.9rem;
            margin-top: auto;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            header h1 {
                font-size: 1.6rem;
            }

            .filter-section {
                flex-direction: column;
                gap: 0.6rem;
                padding: 1rem;
            }

            .filter-group {
                justify-content: center;
            }

            .resources-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 头部 ===== -->
    <header>
        <h1>📚 大学<span>免费</span>资源库</h1>
        <p>学习笔记 · 视频讲座 · 历年试卷 — 按学期 &amp; 科目整理</p>
    </header>

    <!-- ===== 过滤器 ===== -->
    <div class="filter-section">
        <div class="filter-group">
            <label>📅 学期</label>
            <button class="filter-btn active" data-filter="semester" data-value="all">全部</button>
            <button class="filter-btn" data-filter="semester" data-value="大一上">大一上</button>
            <button class="filter-btn" data-filter="semester" data-value="大一下">大一下</button>
            <button class="filter-btn" data-filter="semester" data-value="大二上">大二上</button>
            <button class="filter-btn" data-filter="semester" data-value="大二下">大二下</button>
            <button class="filter-btn" data-filter="semester" data-value="大三">大三</button>
            <button class="filter-btn" data-filter="semester" data-value="大四">大四</button>
        </div>

        <div class="filter-group">
            <label>📂 类型</label>
            <button class="filter-btn active" data-filter="type" data-value="all">全部</button>
            <button class="filter-btn" data-filter="type" data-value="学习笔记">📝 笔记</button>
            <button class="filter-btn" data-filter="type" data-value="视频讲座">🎥 视频</button>
            <button class="filter-btn" data-filter="type" data-value="历年试卷">📄 试卷</button>
        </div>
    </div>

    <!-- ===== 资源卡片区域 ===== -->
    <section class="resources-section">
        <div id="resourcesGrid" class="resources-grid">
            <!-- 由 JavaScript 动态渲染 -->
        </div>
    </section>

    <!-- ===== 页脚 ===== -->
    <footer>
        ❤️ 致力于为每位大学生提供免费优质资源 · 所有资料仅供学习使用
    </footer>

    <script>
        // ============================================================
        // 数据
        // ============================================================
        const resources = [{
            id: 1,
            subject: '高等数学 (上)',
            semester: '大一上',
            type: '学习笔记',
            description: '极限、导数与微积分核心公式整理，含典型例题。',
            link: '#'
        }, {
            id: 2,
            subject: '高等数学 (上)',
            semester: '大一上',
            type: '视频讲座',
            description: '宋老师精讲第一章：函数与极限，共12讲。',
            link: '#'
        }, {
            id: 3,
            subject: '线性代数',
            semester: '大一下',
            type: '学习笔记',
            description: '矩阵运算、特征值与特征向量知识梳理。',
            link: '#'
        }, {
            id: 4,
            subject: '线性代数',
            semester: '大一下',
            type: '历年试卷',
            description: '近5年期末真题及答案解析，PDF可下载。',
            link: '#'
        }, {
            id: 5,
            subject: '程序设计 (C语言)',
            semester: '大一下',
            type: '视频讲座',
            description: '零基础入门C语言，配套代码示例。',
            link: '#'
        }, {
            id: 6,
            subject: '大学物理 (上)',
            semester: '大一上',
            type: '学习笔记',
            description: '力学、热学重点概念与习题总结。',
            link: '#'
        }, {
            id: 7,
            subject: '数据结构',
            semester: '大二上',
            type: '历年试卷',
            description: '2018-2023年笔试真题+手写答案。',
            link: '#'
        }, {
            id: 8,
            subject: '数据结构',
            semester: '大二上',
            type: '视频讲座',
            description: '陈老师精讲：链表、树、图与排序算法。',
            link: '#'
        }, {
            id: 9,
            subject: '操作系统',
            semester: '大二下',
            type: '学习笔记',
            description: '进程管理、内存管理、文件系统思维导图。',
            link: '#'
        }, {
            id: 10,
            subject: '计算机网络',
            semester: '大三',
            type: '历年试卷',
            description: '自顶向下各章期末复习题与答案。',
            link: '#'
        }, {
            id: 11,
            subject: '计算机网络',
            semester: '大三',
            type: '视频讲座',
            description: 'TCP/IP协议栈详解，配合Wireshark实验。',
            link: '#'
        }, {
            id: 12,
            subject: '软件工程',
            semester: '大三',
            type: '学习笔记',
            description: '敏捷开发、UML图、项目管理精华整理。',
            link: '#'
        }, {
            id: 13,
            subject: '概率论与数理统计',
            semester: '大二下',
            type: '历年试卷',
            description: '往年期末试题汇编，含详细解答步骤。',
            link: '#'
        }, {
            id: 14,
            subject: '概率论与数理统计',
            semester: '大二下',
            type: '视频讲座',
            description: '张宇概率论基础班视频，共24课时。',
            link: '#'
        }, {
            id: 15,
            subject: '毕业设计指导',
            semester: '大四',
            type: '视频讲座',
            description: '论文写作、选题技巧与答辩准备。',
            link: '#'
        }];

        // ============================================================
        // 渲染引擎
        // ============================================================
        const grid = document.getElementById('resourcesGrid');

        // 过滤器状态
        const filters = {
            semester: 'all',
            type: 'all'
        };

        // 获取所有 filter 按钮
        const filterBtns = document.querySelectorAll('.filter-btn');

        filterBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const filterType = this.dataset.filter; // 'semester' or 'type'
                const value = this.dataset.value;

                // 更新对应过滤器状态
                filters[filterType] = value;

                // 切换同组按钮的 active 类
                const siblings = document.querySelectorAll(`.filter-btn[data-filter="${filterType}"]`);
                siblings.forEach(sib => sib.classList.remove('active'));
                this.classList.add('active');

                // 重新渲染
                renderResources();
            });
        });

        function renderResources() {
            // 根据当前 filters 过滤数据
            let filtered = resources.filter(item => {
                const matchSemester = filters.semester === 'all' || item.semester === filters.semester;
                const matchType = filters.type === 'all' || item.type === filters.type;
                return matchSemester && matchType;
            });

            // 如果无结果，显示空状态
            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="no-results">
                        <p style="font-size:2.5rem;margin-bottom:0.5rem;">🔍</p>
                        <p>没有找到匹配的资源，试试调整过滤条件吧！</p>
                    </div>
                `;
                return;
            }

            // 生成卡片 HTML
            let html = '';
            filtered.forEach(item => {
                // 根据类型选择图标
                let icon = '📄';
                if (item.type === '学习笔记') icon = '📝';
                else if (item.type === '视频讲座') icon = '🎥';
                else if (item.type === '历年试卷') icon = '📄';

                html += `
                    <div class="card">
                        <div class="card-header">
                            <span class="card-type">${icon}</span>
                            <span class="card-semester">${item.semester}</span>
                        </div>
                        <div class="card-subject">${item.subject}</div>
                        <div class="card-desc">${item.description}</div>
                        <a href="${item.link}" class="card-link" target="_blank">查看资源 →</a>
                    </div>
                `;
            });

            grid.innerHTML = html;
        }

        // ============================================================
        // 初始渲染
        // ============================================================
        renderResources();
    </script>

</body>
</html>
