<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>篮球国度 - 篮球新闻、比分、球员数据</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* === 全局重置与变量 === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #0d1b2a;
            --secondary: #1b2a4a;
            --accent: #e63946;
            --accent-hover: #c1121f;
            --bg: #f4f4f8;
            --card-bg: #ffffff;
            --text: #1d1d1d;
            --text-light: #6c757d;
            --shadow: 0 2px 15px rgba(0,0,0,0.08);
            --radius: 12px;
            --nav-height: 64px;
        }
        body {
            font-family: 'Roboto', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding-top: var(--nav-height);
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        ul {
            list-style: none;
        }
        img {
            max-width: 100%;
        }

        /* === 导航栏 === */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background: var(--primary);
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            cursor: default;
        }
        .logo-icon {
            font-size: 1.8rem;
        }
        .nav-links {
            display: flex;
            gap: 8px;
        }
        .nav-links li a {
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 500;
            color: rgba(255,255,255,0.85);
            transition: all 0.3s;
            font-size: 0.95rem;
        }
        .nav-links li a:hover,
        .nav-links li a.active {
            background: var(--accent);
            color: #fff;
        }
        .hamburger {
            display: none;
            font-size: 1.8rem;
            color: #fff;
            cursor: pointer;
        }

        /* === 比分滚动条 === */
        .scorebar {
            background: var(--secondary);
            padding: 12px 0;
            overflow: hidden;
            white-space: nowrap;
            border-bottom: 3px solid var(--accent);
        }
        .score-container {
            display: inline-flex;
            gap: 30px;
            animation: scrollScore 30s linear infinite;
            padding: 0 20px;
        }
        .score-card {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            background: rgba(255,255,255,0.06);
            padding: 6px 18px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .score-card .team {
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }
        .score-card .vs {
            color: rgba(255,255,255,0.4);
            font-size: 0.8rem;
        }
        .score-card .score {
            color: #fff;
            font-weight: 700;
            font-size: 1.1rem;
            background: var(--accent);
            padding: 2px 12px;
            border-radius: 20px;
            min-width: 40px;
            text-align: center;
        }

        @keyframes scrollScore {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* === 主内容区 === */
        .main-content {
            max-width: 1200px;
            margin: 30px auto 20px;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        /* 新闻区域 */
        .news-section h2,
        .sidebar h3,
        .stats-section h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 4px solid var(--accent);
            display: inline-block;
        }
        .sidebar h3 {
            font-size: 1.2rem;
            margin-bottom: 12px;
            border-bottom-width: 3px;
        }
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }
        .news-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .news-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
        }
        .news-img {
            height: 160px;
            background: linear-gradient(135deg, #1b2a4a, #2a3f6a);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.6);
            font-size: 2rem;
            font-weight: 300;
        }
        .news-body {
            padding: 16px 18px 20px;
        }
        .news-body h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .news-body p {
            color: var(--text-light);
            font-size: 0.9rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .news-meta {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-size: 0.8rem;
            color: var(--text-light);
        }
        .news-meta .tag {
            background: var(--accent);
            color: #fff;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 500;
        }

        /* 侧边栏 */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .sidebar-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px 22px;
            box-shadow: var(--shadow);
        }
        .sidebar-card ul li {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 0.9rem;
        }
        .sidebar-card ul li:last-child {
            border-bottom: none;
        }
        .sidebar-card .rank {
            color: var(--accent);
            font-weight: 700;
            width: 24px;
        }
        .sidebar-card .team-name {
            flex: 1;
            margin-left: 6px;
            font-weight: 500;
        }
        .sidebar-card .team-record {
            color: var(--text-light);
        }
        .sidebar-card .player-stat {
            color: var(--accent);
            font-weight: 700;
        }

        /* 球员统计表格 */
        .stats-section {
            max-width: 1200px;
            margin: 10px auto 40px;
            padding: 0 20px;
        }
        .stats-section h2 {
            margin-bottom: 24px;
        }
        .table-wrapper {
            overflow-x: auto;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        thead {
            background: var(--primary);
            color: #fff;
        }
        thead th {
            padding: 14px 16px;
            text-align: left;
            cursor: pointer;
            user-select: none;
            position: relative;
            font-weight: 600;
            transition: background 0.2s;
        }
        thead th:hover {
            background: var(--secondary);
        }
        thead th::after {
            content: " ↕";
            font-size: 0.7rem;
            opacity: 0.6;
            margin-left: 4px;
        }
        thead th.sort-asc::after {
            content: " ↑";
            opacity: 1;
        }
        thead th.sort-desc::after {
            content: " ↓";
            opacity: 1;
        }
        tbody tr {
            border-bottom: 1px solid #eee;
            transition: background 0.15s;
        }
        tbody tr:hover {
            background: #f0f2f5;
        }
        tbody td {
            padding: 12px 16px;
            vertical-align: middle;
        }
        tbody td:first-child {
            font-weight: 600;
        }
        .team-badge {
            display: inline-block;
            background: var(--secondary);
            color: #fff;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        /* 页脚 */
        .footer {
            background: var(--primary);
            color: rgba(255,255,255,0.7);
            text-align: center;
            padding: 20px;
            font-size: 0.85rem;
            margin-top: 20px;
        }

        /* === 响应式 === */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
                position: absolute;
                top: var(--nav-height);
                left: 0;
                width: 100%;
                background: var(--primary);
                flex-direction: column;
                padding: 20px 0;
                gap: 0;
                box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            }
            .nav-links.open {
                display: flex;
            }
            .nav-links li a {
                display: block;
                padding: 14px 24px;
                border-radius: 0;
                text-align: center;
            }
            .hamburger {
                display: block;
            }
            .main-content {
                grid-template-columns: 1fr;
                gap: 24px;
            }
            .news-grid {
                grid-template-columns: 1fr;
            }
            .score-container {
                animation-duration: 20s;
            }
            .stats-section h2 {
                font-size: 1.3rem;
            }
        }
        @media (max-width: 480px) {
            .logo span:not(.logo-icon) {
                display: none;
            }
            .score-card {
                padding: 4px 12px;
                gap: 8px;
            }
            .score-card .score {
                font-size: 0.9rem;
                padding: 0 8px;
                min-width: 30px;
            }
        }
    </style>
</head>
<body>

    <!-- ==================== 导航栏 ==================== -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <span class="logo-icon">🏀</span>
                <span>篮球国度</span>
            </div>
            <ul class="nav-links" id="navLinks">
                <li><a href="#" class="active">首页</a></li>
                <li><a href="#">比分</a></li>
                <li><a href="#">新闻</a></li>
                <li><a href="#">球员数据</a></li>
                <li><a href="#">视频</a></li>
            </ul>
            <div class="hamburger" onclick="toggleMenu()">☰</div>
        </div>
    </nav>

    <!-- ==================== 比分滚动条 ==================== -->
    <section class="scorebar">
        <div class="score-container" id="scoreContainer"></div>
    </section>

    <!-- ==================== 主内容：新闻 + 侧边栏 ==================== -->
    <main class="main-content">
        <!-- 新闻区域 -->
        <section class="news-section">
            <h2>🔥 最新新闻</h2>
            <div class="news-grid" id="newsGrid"></div>
        </section>

        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-card">
                <h3>🏆 东部排名</h3>
                <ul id="eastStandings"></ul>
            </div>
            <div class="sidebar-card">
                <h3>📊 得分榜 TOP5</h3>
                <ul id="topScorers"></ul>
            </div>
        </aside>
    </main>

    <!-- ==================== 球员数据统计表 ==================== -->
    <section class="stats-section">
        <h2>📋 球员数据总表 <span style="font-size:0.8rem;color:var(--text-light);font-weight:400;">（点击表头排序）</span></h2>
        <div class="table-wrapper">
            <table id="statsTable">
                <thead>
                    <tr>
                        <th onclick="sortTable(0)">球员</th>
                        <th onclick="sortTable(1)">球队</th>
                        <th onclick="sortTable(2)">得分</th>
                        <th onclick="sortTable(3)">篮板</th>
                        <th onclick="sortTable(4)">助攻</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </section>

    <!-- ==================== 页脚 ==================== -->
    <footer class="footer">
        <p>&copy; 2025 篮球国度 · 仅供演示 | 数据均为模拟</p>
    </footer>

    <!-- ==================== JavaScript ==================== -->
    <script>
        // ============================================================
        //  1. 导航栏菜单切换
        // ============================================================
        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('open');
        }

        // ============================================================
        //  2. 比分数据与滚动更新
        // ============================================================
        const teams = [
            '湖人', '勇士', '凯尔特人', '雄鹿', '太阳',
            '热火', '篮网', '76人', '掘金', '快船',
            '骑士', '猛龙', '独行侠', '灰熊', '鹈鹕'
        ];
        let games = [];
        function generateGames(count = 8) {
            const shuffled = teams.sort(() => Math.random() - 0.5);
            const games = [];
            for (let i = 0; i < count; i++) {
                const home = shuffled[i * 2];
                const away = shuffled[i * 2 + 1];
                games.push({
                    home,
                    away,
                    homeScore: Math.floor(Math.random() * 40 + 70),
                    awayScore: Math.floor(Math.random() * 40 + 70)
                });
            }
            return games;
        }

        function renderScoreboard() {
            const container = document.getElementById('scoreContainer');
            container.innerHTML = '';
            // 复制两份实现无缝滚动
            const allGames = [...games, ...games];
            allGames.forEach(g => {
                const card = document.createElement('div');
                card.className = 'score-card';
                card.innerHTML = `
                    <span class="team">${g.home}</span>
                    <span class="vs">vs</span>
                    <span class="team">${g.away}</span>
                    <span class="score">${g.homeScore} - ${g.awayScore}</span>
                `;
                container.appendChild(card);
            });
        }

        function updateScores() {
            games.forEach(g => {
                // 随机微调比分，模拟实时更新
                if (Math.random() < 0.6) {
                    g.homeScore += Math.floor(Math.random() * 3);
                }
                if (Math.random() < 0.6) {
                    g.awayScore += Math.floor(Math.random() * 3);
                }
            });
            renderScoreboard();
        }

        // 初始化比分
        games = generateGames(8);
        renderScoreboard();
        setInterval(updateScores, 3000);

        // ============================================================
        //  3. 新闻数据
        // ============================================================
        const newsData = [
            { title: '詹姆斯三双率队逆转', summary: '勒布朗·詹姆斯砍下35分12篮板10助攻，带领湖人在末节完成15分大逆转，击败勇士。', tag: '焦点', imgEmoji: '👑' },
            { title: '库里三分里程碑', summary: '斯蒂芬·库里在今日比赛中命中7记三分，生涯三分总数突破4000大关，再创历史。', tag: '纪录', imgEmoji: '🏹' },
            { title: '凯尔特人豪取8连胜', summary: '塔图姆与布朗合砍68分，凯尔特人主场轻取雄鹿，继续领跑东部。', tag: '连胜', imgEmoji: '☘️' },
            { title: '字母哥回应MVP呼声', summary: '扬尼斯·阿德托昆博赛后表示团队胜利比MVP更重要，本场他贡献30分17篮板。', tag: '采访', imgEmoji: '🦌' },
            { title: '交易截止日临近：四方交易酝酿中', summary: '据知情人士透露，一笔涉及多位球星的四队交易正在谈判，可能改变联盟格局。', tag: '交易', imgEmoji: '🔄' },
            { title: '新秀榜：文班亚马稳居第一', summary: 'NBA官方公布最新新秀排名，维克托·文班亚马场均3.4盖帽继续领跑。', tag: '新秀', imgEmoji: '⭐' }
        ];

        function renderNews() {
            const grid = document.getElementById('newsGrid');
            grid.innerHTML = '';
            newsData.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'news-card';
                // 不同的渐变背景
                const gradients = [
                    'linear-gradient(135deg, #1b2a4a, #2a3f6a)',
                    'linear-gradient(135deg, #2d1b4a, #4a2a6a)',
                    'linear-gradient(135deg, #1a3a2a, #2a5a4a)',
                    'linear-gradient(135deg, #4a1a1a, #6a2a2a)',
                    'linear-gradient(135deg, #1a2a4a, #2a4a6a)',
                    'linear-gradient(135deg, #3a2a1a, #5a4a2a)'
                ];
                card.innerHTML = `
                    <div class="news-img" style="background: ${gradients[idx % gradients.length]}">
                        <span style="font-size:3rem;">${item.imgEmoji}</span>
                    </div>
                    <div class="news-body">
                        <h3>${item.title}</h3>
                        <p>${item.summary}</p>
                        <div class="news-meta">
                            <span class="tag">${item.tag}</span>
                            <span>${Math.floor(Math.random() * 3 + 1)}小时前</span>
                        </div>
                    </div>
                `;
                // 点击新闻弹出详情（模拟）
                card.addEventListener('click', () => {
                    alert(`【${item.tag}】${item.title}\n\n${item.summary}`);
                });
                grid.appendChild(card);
            });
        }
        renderNews();

        // ============================================================
        //  4. 东部排名（模拟）
        // ============================================================
        const eastTeams = [
            { name: '凯尔特人', win: 32, lose: 10 },
            { name: '雄鹿', win: 30, lose: 12 },
            { name: '热火', win: 28, lose: 14 },
            { name: '76人', win: 27, lose: 15 },
            { name: '骑士', win: 26, lose: 16 },
            { name: '篮网', win: 24, lose: 18 },
            { name: '猛龙', win: 22, lose: 20 },
            { name: '公牛', win: 20, lose: 22 }
        ];

        function renderStandings() {
            const list = document.getElementById('eastStandings');
            list.innerHTML = '';
            eastTeams.forEach((t, i) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span class="rank">${i + 1}</span>
                    <span class="team-name">${t.name}</span>
                    <span class="team-record">${t.win}-${t.lose}</span>
                `;
                list.appendChild(li);
            });
        }
        renderStandings();

        // ============================================================
        //  5. 得分榜 TOP5（模拟）
        // ============================================================
        const topScorersData = [
            { name: '卢卡·东契奇', ppg: 33.6 },
            { name: '扬尼斯·阿德托昆博', ppg: 31.2 },
            { name: '谢伊·吉尔杰斯-亚历山大', ppg: 30.8 },
            { name: '乔尔·恩比德', ppg: 30.2 },
            { name: '斯蒂芬·库里', ppg: 29.8 }
        ];

        function renderTopScorers() {
            const list = document.getElementById('topScorers');
            list.innerHTML = '';
            topScorersData.forEach((p, i) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span class="rank">${i + 1}</span>
                    <span class="team-name">${p.name}</span>
                    <span class="player-stat">${p.ppg.toFixed(1)}</span>
                `;
                list.appendChild(li);
            });
        }
        renderTopScorers();

        // ============================================================
        //  6. 球员数据总表（模拟）+ 排序
        // ============================================================
        const players = [
            { name: '勒布朗·詹姆斯', team: '湖人', pts: 28.4, reb: 8.2, ast: 7.8 },
            { name: '斯蒂芬·库里', team: '勇士', pts: 29.8, reb: 5.1, ast: 6.4 },
            { name: '扬尼斯·阿德托昆博', team: '雄鹿', pts: 31.2, reb: 11.8, ast: 5.6 },
            { name: '卢卡·东契奇', team: '独行侠', pts: 33.6, reb: 8.9, ast: 9.2 },
            { name: '乔尔·恩比德', team: '76人', pts: 30.2, reb: 11.5, ast: 4.8 },
            { name: '谢伊·吉尔杰斯-亚历山大', team: '雷霆', pts: 30.8, reb: 5.5, ast: 6.2 },
            { name: '杰森·塔图姆', team: '凯尔特人', pts: 27.4, reb: 8.6, ast: 4.9 },
            { name: '德文·布克', team: '太阳', pts: 26.8, reb: 4.2, ast: 6.9 },
            { name: '安东尼·戴维斯', team: '湖人', pts: 24.9, reb: 12.4, ast: 3.1 },
            { name: '达米安·利拉德', team: '雄鹿', pts: 25.6, reb: 4.3, ast: 7.2 },
            { name: '特雷·杨', team: '老鹰', pts: 27.2, reb: 3.8, ast: 10.6 },
            { name: '科怀·伦纳德', team: '快船', pts: 24.5, reb: 6.3, ast: 4.1 }
        ];

        let currentSort = { col: -1, asc: true };

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            data.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${p.name}</td>
                    <td><span class="team-badge">${p.team}</span></td>
                    <td>${p.pts.toFixed(1)}</td>
                    <td>${p.reb.toFixed(1)}</td>
                    <td>${p.ast.toFixed(1)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function sortTable(col) {
            const headerCells = document.querySelectorAll('#statsTable thead th');
            headerCells.forEach((th, idx) => {
                th.classList.remove('sort-asc', 'sort-desc');
            });

            let asc = true;
            if (currentSort.col === col) {
                asc = !currentSort.asc;
            } else {
                asc = true;
            }
            currentSort.col = col;
            currentSort.asc = asc;

            // 更新排序箭头
            const th = headerCells[col];
            th.classList.add(asc ? 'sort-asc' : 'sort-desc');

            const sorted = [...players].sort((a, b) => {
                let keyA, keyB;
                switch (col) {
                    case 0: keyA = a.name; keyB = b.name; break;
                    case 1: keyA = a.team; keyB = b.team; break;
                    case 2: keyA = a.pts; keyB = b.pts; break;
                    case 3: keyA = a.reb; keyB = b.reb; break;
                    case 4: keyA = a.ast; keyB = b.ast; break;
                    default: return 0;
                }
                if (typeof keyA === 'string') {
                    return asc ? keyA.localeCompare(keyB) : keyB.localeCompare(keyA);
                } else {
                    return asc ? keyA - keyB : keyB - keyA;
                }
            });
            renderTable(sorted);
        }

        // 初始渲染表格（按出场顺序，即原序）
        renderTable(players);

        // ============================================================
        //  7. 点击新闻卡片以外的关闭菜单（点击页面其他区域关闭导航菜单）
        // ============================================================
        document.addEventListener('click', function(e) {
            const nav = document.querySelector('.navbar');
            const links = document.getElementById('navLinks');
            if (!nav.contains(e.target) && links.classList.contains('open')) {
                links.classList.remove('open');
            }
        });

        console.log('🏀 篮球国度已加载！');
    </script>
</body>
</html>
