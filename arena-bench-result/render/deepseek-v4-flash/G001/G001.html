<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>飞机大战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #gameCanvas {
            display: block;
            background: #1a1a2e;
            touch-action: none;
            max-width: 100%;
            max-height: 100%;
        }
        #gameOverlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            pointer-events: none;
            z-index: 10;
        }
        #gameOverlay h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        #gameOverlay p {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        #restartBtn {
            font-size: 1.5rem;
            padding: 15px 40px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 50px;
            pointer-events: auto;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s;
        }
        #restartBtn:active {
            transform: scale(0.95);
        }
        #gameOverlay.hidden {
            display: none;
        }
        #gameOverlay:not(.hidden) {
            display: flex;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="gameOverlay" class="hidden">
        <h1>游戏结束</h1>
        <p id="finalScore">得分：0</p>
        <button id="restartBtn">重新开始</button>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('gameOverlay');
        const finalScoreEl = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');

        // 逻辑尺寸
        const GAME_WIDTH = 320;
        const GAME_HEIGHT = 480;
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;

        // 游戏状态
        let gameRunning = false;
        let player = { x: GAME_WIDTH/2-20, y: GAME_HEIGHT-60, width: 40, height: 40 };
        let bullets = [];
        let enemies = [];
        let score = 0;
        let nextBulletTime = 0;
        let nextEnemyTime = 0;

        // 键盘标志
        const keys = { left: false, right: false, up: false, down: false };

        function initGame() {
            score = 0;
            player.x = GAME_WIDTH/2 - 20;
            player.y = GAME_HEIGHT - 60;
            bullets = [];
            enemies = [];
            const now = performance.now();
            nextBulletTime = now + 200;
            nextEnemyTime = now + 1500;
            gameRunning = true;
            overlay.classList.add('hidden');
        }

        function fireBullet() {
            bullets.push({
                x: player.x + player.width/2 - 2,
                y: player.y,
                width: 4,
                height: 10,
                speed: 8
            });
        }

        function spawnEnemy() {
            const size = 30 + Math.random() * 10;
            enemies.push({
                x: Math.random() * (GAME_WIDTH - size),
                y: -size,
                width: size,
                height: size,
                speed: 2 + Math.random() * 2
            });
        }

        function rectCollide(a, b) {
            return a.x < b.x + b.width &&
                   a.x + a.width > b.x &&
                   a.y < b.y + b.height &&
                   a.y + a.height > b.y;
        }

        function update() {
            if (!gameRunning) return;

            // 键盘移动
            if (keys.left) player.x -= 5;
            if (keys.right) player.x += 5;
            if (keys.up) player.y -= 5;
            if (keys.down) player.y += 5;
            player.x = Math.max(0, Math.min(GAME_WIDTH - player.width, player.x));
            player.y = Math.max(0, Math.min(GAME_HEIGHT - player.height, player.y));

            const now = performance.now();

            // 自动发射子弹
            if (now > nextBulletTime) {
                fireBullet();
                nextBulletTime = now + 200;
            }

            // 生成敌机
            if (now > nextEnemyTime) {
                spawnEnemy();
                nextEnemyTime = now + 1000 + Math.random() * 1000;
            }

            // 更新子弹
            for (let i = bullets.length-1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                if (bullets[i].y + bullets[i].height < 0) bullets.splice(i, 1);
            }

            // 更新敌机
            for (let i = enemies.length-1; i >= 0; i--) {
                enemies[i].y += enemies[i].speed;
                if (enemies[i].y > GAME_HEIGHT) enemies.splice(i, 1);
            }

            // 子弹与敌机碰撞
            for (let i = bullets.length-1; i >= 0; i--) {
                let used = false;
                for (let j = enemies.length-1; j >= 0; j--) {
                    if (rectCollide(bullets[i], enemies[j])) {
                        enemies.splice(j, 1);
                        used = true;
                        score++;
                        break;
                    }
                }
                if (used) bullets.splice(i, 1);
            }

            // 玩家与敌机碰撞
            for (let enemy of enemies) {
                if (rectCollide(player, enemy)) {
                    gameOver();
                    break;
                }
            }
        }

        function gameOver() {
            gameRunning = false;
            finalScoreEl.textContent = '得分：' + score;
            overlay.classList.remove('hidden');
        }

        function draw() {
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // 玩家（三角形）
            ctx.fillStyle = '#00e5ff';
            const px = player.x + player.width/2;
            const py = player.y;
            ctx.beginPath();
            ctx.moveTo(px, py);
            ctx.lineTo(player.x, py + player.height);
            ctx.lineTo(player.x + player.width, py + player.height);
            ctx.closePath();
            ctx.fill();

            // 子弹
            ctx.fillStyle = '#ffeb3b';
            for (let b of bullets) ctx.fillRect(b.x, b.y, b.width, b.height);

            // 敌机
            ctx.fillStyle = '#ff5252';
            for (let e of enemies) ctx.fillRect(e.x, e.y, e.width, e.height);

            // 得分
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText('得分：' + score, 10, 10);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // 自适应尺寸
        function resizeCanvas() {
            const ww = window.innerWidth;
            const wh = window.innerHeight;
            const ratio = GAME_WIDTH / GAME_HEIGHT;
            let dw, dh;
            if (ww / wh > ratio) {
                dh = wh;
                dw = dh * ratio;
            } else {
                dw = ww;
                dh = dw / ratio;
            }
            canvas.style.width = dw + 'px';
            canvas.style.height = dh + 'px';
        }
        window.addEventListener('resize', resizeCanvas);

        // 触摸控制
        function handleTouch(e) {
            if (!gameRunning) return;
            e.preventDefault();
            const touch = e.touches[0] || e.changedTouches[0];
            if (!touch) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let cx = (touch.clientX - rect.left) * scaleX;
            let cy = (touch.clientY - rect.top) * scaleY;
            player.x = Math.max(0, Math.min(GAME_WIDTH - player.width, cx - player.width/2));
            player.y = Math.max(0, Math.min(GAME_HEIGHT - player.height, cy - player.height/2));
        }
        canvas.addEventListener('touchstart', handleTouch);
        canvas.addEventListener('touchmove', handleTouch);
        canvas.addEventListener('touchend', e => e.preventDefault());
        canvas.addEventListener('touchcancel', e => e.preventDefault());

        // 键盘控制
        document.addEventListener('keydown', e => {
            if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) {
                e.preventDefault();
            }
            if (!gameRunning) return;
            switch (e.key) {
                case 'ArrowLeft': keys.left = true; break;
                case 'ArrowRight': keys.right = true; break;
                case 'ArrowUp': keys.up = true; break;
                case 'ArrowDown': keys.down = true; break;
            }
        });
        document.addEventListener('keyup', e => {
            switch (e.key) {
                case 'ArrowLeft': keys.left = false; break;
                case 'ArrowRight': keys.right = false; break;
                case 'ArrowUp': keys.up = false; break;
                case 'ArrowDown': keys.down = false; break;
            }
        });

        // 重启按钮
        restartBtn.addEventListener('click', initGame);
        restartBtn.addEventListener('touchend', e => {
            e.preventDefault();
            initGame();
        });

        // 禁止右键菜单
        canvas.addEventListener('contextmenu', e => e.preventDefault());

        // 启动
        window.addEventListener('load', () => {
            resizeCanvas();
            initGame();
            gameLoop();
        });
    </script>
</body>
</html>
