<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课堂笔记 · NoteClass</title>
    <style>
        /* ===== CSS 变量 ===== */
        :root {
            --bg-primary: #f7f8fa;
            --bg-white: #ffffff;
            --bg-sidebar: #f1f3f5;
            --bg-hover: #e8eaed;
            --bg-active: #d3e3fd;
            --text-primary: #1d1d1f;
            --text-secondary: #6b7280;
            --text-light: #9ca3af;
            --border-color: #e5e7eb;
            --border-light: #f0f0f0;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.12);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --transition: all 0.2s ease;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --tag-colors: #4f46e5, #0ea5e9, #10b981, #f59e0b, #ef4444, #ec4899, #8b5cf6, #14b8a6;
        }

        /* ===== 全局重置 ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        /* ===== 主容器 ===== */
        .app {
            width: 100%;
            max-width: 1440px;
            height: 100%;
            max-height: 960px;
            background: var(--bg-white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* ===== 左侧边栏 ===== */
        .sidebar {
            width: 240px;
            min-width: 240px;
            background: var(--bg-sidebar);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .sidebar-header .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: -0.5px;
        }

        .sidebar-header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }

        .sidebar-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-sans);
        }
        .btn-primary:hover {
            background: #4338ca;
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }
        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 14px;
            background: transparent;
            color: var(--text-secondary);
            border: 1px dashed var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 400;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-sans);
        }
        .btn-secondary:hover {
            background: var(--bg-hover);
            border-color: var(--text-light);
            color: var(--text-primary);
        }

        .nav-section {
            margin-top: 4px;
        }
        .nav-section .section-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-light);
            padding: 8px 4px 6px;
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
            font-weight: 400;
            color: var(--text-secondary);
            user-select: none;
            position: relative;
        }
        .nav-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .nav-item.active {
            background: var(--bg-active);
            color: #4f46e5;
            font-weight: 500;
        }
        .nav-item .tag-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .nav-item .tag-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .nav-item .tag-count {
            font-size: 12px;
            color: var(--text-light);
            background: var(--bg-hover);
            padding: 0 8px;
            border-radius: 10px;
            font-weight: 400;
            min-width: 20px;
            text-align: center;
        }
        .nav-item.active .tag-count {
            background: rgba(79, 70, 229, 0.15);
            color: #4f46e5;
        }
        .nav-item .delete-tag-btn {
            opacity: 1; /* fixed: was 0 */
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-light);
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .nav-item:hover .delete-tag-btn {
            opacity: 0.6;
        }
        .nav-item .delete-tag-btn:hover {
            opacity: 1;
            background: rgba(239, 68, 68, 0.12);
            color: #ef4444;
        }

        /* ===== 主内容区 ===== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* 顶部栏 */
        .topbar {
            padding: 20px 28px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            background: var(--bg-white);
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .topbar-left h2 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }
        .topbar-left .note-count {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-light);
            background: var(--bg-sidebar);
            padding: 2px 12px;
            border-radius: 12px;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-sidebar);
            border-radius: var(--radius-sm);
            padding: 6px 14px;
            width: 240px;
            transition: var(--transition);
            border: 1px solid transparent;
        }
        .search-box:focus-within {
            border-color: #4f46e5;
            background: var(--bg-white);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .search-box svg {
            width: 16px;
            height: 16px;
            color: var(--text-light);
            flex-shrink: 0;
        }
        .search-box input {
            border: none;
            background: transparent;
            outline: none;
            font-size: 14px;
            color: var(--text-primary);
            width: 100%;
            font-family: var(--font-sans);
        }
        .search-box input::placeholder {
            color: var(--text-light);
        }

        /* 笔记列表 */
        .note-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 24px 24px;
            min-height: 0;
        }

        .note-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        /* 空状态 */
        .empty-state {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: var(--text-light);
            text-align: center;
        }
        .empty-state .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        .empty-state h3 {
            font-size: 18px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .empty-state p {
            font-size: 14px;
            color: var(--text-light);
            max-width: 300px;
        }

        /* 笔记卡片 */
        .note-card {
            background: var(--bg-white);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 18px 20px 16px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }
        .note-card:hover {
            border-color: #d1d5db;
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        .note-card.selected {
            border-color: #4f46e5;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.15), var(--shadow-sm);
        }
        .note-card .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .note-card .card-preview {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .note-card .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 4px;
            gap: 8px;
            flex-wrap: wrap;
        }
        .note-card .card-tags {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .note-card .card-tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 500;
            background: var(--bg-sidebar);
            color: var(--text-secondary);
        }
        .note-card .card-time {
            font-size: 11px;
            color: var(--text-light);
            white-space: nowrap;
        }
        .note-card .card-actions {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 4px;
            opacity: 1; /* fixed: was 0 */
            transition: var(--transition);
        }
        .note-card:hover .card-actions {
            opacity: 1;
        }
        .note-card .card-action-btn {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: none;
            background: var(--bg-white);
            color: var(--text-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }
        .note-card .card-action-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .note-card .card-action-btn.delete:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        /* ===== 右侧详情面板 ===== */
        .detail-panel {
            width: 380px;
            min-width: 380px;
            border-left: 1px solid var(--border-color);
            background: var(--bg-white);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: var(--transition);
        }
        .detail-panel.empty {
            justify-content: center;
            align-items: center;
            color: var(--text-light);
            padding: 40px;
            text-align: center;
        }
        .detail-panel.empty .empty-icon {
            font-size: 40px;
            opacity: 0.4;
            margin-bottom: 12px;
        }
        .detail-panel.empty h3 {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .detail-panel.empty p {
            font-size: 13px;
            margin-top: 4px;
        }

        .detail-header {
            padding: 20px 24px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .detail-header h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .detail-header .close-btn {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text-light);
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .detail-header .close-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .detail-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .detail-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .detail-field label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .detail-field input,
        .detail-field textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: var(--font-sans);
            color: var(--text-primary);
            background: var(--bg-primary);
            transition: var(--transition);
            outline: none;
        }
        .detail-field input:focus,
        .detail-field textarea:focus {
            border-color: #4f46e5;
            background: var(--bg-white);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.08);
        }
        .detail-field textarea {
            resize: vertical;
            min-height: 160px;
            line-height: 1.6;
        }

        .detail-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px 0;
        }
        .detail-tags .dtag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            background: var(--bg-sidebar);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .detail-tags .dtag .remove-tag {
            cursor: pointer;
            opacity: 0.5;
            font-size: 14px;
            line-height: 1;
            transition: var(--transition);
            background: none;
            border: none;
            color: inherit;
            padding: 0 2px;
        }
        .detail-tags .dtag .remove-tag:hover {
            opacity: 1;
            color: #ef4444;
        }
        .detail-tags .add-tag-select {
            padding: 4px 10px;
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            font-size: 12px;
            font-family: var(--font-sans);
            background: transparent;
            color: var(--text-light);
            cursor: pointer;
            transition: var(--transition);
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            min-width: 80px;
        }
        .detail-tags .add-tag-select:hover {
            border-color: var(--text-light);
            color: var(--text-secondary);
        }
        .detail-tags .add-tag-select:focus {
            border-color: #4f46e5;
        }

        .detail-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }
        .detail-actions .btn-save {
            flex: 1;
            padding: 10px 16px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-sans);
        }
        .detail-actions .btn-save:hover {
            background: #4338ca;
        }
        .detail-actions .btn-delete {
            padding: 10px 16px;
            background: transparent;
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-sans);
        }
        .detail-actions .btn-delete:hover {
            background: rgba(239, 68, 68, 0.06);
            border-color: #ef4444;
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 1; /* fixed: was 0 */
            visibility: hidden;
            transition: var(--transition);
        }
        .modal-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-white);
            border-radius: var(--radius-lg);
            padding: 28px 32px 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-lg);
            transform: scale(0.92) translateY(12px);
            transition: var(--transition);
        }
        .modal-overlay.open .modal {
            transform: scale(1) translateY(0);
        }
        .modal h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-primary);
        }
        .modal .modal-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 18px;
        }
        .modal .modal-field {
            margin-bottom: 16px;
        }
        .modal .modal-field label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .modal .modal-field input,
        .modal .modal-field select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: var(--font-sans);
            outline: none;
            transition: var(--transition);
            background: var(--bg-primary);
        }
        .modal .modal-field input:focus,
        .modal .modal-field select:focus {
            border-color: #4f46e5;
            background: var(--bg-white);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.08);
        }
        .modal .modal-field input[type="color"] {
            padding: 4px;
            height: 42px;
            cursor: pointer;
        }
        .modal .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 8px;
        }
        .modal .modal-actions .btn-cancel {
            padding: 8px 20px;
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-sans);
        }
        .modal .modal-actions .btn-cancel:hover {
            background: var(--bg-hover);
        }
        .modal .modal-actions .btn-confirm {
            padding: 8px 24px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-sans);
        }
        .modal .modal-actions .btn-confirm:hover {
            background: #4338ca;
        }

        /* ===== 滚动条美化 ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 1200px) {
            .detail-panel {
                width: 320px;
                min-width: 320px;
            }
        }

        @media (max-width: 960px) {
            body {
                padding: 0;
            }
            .app {
                max-height: none;
                border-radius: 0;
                height: 100vh;
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                min-width: unset;
                flex-direction: row;
                flex-wrap: wrap;
                padding: 12px 16px;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                max-height: 140px;
                overflow-y: auto;
                gap: 8px;
            }
            .sidebar-header {
                margin-bottom: 0;
                padding-bottom: 0;
                border-bottom: none;
                width: 100%;
            }
            .sidebar-actions {
                flex-direction: row;
                margin-bottom: 0;
                width: 100%;
            }
            .nav-section {
                width: 100%;
            }
            .nav-list {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 4px;
            }
            .nav-item {
                padding: 6px 10px;
                font-size: 13px;
            }
            .nav-item .tag-count {
                display: none;
            }
            .main {
                flex: 1;
                min-height: 0;
            }
            .topbar {
                padding: 12px 16px;
                flex-wrap: wrap;
            }
            .search-box {
                width: 100%;
            }
            .note-list-container {
                padding: 12px 16px;
            }
            .note-list {
                grid-template-columns: 1fr;
            }
            .detail-panel {
                position: fixed;
                top: 0;
                right: 0;
                bottom: 0;
                width: 100%;
                min-width: unset;
                max-width: 480px;
                z-index: 100;
                box-shadow: var(--shadow-lg);
                transform: translateX(100%);
                transition: transform 0.3s ease;
            }
            .detail-panel.open {
                transform: translateX(0);
            }
            .detail-panel.empty {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .detail-panel {
                max-width: 100%;
            }
            .modal {
                margin: 16px;
                padding: 20px;
            }
        }

        /* ===== 工具类 ===== */
        .hidden {
            display: none !important;
        }
        .fade-in {
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
<style id="screenshot-fix">
/* 仅处理滚动懒加载：让 opacity:0 的元素可见，但排除 toast/弹窗 */
.reveal:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.fade-in:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.fade:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.lazy:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.stagger-item:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.animate:not(.toast):not([class*="modal"]):not([class*="overlay"]) {
  opacity: 1 !important;
  visibility: visible !important;
}
/* 特别确保弹窗/侧边栏/Toast 保持隐藏（它们通过其他类控制显示） */
.modal-overlay:not(.show):not(.active),
.confirm-overlay:not(.show):not(.active),
[class*="modal"]:not(.show):not(.active):not([class*="stagger"]),
[class*="overlay"]:not(.show):not(.active):not([class*="scroll"]),
.toast:not(.show),
[id*="toast"]:not(.show):not(.active),
[id*="cart"],
[id*="sidebar"] {
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
}
/* 排除 toast 类，避免强制显示 */
.reveal:not(.toast), .fade-in:not(.toast), .fade:not(.toast), .lazy:not(.toast), .stagger-item:not(.toast), .animate:not(.toast) {

  visibility: visible !important;
}
/* 强制显示主要内容区域（section 下的直接子元素），但排除移动菜单 */

</style></head>
<body>

    <!-- ===== 主应用容器 ===== -->
    <div class="app" id="app">

        <!-- ===== 左侧边栏 ===== -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon">📓</div>
                <h1>课堂笔记</h1>
            </div>

            <div class="sidebar-actions">
                <button class="btn-primary" id="btnNewNote">
                    <span>+</span> 新建笔记
                </button>
                <button class="btn-secondary" id="btnNewTag">
                    + 新建标签
                </button>
            </div>

            <div class="nav-section">
                <div class="section-title">分类</div>
                <ul class="nav-list" id="navList">
                    <li class="nav-item active" data-filter="all">
                        <span style="font-size:16px;">📋</span>
                        <span class="tag-name">所有笔记</span>
                        <span class="tag-count" id="allCount">0</span>
                    </li>
                </ul>
            </div>
        </aside>

        <!-- ===== 主内容区 ===== -->
        <div class="main">

            <!-- 顶部栏 -->
            <div class="topbar">
                <div class="topbar-left">
                    <h2 id="viewTitle">所有笔记</h2>
                    <span class="note-count" id="viewCount">0</span>
                </div>
                <div class="search-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" id="searchInput" placeholder="搜索笔记..." autocomplete="off">
                </div>
            </div>

            <!-- 笔记列表 -->
            <div class="note-list-container">
                <div class="note-list" id="noteList"></div>
            </div>
        </div>

        <!-- ===== 右侧详情面板 ===== -->
        <div class="detail-panel empty" id="detailPanel">
            <div class="empty-icon">📝</div>
            <h3>选择一篇笔记</h3>
            <p>点击左侧笔记查看或编辑详细信息</p>
        </div>
    </div>

    <!-- ===== 新建标签模态框 ===== -->
    <div class="modal-overlay" id="tagModal">
        <div class="modal">
            <h3>新建标签</h3>
            <p class="modal-desc">为笔记创建一个新的分类标签</p>
            <div class="modal-field">
                <label>标签名称</label>
                <input type="text" id="tagNameInput" placeholder="例如：数学、物理、历史..." autocomplete="off">
            </div>
            <div class="modal-field">
                <label>标签颜色</label>
                <input type="color" id="tagColorInput" value="#4f46e5">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" id="tagModalCancel">取消</button>
                <button class="btn-confirm" id="tagModalConfirm">创建</button>
            </div>
        </div>
    </div>

    <!-- ===== JavaScript ===== -->
    <script>
        (function() {
            'use strict';

            // ===== 数据层 =====
            const STORAGE_KEY = 'noteclass_data';

            let data = {
                notes: [],
                tags: []
            };

            // 默认标签
            const DEFAULT_TAGS = [
                { id: 't1', name: '数学', color: '#4f46e5' },
                { id: 't2', name: '物理', color: '#0ea5e9' },
                { id: 't3', name: '化学', color: '#10b981' },
                { id: 't4', name: '历史', color: '#f59e0b' },
                { id: 't5', name: '文学', color: '#ec4899' },
            ];

            // 加载数据
            function loadData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (parsed && typeof parsed === 'object' && Array.isArray(parsed.notes) && Array.isArray(parsed
                                .tags)) {
                            data = parsed;
                            return;
                        }
                    }
                } catch (e) { /* ignore */ }
                // 初始化默认数据
                data = {
                    notes: [],
                    tags: JSON.parse(JSON.stringify(DEFAULT_TAGS))
                };
                // 添加一些示例笔记
                data.notes.push({
                    id: 'n1',
                    title: '微积分基本定理',
                    content: '微积分基本定理（Fundamental Theorem of Calculus）将微分和积分联系起来。\n\n第一部分：若 f 在 [a,b] 上连续，则 F(x)=∫ₐˣ f(t)dt 在 [a,b] 上可导，且 F\'(x)=f(x)。\n\n第二部分：若 F 是 f 的任意一个原函数，则 ∫ₐᵇ f(x)dx = F(b)-F(a)。',
                    tags: ['t1'],
                    createdAt: Date.now() - 86400000 * 3,
                    updatedAt: Date.now() - 86400000 * 1
                });
                data.notes.push({
                    id: 'n2',
                    title: '牛顿运动定律',
                    content: '牛顿三定律是经典力学的基础：\n\n第一定律（惯性定律）：物体在不受外力作用时，保持静止或匀速直线运动状态。\n\n第二定律（F=ma）：物体的加速度与所受合力成正比，与质量成反比。\n\n第三定律（作用与反作用）：两个物体之间的作用力与反作用力大小相等、方向相反。',
                    tags: ['t2'],
                    createdAt: Date.now() - 86400000 * 5,
                    updatedAt: Date.now() - 86400000 * 2
                });
                data.notes.push({
                    id: 'n3',
                    title: '文艺复兴时期的艺术',
                    content: '文艺复兴（14-17世纪）是欧洲文化史上的一个重要时期，强调人文主义和回归古典。\n\n代表人物：\n- 达·芬奇：《蒙娜丽莎》《最后的晚餐》\n- 米开朗基罗：大卫雕像、西斯廷教堂壁画\n- 拉斐尔：《雅典学院》\n\n这一时期艺术的特点是透视法的运用、人体的真实描绘和光影的处理。',
                    tags: ['t4', 't5'],
                    createdAt: Date.now() - 86400000 * 7,
                    updatedAt: Date.now() - 86400000 * 4
                });
                data.notes.push({
                    id: 'n4',
                    title: '化学反应速率',
                    content: '化学反应速率表示反应进行的快慢程度。\n\n影响因素：\n1. 浓度：浓度越大，反应速率越快\n2. 温度：温度升高，反应速率加快（范特霍夫规则）\n3. 催化剂：降低活化能，加快反应\n4. 接触面积：固体表面积越大，反应越快',
                    tags: ['t3'],
                    createdAt: Date.now() - 86400000 * 1,
                    updatedAt: Date.now() - 86400000 * 0.5
                });
                saveData();
            }

            function saveData() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                } catch (e) { /* ignore */ }
            }

            // ===== 工具函数 =====
            function generateId() {
                return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
            }

            function formatTime(ts) {
                const d = new Date(ts);
                const now = new Date();
                const diff = now - d;
                if (diff < 60000) return '刚刚';
                if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
                if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
                if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
                return d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
            }

            function getTagById(id) {
                return data.tags.find(t => t.id === id);
            }

            function getTagsForNote(note) {
                return (note.tags || []).map(id => getTagById(id)).filter(Boolean);
            }

            // ===== 状态管理 =====
            let state = {
                currentFilter: 'all', // 'all' 或 tagId
                selectedNoteId: null,
                searchQuery: '',
                detailOpen: false // 移动端用
            };

            // ===== DOM 引用 =====
            const $ = (sel) => document.querySelector(sel);
            const $$ = (sel) => document.querySelectorAll(sel);

            const navList = $('#navList');
            const noteList = $('#noteList');
            const detailPanel = $('#detailPanel');
            const viewTitle = $('#viewTitle');
            const viewCount = $('#viewCount');
            const allCount = $('#allCount');
            const searchInput = $('#searchInput');
            const btnNewNote = $('#btnNewNote');
            const btnNewTag = $('#btnNewTag');

            // 详情面板内部元素（动态渲染）

            // 模态框
            const tagModal = $('#tagModal');
            const tagNameInput = $('#tagNameInput');
            const tagColorInput = $('#tagColorInput');
            const tagModalCancel = $('#tagModalCancel');
            const tagModalConfirm = $('#tagModalConfirm');

            // ===== 渲染函数 =====

            // 渲染侧边栏标签
            function renderSidebar() {
                // 保留 "所有笔记"
                const allItem = navList.querySelector('[data-filter="all"]');
                // 移除其他标签项
                const items = navList.querySelectorAll('.nav-item:not([data-filter="all"])');
                items.forEach(el => el.remove());

                // 按名称排序
                const sorted = [...data.tags].sort((a, b) => a.name.localeCompare(b.name, 'zh'));

                sorted.forEach(tag => {
                    const li = document.createElement('li');
                    li.className = 'nav-item';
                    li.dataset.filter = tag.id;
                    if (state.currentFilter === tag.id) li.classList.add('active');

                    const dot = document.createElement('span');
                    dot.className = 'tag-dot';
                    dot.style.background = tag.color;

                    const name = document.createElement('span');
                    name.className = 'tag-name';
                    name.textContent = tag.name;

                    const count = document.createElement('span');
                    count.className = 'tag-count';
                    count.textContent = data.notes.filter(n => (n.tags || []).includes(tag.id)).length;

                    const delBtn = document.createElement('button');
                    delBtn.className = 'delete-tag-btn';
                    delBtn.innerHTML = '×';
                    delBtn.title = '删除标签';
                    delBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteTag(tag.id);
                    });

                    li.appendChild(dot);
                    li.appendChild(name);
                    li.appendChild(count);
                    li.appendChild(delBtn);

                    li.addEventListener('click', () => {
                        setFilter(tag.id);
                    });

                    navList.appendChild(li);
                });

                // 更新所有笔记计数
                allCount.textContent = data.notes.length;
                // 高亮当前筛选
                navList.querySelectorAll('.nav-item').forEach(el => {
                    el.classList.toggle('active', el.dataset.filter === state.currentFilter);
                });
            }

            // 渲染笔记列表
            function renderNoteList() {
                let filtered = [...data.notes];

                // 按标签筛选
                if (state.currentFilter !== 'all') {
                    filtered = filtered.filter(n => (n.tags || []).includes(state.currentFilter));
                }

                // 按搜索筛选
                const q = state.searchQuery.trim().toLowerCase();
                if (q) {
                    filtered = filtered.filter(n =>
                        n.title.toLowerCase().includes(q) ||
                        n.content.toLowerCase().includes(q)
                    );
                }

                // 按更新时间排序（最新的在前）
                filtered.sort((a, b) => (b.updatedAt || b.createdAt) - (a.updatedAt || a.createdAt));

                // 更新视图信息
                const filterTag = state.currentFilter === 'all' ? null : getTagById(state.currentFilter);
                viewTitle.textContent = filterTag ? filterTag.name : '所有笔记';
                viewCount.textContent = filtered.length + ' 篇';

                // 清空列表
                noteList.innerHTML = '';

                if (filtered.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'empty-state';
                    empty.innerHTML = `
                        <div class="empty-icon">📭</div>
                        <h3>${q ? '没有匹配的笔记' : '还没有笔记'}</h3>
                        <p>${q ? '试试其他关键词吧' : '点击左侧 "新建笔记" 开始记录课堂内容'}</p>
                    `;
                    noteList.appendChild(empty);
                    // 清空详情（如果显示的是空）
                    if (state.selectedNoteId) {
                        const stillExists = data.notes.some(n => n.id === state.selectedNoteId);
                        if (!stillExists) {
                            state.selectedNoteId = null;
                            renderDetailPanel();
                        }
                    }
                    return;
                }

                // 如果当前选中的笔记不在筛选结果中，取消选中
                if (state.selectedNoteId) {
                    const stillVisible = filtered.some(n => n.id === state.selectedNoteId);
                    if (!stillVisible) {
                        state.selectedNoteId = null;
                        renderDetailPanel();
                    }
                }

                filtered.forEach(note => {
                    const card = document.createElement('div');
                    card.className = 'note-card' + (state.selectedNoteId === note.id ? ' selected' : '');
                    card.dataset.noteId = note.id;

                    const tags = getTagsForNote(note);

                    card.innerHTML = `
                        <div class="card-title">${escapeHtml(note.title) || '无标题'}</div>
                        <div class="card-preview">${escapeHtml(note.content.replace(/\\n/g, ' ')) || '暂无内容'}</div>
                        <div class="card-footer">
                            <div class="card-tags">
                                ${tags.map(t => `<span class="card-tag" style="background:${t.color}20;color:${t.color};">${escapeHtml(t.name)}</span>`).join('')}
                            </div>
                            <span class="card-time">${formatTime(note.updatedAt || note.createdAt)}</span>
                        </div>
                        <div class="card-actions">
                            <button class="card-action-btn delete" title="删除笔记" data-action="delete">🗑</button>
                        </div>
                    `;

                    // 点击卡片选中
                    card.addEventListener('click', (e) => {
                        // 如果点的是操作按钮，不触发选中
                        if (e.target.closest('.card-actions')) return;
                        selectNote(note.id);
                    });

                    // 删除按钮
                    const delBtn = card.querySelector('[data-action="delete"]');
                    delBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteNote(note.id);
                    });

                    noteList.appendChild(card);
                });
            }

            // 渲染详情面板
            function renderDetailPanel() {
                if (!state.selectedNoteId) {
                    detailPanel.className = 'detail-panel empty';
                    detailPanel.innerHTML = `
                        <div class="empty-icon">📝</div>
                        <h3>选择一篇笔记</h3>
                        <p>点击左侧笔记查看或编辑详细信息</p>
                    `;
                    return;
                }

                const note = data.notes.find(n => n.id === state.selectedNoteId);
                if (!note) {
                    state.selectedNoteId = null;
                    renderDetailPanel();
                    return;
                }

                detailPanel.className = 'detail-panel';
                const tags = getTagsForNote(note);
                const allTags = data.tags;
                const availableTags = allTags.filter(t => !(note.tags || []).includes(t.id));

                detailPanel.innerHTML = `
                    <div class="detail-header">
                        <h3>编辑笔记</h3>
                        <button class="close-btn" id="detailClose">✕</button>
                    </div>
                    <div class="detail-body">
                        <div class="detail-field">
                            <label>标题</label>
                            <input type="text" id="detailTitle" value="${escapeHtml(note.title)}" placeholder="笔记标题">
                        </div>
                        <div class="detail-field">
                            <label>内容</label>
                            <textarea id="detailContent" placeholder="开始记录课堂内容...">${escapeHtml(note.content)}</textarea>
                        </div>
                        <div class="detail-field">
                            <label>标签</label>
                            <div class="detail-tags" id="detailTags">
                                ${tags.map(t => `
                                    <span class="dtag" style="border-color:${t.color}40;background:${t.color}15;color:${t.color};">
                                        <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${t.color};margin-right:2px;"></span>
                                        ${escapeHtml(t.name)}
                                        <button class="remove-tag" data-tag-id="${t.id}">×</button>
                                    </span>
                                `).join('')}
                                ${availableTags.length > 0 ? `
                                    <select class="add-tag-select" id="addTagSelect">
                                        <option value="">+ 添加标签</option>
                                        ${availableTags.map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('')}
                                    </select>
                                ` : `<span style="font-size:12px;color:var(--text-light);">没有更多标签了</span>`}
                            </div>
                        </div>
                        <div class="detail-actions">
                            <button class="btn-save" id="detailSave">💾 保存</button>
                            <button class="btn-delete" id="detailDelete">🗑 删除</button>
                        </div>
                    </div>
                `;

                // 绑定详情事件
                const closeBtn = detailPanel.querySelector('#detailClose');
                const saveBtn = detailPanel.querySelector('#detailSave');
                const deleteBtn = detailPanel.querySelector('#detailDelete');
                const titleInput = detailPanel.querySelector('#detailTitle');
                const contentInput = detailPanel.querySelector('#detailContent');
                const addTagSelect = detailPanel.querySelector('#addTagSelect');
                const removeTagBtns = detailPanel.querySelectorAll('.remove-tag');

                closeBtn.addEventListener('click', () => {
                    state.selectedNoteId = null;
                    renderDetailPanel();
                    // 移动端关闭
                    detailPanel.classList.remove('open');
                    // 取消所有卡片选中状态
                    document.querySelectorAll('.note-card.selected').forEach(el => el.classList.remove('selected'));
                });

                saveBtn.addEventListener('click', () => {
                    const title = titleInput.value.trim() || '无标题';
                    const content = contentInput.value;
                    updateNote(note.id, { title, content });
                });

                deleteBtn.addEventListener('click', () => {
                    if (confirm('确定要删除这篇笔记吗？')) {
                        deleteNote(note.id);
                    }
                });

                // 快捷键保存 Ctrl+Enter
                contentInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                        saveBtn.click();
                    }
                });

                // 添加标签
                if (addTagSelect) {
                    addTagSelect.addEventListener('change', (e) => {
                        const tagId = e.target.value;
                        if (tagId) {
                            addTagToNote(note.id, tagId);
                            addTagSelect.value = '';
                        }
                    });
                }

                // 移除标签
                removeTagBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const tagId = btn.dataset.tagId;
                        removeTagFromNote(note.id, tagId);
                    });
                });

                // 移动端自动打开
                if (window.innerWidth <= 960) {
                    detailPanel.classList.add('open');
                }
            }

            // ===== 操作函数 =====

            function setFilter(filter) {
                state.currentFilter = filter;
                state.selectedNoteId = null;
                state.searchQuery = '';
                searchInput.value = '';
                renderSidebar();
                renderNoteList();
                renderDetailPanel();
            }

            function selectNote(id) {
                state.selectedNoteId = id;
                // 更新卡片高亮
                document.querySelectorAll('.note-card').forEach(el => {
                    el.classList.toggle('selected', el.dataset.noteId === id);
                });
                renderDetailPanel();
            }

            function createNote() {
                const tagId = state.currentFilter !== 'all' ? state.currentFilter : null;
                const note = {
                    id: generateId(),
                    title: '新笔记',
                    content: '',
                    tags: tagId ? [tagId] : [],
                    createdAt: Date.now(),
                    updatedAt: Date.now()
                };
                data.notes.push(note);
                saveData();
                // 刷新视图
                renderSidebar();
                renderNoteList();
                selectNote(note.id);
                // 滚动到新卡片
                const card = document.querySelector(`.note-card[data-note-id="${note.id}"]`);
                if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                // 聚焦标题编辑
                setTimeout(() => {
                    const titleInput = detailPanel.querySelector('#detailTitle');
                    if (titleInput) titleInput.focus();
                }, 100);
            }

            function updateNote(id, updates) {
                const note = data.notes.find(n => n.id === id);
                if (!note) return;
                if (updates.title !== undefined) note.title = updates.title;
                if (updates.content !== undefined) note.content = updates.content;
                note.updatedAt = Date.now();
                saveData();
                renderNoteList();
                renderDetailPanel();
                // 也刷新侧边栏（标签计数可能变化）
                renderSidebar();
            }

            function deleteNote(id) {
                data.notes = data.notes.filter(n => n.id !== id);
                if (state.selectedNoteId === id) {
                    state.selectedNoteId = null;
                }
                saveData();
                renderSidebar();
                renderNoteList();
                renderDetailPanel();
            }

            function addTagToNote(noteId, tagId) {
                const note = data.notes.find(n => n.id === noteId);
                if (!note) return;
                if (!note.tags) note.tags = [];
                if (note.tags.includes(tagId)) return;
                note.tags.push(tagId);
                note.updatedAt = Date.now();
                saveData();
                renderSidebar();
                renderNoteList();
                renderDetailPanel();
            }

            function removeTagFromNote(noteId, tagId) {
                const note = data.notes.find(n => n.id === noteId);
                if (!note) return;
                note.tags = (note.tags || []).filter(t => t !== tagId);
                note.updatedAt = Date.now();
                saveData();
                renderSidebar();
                renderNoteList();
                renderDetailPanel();
            }

            function createTag(name, color) {
                const trimmed = name.trim();
                if (!trimmed) return;
                if (data.tags.some(t => t.name.toLowerCase() === trimmed.toLowerCase())) {
                    alert('标签 "' + trimmed + '" 已存在');
                    return;
                }
                const tag = {
                    id: generateId(),
                    name: trimmed,
                    color: color || '#4f46e5'
                };
                data.tags.push(tag);
                saveData();
                renderSidebar();
                // 如果当前在详情面板且选中了笔记，刷新详情（标签选择器更新）
                if (state.selectedNoteId) renderDetailPanel();
            }

            function deleteTag(tagId) {
                const tag = getTagById(tagId);
                if (!tag) return;
                if (!confirm(`确定要删除标签 "${tag.name}" 吗？所有笔记中的该标签将被移除。`)) return;
                // 从所有笔记中移除该标签
                data.notes.forEach(n => {
                    if (n.tags) {
                        n.tags = n.tags.filter(t => t !== tagId);
                    }
                });
                data.tags = data.tags.filter(t => t.id !== tagId);
                if (state.currentFilter === tagId) {
                    state.currentFilter = 'all';
                }
                saveData();
                renderSidebar();
                renderNoteList();
                if (state.selectedNoteId) renderDetailPanel();
            }

            // ===== 工具 =====
            function escapeHtml(str) {
                if (!str) return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ===== 事件绑定 =====

            // 新建笔记
            btnNewNote.addEventListener('click', createNote);

            // 新建标签
            btnNewTag.addEventListener('click', () => {
                tagNameInput.value = '';
                tagColorInput.value = '#4f46e5';
                tagModal.classList.add('open');
                setTimeout(() => tagNameInput.focus(), 100);
            });

            // 模态框
            tagModalCancel.addEventListener('click', () => {
                tagModal.classList.remove('open');
            });
            tagModal.addEventListener('click', (e) => {
                if (e.target === tagModal) tagModal.classList.remove('open');
            });
            tagModalConfirm.addEventListener('click', () => {
                const name = tagNameInput.value.trim();
                const color = tagColorInput.value;
                if (!name) {
                    tagNameInput.focus();
                    return;
                }
                createTag(name, color);
                tagModal.classList.remove('open');
            });
            tagNameInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') tagModalConfirm.click();
                if (e.key === 'Escape') tagModal.classList.remove('open');
            });

            // 搜索
            searchInput.addEventListener('input', (e) => {
                state.searchQuery = e.target.value;
                renderNoteList();
                // 如果当前选中的笔记被筛掉了，取消选中
                if (state.selectedNoteId) {
                    const note = data.notes.find(n => n.id === state.selectedNoteId);
                    if (note) {
                        const q = state.searchQuery.trim().toLowerCase();
                        if (q) {
                            const matches = note.title.toLowerCase().includes(q) || note.content.toLowerCase().includes(q);
                            if (!matches) {
                                state.selectedNoteId = null;
                                renderDetailPanel();
                            }
                        }
                    }
                }
            });

            // 键盘快捷键
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (tagModal.classList.contains('open')) {
                        tagModal.classList.remove('open');
                        return;
                    }
                    if (state.selectedNoteId) {
                        state.selectedNoteId = null;
                        renderDetailPanel();
                        if (window.innerWidth <= 960) {
                            detailPanel.classList.remove('open');
                        }
                        renderNoteList();
                    }
                }
                // Ctrl+N 新建笔记
                if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
                    e.preventDefault();
                    createNote();
                }
            });

            // 窗口尺寸变化，移动端关闭详情
            window.addEventListener('resize', () => {
                if (window.innerWidth > 960) {
                    detailPanel.classList.remove('open');
                }
            });

            // ===== 初始化 =====
            loadData();
            renderSidebar();
            renderNoteList();
            renderDetailPanel();

            // 如果有笔记，默认选中第一篇（方便演示）
            if (data.notes.length > 0 && !state.selectedNoteId) {
                // 按筛选后的第一篇
                let filtered = [...data.notes];
                if (state.currentFilter !== 'all') {
                    filtered = filtered.filter(n => (n.tags || []).includes(state.currentFilter));
                }
                if (filtered.length > 0) {
                    selectNote(filtered[0].id);
                }
            }

            // 控制台帮助
            console.log('📓 课堂笔记已启动！');
            console.log('快捷键: Ctrl+N 新建笔记, Escape 取消选择');
            console.log('数据保存在 localStorage 中');

        })();
    </script>

</body>
</html>
