<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考研政治刷题工具</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            margin-top: 20px;
        }

        h1 {
            font-size: 24px;
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }

        .question {
            margin-bottom: 20px;
        }

        .question h2 {
            font-size: 18px;
            color: #444;
        }

        .options {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .options li {
            margin: 10px 0;
        }

        .options input[type="radio"] {
            margin-right: 10px;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            color: #fff;
            background-color: #007BFF;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        .result {
            display: none;
            text-align: center;
            font-size: 18px;
            margin-top: 20px;
        }

        .result span.correct {
            color: green;
        }

        .result span.wrong {
            color: red;
        }

        .retry {
            display: none;
            background-color: #28a745;
        }

        .retry:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>考研政治刷题工具</h1>
        <form id="quizForm">
            <div class="question" id="question1">
                <h2>1. 中国共产党成立的时间是？</h2>
                <ul class="options">
                    <li><label><input type="radio" name="q1" value="A">A. 1920年</label></li>
                    <li><label><input type="radio" name="q1" value="B">B. 1921年</label></li>
                    <li><label><input type="radio" name="q1" value="C">C. 1922年</label></li>
                    <li><label><input type="radio" name="q1" value="D">D. 1923年</label></li>
                </ul>
            </div>
            <!-- Add more questions below. Adjust IDs and names. This is a placeholder list. -->
            <div id="moreQuestions"></div>
            <button type="button" onclick="submitQuiz()">提交答案</button>
        </form>
        <div class="result" id="result">
            <p>得分：<span id="score"></span>/10</p>
            <div id="analysis"></div>
        </div>
