<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Countdown</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #f9f9f9;
            color: #333;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin: 1rem 0;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 1rem;
        }

        .event-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .event-form input,
        .event-form button {
            padding: 0.8rem;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .event-form button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        .event-form button:hover {
            background-color: #45a049;
        }

        .events-list {
            list-style-type: none;
            padding: 0;
        }

        .event-item {
            background: #fff;
            border: 1px solid #ddd;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 5px;
        }

        .event-item strong {
            display: block;
            font-size: 1.2rem;
            margin-bottom: 0.3rem;
        }

        .highlight {
            font-weight: bold;
            color: #4CAF50;
        }
    </style>
</head>

<body>
    <h1>Event Countdown</h1>
    <div class="container">
        <form class="event-form" id="event-form">
            <input type="text" id="event-name" placeholder="Event Name (e.g., Birthday)" required>
            <input type="date" id="event-date" required>
            <button type="submit">Add Event</button>
        </form>
        <ul class="events-list" id="events-list"></ul>
    </div>

    <script>
        const eventForm = document.getElementById('event-form');
        const eventNameInput = document.getElementById('event-name');
        const eventDateInput = document.getElementById('event-date');
        const eventsList = document.getElementById('events-list');

        const events = [];

        eventForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const eventName = eventNameInput.value;
            const eventDate = new Date(eventDateInput.value);

            if (eventName && eventDate) {
                events.push({ name: eventName, date: eventDate });
                eventNameInput.value = '';
                eventDateInput.value = '';
                updateEventsDisplay();
            }
        });

        function calculateDaysLeft(eventDate) {
            const today = new Date();
            const timeDiff = eventDate - today;
            return Math.ceil(timeDiff / (1000 * 60 * 60 * 24));
        }

        function updateEventsDisplay() {
            eventsList.innerHTML = '';
            const sortedEvents = events.slice().sort((a, b) => a.date - b.date);

            sortedEvents.forEach((event, index) => {
                const daysLeft = calculateDaysLeft(event.date);
                const eventItem = document.createElement('li');
                eventItem.classList.add('event-item');
                eventItem.innerHTML = `
                    <strong>${event.name}</strong>
                    <span>Event Date: ${event.date.toISOString().split('T')[0]}</span><br>
                    <span>Days Left: <span class="highlight">${daysLeft}</span></span>
                `;
                eventsList.appendChild(eventItem);

                // Display the closest event on the top of the list
                if (index === 0) {
                    document.querySelector('h1').innerHTML = `Next Event: <span class="highlight">${event.name}</span> (${daysLeft} days left)`;
                }
            });
        }
    </script>
</body>

</html>
