<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorful To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
            animation: backgroundGradient 10s infinite alternate;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        @keyframes backgroundGradient {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
        }

        .todo-container {
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
        }

        .todo-input {
            width: calc(100% - 40px);
            margin-bottom: 10px;
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            font-size: 1rem;
            outline: none;
            transition: box-shadow 0.2s;
        }

        .todo-input:focus {
            box-shadow: 0 0 10px rgba(255, 105, 135, 0.6);
        }

        .add-btn {
            width: 100%;
            padding: 10px 20px;
            margin-bottom: 10px;
            border: none;
            background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.15);
        }

        .todo-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            margin-bottom: 10px;
            padding: 10px 20px;
            border-radius: 25px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .delete-btn {
            background: #ff6b6b;
            border: none;
            padding: 5px 10px;
            border-radius: 50%;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .delete-btn:hover {
            transform: rotate(15deg);
        }
    </style>
</head>
<body>
    <h1>To-Do List</h1>
    <div class="todo-container">
        <input type="text" class="todo-input" placeholder="Add a new task...">
        <button class="add-btn">Add Task</button>
        <ul class="todo-list">
            <!-- Tasks will be dynamically added here -->
        </ul>
    </div>

    <script>
        document.querySelector('.add-btn').addEventListener('click', function() {
            const input = document.querySelector('.todo-input');
            const taskText = input.value.trim();
            if (taskText !== '') {
                const taskItem = document.createElement('li');
                taskItem.className = 'todo-item';
                taskItem.innerHTML = `
                    <span>${taskText}</span>
                    <button class="delete-btn">X</button>
                `;

                document.querySelector('.todo-list').appendChild(taskItem);

                taskItem.querySelector('.delete-btn').addEventListener('click', function() {
                    taskItem.remove();
                });

                input.value = '';
                input.focus();
            }
        });

        // Trigger "Add Task" by pressing Enter key on the input box
        document.querySelector('.todo-input').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                document.querySelector('.add-btn').click();
            }
        });
    </script>
</body>
</html>
