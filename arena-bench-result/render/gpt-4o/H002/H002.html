<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日喝水追踪工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .tracker-container {
            width: 100%;
            max-width: 400px;
            background: #cce7ff;
            border: 2px solid #87ceeb;
            border-radius: 15px;
            padding: 20px 15px;
            text-align: center;
        }

        .progress {
            position: relative;
            width: 100%;
            height: 200px;
            background: #e6f7ff;
            border-radius: 10px;
            border: 2px solid #87ceeb;
            overflow: hidden;
            margin: 20px 0;
        }

        .water-level {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #4fc3f7;
            height: 0;
            transition: height 0.3s ease-in-out;
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            font-weight: bold;
            color: #555;
        }

        .input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-container input {
            flex: 1;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #87ceeb;
            border-radius: 5px;
        }

        .input-container button {
            padding: 10px 15px;
            font-size: 1rem;
            border: none;
            background: #4fc3f7;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button.track-btn {
            padding: 15px;
            width: 100%;
            font-size: 1.2rem;
            border: none;
            background: #4fc3f7;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button.track-btn:active {
            background: #0288d1;
        }

        footer {
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>
    <h1>每日喝水追踪工具</h1>
    <div class="tracker-container">
        <div class="input-container">
            <input type="number" id="dailyGoal" placeholder="设定今日目标杯数" min="1">
            <button onclick="setGoal()">设定</button>
        </div>
        <div class="progress">
            <div class="water-level" id="waterLevel"></div>
            <div class="progress-text" id="progressText">0%</div>
        </div>
        <button class="track-btn" onclick="drinkWater()">喝下一杯水</button>
    </div>
    <footer>坚持健康生活，从喝水开始！</footer>
    <script>
        let dailyGoal = 0;
        let currentCups = 0;

        function setGoal() {
            const goalInput = document.getElementById("dailyGoal").value;
            if (goalInput > 0) {
                dailyGoal = parseInt(goalInput);
                currentCups = 0; // 重置当前进度
                updateProgress();
            } else {
                alert("请输入一个有效的目标杯数！");
            }
        }

        function drinkWater() {
            if (dailyGoal === 0) {
                alert("请先设定今日目标杯数！");
                return;
            }
            if (currentCups < dailyGoal) {
                currentCups++;
                updateProgress();
            } else {
                alert("目标已完成！保持身体水分充足！");
            }
        }

        function updateProgress() {
            const progressText = document.getElementById("progressText");
            const waterLevel = document.getElementById("waterLevel");
            const percentage = Math.min((currentCups / dailyGoal) * 100, 100).toFixed(0);
            progressText.innerText = `${percentage}%`;
            waterLevel.style.height = `${percentage}%`;
        }
    </script>
</body>
</html>
