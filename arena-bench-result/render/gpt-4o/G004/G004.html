<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解压小工具 - 爆气泡</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            touch-action: manipulation;
        }

        .bubble-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            width: 60px;
            height: 60px;
            background-color: rgba(255,255,255,0.8);
            border-radius: 50%;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1), inset 0 -4px 6px rgba(0, 0, 0, 0.2);
            animation: float 5s infinite ease-in-out;
            cursor: pointer;
        }

        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            animation: explode 0.6s ease-out forwards;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(0, -150%) scale(1.2);
                opacity: 0;
            }
        }

        @keyframes explode {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(0.5) translate(50px, -50px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="bubble-container" id="bubbleContainer"></div>
    <audio id="popSound" src="https://www.soundjay.com/button/beep-07.wav" preload="auto"></audio>
    <script>
        const container = document.getElementById('bubbleContainer');
        const popSound = document.getElementById('popSound');

        // 创建多个气泡
        function createBubble() {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            const size = Math.random() * 40 + 40; // 随机直径 40~80px
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;

            bubble.style.left = `${Math.random() * (window.innerWidth - size)}px`;
            bubble.style.bottom = `-${size}px`;
            bubble.style.animationDuration = `${Math.random() * 3 + 2}s`;

            container.appendChild(bubble);

            bubble.addEventListener('click', () => burstBubble(bubble));
            bubble.addEventListener('animationend', () => container.removeChild(bubble));
        }

        // 点击爆炸气泡
        function burstBubble(bubble) {
            popSound.currentTime = 0; // 重置音效时间
            popSound.play();

            // 创建粒子效果
            for (let i = 0; i < 10; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = `${bubble.offsetLeft + bubble.offsetWidth / 2}px`;
                particle.style.top = `${bubble.offsetTop + bubble.offsetHeight / 2}px`;
                const randX = (Math.random() - 0.5) * 100; // -50~50
                const randY = (Math.random() - 0.5) * 100;
                particle.style.transform = `translate(${randX}px, ${randY}px)`;
                container.appendChild(particle);

                particle.addEventListener('animationend', () => container.removeChild(particle));
            }

            container.removeChild(bubble); // 移除气泡
        }

        // 持续生成气泡
        setInterval(createBubble, 500);
        createBubble(); // 立即生成一个气泡
    </script>
</body>
</html>
