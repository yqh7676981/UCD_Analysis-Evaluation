<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>火星天气报告</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap');

        :root {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --text-color: #e0e0e0;
            --accent-color: #e94560;
            --secondary-text: #9e9e9e;
            --border-color: #0f3460;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Mars_atmosphere.jpg/1200px-Mars_atmosphere.jpg'); /* NASA Mars surface image */
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay;
            background-color: rgba(0, 0, 0, 0.7); /* Dark overlay for better readability */
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 30px;
            max-width: 900px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(5px); /* Slightly blur background for a futuristic feel */
            -webkit-backdrop-filter: blur(5px);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            color: var(--accent-color);
            font-size: 2.8em;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        .current-sol-info {
            background-color: #0a1122;
            padding: 15px 25px;
            margin-bottom: 30px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            display: inline-block; /* To make it wrap content */
            font-size: 1.1em;
            color: var(--secondary-text);
        }

        .current-sol-info p {
            margin: 5px 0;
            font-weight: 300;
        }

        .current-sol-info #sol-number {
            font-family: 'Orbitron', sans-serif;
            color: var(--text-color);
            font-size: 1.5em;
            font-weight: 700;
        }

        .weather-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .weather-card {
            background-color: #0f1c30;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #0d203f;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .weather-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        .weather-card h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--accent-color);
            font-size: 1.5em;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .weather-card .value {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5em;
            font-weight: 700;
            color: var(--text-color);
            margin: 10px 0;
            line-height: 1.2;
        }
        .weather-card .value.small {
             font-size: 1.8em;
        }

        .weather-card .unit {
            font-size: 1em;
            color: var(--secondary-text);
            margin-top: 5px;
        }

        .weather-card .description {
            font-size: 0.95em;
            color: var(--secondary-text);
            margin-top: 15px;
        }

        .pressure .description span {
            font-size: 1.2em;
            vertical-align: middle;
            margin-left: 5px;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.9em;
            color: var(--secondary-text);
        }

        #refresh-button {
            background-color: var(--accent-color);
            color: var(--text-color);
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-family: 'Orbitron', sans-serif;
            margin-top: 20px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        }

        #refresh-button:hover {
            background-color: #c03952;
            transform: translateY(-2px);
        }

        #refresh-button:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(233, 69, 96, 0.4);
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            .current-sol-info {
                padding: 10px 20px;
                font-size: 1em;
            }
            .current-sol-info #sol-number {
                font-size: 1.2em;
            }
            .weather-grid {
                grid-template-columns: 1fr;
            }
            .weather-card .value {
                font-size: 2em;
            }
            .weather-card .value.small {
                font-size: 1.5em;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 1.8em;
            }
            .weather-card h2 {
                font-size: 1.3em;
            }
            #refresh-button {
                padding: 10px 20px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>火星天气报告</h1>

        <div class="current-sol-info">
            <p>Sol <span id="sol-number">---</span></p>
            <p>地球日期：<span id="earth-date">---</span></p>
        </div>

        <div class="weather-grid">
            <div class="weather-card temperature">
                <h2>温度</h2>
                <p class="value small" id="temp-high">---°C</p>
                <p class="value small" id="temp-low">---°C</p>
                <p class="description">高 / 低</p>
            </div>

            <div class="weather-card wind">
                <h2>风速</h2>
                <p class="value" id="wind-speed">---</p>
                <p class="unit">米/秒</p>
                <p class="description" id="wind-direction">---</p>
            </div>

            <div class="weather-card pressure">
                <h2>大气压</h2>
                <p class="value" id="pressure-value">---</p>
                <p class="unit">帕</p>
                <p class="description" id="pressure-trend">---</p>
            </div>
        </div>

        <div class="footer">
            <p>数据为模拟生成，并非实时火星天气。</p>
            <button id="refresh-button">刷新数据</button>
        </div>
    </div>

    <script>
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function updateMarsWeather() {
            // 模拟火星数据
            const solNumber = getRandomInt(3000, 4500); // 火星日编号
            const tempHigh = getRandomInt(-35, -5); // 高温 (摄氏度)
            const tempLow = getRandomInt(-90, -60);  // 低温 (摄氏度)
            const windSpeed = (Math.random() * (12 - 2) + 2).toFixed(1); // 风速 (米/秒)
            const pressureValue = getRandomInt(600, 800); // 大气压 (帕)

            const windDirections = ['北', '东北', '东', '东南', '南', '西南', '西', '西北'];
            const windDirection = windDirections[getRandomInt(0, windDirections.length - 1)];

            const pressureTrends = [
                { text: '上升 ▲', symbol: '▲', color: '#8BC34A' },
                { text: '下降 ▼', symbol: '▼', color: '#FF5722' },
                { text: '稳定 ▬', symbol: '▬', color: '#9E9E9E' }
            ];
            const pressureTrend = pressureTrends[getRandomInt(0, pressureTrends.length - 1)];

            // 获取当前地球日期
            const now = new Date();
            const earthDateOptions = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            const earthDate = now.toLocaleDateString('zh-CN', earthDateOptions);

            // 更新DOM
            document.getElementById('sol-number').textContent = solNumber;
            document.getElementById('earth-date').textContent = earthDate;
            document.getElementById('temp-high').textContent = `${tempHigh}°C`;
            document.getElementById('temp-low').textContent = `${tempLow}°C`;
            document.getElementById('wind-speed').textContent = windSpeed;
            document.getElementById('wind-direction').textContent = `方向: ${windDirection}`;

            const pressureTrendElement = document.getElementById('pressure-trend');
            document.getElementById('pressure-value').textContent = pressureValue;
            pressureTrendElement.innerHTML = `趋势: <span style="color: ${pressureTrend.color};">${pressureTrend.text}</span>`;
        }

        // 页面加载完成后立即更新天气数据
        document.addEventListener('DOMContentLoaded', () => {
            updateMarsWeather();
            // 为刷新按钮添加事件监听器
            document.getElementById('refresh-button').addEventListener('click', updateMarsWeather);
        });
    </script>
</body>
</html>
