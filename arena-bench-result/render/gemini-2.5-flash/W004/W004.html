<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会议纪要整理工具</title>
    <style>
        /* 全局样式和重置 */
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --success-color: #28a745;
            --light-bg: #f8f9fa;
            --dark-bg: #343a40;
            --text-color: #333;
            --border-color: #ced4da;
            --border-radius: 0.5rem;
            --spacing-unit: 1rem;
            --font-size-base: 1rem;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
            margin: 0;
            padding: 0;
            background-color: var(--light-bg);
            color: var(--text-color);
            line-height: 1.6;
            -webkit-text-size-adjust: 100%; /* 防止移动端字体缩放 */
            box-sizing: border-box;
        }

        *, *::before, *::after {
            box-sizing: inherit;
        }

        /* 容器布局 */
        .container {
            max-width: 600px; /* 限制内容最大宽度，适合移动设备 */
            margin: var(--spacing-unit) auto;
            padding: var(--spacing-unit);
            background-color: #fff;
            border-radius: var(--border-radius);
            box-shadow: 0 0.25rem 0.75rem rgba(0, 0, 0, 0.05);
        }

        /* 标题 */
        h1, h2 {
            text-align: center;
            color: var(--dark-bg);
            margin-bottom: calc(var(--spacing-unit) * 1.5);
            font-size: 1.8rem;
        }

        h2 {
            font-size: 1.5rem;
            margin-top: calc(var(--spacing-unit) * 2);
        }

        /* 表单组 */
        .form-group {
            margin-bottom: var(--spacing-unit);
            display: flex;
            flex-direction: column;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: calc(var(--font-size-base) * 0.95);
            color: var(--dark-bg);
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: var(--font-size-base);
            color: var(--text-color);
            background-color: #fff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            -webkit-appearance: none; /* 移除 iOS 默认样式 */
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
            outline: none;
        }

        textarea {
            resize: vertical; /* 允许垂直方向调整大小 */
            min-height: 5rem; /* 最小高度 */
        }

        /* 按钮组 */
        .button-group {
            display: flex;
            gap: 1rem; /* 按钮之间的间距 */
            margin-top: calc(var(--spacing-unit) * 1.5);
            flex-wrap: wrap; /* 适应小屏幕，按钮可以换行 */
            justify-content: center; /* 按钮居中 */
        }

        button {
            flex: 1; /* 按钮弹性伸缩 */
            min-width: 120px; /* 确保按钮在小屏幕下也有足够的宽度 */
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: var(--border-radius);
            font-size: calc(var(--font-size-base) * 1.05);
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            -webkit-appearance: none; /* 移除 iOS 默认样式 */
        }

        button#generateBtn {
            background-color: var(--primary-color);
            color: #fff;
        }

        button#generateBtn:hover {
            background-color: #0056b3;
            transform: translateY(-1px);
        }

        button#clearBtn {
            background-color: var(--secondary-color);
            color: #fff;
        }

        button#clearBtn:hover {
            background-color: #545b62;
            transform: translateY(-1px);
        }

        button#copyBtn {
            background-color: var(--success-color);
            color: #fff;
            margin-top: var(--spacing-unit);
            width: 100%; /* 复制按钮占据一行 */
            max-width: 300px; /* 限制最大宽度 */
            display: block; /* 确保 margin auto 有效 */
            margin-left: auto;
            margin-right: auto;
        }
        
        button#copyBtn:hover {
            background-color: #218838;
            transform: translateY(-1px);
        }

        /* 纪要输出区 */
        .summary-output {
            margin-top: calc(var(--spacing-unit) * 2);
            padding: var(--spacing-unit);
            background-color: var(--light-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
        }

        .summary-output.hidden {
            display: none;
        }

        #generatedSummary {
            white-space: pre-wrap; /* 保留空白符和换行符，并自动换行 */
            word-wrap: break-word; /* 确保长单词也能正常换行 */
            font-family: 'Courier New', monospace; /* 等宽字体方便阅读 */
            font-size: var(--font-size-base);
            padding: var(--spacing-unit);
            background-color: #e9ecef;
            border-radius: var(--border-radius);
            border: 1px dashed var(--secondary-color);
            max-height: 400px; /* 限制高度，可滚动 */
            overflow-y: auto;
            margin-bottom: var(--spacing-unit);
        }

        /* 媒体查询 - 调整按钮在更小屏幕上的布局 */
        @media (max-width: 400px) {
            .button-group button {
                flex-basis: 100%; /* 按钮在小屏幕上垂直堆叠 */
                margin-bottom: 0.5rem;
            }
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>会议纪要整理</h1>

        <form id="meetingForm">
            <div class="form-group">
                <label for="meetingTopic">会议主题:</label>
                <input type="text" id="meetingTopic" placeholder="填写会议主题，如：产品迭代会议" required>
            </div>

            <div class="form-group">
                <label for="attendees">参会人:</label>
                <textarea id="attendees" rows="3" placeholder="填写参会人，多人请用逗号、分号或换行分隔，如：张三, 李四, 王五"></textarea>
            </div>

            <div class="form-group">
                <label for="discussionPoints">讨论要点:</label>
                <textarea id="discussionPoints" rows="6" placeholder="填写讨论的主要内容和结论，可分点列出：
1. 产品功能 A 需求确认
2. 技术实现方案讨论
3. 风险评估与应对"></textarea>
            </div>

            <div class="form-group">
                <label for="actionItems">待办事项:</label>
                <textarea id="actionItems" rows="4" placeholder="填写具体的待办事项、负责人和截止日期：
- 功能 A 开发，负责人：张三，截止：2023-12-31
- 市场调研报告，负责人：李四，截止：2024-01-15"></textarea>
            </div>

            <div class="button-group">
                <button type="button" id="generateBtn">生成纪要</button>
                <button type="button" id="clearBtn" class="secondary-btn">清空</button>
            </div>
        </form>

        <div id="summaryOutput" class="summary-output hidden">
            <h2>生成的会议纪要</h2>
            <pre id="generatedSummary"></pre>
            <button type="button" id="copyBtn">一键复制</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const meetingTopicInput = document.getElementById('meetingTopic');
            const attendeesInput = document.getElementById('attendees');
            const discussionPointsInput = document.getElementById('discussionPoints');
            const actionItemsInput = document.getElementById('actionItems');
            const generateBtn = document.getElementById('generateBtn');
            const clearBtn = document.getElementById('clearBtn');
            const copyBtn = document.getElementById('copyBtn');
            const summaryOutputDiv = document.getElementById('summaryOutput');
            const generatedSummaryPre = document.getElementById('generatedSummary');

            // 格式化列表项
            const formatList = (text, prefix = '- ') => {
                if (!text.trim()) return '';
                // 替换多种分隔符为统一的换行符
                const items = text.split(/[,;\n]+/).map(item => item.trim()).filter(item => item);
                if (items.length === 0) return '';
                return items.map(item => prefix + item).join('\n');
            };

            generateBtn.addEventListener('click', () => {
                const topic = meetingTopicInput.value.trim();
                const attendees = formatList(attendeesInput.value, '  - '); // 缩进方便阅读
                const discussion = formatList(discussionPointsInput.value, '  - ');
                const actions = formatList(actionItemsInput.value, '  - ');

                if (!topic) {
                    alert('会议主题是必填项！');
                    return;
                }

                const now = new Date();
                const dateTime = now.toLocaleString('zh-CN', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                });

                let summaryText = `【会议纪要】\n`;
                summaryText += `--------------------------------------------------\n`;
                summaryText += `会议主题：${topic}\n`;
                summaryText += `会议时间：${dateTime}\n`;
                
                if (attendees) {
                    summaryText += `参 会 人：\n${attendees}\n`;
                } else {
                    summaryText += `参 会 人：(未填写)\n`;
                }

                summaryText += `--------------------------------------------------\n`;
                summaryText += `【讨论要点】\n`;
                if (discussion) {
                    summaryText += `${discussion}\n`;
                } else {
                    summaryText += `  无\n`;
                }
                
                summaryText += `--------------------------------------------------\n`;
                summaryText += `【待办事项】\n`;
                if (actions) {
                    summaryText += `${actions}\n`;
                } else {
                    summaryText += `  无\n`;
                }
                summaryText += `--------------------------------------------------\n`;

                generatedSummaryPre.textContent = summaryText;
                summaryOutputDiv.classList.remove('hidden');

                // 滚动到生成纪要区域
                summaryOutputDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });

            clearBtn.addEventListener('click', () => {
                meetingTopicInput.value = '';
                attendeesInput.value = '';
                discussionPointsInput.value = '';
                actionItemsInput.value = '';
                generatedSummaryPre.textContent = '';
                summaryOutputDiv.classList.add('hidden');
            });

            copyBtn.addEventListener('click', () => {
                const summaryContent = generatedSummaryPre.textContent;
                if (!summaryContent) {
                    alert('没有可复制的纪要内容！');
                    return;
                }

                navigator.clipboard.writeText(summaryContent)
                    .then(() => {
                        alert('会议纪要已复制到剪贴板！');
                    })
                    .catch(err => {
                        console.error('复制失败: ', err);
                        alert('复制失败，请手动复制。');
                    });
            });
        });
    </script>
</body>
</html>
