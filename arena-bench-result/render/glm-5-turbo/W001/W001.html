<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>待办清单</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f3ef;
            --fg: #2d2a26;
            --card: #ffffff;
            --border: #e8e4de;
            --accent: #e07a5f;
            --high: #d64545;
            --medium: #e9a23b;
            --low: #5a9a6e;
            --muted: #9a9590;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            padding-bottom: 100px;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(224, 122, 95, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(90, 154, 110, 0.08) 0%, transparent 50%);
        }

        .header {
            padding: 48px 24px 24px;
            position: sticky;
            top: 0;
            background: linear-gradient(to bottom, var(--bg) 70%, transparent);
            z-index: 10;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--muted);
            font-size: 14px;
        }

        .input-area {
            padding: 0 16px;
            margin-bottom: 24px;
        }

        .input-card {
            background: var(--card);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        .task-input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 16px;
            font-family: inherit;
            padding: 12px 0;
            border-bottom: 2px solid var(--border);
            background: transparent;
            transition: border-color 0.2s;
        }

        .task-input:focus {
            border-bottom-color: var(--accent);
        }

        .task-input::placeholder {
            color: var(--muted);
        }

        .options-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            gap: 8px;
        }

        .priority-selector {
            display: flex;
            gap: 8px;
        }

        .priority-btn {
            padding: 8px 14px;
            border-radius: 20px;
            border: 2px solid var(--border);
            background: transparent;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .priority-btn.active.high {
            background: var(--high);
            border-color: var(--high);
            color: white;
        }

        .priority-btn.active.medium {
            background: var(--medium);
            border-color: var(--medium);
            color: white;
        }

        .priority-btn.active.low {
            background: var(--low);
            border-color: var(--low);
            color: white;
        }

        .add-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--fg);
            color: var(--card);
            border: none;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
        }

        .add-btn:active {
            transform: scale(0.92);
            background: var(--accent);
        }

        .task-list {
            padding: 0 16px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 24px 0 12px 8px;
        }

        .task-item {
            background: var(--card);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex;
            align-items: center;
            gap: 14px;
            transition: transform 0.2s, opacity 0.3s;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .task-item.completed {
            opacity: 0.6;
            order: 1;
        }

        .task-item.removing {
            transform: translateX(100%);
            opacity: 1; /* fixed: was 0 */
        }

        .checkbox {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .checkbox.checked {
            background: var(--low);
            border-color: var(--low);
        }

        .checkbox svg {
            width: 14px;
            height: 14px;
            stroke: white;
            stroke-width: 3;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .checkbox.checked svg {
            opacity: 1;
        }

        .task-content {
            flex: 1;
            min-width: 0;
        }

        .task-text {
            font-size: 15px;
            font-weight: 500;
            word-break: break-word;
            transition: all 0.2s;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--muted);
        }

        .task-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
        }

        .priority-tag {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 10px;
            text-transform: uppercase;
        }

        .priority-tag.high {
            background: rgba(214, 69, 69, 0.15);
            color: var(--high);
        }

        .priority-tag.medium {
            background: rgba(233, 162, 59, 0.15);
            color: var(--medium);
        }

        .priority-tag.low {
            background: rgba(90, 154, 110, 0.15);
            color: var(--low);
        }

        .delete-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1; /* fixed: was 0 */
            transition: all 0.2s;
        }

        .task-item:active .delete-btn {
            opacity: 1;
        }

        .delete-btn:active {
            background: rgba(214, 69, 69, 0.15);
            color: var(--high);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            stroke: var(--border);
            margin-bottom: 16px;
        }

        .empty-state p {
            font-size: 14px;
        }

        .stats-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card);
            padding: 16px 24px;
            display: flex;
            justify-content: space-around;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
            border-radius: 20px 20px 0 0;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: 700;
            color: var(--fg);
        }

        .stat-label {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        @media (min-width: 768px) {
            body {
                max-width: 420px;
                margin: 0 auto;
            }
        }
    </style>
<style id="screenshot-fix">
/* 仅处理滚动懒加载：让 opacity:0 的元素可见，但排除 toast/弹窗 */
.reveal:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.fade-in:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.fade:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.lazy:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.stagger-item:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.animate:not(.toast):not([class*="modal"]):not([class*="overlay"]) {
  opacity: 1 !important;
  visibility: visible !important;
}
/* 特别确保弹窗/侧边栏/Toast 保持隐藏（它们通过其他类控制显示） */
.modal-overlay:not(.show):not(.active),
.confirm-overlay:not(.show):not(.active),
[class*="modal"]:not(.show):not(.active):not([class*="stagger"]),
[class*="overlay"]:not(.show):not(.active):not([class*="scroll"]),
.toast:not(.show),
[id*="toast"]:not(.show):not(.active),
[id*="cart"],
[id*="sidebar"] {
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
}
/* 排除 toast 类，避免强制显示 */
.reveal:not(.toast), .fade-in:not(.toast), .fade:not(.toast), .lazy:not(.toast), .stagger-item:not(.toast), .animate:not(.toast) {
  opacity: 1 !important;
  visibility: visible !important;
}
/* 强制显示主要内容区域（section 下的直接子元素），但排除移动菜单 */
section > div:not(.mobile-menu):not([id*="mobile-menu"]):not([id*="menu"]) {
  opacity: 1 !important;
}
</style></head>
<body>
    <div class="header">
        <h1>待办清单</h1>
        <p>专注于重要的事情</p>
    </div>

    <div class="input-area">
        <div class="input-card">
            <input type="text" class="task-input" id="taskInput" placeholder="添加新任务..." maxlength="100">
            <div class="options-row">
                <div class="priority-selector">
                    <button class="priority-btn high" data-priority="high">紧急</button>
                    <button class="priority-btn medium active" data-priority="medium">一般</button>
                    <button class="priority-btn low" data-priority="low">稍后</button>
                </div>
                <button class="add-btn" id="addBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <div class="task-list" id="taskList">
        <div class="empty-state" id="emptyState">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"></path>
                <rect x="9" y="3" width="6" height="4" rx="1"></rect>
                <path d="M9 14l2 2 4-4"></path>
            </svg>
            <p>还没有任务，添加一个吧</p>
        </div>
    </div>

    <div class="stats-bar">
        <div class="stat-item">
            <div class="stat-number" id="totalCount">0</div>
            <div class="stat-label">总计</div>
        </div>
        <div class="stat-item">
            <div class="stat-number" id="activeCount">0</div>
            <div class="stat-label">进行中</div>
        </div>
        <div class="stat-item">
            <div class="stat-number" id="completedCount">0</div>
            <div class="stat-label">已完成</div>
        </div>
    </div>

    <script>
        let tasks = [];
        let currentPriority = 'medium';

        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');
        const emptyState = document.getElementById('emptyState');
        const priorityBtns = document.querySelectorAll('.priority-btn');

        priorityBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                priorityBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentPriority = btn.dataset.priority;
            });
        });

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        function loadTasks() {
            const saved = localStorage.getItem('tasks');
            if (saved) {
                tasks = JSON.parse(saved);
            }
        }

        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const active = total - completed;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('activeCount').textContent = active;
            document.getElementById('completedCount').textContent = completed;
        }

        function renderTasks() {
            const taskItems = taskList.querySelectorAll('.task-item');
            taskItems.forEach(item => item.remove());

            emptyState.style.display = tasks.length === 0 ? 'block' : 'none';

            const sortedTasks = [...tasks].sort((a, b) => {
                if (a.completed !== b.completed) {
                    return a.completed ? 1 : -1;
                }
                const priorityOrder = { high: 0, medium: 1, low: 2 };
                return priorityOrder[a.priority] - priorityOrder[b.priority];
            });

            sortedTasks.forEach(task => {
                const item = document.createElement('div');
                item.className = `task-item ${task.completed ? 'completed' : ''}`;
                item.dataset.id = task.id;

                const priorityLabels = {
                    high: '紧急',
                    medium: '一般',
                    low: '稍后'
                };

                item.innerHTML = `
                    <div class="checkbox ${task.completed ? 'checked' : ''}">
                        <svg viewBox="0 0 24 24" fill="none">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </div>
                    <div class="task-content">
                        <div class="task-text">${escapeHtml(task.text)}</div>
                        <div class="task-meta">
                            <span class="priority-tag ${task.priority}">${priorityLabels[task.priority]}</span>
                        </div>
                    </div>
                    <button class="delete-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path>
                        </svg>
                    </button>
                `;

                const checkbox = item.querySelector('.checkbox');
                checkbox.addEventListener('click', () => toggleTask(task.id));

                const deleteBtn = item.querySelector('.delete-btn');
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteTask(task.id, item);
                });

                taskList.appendChild(item);
            });

            updateStats();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function addTask() {
            const text = taskInput.value.trim();
            if (!text) return;

            const task = {
                id: generateId(),
                text: text,
                priority: currentPriority,
                completed: false,
                createdAt: Date.now()
            };

            tasks.unshift(task);
            saveTasks();
            renderTasks();
            taskInput.value = '';

            addBtn.style.transform = 'scale(0.8)';
            setTimeout(() => {
                addBtn.style.transform = '';
            }, 150);
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                renderTasks();
            }
        }

        function deleteTask(id, element) {
            element.classList.add('removing');
            setTimeout(() => {
                tasks = tasks.filter(t => t.id !== id);
                saveTasks();
                renderTasks();
            }, 200);
        }

        addBtn.addEventListener('click', addTask);

        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        loadTasks();
        renderTasks();
    </script>
</body>
</html>
