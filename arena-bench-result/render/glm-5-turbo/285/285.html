<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chirp - 社交平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0b;
            --bg-elevated: #111113;
            --card: #18181b;
            --border: #27272a;
            --fg: #fafafa;
            --muted: #71717a;
            --accent: #f59e0b;
            --accent-hover: #fbbf24;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1, h2, h3, .brand {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* Animated background */
        .bg-pattern {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: 
                radial-gradient(ellipse 80% 50% at 20% -20%, rgba(245, 158, 11, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(245, 158, 11, 0.08) 0%, transparent 50%);
        }

        .noise-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--muted);
        }

        /* Tweet animations */
        .tweet-card {
            animation: slideUp 0.4s ease-out both;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .tweet-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(245, 158, 11, 0.1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tweet-card:nth-child(1) { animation-delay: 0.05s; }
        .tweet-card:nth-child(2) { animation-delay: 0.1s; }
        .tweet-card:nth-child(3) { animation-delay: 0.15s; }
        .tweet-card:nth-child(4) { animation-delay: 0.2s; }
        .tweet-card:nth-child(5) { animation-delay: 0.25s; }

        /* Action buttons */
        .action-btn {
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: currentColor;
            opacity: 0;
            transition: opacity 0.2s ease;
            border-radius: inherit;
        }

        .action-btn:hover::before {
            opacity: 0.1;
        }

        .action-btn.liked {
            color: var(--danger);
        }

        .action-btn.retweeted {
            color: var(--success);
        }

        /* Like animation */
        @keyframes likeHeart {
            0% { transform: scale(1); }
            25% { transform: scale(1.3); }
            50% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }

        .action-btn.liked svg {
            animation: likeHeart 0.4s ease;
        }

        /* Modal */
        .modal-overlay {
            backdrop-filter: blur(8px);
            background: rgba(0, 0, 0, 0.7);
        }

        .modal-content {
            animation: modalIn 0.3s ease-out;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Input focus */
        .compose-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        }

        /* Avatar ring */
        .avatar-ring {
            position: relative;
        }

        .avatar-ring::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), transparent);
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .tweet-card:hover .avatar-ring::after {
            opacity: 1;
        }

        /* Counter animation */
        .counter {
            transition: transform 0.2s ease;
        }

        .counter.bump {
            animation: bump 0.3s ease;
        }

        @keyframes bump {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* Floating particles */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--accent);
            border-radius: 50%;
            pointer-events: none;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.3; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 0.8; }
        }

        /* Tab indicator */
        .tab-indicator {
            position: absolute;
            bottom: 0;
            height: 2px;
            background: var(--accent);
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        /* Notification badge */
        .badge-pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(245, 158, 11, 0); }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Focus visible */
        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
    </style>
</head>

            <div class="p-4">
                <div class="flex gap-4">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=me" alt="头像" class="w-12 h-12 rounded-full bg-zinc-700 shrink-0">
                    <textarea 
                        id="modalTextarea"
                        class="compose-input flex-1 bg-transparent text-lg placeholder-zinc-500 resize-none border border-transparent rounded-lg p-2 transition-all min-h-[120px]"
                        placeholder="有什么新鲜事？"
                        maxlength="280"
                    ></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- Comment Modal -->
    <div id="commentModal" class="fixed inset-0 z-50 hidden">
        <div class="modal-overlay absolute inset-0" onclick="closeCommentModal()"></div>
        <div class="modal-content absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-lg bg-zinc-900 rounded-2xl border border-zinc-700 shadow-2xl">
            <div class="flex items-center justify-between p-4 border-b border-zinc-800">
                <h3 class="font-bold text-lg">评论</h3>
                <button onclick="closeCommentModal()" class="p-2 -mr-2 rounded-full hover:bg-zinc-800 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div id="originalTweet" class="p-4 border-b border-zinc-800/50">
                <!-- Original tweet will be rendered here -->
            </div>
            <div class="p-4">
                <div class="flex gap-4">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=me" alt="头像" class="w-10 h-10 rounded-full bg-zinc-700 shrink-0">
                    <textarea 
                        id="commentTextarea"
                        class="compose-input flex-1 bg-transparent placeholder-zinc-500 resize-none border border-transparent rounded-lg p-2 transition-all min-h-[80px]"
                        placeholder="发表你的评论..."
                        maxlength="280"
                    ></textarea>
                </div>
                <div class="flex justify-end mt-3">
                    <button onclick="submitComment()" class="px-5 py-2 bg-amber-500 hover:bg-amber-400 text-black font-semibold rounded-full transition-all hover:shadow-lg hover:shadow-amber-500/25 active:scale-95">
                        回复
                    </button>
                </div>
            </div>
            <div id="commentsList" class="max-h-60 overflow-y-auto divide-y divide-zinc-800/50">
                <!-- Comments will be rendered here -->
            </div>
        </div>
    </div>

    <script>
        // Data
        const initialTweets = [
            {
                id: 1,
                author: '设计师小王',
                handle: '@designer_wang',
                avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=wang',
                content: '今天完成了一个新的 UI 设计项目，用了最新的设计趋势。渐变色彩搭配暗色主题真的很好看！大家觉得怎么样？',
                time: '2小时前',
                likes: 128,
                comments: 23,
                retweets: 45,
                liked: false,
                retweeted: false,
                image: 'https://images.unsplash.com/photo-1618005182384-a83e8cd85d14?w=600&h=400&fit=crop'
            },
            {
                id: 2,
                author: '前端工程师李明',
                handle: '@frontend_li',
                avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=liming',
                content: '刚刚解决了一个困扰我两天的 bug，原来是 CSS 属性优先级的问题。记住：!important 不是解决问题的方法，而是制造问题的开始。',
                time: '4小时前',
                likes: 256,
                comments: 67,
                retweets: 89,
                liked: true,
                retweeted: false
            },
            {
                id: 3,
                author: '产品经理张三',
                handle: '@pm_zhang',
                avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=zhangsan',
                content: '用户需求 vs 用户想要，这是两个完全不同的概念。作为产品经理，我们要学会倾听用户真正的需求，而不是他们口中说想要的东西。',
                time: '6小时前',
                likes: 189,
                comments: 45,
                retweets: 78,
                liked: false,
                retweeted: true
            },
            {
                id: 4,
                author: '创意工作室',
                handle: '@creative_studio',
                avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=studio',
                content: '周末去了一个超美的咖啡馆，阳光透过落地窗洒进来，整个空间都充满了温暖的感觉。这样的环境最适合发呆和思考人生。',
                time: '8小时前',
                likes: 342,
                comments: 56,
                retweets: 123,
                liked: false,
                retweeted: false,
                image: 'https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?w=600&h=400&fit=crop'
            },
            {
                id: 5,
                author: '科技观察',
                handle: '@tech_watch',
                avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=tech',
                content: '2024年最值得关注的 AI 发展趋势：多模态模型、AI Agent、本地化部署。这些技术正在改变我们的工作方式，你准备好了吗？',
                time: '12小时前',
                likes: 567,
                comments: 134,
                retweets: 234,
                liked: false,
                retweeted: false
            }
        ];

        let tweets = [...initialTweets];
        let currentCommentTweetId = null;
        let tweetIdCounter = 6;

        // Render functions
        function renderTweet(tweet) {
            const imageHtml = tweet.image 
                ? `<img src="${tweet.image}" alt="推文图片" class="mt-3 rounded-xl w-full object-cover max-h-80 cursor-pointer hover:opacity-90 transition-opacity">` 
                : '';
            
            return `
                <article class="tweet-card p-4 hover:bg-zinc-800/20 transition-colors cursor-pointer" data-id="${tweet.id}">
                    <div class="flex gap-4">
                        <div class="avatar-ring shrink-0">
                            <img src="${tweet.avatar}" alt="${tweet.author}" class="w-12 h-12 rounded-full bg-zinc-700">
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="font-semibold hover:text-amber-500 transition-colors">${tweet.author}</span>
                                <span class="text-zinc-500">${tweet.handle}</span>
                                <span class="text-zinc-600">·</span>
                                <span class="text-zinc-500">${tweet.time}</span>
                            </div>
                            <p class="mt-2 text-[15px] leading-relaxed">${tweet.content}</p>
                            ${imageHtml}
                            <div class="flex items-center gap-1 mt-4 -ml-2">
                                <button onclick="event.stopPropagation(); openCommentModal(${tweet.id})" class="action-btn flex items-center gap-2 px-3 py-2 rounded-full text-zinc-500 hover:text-blue-400 hover:bg-blue-400/10 transition-colors group">
                                    <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                                    </svg>
                                    <span class="counter text-sm group-hover:text-blue-400">${tweet.comments}</span>
                                </button>
                                <button onclick="event.stopPropagation(); toggleRetweet(${tweet.id})" class="action-btn flex items-center gap-2 px-3 py-2 rounded-full ${tweet.retweeted ? 'retweeted text-green-500' : 'text-zinc-500 hover:text-green-500 hover:bg-green-500/10'} transition-colors group">
                                    <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                                    </svg>
                                    <span class="counter text-sm">${tweet.retweets}</span>
                                </button>
                                <button onclick="event.stopPropagation(); toggleLike(${tweet.id})" class="action-btn flex items-center gap-2 px-3 py-2 rounded-full ${tweet.liked ? 'liked text-red-500' : 'text-zinc-500 hover:text-red-500 hover:bg-red-500/10'} transition-colors group">
                                    <svg class="w-[18px] h-[18px]" fill="${tweet.liked ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                                    </svg>
                                    <span class="counter text-sm">${tweet.likes}</span>
                                </button>
                                <button onclick="event.stopPropagation(); shareTweet(${tweet.id})" class="action-btn flex items-center gap-2 px-3 py-2 rounded-full text-zinc-500 hover:text-amber-500 hover:bg-amber-500/10 transition-colors">
                                    <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </article>
            `;
        }

        function renderFeed() {
            const feed = document.getElementById('feed');
            feed.innerHTML = tweets.map(renderTweet).join('');
        }

        // Interactions
        function toggleLike(id) {
            const tweet = tweets.find(t => t.id === id);
            if (tweet) {
                tweet.liked = !tweet.liked;
                tweet.likes += tweet.liked ? 1 : -1;
                
                const btn = document.querySelector(`.tweet-card[data-id="${id}"] .action-btn:nth-child(3)`);
                if (btn) {
                    const counter = btn.querySelector('.counter');
                    counter.textContent = tweet.likes;
                    if (tweet.liked) {
                        counter.classList.add('bump');
                        setTimeout(() => counter.classList.remove('bump'), 300);
                    }
                }
                
                renderFeed();
            }
        }

        function toggleRetweet(id) {
            const tweet = tweets.find(t => t.id === id);
            if (tweet) {
                tweet.retweeted = !tweet.retweeted;
                tweet.retweets += tweet.retweeted ? 1 : -1;
                renderFeed();
            }
        }

        function shareTweet(id) {
            const tweet = tweets.find(t => t.id === id);
            if (tweet && navigator.share) {
                navigator.share({
                    title: `${tweet.author} 的推文`,
                    text: tweet.content,
                    url: window.location.href
                });
            } else {
                // Fallback: copy to clipboard
                navigator.clipboard.writeText(tweet.content);
                alert('推文内容已复制到剪贴板');
            }
        }

        // Post new tweet
        function postTweet() {
            const textarea = document.getElementById('composeTextarea');
            const content = textarea.value.trim();
            if (content) {
                const newTweet = {
                    id: tweetIdCounter++,
                    author: '我的账号',
                    handle: '@myhandle',
                    avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=me',
                    content: content,
                    time: '刚刚',
                    likes: 0,
                    comments: 0,
                    retweets: 0,
                    liked: false,
                    retweeted: false
                };
                tweets.unshift(newTweet);
                textarea.value = '';
                updateCharCounter();
                renderFeed();
            }
        }

        function postTweetFromModal() {
            const textarea = document.getElementById('modalTextarea');
            const content = textarea.value.trim();
            if (content) {
                const newTweet = {
                    id: tweetIdCounter++,
                    author: '我的账号',
                    handle: '@myhandle',
                    avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=me',
                    content: content,
                    time: '刚刚',
                    likes: 0,
                    comments: 0,
                    retweets: 0,
                    liked: false,
                    retweeted: false
                };
                tweets.unshift(newTweet);
                textarea.value = '';
                closeComposeModal();
                renderFeed();
            }
        }

        // Modal functions
        function openComposeModal() {
            document.getElementById('composeModal').classList.remove('hidden');
            document.getElementById('modalTextarea').focus();
            document.body.style.overflow = 'hidden';
        }

        function closeComposeModal() {
            document.getElementById('composeModal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        function openCommentModal(id) {
            currentCommentTweetId = id;
            const tweet = tweets.find(t => t.id === id);
            if (tweet) {
                document.getElementById('originalTweet').innerHTML = `
                    <div class="flex gap-3">
                        <img src="${tweet.avatar}" alt="${tweet.author}" class="w-10 h-10 rounded-full bg-zinc-700 shrink-0">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="font-semibold">${tweet.author}</span>
                                <span class="text-zinc-500">${tweet.handle}</span>
                            </div>
                            <p class="mt-1 text-sm">${tweet.content}</p>
                        </div>
                    </div>
                `;
                
                // Render existing comments
                const commentsHtml = tweet.comments > 0 
                    ? `<div class="p-4 text-center text-zinc-500 text-sm">共 ${tweet.comments} 条评论</div>`
                    : `<div class="p-4 text-center text-zinc-500 text-sm">暂无评论，快来抢沙发吧</div>`;
                document.getElementById('commentsList').innerHTML = commentsHtml;
                
                document.getElementById('commentModal').classList.remove('hidden');
                document.getElementById('commentTextarea').focus();
                document.body.style.overflow = 'hidden';
            }
        }

        function closeCommentModal() {
            document.getElementById('commentModal').classList.add('hidden');
            document.getElementById('commentTextarea').value = '';
            document.body.style.overflow = '';
            currentCommentTweetId = null;
        }

        function submitComment() {
            const textarea = document.getElementById('commentTextarea');
            const content = textarea.value.trim();
            if (content && currentCommentTweetId) {
                const tweet = tweets.find(t => t.id === currentCommentTweetId);
                if (tweet) {
                    tweet.comments++;
                    renderFeed();
                    closeCommentModal();
                }
            }
        }

        // Character counter
        function updateCharCounter() {
            const textarea = document.getElementById('composeTextarea');
            const counter = document.getElementById('charCounter');
            const remaining = 280 - textarea.value.length;
            counter.textContent = remaining;
            counter.classList.toggle('text-red-500', remaining < 20);
            counter.classList.toggle('text-zinc-500', remaining >= 20);
        }

        // Tab switching
        function initTabs() {
            const tabs = document.querySelectorAll('[data-tab]');
            const indicator = document.querySelector('.tab-indicator');
            
            tabs.forEach((tab, index) => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('text-white'));
                    tabs.forEach(t => t.classList.add('text-zinc-500'));
                    tab.classList.remove('text-zinc-500');
                    tab.classList.add('text-white');
                    
                    indicator.style.left = `${index * 50}%`;
                });
            });
        }

        // Keyboard shortcuts
        function initKeyboardShortcuts() {
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeComposeModal();
                    closeCommentModal();
                }
                if (e.key === 'n' && (e.metaKey || e.ctrlKey)) {
                    e.preventDefault();
                    openComposeModal();
                }
            });
        }

        // Initialize
        function init() {
            renderFeed();
            initTabs();
            initKeyboardShortcuts();
            
            const textarea = document.getElementById('composeTextarea');
            textarea.addEventListener('input', updateCharCounter);
            
            // Add particles
            const particles = document.querySelectorAll('.particle');
            particles.forEach((p, i) => {
                p.style.animationDelay = `${i * 0.5}s`;
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
