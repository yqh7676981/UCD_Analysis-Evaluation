<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS Bank - 数字银行平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050810;
            --bg-secondary: #0c1220;
            --card: #111827;
            --card-hover: #1a2332;
            --border: #1f2937;
            --accent: #d4a574;
            --accent-light: #e8c9a8;
            --accent-glow: rgba(212, 165, 116, 0.15);
            --text: #f0f0f0;
            --text-muted: #9ca3af;
            --success: #34d399;
            --danger: #f87171;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
        
        /* Background Effects */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(212, 165, 116, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(212, 165, 116, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }
        
        .bg-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
        }
        
        .glow-1 {
            top: -200px;
            right: -100px;
            background: radial-gradient(circle, rgba(212, 165, 116, 0.3), transparent 70%);
        }
        
        .glow-2 {
            bottom: -300px;
            left: -200px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15), transparent 70%);
        }
        
        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 260px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            z-index: 100;
            display: flex;
            flex-direction: column;
        }
        
        .logo {
            padding: 24px;
            border-bottom: 1px solid var(--border);
        }
        
        .logo h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .logo span {
            color: var(--accent);
        }
        
        .nav-section {
            padding: 20px 16px;
        }
        
        .nav-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 12px;
            padding-left: 8px;
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        
        .nav-item:hover {
            background: var(--card);
            color: var(--text);
        }
        
        .nav-item.active {
            background: var(--accent-glow);
            color: var(--accent);
            border: 1px solid rgba(212, 165, 116, 0.2);
        }
        
        .nav-item svg {
            width: 20px;
            height: 20px;
            stroke-width: 1.5;
        }
        
        .sidebar-footer {
            margin-top: auto;
            padding: 20px;
            border-top: 1px solid var(--border);
        }
        
        .user-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--card);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .user-card:hover {
            background: var(--card-hover);
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), #b8956a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }
        
        .user-info h4 {
            font-size: 14px;
            font-weight: 500;
        }
        
        .user-info p {
            font-size: 12px;
            color: var(--text-muted);
        }
        
        /* Main Content */
        .main {
            margin-left: 260px;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }
        
        .header {
            position: sticky;
            top: 0;
            background: rgba(5, 8, 16, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
        }
        
        .search-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 16px;
            width: 320px;
            transition: all 0.2s ease;
        }
        
        .search-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        
        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            width: 100%;
            font-size: 14px;
        }
        
        .search-box input::placeholder {
            color: var(--text-muted);
        }
        
        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }
        
        .icon-btn:hover {
            background: var(--card-hover);
            border-color: var(--accent);
        }
        
        .icon-btn svg {
            width: 20px;
            height: 20px;
            color: var(--text-muted);
        }
        
        .icon-btn .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 18px;
            height: 18px;
            background: var(--danger);
            border-radius: 50%;
            font-size: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Content Area */
        .content {
            padding: 40px;
        }
        
        .page-title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        
        .page-subtitle {
            color: var(--text-muted);
            font-size: 15px;
        }
        
        /* Cards */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
        }
        
        .card:hover {
            border-color: rgba(212, 165, 116, 0.3);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .card-title {
            font-size: 16px;
            font-weight: 500;
        }
        
        /* Account Cards */
        .accounts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 24px 0;
        }
        
        .account-card {
            position: relative;
            overflow: hidden;
            padding: 28px;
        }
        
        .account-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), #f0d9b5);
        }
        
        .account-type {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        
        .account-balance {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 4px;
        }
        
        .account-number {
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 1px;
        }
        
        .account-change {
            position: absolute;
            top: 28px;
            right: 28px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .change-positive {
            color: var(--success);
        }
        
        .change-negative {
            color: var(--danger);
        }
        
        /* Quick Actions */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin: 24px 0;
        }
        
        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 24px 16px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .action-btn:hover {
            background: var(--card-hover);
            border-color: var(--accent);
            transform: translateY(-4px);
        }
        
        .action-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: var(--accent-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .action-btn:hover .action-icon {
            background: var(--accent);
        }
        
        .action-icon svg {
            width: 24px;
            height: 24px;
            color: var(--accent);
            transition: all 0.3s ease;
        }
        
        .action-btn:hover .action-icon svg {
            color: var(--bg);
        }
        
        .action-label {
            font-size: 14px;
            font-weight: 500;
        }
        
        /* Transactions */
        .transactions-section {
            margin-top: 32px;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .section-title {
            font-size: 20px;
            font-weight: 600;
        }
        
        .filter-tabs {
            display: flex;
            gap: 8px;
        }
        
        .filter-tab {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }
        
        .filter-tab:hover {
            background: var(--card);
            color: var(--text);
        }
        
        .filter-tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg);
            font-weight: 500;
        }
        
        .transaction-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .transaction-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            opacity: 1; /* fixed: was 0 */
            transform: translateY(10px);
        }
        
        .transaction-item.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .transaction-item:hover {
            background: var(--card-hover);
            border-color: rgba(212, 165, 116, 0.3);
        }
        
        .tx-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .tx-icon.income {
            background: rgba(52, 211, 153, 0.1);
            color: var(--success);
        }
        
        .tx-icon.expense {
            background: rgba(248, 113, 113, 0.1);
            color: var(--danger);
        }
        
        .tx-icon svg {
            width: 22px;
            height: 22px;
        }
        
        .tx-details {
            flex: 1;
        }
        
        .tx-name {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .tx-meta {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .tx-category {
            padding: 2px 8px;
            background: rgba(212, 165, 116, 0.1);
            border-radius: 4px;
            font-size: 11px;
            color: var(--accent);
        }
        
        .tx-amount {
            font-size: 16px;
            font-weight: 600;
            text-align: right;
        }
        
        .tx-amount.positive {
            color: var(--success);
        }
        
        .tx-amount.negative {
            color: var(--text);
        }
        
        .tx-time {
            font-size: 12px;
            color: var(--text-muted);
            text-align: right;
            margin-top: 4px;
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 8, 16, 0.9);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1; /* fixed: was 0 */
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .modal {
            width: 100%;
            max-width: 480px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
            transform: scale(0.9) translateY(20px);
            transition: all 0.3s ease;
        }
        
        .modal-overlay.active .modal {
            transform: scale(1) translateY(0);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }
        
        .modal-title {
            font-size: 22px;
            font-weight: 600;
        }
        
        .modal-close {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .modal-close:hover {
            background: var(--card-hover);
            border-color: var(--danger);
            color: var(--danger);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        
        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        
        .form-input::placeholder {
            color: var(--text-muted);
        }
        
        .amount-input {
            font-size: 28px;
            font-weight: 600;
            text-align: center;
        }
        
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent), #c99b6d);
            border: none;
            border-radius: 12px;
            color: var(--bg);
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(212, 165, 116, 0.3);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 24px;
        }
        
        .stat-card {
            text-align: center;
            padding: 24px;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 4px;
        }
        
        .stat-label {
            font-size: 13px;
            color: var(--text-muted);
        }
        
        /* Particles */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 1; /* fixed: was 0 */
            animation: float 8s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% {
                opacity: 0;
                transform: translateY(100vh) scale(0);
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(1);
            }
        }
        
        /* Responsive */
        @media (max-width: 1024px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            
            .sidebar.open {
                transform: translateX(0);
            }
            
            .main {
                margin-left: 0;
            }
            
            .quick-actions {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 640px) {
            .content {
                padding: 20px;
            }
            
            .header {
                padding: 16px 20px;
            }
            
            .search-box {
                width: 100%;
                display: none;
            }
            
            .accounts-grid {
                grid-template-columns: 1fr;
            }
            
            .account-balance {
                font-size: 28px;
            }
        }
        
        /* Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
    </style>
<style id="screenshot-fix">
/* 仅处理滚动懒加载：让 opacity:0 的元素可见，但排除 toast/弹窗 */
.reveal:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.fade-in:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.fade:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.lazy:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.stagger-item:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.animate:not(.toast):not([class*="modal"]):not([class*="overlay"]) {
  opacity: 1 !important;
  visibility: visible !important;
}
/* 特别确保弹窗/侧边栏/Toast 保持隐藏（它们通过其他类控制显示） */
.modal-overlay:not(.show):not(.active),
.confirm-overlay:not(.show):not(.active),
[class*="modal"]:not(.show):not(.active):not([class*="stagger"]),
[class*="overlay"]:not(.show):not(.active):not([class*="scroll"]),
.toast:not(.show),
[id*="toast"]:not(.show):not(.active),
[id*="cart"],
[id*="sidebar"] {
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
}
/* 排除 toast 类，避免强制显示 */
.reveal:not(.toast), .fade-in:not(.toast), .fade:not(.toast), .lazy:not(.toast), .stagger-item:not(.toast), .animate:not(.toast) {
  opacity: 1 !important;
  visibility: visible !important;
}
/* 强制显示主要内容区域（section 下的直接子元素），但排除移动菜单 */
section > div:not(.mobile-menu):not([id*="mobile-menu"]):not([id*="menu"]) {
  opacity: 1 !important;
}
</style></head>

    <div class="bg-grid"></div>

    <!-- Sidebar -->

                <span>仪表盘</span>

                </svg>

    <!-- Main Content -->

        <div class="content">

            <p class="page-subtitle">以下是您的账户概览和近期交易记录</p>
            
            <!-- Account Cards -->
            <div class="accounts-grid">

                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18" />

            <!-- Quick Actions -->

            <!-- Stats -->
            <div class="stats-grid">

            <!-- Transactions -->
            <section class="transactions-section">

    <!-- Transfer Modal -->
    <div class="modal-overlay" id="transferModal">
        <div class="modal" role="dialog" aria-labelledby="modalTitle">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">快速转账</h3>
                <button class="modal-close" id="closeModal" aria-label="关闭">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            
            <form id="transferForm">
                <div class="form-group">
                    <label class="form-label">收款账户</label>
                    <input type="text" class="form-input" placeholder="输入收款人账号" required>
                </div>
                <div class="form-group">
                    <label class="form-label">收款人姓名</label>
                    <input type="text" class="form-input" placeholder="输入收款人姓名" required>
                </div>
                <div class="form-group">
                    <label class="form-label">转账金额</label>
                    <input type="number" class="form-input amount-input mono" placeholder="¥ 0.00" required min="0.01" step="0.01">
                </div>
                <div class="form-group">
                    <label class="form-label">备注（可选）</label>
                    <input type="text" class="form-input" placeholder="添加转账备注">
                </div>
                <button type="submit" class="submit-btn">确认转账</button>
            </form>
        </div>
    </div>
    
    <script>
        // Transaction Data
        const transactions = [
            { id: 1, name: '工资收入', category: '薪资', amount: 25000, type: 'income', date: '今天 09:30', account: '储蓄账户' },
            { id: 2, name: '淘宝购物', category: '购物', amount: -328.50, type: 'expense', date: '今天 14:22', account: '活期账户' },
            { id: 3, name: '滴滴出行', category: '交通', amount: -45.00, type: 'expense', date: '昨天 18:45', account: '活期账户' },
            { id: 4, name: '投资收益', category: '理财', amount: 1280.00, type: 'income', date: '昨天 10:00', account: '投资账户' },
            { id: 5, name: '美团外卖', category: '餐饮', amount: -56.00, type: 'expense', date: '昨天 12:30', account: '活期账户' },
            { id: 6, name: '电费缴纳', category: '生活', amount: -180.00, type: 'expense', date: '3天前', account: '活期账户' },
            { id: 7, name: '基金分红', category: '投资', amount: 560.00, type: 'income', date: '3天前', account: '投资账户' },
            { id: 8, name: '京东购物', category: '购物', amount: -899.00, type: 'expense', date: '4天前', account: '活期账户' }
        ];
        
        // DOM Elements
        const transactionList = document.getElementById('transactionList');
        const filterTabs = document.querySelectorAll('.filter-tab');
        const navItems = document.querySelectorAll('.nav-item');
        const transferBtn = document.getElementById('transferBtn');
        const transferModal = document.getElementById('transferModal');
        const closeModal = document.getElementById('closeModal');
        const transferForm = document.getElementById('transferForm');
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const particles = document.getElementById('particles');
        
        // Render Transactions
        function renderTransactions(filter = 'all') {
            const filtered = filter === 'all' 
                ? transactions 
                : transactions.filter(t => t.type === filter);
            
            transactionList.innerHTML = filtered.map((tx, index) => `
                <div class="transaction-item" style="transition-delay: ${index * 50}ms" data-id="${tx.id}">
                    <div class="tx-icon ${tx.type}">
                        ${tx.type === 'income' 
                            ? '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18" /></svg>'
                            : '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3" /></svg>'
                        }
                    </div>
                    <div class="tx-details">
                        <div class="tx-name">${tx.name}</div>
                        <div class="tx-meta">
                            <span class="tx-category">${tx.category}</span>
                            <span>${tx.account}</span>
                        </div>
                    </div>
                    <div>
                        <div class="tx-amount ${tx.amount > 0 ? 'positive' : 'negative'}">
                            ${tx.amount > 0 ? '+' : ''}${tx.amount.toLocaleString('zh-CN', { minimumFractionDigits: 2 })}
                        </div>
                        <div class="tx-time">${tx.date}</div>
                    </div>
                </div>
            `).join('');
            
            // Animate in
            requestAnimationFrame(() => {
                document.querySelectorAll('.transaction-item').forEach((item, i) => {
                    setTimeout(() => item.classList.add('visible'), i * 50);
                });
            });
        }
        
        // Filter Tabs
        filterTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                filterTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                renderTransactions(tab.dataset.filter);
            });
        });
        
        // Navigation
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                navItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');
            });
        });
        
        // Modal
        transferBtn.addEventListener('click', () => {
            transferModal.classList.add('active');
        });
        
        closeModal.addEventListener('click', () => {
            transferModal.classList.remove('active');
        });
        
        transferModal.addEventListener('click', (e) => {
            if (e.target === transferModal) {
                transferModal.classList.remove('active');
            }
        });
        
        transferForm.addEventListener('submit', (e) => {
            e.preventDefault();
            // Simulate transfer
            const btn = transferForm.querySelector('.submit-btn');
            btn.textContent = '处理中...';
            btn.disabled = true;
            
            setTimeout(() => {
                btn.textContent = '转账成功';
                btn.style.background = 'var(--success)';
                
                setTimeout(() => {
                    transferModal.classList.remove('active');
                    btn.textContent = '确认转账';
                    btn.style.background = '';
                    btn.disabled = false;
                    transferForm.reset();
                }, 1500);
            }, 2000);
        });
        
        // Mobile Menu
        function checkMobile() {
            if (window.innerWidth <= 1024) {
                menuBtn.style.display = 'flex';
            } else {
                menuBtn.style.display = 'none';
                sidebar.classList.remove('open');
            }
        }
        
        menuBtn.addEventListener('click', () => {
            sidebar.classList.toggle('open');
        });
        
        window.addEventListener('resize', checkMobile);
        checkMobile();
        
        // Particles
        function createParticles() {
            const colors = ['#d4a574', '#e8c9a8', '#b8956a'];
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 8 + 's';
                particle.style.animationDuration = (6 + Math.random() * 4) + 's';
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.width = (2 + Math.random() * 4) + 'px';
                particle.style.height = particle.style.width;
                particles.appendChild(particle);
            }
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderTransactions();
            createParticles();
        });
        
        // Keyboard accessibility
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && transferModal.classList.contains('active')) {
                transferModal.classList.remove('active');
            }
        });
    </script>
</body>
