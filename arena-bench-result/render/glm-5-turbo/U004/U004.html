<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>旅行行程规划</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1419;
            --bg-card: #1a2129;
            --bg-input: #242d38;
            --fg: #e8eaed;
            --fg-muted: #8b949e;
            --accent: #e07b39;
            --accent-light: #f4a261;
            --teal: #2d9596;
            --teal-dark: #235555;
            --border: #30363d;
            --danger: #f85149;
            --success: #3fb950;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans SC', 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .font-display {
            font-family: 'Outfit', sans-serif;
        }

        /* 背景装饰 */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 0;
            background: 
                radial-gradient(ellipse 80% 50% at 20% -10%, rgba(45, 149, 150, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 110%, rgba(224, 123, 57, 0.12) 0%, transparent 50%);
        }

        .bg-noise {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 1;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        /* 输入框样式 */
        .input-field {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--fg);
            font-size: 15px;
            width: 100%;
            transition: all 0.2s ease;
        }
        .input-field:focus {
            outline: none;
            border-color: var(--teal);
            box-shadow: 0 0 0 3px rgba(45, 149, 150, 0.15);
        }
        .input-field::placeholder {
            color: var(--fg-muted);
        }

        textarea.input-field {
            resize: none;
            min-height: 80px;
        }

        /* 按钮样式 */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 24px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            touch-action: manipulation;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--teal) 0%, var(--teal-dark) 100%);
            color: white;
            box-shadow: 0 4px 20px rgba(45, 149, 150, 0.3);
        }
        .btn-primary:active {
            box-shadow: 0 2px 10px rgba(45, 149, 150, 0.3);
        }
        .btn-accent {
            background: linear-gradient(135deg, var(--accent) 0%, #c9652e 100%);
            color: white;
            box-shadow: 0 4px 20px rgba(224, 123, 57, 0.3);
        }
        .btn-ghost {
            background: transparent;
            color: var(--fg-muted);
            border: 1px solid var(--border);
        }
        .btn-ghost:active {
            background: var(--bg-input);
        }
        .btn-sm {
            padding: 10px 16px;
            font-size: 13px;
            border-radius: 10px;
        }
        .btn-icon {
            width: 44px;
            height: 44px;
            padding: 0;
            border-radius: 12px;
        }

        /* 卡片 */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }

        /* 天数标签 */
        .day-tab {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            color: var(--fg-muted);
            background: transparent;
            border: none;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }
        .day-tab.active {
            color: var(--accent);
        }
        .day-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 3px;
            background: var(--accent);
            border-radius: 3px;
        }

        /* 项目卡片 */
        .item-card {
            background: var(--bg-input);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            position: relative;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .item-type {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
        }
        .type-attraction {
            background: rgba(224, 123, 57, 0.15);
            color: var(--accent-light);
        }
        .type-transport {
            background: rgba(45, 149, 150, 0.15);
            color: var(--teal);
        }
        .type-restaurant {
            background: rgba(63, 185, 80, 0.15);
            color: var(--success);
        }

        /* 浮动按钮 */
        .fab {
            position: fixed;
            bottom: 100px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent) 0%, #c9652e 100%);
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 24px rgba(224, 123, 57, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: all 0.2s ease;
        }
        .fab:active {
            transform: scale(0.93);
        }

        /* 底部导航 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(26, 33, 41, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 12px 0 28px;
            z-index: 99;
        }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 20, 25, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 200;
            opacity: 1; /* fixed: was 0 */
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-radius: 24px 24px 0 0;
            padding: 24px 20px 40px;
            z-index: 201;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-overlay.active .modal {
            transform: translateY(0);
        }
        .modal-handle {
            width: 36px;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin: 0 auto 20px;
        }

        /* 类型选择器 */
        .type-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .type-option {
            flex: 1;
            padding: 12px 8px;
            border-radius: 12px;
            border: 2px solid var(--border);
            background: transparent;
            color: var(--fg-muted);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .type-option.selected {
            border-color: var(--accent);
            background: rgba(224, 123, 57, 0.1);
            color: var(--accent);
        }

        /* 预览样式 */
        .preview-day {
            page-break-after: always;
            margin-bottom: 24px;
        }
        .preview-day-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .preview-day-number {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--teal) 0%, var(--teal-dark) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: white;
        }

        /* 动画 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-in {
            animation: fadeInUp 0.5s ease forwards;
        }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* 删除按钮 */
        .delete-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(248, 81, 73, 0.1);
            border: none;
            color: var(--danger);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.6;
            transition: all 0.2s ease;
        }
        .delete-btn:active {
            opacity: 1;
            background: rgba(248, 81, 73, 0.2);
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--fg-muted);
        }
        .empty-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
            border-radius: 20px;
            background: var(--bg-input);
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
<style id="screenshot-fix">
/* 仅处理滚动懒加载：让 opacity:0 的元素可见，但排除 toast/弹窗 */
.reveal:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.fade-in:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.fade:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.lazy:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.stagger-item:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.animate:not(.toast):not([class*="modal"]):not([class*="overlay"]) {
  opacity: 1 !important;
  visibility: visible !important;
}
/* 特别确保弹窗/侧边栏/Toast 保持隐藏（它们通过其他类控制显示） */
.modal-overlay:not(.show):not(.active),
.confirm-overlay:not(.show):not(.active),
[class*="modal"]:not(.show):not(.active):not([class*="stagger"]),
[class*="overlay"]:not(.show):not(.active):not([class*="scroll"]),
.toast:not(.show),
[id*="toast"]:not(.show):not(.active),
[id*="cart"],
[id*="sidebar"] {
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
}
/* 排除 toast 类，避免强制显示 */
.reveal:not(.toast), .fade-in:not(.toast), .fade:not(.toast), .lazy:not(.toast), .stagger-item:not(.toast), .animate:not(.toast) {
  opacity: 1 !important;
  visibility: visible !important;
}
/* 强制显示主要内容区域（section 下的直接子元素），但排除移动菜单 */
section > div:not(.mobile-menu):not([id*="mobile-menu"]):not([id*="menu"]) {
  opacity: 1 !important;
}
</style></head>
<body>
    <div class="bg-pattern"></div>
    <div class="bg-noise"></div>

    <!-- 主容器 -->
    <main id="app" class="relative z-10 pb-40">
        <!-- 头部 -->
        <header class="px-5 pt-12 pb-6 animate-in">
            <h1 class="font-display text-3xl font-bold mb-2" style="color: var(--fg);">行程规划</h1>
            <p class="text-sm" style="color: var(--fg-muted);">创建你的专属旅行手册</p>
        </header>

        <!-- 旅行信息卡片 -->
        <section class="px-5 mb-6 animate-in delay-1">
            <div class="card p-5">
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2" style="color: var(--fg-muted);">旅行名称</label>
                    <input type="text" id="tripName" class="input-field font-display text-lg" placeholder="我的旅行计划" value="">
                </div>
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-sm font-medium mb-2" style="color: var(--fg-muted);">出发日期</label>
                        <input type="date" id="startDate" class="input-field">
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-medium mb-2" style="color: var(--fg-muted);">天数</label>
                        <div class="flex items-center gap-2">
                            <button class="btn btn-icon btn-ghost" onclick="adjustDays(-1)">
                                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 10h10"/></svg>
                            </button>
                            <span id="daysCount" class="font-display text-2xl font-bold min-w-[40px] text-center" style="color: var(--accent);">3</span>
                            <button class="btn btn-icon btn-ghost" onclick="adjustDays(1)">
                                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 10h10M10 5v10"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 天数标签 -->
        <section class="animate-in delay-2">
            <div class="overflow-x-auto scrollbar-hide" style="scrollbar-width: none;">
                <div id="dayTabs" class="flex gap-1 px-5 pb-4" style="min-width: max-content;">
                    <!-- 天数标签动态生成 -->
                </div>
            </div>
        </section>

        <!-- 当天行程内容 -->
        <section id="dayContent" class="px-5 animate-in delay-3">
            <!-- 内容动态生成 -->
        </section>
    </main>

    <!-- 添加按钮 -->
    <button class="fab" onclick="openAddModal()" aria-label="添加项目">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 5v14M5 12h14"/>
        </svg>
    </button>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
        <div class="flex justify-around items-center">
            <button class="flex flex-col items-center gap-1 px-4 py-2" style="color: var(--accent);" onclick="showEditView()">
                <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
                <span class="text-xs font-medium">编辑</span>
            </button>
            <button class="flex flex-col items-center gap-1 px-4 py-2" style="color: var(--fg-muted);" onclick="showPreview()">
                <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10 9 9 9 8 9"/>
                </svg>
                <span class="text-xs font-medium">预览</span>
            </button>
            <button class="flex flex-col items-center gap-1 px-4 py-2" style="color: var(--fg-muted);" onclick="exportTrip()">
                <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                <span class="text-xs font-medium">导出</span>
            </button>
        </div>
    </nav>

    <!-- 添加项目模态框 -->
    <div id="addModal" class="modal-overlay" onclick="closeAddModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-handle"></div>
            <h3 class="font-display text-xl font-bold mb-5">添加项目</h3>
            
            <div class="type-selector">
                <button class="type-option selected" data-type="attraction" onclick="selectType(this)">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="10" r="3"/>
                        <path d="M12 2a8 8 0 0 0-8 8c0 5.4 7 12 8 12s8-6.6 8-12a8 8 0 0 0-8-8z"/>
                    </svg>
                    景点
                </button>
                <button class="type-option" data-type="transport" onclick="selectType(this)">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="1" y="3" width="15" height="13" rx="2"/>
                        <circle cx="5" cy="18" r="2"/>
                        <circle cx="12" cy="18" r="2"/>
                        <path d="M16 8h4l3 4v4h-7"/>
                        <circle cx="19" cy="18" r="2"/>
                    </svg>
                    交通
                </button>
                <button class="type-option" data-type="restaurant" onclick="selectType(this)">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8h1a4 4 0 0 1 0 8h-1"/>
                        <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/>
                        <line x1="6" y1="1" x2="6" y2="4"/>
                        <line x1="10" y1="1" x2="10" y2="4"/>
                        <line x1="14" y1="1" x2="14" y2="4"/>
                    </svg>
                    餐厅
                </button>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium mb-2" style="color: var(--fg-muted);">名称</label>
                <input type="text" id="itemName" class="input-field" placeholder="请输入名称">
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium mb-2" style="color: var(--fg-muted);">时间</label>
                <input type="time" id="itemTime" class="input-field">
            </div>

            <div class="mb-5">
                <label class="block text-sm font-medium mb-2" style="color: var(--fg-muted);">备注</label>
                <textarea id="itemNote" class="input-field" placeholder="添加备注信息（可选）"></textarea>
            </div>

            <button class="btn btn-primary w-full" onclick="addItem()">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                添加到行程
            </button>
        </div>
    </div>

    <script>
        // 数据初始化
        let tripData = {
            name: '',
            startDate: '',
            days: 3,
            items: {}
        };

        let currentDay = 1;
        let currentType = 'attraction';

        // DOM 元素缓存
        const dayTabsEl = document.getElementById('dayTabs');
        const dayContentEl = document.getElementById('dayContent');
        const addModalEl = document.getElementById('addModal');

        // 初始化
        function init() {
            const today = new Date();
            const nextWeek = new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000);
            document.getElementById('startDate').value = nextWeek.toISOString().split('T')[0];
            
            // 从 localStorage 加载数据
            const saved = localStorage.getItem('tripPlan');
            if (saved) {
                tripData = JSON.parse(saved);
                document.getElementById('tripName').value = tripData.name || '';
                document.getElementById('startDate').value = tripData.startDate || '';
                document.getElementById('daysCount').textContent = tripData.days || 3;
            }
            
            renderDayTabs();
            renderDayContent();
        }

        // 渲染天数标签
        function renderDayTabs() {
            const days = parseInt(document.getElementById('daysCount').textContent) || 3;
            dayTabsEl.innerHTML = '';
            
            for (let i = 1; i <= days; i++) {
                const tab = document.createElement('button');
                tab.className = `day-tab ${i === currentDay ? 'active' : ''}`;
                tab.textContent = `第${i}天`;
                tab.onclick = () => selectDay(i);
                dayTabsEl.appendChild(tab);
            }
        }

        // 选择天数
        function selectDay(day) {
            currentDay = day;
            renderDayTabs();
            renderDayContent();
        }

        // 渲染当天内容
        function renderDayContent() {
            const items = tripData.items[currentDay] || [];
            
            if (items.length === 0) {
                dayContentEl.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">
                            <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" style="color: var(--fg-muted);">
                                <circle cx="12" cy="10" r="3"/>
                                <path d="M12 2a8 8 0 0 0-8 8c0 5.4 7 12 8 12s8-6.6 8-12a8 8 0 0 0-8-8z"/>
                            </svg>
                        </div>
                        <p class="font-medium mb-1">暂无行程安排</p>
                        <p class="text-sm" style="color: var(--fg-muted);">点击下方按钮添加项目</p>
                    </div>
                `;
                return;
            }

            dayContentEl.innerHTML = items.map((item, index) => `
                <div class="item-card" style="animation-delay: ${index * 0.05}s">
                    <button class="delete-btn" onclick="deleteItem(${index})" aria-label="删除">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 6L6 18M6 6l12 12"/>
                        </svg>
                    </button>
                    <span class="item-type type-${item.type}">
                        ${getTypeIcon(item.type)}
                        ${getTypeName(item.type)}
                    </span>
                    <h4 class="font-semibold text-lg mt-3 mb-1 pr-8" style="color: var(--fg);">${escapeHtml(item.name)}</h4>
                    ${item.time ? `<p class="text-sm mb-2" style="color: var(--accent);">${item.time}</p>` : ''}
                    ${item.note ? `<p class="text-sm" style="color: var(--fg-muted);">${escapeHtml(item.note)}</p>` : ''}
                </div>
            `).join('');
        }

        // 获取类型图标
        function getTypeIcon(type) {
            const icons = {
                attraction: '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="6" r="2"/><path d="M7 1a5 5 0 0 0-5 5c0 3.4 4.4 7.5 5 7.5s5-4.1 5-7.5a5 5 0 0 0-5-5z"/></svg>',
                transport: '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="10" height="8" rx="1"/><circle cx="4" cy="12" r="1.5"/><circle cx="9" cy="12" r="1.5"/></svg>',
                restaurant: '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5h.5a2.5 2.5 0 0 1 0 5H11"/><path d="M2 5h9v5.5a2.5 2.5 0 0 1-2.5 2.5h-4A2.5 2.5 0 0 1 2 10.5V5z"/></svg>'
            };
            return icons[type] || '';
        }

        // 获取类型名称
        function getTypeName(type) {
            const names = { attraction: '景点', transport: '交通', restaurant: '餐厅' };
            return names[type] || type;
        }

        // 调整天数
        function adjustDays(delta) {
            const el = document.getElementById('daysCount');
            let days = parseInt(el.textContent) || 3;
            days = Math.max(1, Math.min(30, days + delta));
            el.textContent = days;
            tripData.days = days;
            
            // 清理超出范围的数据
            if (tripData.items) {
                Object.keys(tripData.items).forEach(key => {
                    if (parseInt(key) > days) {
                        delete tripData.items[key];
                    }
                });
            }
            
            if (currentDay > days) {
                currentDay = days;
            }
            
            saveData();
            renderDayTabs();
            renderDayContent();
        }

        // 打开添加模态框
        function openAddModal() {
            addModalEl.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // 关闭添加模态框
        function closeAddModal(e) {
            if (e.target === addModalEl) {
                addModalEl.classList.remove('active');
                document.body.style.overflow = '';
            }
        }

        // 选择类型
        function selectType(el) {
            document.querySelectorAll('.type-option').forEach(btn => btn.classList.remove('selected'));
            el.classList.add('selected');
            currentType = el.dataset.type;
        }

        // 添加项目
        function addItem() {
            const name = document.getElementById('itemName').value.trim();
            const time = document.getElementById('itemTime').value;
            const note = document.getElementById('itemNote').value.trim();

            if (!name) {
                document.getElementById('itemName').focus();
                return;
            }

            if (!tripData.items[currentDay]) {
                tripData.items[currentDay] = [];
            }

            tripData.items[currentDay].push({
                type: currentType,
                name: name,
                time: time,
                note: note
            });

            // 按时间排序
            tripData.items[currentDay].sort((a, b) => {
                if (!a.time) return 1;
                if (!b.time) return -1;
                return a.time.localeCompare(b.time);
            });

            saveData();
            renderDayContent();

            // 重置表单
            document.getElementById('itemName').value = '';
            document.getElementById('itemTime').value = '';
            document.getElementById('itemNote').value = '';

            // 关闭模态框
            addModalEl.classList.remove('active');
            document.body.style.overflow = '';
        }

        // 删除项目
        function deleteItem(index) {
            if (tripData.items[currentDay]) {
                tripData.items[currentDay].splice(index, 1);
                saveData();
                renderDayContent();
            }
        }

        // 保存数据
        function saveData() {
            tripData.name = document.getElementById('tripName').value;
            tripData.startDate = document.getElementById('startDate').value;
            tripData.days = parseInt(document.getElementById('daysCount').textContent) || 3;
            localStorage.setItem('tripPlan', JSON.stringify(tripData));
        }

        // 监听输入变化
        document.getElementById('tripName').addEventListener('input', saveData);
        document.getElementById('startDate').addEventListener('change', saveData);

        // 显示编辑视图
        function showEditView() {
            document.querySelector('main').style.display = 'block';
            document.querySelectorAll('.bottom-nav button')[0].style.color = 'var(--accent)';
            document.querySelectorAll('.bottom-nav button')[1].style.color = 'var(--fg-muted)';
            document.querySelectorAll('.bottom-nav button')[2].style.color = 'var(--fg-muted)';
            renderDayContent();
        }

        // 显示预览
        function showPreview() {
            const name = tripData.name || '我的旅行计划';
            const days = tripData.days;
            
            document.querySelectorAll('.bottom-nav button')[0].style.color = 'var(--fg-muted)';
            document.querySelectorAll('.bottom-nav button')[1].style.color = 'var(--accent)';
            
            let previewHtml = `
                <div class="px-5 pb-32">
                    <div class="text-center py-8 border-b mb-6" style="border-color: var(--border);">
                        <h1 class="font-display text-2xl font-bold mb-2" style="color: var(--fg);">${escapeHtml(name)}</h1>
                        ${tripData.startDate ? `<p class="text-sm" style="color: var(--fg-muted);">出发日期: ${tripData.startDate}</p>` : ''}
                        <p class="text-sm mt-1" style="color: var(--accent);">共 ${days} 天行程</p>
                    </div>
            `;

            for (let day = 1; day <= days; day++) {
                const items = tripData.items[day] || [];
                previewHtml += `
                    <div class="preview-day">
                        <div class="preview-day-header">
                            <div class="preview-day-number">${day}</div>
                            <div>
                                <h3 class="font-semibold" style="color: var(--fg);">第${day}天</h3>
                                <p class="text-sm" style="color: var(--fg-muted);">${items.length} 个安排</p>
                            </div>
                        </div>
                `;

                if (items.length === 0) {
                    previewHtml += `<p class="text-sm py-4" style="color: var(--fg-muted);">暂无安排</p>`;
                } else {
                    items.forEach(item => {
                        previewHtml += `
                            <div class="flex gap-3 mb-3 pb-3 border-b" style="border-color: var(--border);">
                                <span class="item-type type-${item.type}" style="flex-shrink: 0;">
                                    ${getTypeIcon(item.type)}
                                </span>
                                <div class="flex-1 min-w-0">
                                    <p class="font-medium truncate" style="color: var(--fg);">${escapeHtml(item.name)}</p>
                                    ${item.time ? `<p class="text-xs" style="color: var(--accent);">${item.time}</p>` : ''}
                                    ${item.note ? `<p class="text-xs mt-1" style="color: var(--fg-muted);">${escapeHtml(item.note)}</p>` : ''}
                                </div>
                            </div>
                        `;
                    });
                }

                previewHtml += `</div>`;
            }

            previewHtml += `</div>`;
            dayContentEl.innerHTML = previewHtml;
        }

        // 导出行程
        function exportTrip() {
            const name = tripData.name || '我的旅行计划';
            let content = `【${name}】\n`;
            
            if (tripData.startDate) {
                content += `出发日期: ${tripData.startDate}\n`;
            }
            
            content += `行程天数: ${tripData.days}天\n\n`;
            content += `${'='.repeat(30)}\n\n`;

            for (let day = 1; day <= tripData.days; day++) {
                content += `【第${day}天】\n`;
                const items = tripData.items[day] || [];
                
                if (items.length === 0) {
                    content += `暂无安排\n\n`;
                } else {
                    items.forEach(item => {
                        const typeNames = { attraction: '景点', transport: '交通', restaurant: '餐厅' };
                        content += `▸ [${typeNames[item.type]}] ${item.name}`;
                        if (item.time) content += ` (${item.time})`;
                        content += '\n';
                        if (item.note) content += `  备注: ${item.note}\n`;
                    });
                    content += '\n';
                }
            }

            // 创建下载
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${name}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            // 显示提示
            showToast('行程已导出');
        }

        // 显示提示
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-20 left-1/2 -translate-x-1/2 px-5 py-3 rounded-xl text-sm font-medium z-300';
            toast.style.cssText = 'background: var(--bg-card); border: 1px solid var(--border); color: var(--fg);';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        // HTML 转义
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // 启动
        init();
    </script>
</body>
</html>
