<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>每日热量记录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
<style>
  :root {
    --bg: #0F0E0C;
    --bg2: #1A1815;
    --card: #222019;
    --card-hover: #2C2A22;
    --border: #33302A;
    --fg: #F5F0E8;
    --fg2: #B8B0A2;
    --muted: #7A7468;
    --accent: #FF6B35;
    --accent2: #FF8C5A;
    --success: #5CB85C;
    --danger: #E74C3C;
    --warning: #F0AD4E;
    --radius: 14px;
    --radius-sm: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Outfit', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100dvh;
    overflow-x: hidden;
    position: relative;
  }

  /* 背景装饰 */
  body::before {
    content: '';
    position: fixed;
    top: -120px;
    right: -80px;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(255,107,53,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -100px;
    left: -60px;
    width: 250px;
    height: 250px;
    background: radial-gradient(circle, rgba(255,140,90,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    max-width: 430px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
    padding-bottom: 100px;
  }

  /* 顶部栏 */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 8px;
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(15,14,12,0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  .top-bar h1 {
    font-size: 20px;
    font-weight: 700;
    color: var(--fg);
    letter-spacing: -0.3px;
  }
  .top-bar .date-text {
    font-size: 13px;
    color: var(--muted);
    font-weight: 400;
  }
  .goal-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--fg2);
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
  }
  .goal-btn:active { transform: scale(0.95); }
  .goal-btn .material-symbols-rounded { font-size: 16px; color: var(--accent); }

  /* 进度环区域 */
  .progress-section {
    padding: 20px 20px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .ring-container {
    position: relative;
    width: 200px;
    height: 200px;
    margin-bottom: 12px;
  }
  .ring-container svg {
    width: 200px;
    height: 200px;
    transform: rotate(-90deg);
  }
  .ring-bg {
    fill: none;
    stroke: var(--border);
    stroke-width: 12;
  }
  .ring-fill {
    fill: none;
    stroke: url(#ringGrad);
    stroke-width: 12;
    stroke-linecap: round;
    stroke-dasharray: 502.65;
    stroke-dashoffset: 502.65;
    transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .ring-fill.over {
    stroke: var(--danger);
  }
  .ring-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .ring-cal {
    font-size: 42px;
    font-weight: 800;
    color: var(--fg);
    line-height: 1;
    letter-spacing: -1px;
  }
  .ring-unit {
    font-size: 14px;
    color: var(--muted);
    font-weight: 400;
    margin-top: 2px;
  }
  .ring-label {
    font-size: 13px;
    color: var(--accent2);
    font-weight: 600;
    margin-top: 4px;
  }

  .macro-row {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 360px;
  }
  .macro-card {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 10px;
    text-align: center;
  }
  .macro-card .macro-val {
    font-size: 20px;
    font-weight: 700;
    color: var(--fg);
  }
  .macro-card .macro-name {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }
  .macro-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 8px;
    overflow: hidden;
  }
  .macro-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.6s ease;
  }

  /* 添加按钮 */
  .add-section {
    padding: 8px 20px 12px;
  }
  .add-btn {
    width: 100%;
    padding: 14px;
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    background: transparent;
    color: var(--muted);
    font-size: 15px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.25s;
  }
  .add-btn:active {
    transform: scale(0.97);
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(255,107,53,0.05);
  }
  .add-btn .material-symbols-rounded { font-size: 22px; }

  /* 今日记录列表 */
  .record-section {
    padding: 4px 20px 20px;
  }
  .section-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--fg2);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .section-title .material-symbols-rounded { font-size: 18px; color: var(--accent); }
  .record-empty {
    text-align: center;
    padding: 32px 0;
    color: var(--muted);
    font-size: 14px;
  }
  .record-empty .material-symbols-rounded {
    font-size: 40px;
    display: block;
    margin: 0 auto 8px;
    opacity: 0.4;
  }
  .record-list { display: flex; flex-direction: column; gap: 8px; }
  .record-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .record-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .record-info { flex: 1; min-width: 0; }
  .record-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .record-detail {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .record-cal {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    flex-shrink: 0;
  }
  .record-cal span { font-size: 11px; font-weight: 400; color: var(--muted); }
  .record-del {
    width: 32px;
    height: 32px;
    border: none;
    background: rgba(231,76,60,0.1);
    color: var(--danger);
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .record-del:active { transform: scale(0.9); background: rgba(231,76,60,0.2); }
  .record-del .material-symbols-rounded { font-size: 18px; }

  /* 底部弹窗 - 食物库 */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    opacity: 1; /* fixed: was 0 */
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .modal-overlay.active { opacity: 1; pointer-events: all; }

  .modal-sheet {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 101;
    max-width: 430px;
    margin: 0 auto;
    background: var(--bg2);
    border-radius: 20px 20px 0 0;
    max-height: 85dvh;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .modal-sheet.active { transform: translateY(0); }

  .modal-handle {
    width: 36px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 10px auto 6px;
    flex-shrink: 0;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 20px 12px;
    flex-shrink: 0;
  }
  .modal-header h2 {
    font-size: 18px;
    font-weight: 700;
  }
  .modal-close {
    width: 34px;
    height: 34px;
    border: none;
    background: var(--card);
    color: var(--fg2);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-close:active { transform: scale(0.9); }

  .search-box {
    margin: 0 20px 10px;
    position: relative;
    flex-shrink: 0;
  }
  .search-box input {
    width: 100%;
    padding: 11px 14px 11px 40px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--card);
    color: var(--fg);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box input::placeholder { color: var(--muted); }
  .search-box input:focus { border-color: var(--accent); }
  .search-box .material-symbols-rounded {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 18px;
    color: var(--muted);
  }

  /* 分类标签 */
  .cat-tabs {
    display: flex;
    gap: 8px;
    padding: 0 20px 12px;
    overflow-x: auto;
    flex-shrink: 0;
    scrollbar-width: none;
  }
  .cat-tabs::-webkit-scrollbar { display: none; }
  .cat-tab {
    padding: 7px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--fg2);
    font-size: 13px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .cat-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .cat-tab:active { transform: scale(0.95); }

  .food-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 20px 30px;
    overscroll-behavior: contain;
  }
  .food-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .food-item:active { opacity: 0.6; }
  .food-item:last-child { border-bottom: none; }
  .food-emoji {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .food-info { flex: 1; min-width: 0; }
  .food-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--fg);
  }
  .food-meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .food-kcal {
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    flex-shrink: 0;
  }
  .food-kcal span { font-size: 11px; font-weight: 400; }
  .food-add-icon {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(255,107,53,0.12);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .food-add-icon .material-symbols-rounded { font-size: 18px; }

  /* 目标设置弹窗 */
  .goal-modal-content {
    padding: 20px;
  }
  .goal-modal-content label {
    font-size: 14px;
    color: var(--fg2);
    font-weight: 500;
    display: block;
    margin-bottom: 8px;
  }
  .goal-input-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .goal-input-row input {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--card);
    color: var(--fg);
    font-size: 18px;
    font-family: inherit;
    font-weight: 700;
    outline: none;
    text-align: center;
    transition: border-color 0.2s;
  }
  .goal-input-row input:focus { border-color: var(--accent); }
  .goal-input-row .unit {
    font-size: 14px;
    color: var(--muted);
    font-weight: 500;
  }
  .goal-save {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    margin-top: 16px;
    transition: all 0.2s;
  }
  .goal-save:active { transform: scale(0.97); opacity: 0.9; }

  .quick-goals {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .quick-goal {
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--fg2);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
  }
  .quick-goal:active { transform: scale(0.95); }

  /* Toast 通知 */
  .toast-container {
    position: fixed;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
    pointer-events: none;
  }
  .toast {
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    font-family: 'Outfit', sans-serif;
    animation: toastIn 0.3s ease, toastOut 0.3s ease 1.7s forwards;
    white-space: nowrap;
  }
  .toast.success { background: rgba(92,184,92,0.9); color: #fff; }
  .toast.warn { background: rgba(240,173,78,0.9); color: #1a1a1a; }
  .toast.info { background: rgba(255,107,53,0.9); color: #fff; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(-10px); } }

  /* 份额选择弹窗 */
  .serving-modal {
    padding: 20px;
    text-align: center;
  }
  .serving-emoji { font-size: 48px; margin-bottom: 8px; }
  .serving-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .serving-base { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .serving-counter {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-bottom: 16px;
  }
  .serving-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--fg);
    font-size: 22px;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .serving-btn:active { transform: scale(0.9); background: var(--accent); color: #fff; border-color: var(--accent); }
  .serving-num {
    font-size: 32px;
    font-weight: 800;
    min-width: 60px;
    color: var(--fg);
  }
  .serving-kcal {
    font-size: 24px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 16px;
  }
  .serving-kcal span { font-size: 13px; font-weight: 400; color: var(--muted); }
  .serving-confirm {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }
  .serving-confirm:active { transform: scale(0.97); }

  /* 超标闪烁 */
  @keyframes overPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }
  .over-badge {
    display: inline-block;
    background: var(--danger);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 6px;
    margin-left: 6px;
    animation: overPulse 1.5s infinite;
  }

  /* 滚动条美化 */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
<style id="screenshot-fix">
/* 仅处理滚动懒加载：让 opacity:0 的元素可见，但排除 toast/弹窗 */
.reveal:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.fade-in:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.fade:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.lazy:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.stagger-item:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.animate:not(.toast):not([class*="modal"]):not([class*="overlay"]) {
  opacity: 1 !important;
  visibility: visible !important;
}
/* 特别确保弹窗/侧边栏/Toast 保持隐藏（它们通过其他类控制显示） */
.modal-overlay:not(.show):not(.active),
.confirm-overlay:not(.show):not(.active),
[class*="modal"]:not(.show):not(.active):not([class*="stagger"]),
[class*="overlay"]:not(.show):not(.active):not([class*="scroll"]),
.toast:not(.show),
[id*="toast"]:not(.show):not(.active),
[id*="cart"],
[id*="sidebar"] {
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
}
/* 排除 toast 类，避免强制显示 */
.reveal:not(.toast), .fade-in:not(.toast), .fade:not(.toast), .lazy:not(.toast), .stagger-item:not(.toast), .animate:not(.toast) {
  opacity: 1 !important;
  visibility: visible !important;
}
/* 强制显示主要内容区域（section 下的直接子元素），但排除移动菜单 */
section > div:not(.mobile-menu):not([id*="mobile-menu"]):not([id*="menu"]) {
  opacity: 1 !important;
}
</style></head>
<body>

<div class="app" id="app">
  <!-- 顶部栏 -->
  <header class="top-bar">
    <div>
      <h1>热量记录</h1>
      <div class="date-text" id="dateText"></div>
    </div>
    <button class="goal-btn" onclick="openGoalModal()" aria-label="设置目标">
      <span class="material-symbols-rounded">flag</span>
      <span id="goalBtnText">2000 kcal</span>
    </button>
  </header>

  <!-- 进度环 -->
  <section class="progress-section">
    <div class="ring-container">
      <svg viewBox="0 0 180 180">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF6B35"/>
            <stop offset="100%" stop-color="#FF8C5A"/>
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="90" cy="90" r="80"/>
        <circle class="ring-fill" id="ringFill" cx="90" cy="90" r="80"/>
      </svg>
      <div class="ring-center">
        <div class="ring-cal" id="ringCal">0</div>
        <div class="ring-unit">千卡已摄入</div>
        <div class="ring-label" id="ringLabel">剩余 2000</div>
      </div>
    </div>

    <!-- 宏量素概览 -->
    <div class="macro-row">
      <div class="macro-card">
        <div class="macro-val" id="macroProtein">0g</div>
        <div class="macro-name">蛋白质</div>
        <div class="macro-bar"><div class="macro-bar-fill" id="barProtein" style="width:0%;background:#4ECDC4;"></div></div>
      </div>
      <div class="macro-card">
        <div class="macro-val" id="macroCarbs">0g</div>
        <div class="macro-name">碳水</div>
        <div class="macro-bar"><div class="macro-bar-fill" id="barCarbs" style="width:0%;background:#FFE66D;"></div></div>

<script>

  { id:22, name:'胡萝卜',     cat:'蔬菜', cal:37,  protein:1.0, carbs:8.8,  fat:0.2,  unit:'100g',  emoji:'🥕', bg:'#3A3530' },
  { id:23, name:'生菜',       cat:'蔬菜', cal:13,  protein:1.3, carbs:2.0,  fat:0.3,  unit:'100g',  emoji:'🥬', bg:'#2E3A2E' },
  // 水果
  { id:24, name:'苹果',       cat:'水果', cal:53,  protein:0.2, carbs:13.7, fat:0.2,  unit:'100g',  emoji:'🍎', bg:'#3A2E2E' },
  { id:25, name:'香蕉',       cat:'水果', cal:93,  protein:1.4, carbs:22.2, fat:0.2,  unit:'100g',  emoji:'🍌', bg:'#3A3830' },
  { id:26, name:'橙子',       cat:'水果', cal:48,  protein:0.8, carbs:11.1, fat:0.2,  unit:'100g',  emoji:'🍊', bg:'#3A3530' },
  { id:27, name:'葡萄',       cat:'水果', cal:44,  protein:0.5, carbs:10.3, fat:0.2,  unit:'100g',  emoji:'🍇', bg:'#2E2E3A' },
  { id:28, name:'西瓜',       cat:'水果', cal:31,  protein:0.5, carbs:6.8,  fat:0.1,  unit:'100g',  emoji:'🍉', bg:'#3A2E2E' },
  { id:29, name:'草莓',       cat:'水果', cal:30,  protein:1.0, carbs:7.1,  fat:0.2,  unit:'100g',  emoji:'🍓', bg:'#3A2E2E' },
  // 奶制品
  { id:30, name:'牛奶',       cat:'奶制品', cal:54,  protein:3.0, carbs:3.4,  fat:3.2,  unit:'100ml', emoji:'🥛', bg:'#2E353A' },
  { id:31, name:'酸奶',       cat:'奶制品', cal:72,  protein:2.5, carbs:9.3,  fat:2.7,  unit:'100g',  emoji:'🥛', bg:'#2E353A' },
  { id:32, name:'奶酪',       cat:'奶制品', cal:328, protein:20.0,carbs:2.5,  fat:25.0, unit:'100g',  emoji:'🧀', bg:'#3A3830' },
  // 零食饮品
  { id:33, name:'薯片',       cat:'零食', cal:547, protein:5.3, carbs:49.7, fat:36.2, unit:'100g',  emoji:'🍟', bg:'#3A3530' },
  { id:34, name:'巧克力',     cat:'零食', cal:544, protein:5.3, carbs:56.0, fat:33.0, unit:'100g',  emoji:'🍫', bg:'#3A2E2E' },
  { id:35, name:'可乐',       cat:'零食', cal:43,  protein:0,   carbs:10.6, fat:0,    unit:'100ml', emoji:'🥤', bg:'#2E2E2E' },
  { id:36, name:'奶茶',       cat:'零食', cal:52,  protein:0.8, carbs:9.8,  fat:1.2,  unit:'100ml', emoji:'🧋', bg:'#3A3530' },
  { id:37, name:'饼干',       cat:'零食', cal:433, protein:7.5, carbs:71.7, fat:14.0, unit:'100g',  emoji:'🍪', bg:'#3A3830' },
  { id:38, name:'冰淇淋',     cat:'零食', cal:127, protein:2.4, carbs:17.3, fat:5.3,  unit:'100g',  emoji:'🍦', bg:'#2E353A' },
  { id:39, name:'咖啡(黑)',   cat:'零食', cal:2,   protein:0.1, carbs:0.3,  fat:0,    unit:'100ml', emoji:'☕', bg:'#2E2E2E' },
  { id:40, name:'坚果混合',   cat:'零食', cal:607, protein:18.0,carbs:17.3, fat:51.0, unit:'100g',  emoji:'🥜', bg:'#3A3530' },
];

const categories = ['全部','主食','肉蛋','蔬菜','水果','奶制品','零食'];

// ==================== 状态管理 ====================
let dailyGoal = parseInt(localStorage.getItem('cal_goal')) || 2000;
let records = JSON.parse(localStorage.getItem('cal_records') || '[]');
let currentCat = '全部';
let servingFood = null;
let servingCount = 1;

// ==================== 初始化 ====================
function init() {
  // 清除非今日记录
  const today = getToday();
  records = records.filter(r => r.date === today);
  saveRecords();

  updateDate();
  updateProgress();
  renderRecords();
  buildCatTabs();
  renderFoodList();
  document.getElementById('goalBtnText').textContent = dailyGoal + ' kcal';
}

function getToday() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function updateDate() {
  const d = new Date();
  const weekDays = ['日','一','二','三','四','五','六'];
  document.getElementById('dateText').textContent =
    (d.getMonth()+1) + '月' + d.getDate() + '日 周' + weekDays[d.getDay()];
}

// ==================== 进度更新 ====================
function updateProgress() {
  const totalCal = records.reduce((s,r) => s + r.cal, 0);
  const totalProtein = records.reduce((s,r) => s + r.protein, 0);
  const totalCarbs = records.reduce((s,r) => s + r.carbs, 0);
  const totalFat = records.reduce((s,r) => s + r.fat, 0);

  // 进度环
  const pct = Math.min(totalCal / dailyGoal, 1.5);
  const circumference = 2 * Math.PI * 80; // 502.65
  const offset = circumference * (1 - Math.min(pct, 1));
  const ringFill = document.getElementById('ringFill');
  ringFill.style.strokeDashoffset = offset;

  // 超标样式
  if (totalCal > dailyGoal) {
    ringFill.classList.add('over');
  } else {
    ringFill.classList.remove('over');
  }

  document.getElementById('ringCal').textContent = Math.round(totalCal);

  const remain = dailyGoal - totalCal;
  const ringLabel = document.getElementById('ringLabel');
  if (remain > 0) {
    ringLabel.innerHTML = '剩余 ' + remain;
  } else {
    ringLabel.innerHTML = '超出 <span class="over-badge">+' + Math.abs(remain) + '</span>';
  }

  // 宏量素
  document.getElementById('macroProtein').textContent = Math.round(totalProtein) + 'g';
  document.getElementById('macroCarbs').textContent = Math.round(totalCarbs) + 'g';
  document.getElementById('macroFat').textContent = Math.round(totalFat) + 'g';

  // 宏量素目标比例（基于总热量的估算目标）
  const proteinGoal = dailyGoal * 0.3 / 4; // 30%热量来自蛋白质
  const carbsGoal = dailyGoal * 0.45 / 4;  // 45%热量来自碳水
  const fatGoal = dailyGoal * 0.25 / 9;    // 25%热量来自脂肪

  document.getElementById('barProtein').style.width = Math.min(totalProtein / proteinGoal * 100, 100) + '%';
  document.getElementById('barCarbs').style.width = Math.min(totalCarbs / carbsGoal * 100, 100) + '%';
  document.getElementById('barFat').style.width = Math.min(totalFat / fatGoal * 100, 100) + '%';
}

// ==================== 记录渲染 ====================
function renderRecords() {
  const container = document.getElementById('recordList');
  if (records.length === 0) {
    container.innerHTML = `
      <div class="record-empty">
        <span class="material-symbols-rounded">restaurant</span>
        还没有记录，点击上方添加食物
      </div>`;
    return;
  }

  container.innerHTML = '<div class="record-list">' + records.map((r, i) => `
    <div class="record-item">
      <div class="record-icon" style="background:${r.bg}">${r.emoji}</div>
      <div class="record-info">
        <div class="record-name">${r.name}${r.count > 1 ? ' x' + r.count : ''}</div>
        <div class="record-detail">${r.unit}份</div>
      </div>
      <div class="record-cal">${Math.round(r.cal)}<span> kcal</span></div>
      <button class="record-del" onclick="deleteRecord(${i})" aria-label="删除">
        <span class="material-symbols-rounded">delete</span>
      </button>
    </div>
  `).join('') + '</div>';
}

function deleteRecord(index) {
  records.splice(index, 1);
  saveRecords();
  updateProgress();
  renderRecords();
  showToast('已删除记录', 'info');
}

function saveRecords() {
  localStorage.setItem('cal_records', JSON.stringify(records));
}

// ==================== 食物库弹窗 ====================
function openFoodModal() {
  document.getElementById('foodOverlay').classList.add('active');
  document.getElementById('foodSheet').classList.add('active');
  document.getElementById('foodSearch').value = '';
  currentCat = '全部';
  buildCatTabs();
  renderFoodList();
  // 延迟聚焦，避免键盘弹起
  setTimeout(() => { document.getElementById('foodSearch').focus(); }, 400);
}

function closeFoodModal() {
  document.getElementById('foodOverlay').classList.remove('active');
  document.getElementById('foodSheet').classList.remove('active');
}

function buildCatTabs() {
  const container = document.getElementById('catTabs');
  container.innerHTML = categories.map(c => `
    <button class="cat-tab ${c === currentCat ? 'active' : ''}" onclick="selectCat('${c}')">${c}</button>
  `).join('');
}

function selectCat(cat) {
  currentCat = cat;
  buildCatTabs();
  renderFoodList();
}

function filterFoods() {
  renderFoodList();
}

function renderFoodList() {
  const search = document.getElementById('foodSearch').value.trim().toLowerCase();
  let filtered = foodDB;

  if (currentCat !== '全部') {
    filtered = filtered.filter(f => f.cat === currentCat);
  }
  if (search) {
    filtered = filtered.filter(f => f.name.toLowerCase().includes(search));
  }

  const container = document.getElementById('foodList');
  if (filtered.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:40px 0;color:var(--muted);font-size:14px;">没有找到匹配的食物</div>';
    return;
  }

  container.innerHTML = filtered.map(f => `
    <div class="food-item" onclick="openServingModal(${f.id})">
      <div class="food-emoji" style="background:${f.bg}">${f.emoji}</div>
      <div class="food-info">
        <div class="food-name">${f.name}</div>
        <div class="food-meta">${f.unit} · 蛋白${f.protein}g 碳水${f.carbs}g 脂肪${f.fat}g</div>
      </div>
      <div class="food-kcal">${f.cal}<span> kcal</span></div>
      <div class="food-add-icon"><span class="material-symbols-rounded">add</span></div>
    </div>
  `).join('');
}

// ==================== 份额选择弹窗 ====================
function openServingModal(foodId) {
  servingFood = foodDB.find(f => f.id === foodId);
  servingCount = 1;
  renderServingModal();
  document.getElementById('servingOverlay').classList.add('active');
  document.getElementById('servingSheet').classList.add('active');
}

function closeServingModal() {
  document.getElementById('servingOverlay').classList.remove('active');
  document.getElementById('servingSheet').classList.remove('active');
  servingFood = null;
}

function renderServingModal() {
  if (!servingFood) return;
  const f = servingFood;
  const totalCal = Math.round(f.cal * servingCount);
  document.getElementById('servingContent').innerHTML = `
    <div class="serving-emoji">${f.emoji}</div>
    <div class="serving-name">${f.name}</div>
    <div class="serving-base">每${f.unit} ${f.cal} kcal</div>
    <div class="serving-counter">
      <button class="serving-btn" onclick="changeServing(-1)">−</button>
      <div class="serving-num">${servingCount}</div>
      <button class="serving-btn" onclick="changeServing(1)">+</button>
    </div>
    <div class="serving-kcal">${totalCal} <span>kcal</span></div>
    <button class="serving-confirm" onclick="confirmAdd()">确认添加</button>
  `;
}

function changeServing(delta) {
  servingCount = Math.max(1, Math.min(20, servingCount + delta));
  renderServingModal();
}

function confirmAdd() {
  if (!servingFood) return;
  const f = servingFood;
  const record = {
    id: Date.now(),
    foodId: f.id,
    name: f.name,
    emoji: f.emoji,
    bg: f.bg,
    cal: f.cal * servingCount,
    protein: f.protein * servingCount,
    carbs: f.carbs * servingCount,
    fat: f.fat * servingCount,
    count: servingCount,
    unit: f.unit,
    date: getToday()
  };
  records.push(record);
  saveRecords();
  updateProgress();
  renderRecords();
  closeServingModal();
  closeFoodModal();
  showToast(f.name + ' x' + servingCount + ' 已添加', 'success');

  // 检查是否超标
  const totalCal = records.reduce((s,r) => s + r.cal, 0);
  if (totalCal > dailyGoal && totalCal - record.cal <= dailyGoal) {
    setTimeout(() => showToast('今日热量已超过目标!', 'warn'), 600);
  }
}

// ==================== 目标设置 ====================
function openGoalModal() {
  document.getElementById('goalInput').value = dailyGoal;
  document.getElementById('goalOverlay').classList.add('active');
  document.getElementById('goalSheet').classList.add('active');
}

function closeGoalModal() {
  document.getElementById('goalOverlay').classList.remove('active');
  document.getElementById('goalSheet').classList.remove('active');
}

function setQuickGoal(val) {
  document.getElementById('goalInput').value = val;
}

function saveGoal() {
  const val = parseInt(document.getElementById('goalInput').value);
  if (isNaN(val) || val < 800 || val > 5000) {
    showToast('请输入 800-5000 之间的数值', 'warn');
    return;
  }
  dailyGoal = val;
  localStorage.setItem('cal_goal', dailyGoal);
  document.getElementById('goalBtnText').textContent = dailyGoal + ' kcal';
  updateProgress();
  closeGoalModal();
  showToast('目标已更新为 ' + dailyGoal + ' kcal', 'success');
}

// ==================== Toast ====================
function showToast(msg, type) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 2100);
}

// ==================== 启动 ====================
init();
</script>
