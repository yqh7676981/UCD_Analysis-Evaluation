<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>像素画板</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --bg-secondary: #12121a;
            --fg: #e8e8f0;
            --muted: #6b6b80;
            --accent: #00d4aa;
            --accent-glow: rgba(0, 212, 170, 0.3);
            --card: #1a1a24;
            --border: #2a2a38;
            --grid-line: #252530;
            --eraser: #ff6b6b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--fg);
            display: flex;
            flex-direction: column;
            min-height: 100dvh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: radial-gradient(ellipse at 50% 0%, rgba(0, 212, 170, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
            padding-bottom: max(16px, env(safe-area-inset-bottom));
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        h1 {
            font-family: 'Space Mono', monospace;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--fg);
            text-transform: uppercase;
        }

        h1 span {
            color: var(--accent);
        }

        .canvas-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            min-height: 0;
        }

        .canvas-container {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 8px;
            border: 2px solid var(--border);
            box-shadow: 
                0 4px 24px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
            position: relative;
            max-width: calc(100vw - 48px);
            max-height: calc(100% - 8px);
            aspect-ratio: 1;
        }

        .pixel-grid {
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            grid-template-rows: repeat(16, 1fr);
            gap: 1px;
            background: var(--grid-line);
            border-radius: 6px;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        .pixel {
            background: var(--card);
            cursor: pointer;
            transition: background-color 0.05s ease;
            touch-action: none;
            position: relative;
        }

        .pixel:hover {
            filter: brightness(1.2);
        }

        .pixel.painted {
            box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.2);
        }

        .toolbar {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 12px;
            background: var(--card);
            border-radius: 16px;
            border: 1px solid var(--border);
            margin-top: 12px;
        }

        .color-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            min-width: 48px;
        }

        .color-picker-wrapper {
            position: relative;
            width: 44px;
            height: 44px;
            flex-shrink: 0;
        }

        .color-picker {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: transparent;
            padding: 0;
        }

        .color-picker::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-picker::-webkit-color-swatch {
            border: 3px solid var(--border);
            border-radius: 10px;
        }

        .color-presets {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            flex: 1;
        }

        .preset-color {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.15s ease;
            flex-shrink: 0;
        }

        .preset-color.active {
            border-color: var(--fg);
            transform: scale(1.1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .preset-color:active {
            transform: scale(0.95);
        }

        .tools-section {
            display: flex;
            gap: 8px;
        }

        .tool-btn {
            flex: 1;
            height: 48px;
            border: 2px solid var(--border);
            background: var(--bg-secondary);
            color: var(--fg);
            border-radius: 12px;
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.15s ease;
        }

        .tool-btn:active {
            transform: scale(0.97);
        }

        .tool-btn.active {
            border-color: var(--accent);
            background: rgba(0, 212, 170, 0.15);
            color: var(--accent);
        }

        .tool-btn.eraser-btn.active {
            border-color: var(--eraser);
            background: rgba(255, 107, 107, 0.15);
            color: var(--eraser);
        }

        .tool-btn.clear-btn {
            background: rgba(255, 107, 107, 0.1);
            border-color: rgba(255, 107, 107, 0.3);
            color: var(--eraser);
        }

        .tool-btn.preview-btn {
            background: rgba(0, 212, 170, 0.1);
            border-color: rgba(0, 212, 170, 0.3);
            color: var(--accent);
        }

        .tool-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Preview Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 1; /* fixed: was 0 */
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 24px;
            backdrop-filter: blur(8px);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--card);
            border-radius: 20px;
            padding: 24px;
            max-width: 320px;
            width: 100%;
            text-align: center;
            border: 1px solid var(--border);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal h2 {
            font-family: 'Space Mono', monospace;
            font-size: 16px;
            margin-bottom: 20px;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .preview-canvas-wrapper {
            background: var(--bg);
            border-radius: 12px;
            padding: 12px;
            border: 2px solid var(--border);
            margin-bottom: 20px;
        }

        #previewCanvas {
            display: block;
            width: 100%;
            aspect-ratio: 1;
            image-rendering: pixelated;
            border-radius: 8px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            height: 44px;
            border: none;
            border-radius: 10px;
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .modal-btn.close-btn {
            background: var(--bg-secondary);
            color: var(--fg);
            border: 1px solid var(--border);
        }

        .modal-btn.download-btn {
            background: var(--accent);
            color: var(--bg);
        }

        .modal-btn:active {
            transform: scale(0.97);
        }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container > * {
            animation: fadeIn 0.5s ease backwards;
        }

        header { animation-delay: 0.1s; }
        .canvas-wrapper { animation-delay: 0.2s; }
        .toolbar { animation-delay: 0.3s; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
<style id="screenshot-fix">
/* 仅处理滚动懒加载：让 opacity:0 的元素可见，但排除 toast/弹窗 */
.reveal:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.fade-in:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.fade:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.lazy:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.stagger-item:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.animate:not(.toast):not([class*="modal"]):not([class*="overlay"]) {
  opacity: 1 !important;
  visibility: visible !important;
}
/* 特别确保弹窗/侧边栏/Toast 保持隐藏（它们通过其他类控制显示） */
.modal-overlay:not(.show):not(.active),
.confirm-overlay:not(.show):not(.active),
[class*="modal"]:not(.show):not(.active):not([class*="stagger"]),
[class*="overlay"]:not(.show):not(.active):not([class*="scroll"]),
.toast:not(.show),
[id*="toast"]:not(.show):not(.active),
[id*="cart"],
[id*="sidebar"] {
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
}
/* 排除 toast 类，避免强制显示 */
.reveal:not(.toast), .fade-in:not(.toast), .fade:not(.toast), .lazy:not(.toast), .stagger-item:not(.toast), .animate:not(.toast) {
  opacity: 1 !important;
  visibility: visible !important;
}
/* 强制显示主要内容区域（section 下的直接子元素），但排除移动菜单 */
section > div:not(.mobile-menu):not([id*="mobile-menu"]):not([id*="menu"]) {
  opacity: 1 !important;
}
</style></head>
<body>
    <div class="container">
        <header>
            <h1>Pixel <span>Art</span></h1>
        </header>

        <div class="canvas-wrapper">
            <div class="canvas-container">
                <div class="pixel-grid" id="pixelGrid"></div>
            </div>
        </div>

        <div class="toolbar">
            <div class="color-section">
                <span class="section-label">颜色</span>
                <div class="color-picker-wrapper">
                    <input type="color" class="color-picker" id="colorPicker" value="#00d4aa">
                </div>
                <div class="color-presets" id="colorPresets"></div>
            </div>
            <div class="tools-section">
                <button class="tool-btn active" id="brushBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 19l7-7 3 3-7 7-3-3z"/>
                        <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
                        <path d="M2 2l7.586 7.586"/>
                        <circle cx="11" cy="11" r="2"/>
                    </svg>
                    画笔
                </button>
                <button class="tool-btn eraser-btn" id="eraserBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 20H7L3 16c-.6-.6-.6-1.5 0-2.1l10-10c.6-.6 1.5-.6 2.1 0l6.9 6.9c.6.6.6 1.5 0 2.1L15 20"/>
                        <path d="M6 11l8 8"/>
                    </svg>
                    橡皮
                </button>
                <button class="tool-btn clear-btn" id="clearBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 6h18"/>
                        <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                        <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                    </svg>
                    清空
                </button>
                <button class="tool-btn preview-btn" id="previewBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    预览
                </button>
            </div>
        </div>
    </div>

    <!-- Preview Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2>预览作品</h2>
            <div class="preview-canvas-wrapper">
                <canvas id="previewCanvas" width="16" height="16"></canvas>
            </div>
            <div class="modal-actions">
                <button class="modal-btn close-btn" id="closeModalBtn">关闭</button>
                <button class="modal-btn download-btn" id="downloadBtn">下载</button>
            </div>
        </div>
    </div>

    <script>
        // Initialize variables first
        const GRID_SIZE = 16;
        const DEFAULT_COLOR = '#1a1a24';
        
        const presetColors = [
            '#ff6b6b', '#ffa94d', '#ffd43b', '#69db7c',
            '#00d4aa', '#4dabf7', '#7950f2', '#f06595',
            '#ffffff', '#adb5bd', '#495057', '#212529'
        ];

        // State
        let currentColor = '#00d4aa';
        let isErasing = false;
        let isDrawing = false;
        let pixelData = new Array(GRID_SIZE * GRID_SIZE).fill(DEFAULT_COLOR);

        // DOM Elements
        const pixelGrid = document.getElementById('pixelGrid');
        const colorPicker = document.getElementById('colorPicker');
        const colorPresets = document.getElementById('colorPresets');
        const brushBtn = document.getElementById('brushBtn');
        const eraserBtn = document.getElementById('eraserBtn');
        const clearBtn = document.getElementById('clearBtn');
        const previewBtn = document.getElementById('previewBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const previewCanvas = document.getElementById('previewCanvas');

        // Create pixel grid
        function createGrid() {
            pixelGrid.innerHTML = '';
            for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
                const pixel = document.createElement('div');
                pixel.className = 'pixel';
                pixel.dataset.index = i;
                if (pixelData[i] !== DEFAULT_COLOR) {
                    pixel.style.backgroundColor = pixelData[i];
                    pixel.classList.add('painted');
                }
                pixelGrid.appendChild(pixel);
            }
        }

        // Create color presets
        function createColorPresets() {
            presetColors.forEach(color => {
                const btn = document.createElement('button');
                btn.className = 'preset-color';
                btn.style.backgroundColor = color;
                btn.dataset.color = color;
                if (color === currentColor) btn.classList.add('active');
                colorPresets.appendChild(btn);
            });
        }

        // Paint pixel
        function paintPixel(index) {
            const pixel = pixelGrid.children[index];
            if (!pixel) return;
            
            const color = isErasing ? DEFAULT_COLOR : currentColor;
            pixelData[index] = color;
            pixel.style.backgroundColor = color;
            
            if (color !== DEFAULT_COLOR) {
                pixel.classList.add('painted');
            } else {
                pixel.classList.remove('painted');
            }
        }

        // Handle drawing
        function handleDraw(e) {
            if (!isDrawing) return;
            
            const touch = e.touches ? e.touches[0] : e;
            const element = document.elementFromPoint(touch.clientX, touch.clientY);
            
            if (element && element.classList.contains('pixel')) {
                const index = parseInt(element.dataset.index);
                if (!isNaN(index)) {
                    paintPixel(index);
                }
            }
        }

        // Event Listeners
        pixelGrid.addEventListener('mousedown', (e) => {
            if (e.target.classList.contains('pixel')) {
                isDrawing = true;
                const index = parseInt(e.target.dataset.index);
                if (!isNaN(index)) paintPixel(index);
            }
        });

        pixelGrid.addEventListener('touchstart', (e) => {
            isDrawing = true;
            handleDraw(e);
        }, { passive: true });

        document.addEventListener('mousemove', handleDraw);
        document.addEventListener('touchmove', handleDraw, { passive: true });

        document.addEventListener('mouseup', () => isDrawing = false);
        document.addEventListener('touchend', () => isDrawing = false);

        // Color picker
        colorPicker.addEventListener('input', (e) => {
            currentColor = e.target.value;
            isErasing = false;
            updateToolButtons();
            updatePresetSelection();
        });

        // Preset colors
        colorPresets.addEventListener('click', (e) => {
            if (e.target.classList.contains('preset-color')) {
                currentColor = e.target.dataset.color;
                colorPicker.value = currentColor;
                isErasing = false;
                updateToolButtons();
                updatePresetSelection();
            }
        });

        // Tool buttons
        brushBtn.addEventListener('click', () => {
            isErasing = false;
            updateToolButtons();
        });

        eraserBtn.addEventListener('click', () => {
            isErasing = true;
            updateToolButtons();
        });

        clearBtn.addEventListener('click', () => {
            if (confirm('确定要清空画板吗？')) {
                pixelData = new Array(GRID_SIZE * GRID_SIZE).fill(DEFAULT_COLOR);
                createGrid();
            }
        });

        // Preview
        previewBtn.addEventListener('click', () => {
            const ctx = previewCanvas.getContext('2d');
            const scale = 16;
            previewCanvas.width = GRID_SIZE * scale;
            previewCanvas.height = GRID_SIZE * scale;
            
            for (let i = 0; i < pixelData.length; i++) {
                const x = (i % GRID_SIZE) * scale;
                const y = Math.floor(i / GRID_SIZE) * scale;
                ctx.fillStyle = pixelData[i];
                ctx.fillRect(x, y, scale, scale);
            }
            
            modalOverlay.classList.add('active');
        });

        closeModalBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
        });

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
            }
        });

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'pixel-art.png';
            link.href = previewCanvas.toDataURL('image/png');
            link.click();
        });

        // Helper functions
        function updateToolButtons() {
            brushBtn.classList.toggle('active', !isErasing);
            eraserBtn.classList.toggle('active', isErasing);
        }

        function updatePresetSelection() {
            document.querySelectorAll('.preset-color').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.color === currentColor);
            });
        }

        // Initialize
        createGrid();
        createColorPresets();
    </script>
</body>
</html>
