<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>雅思核心词汇打卡</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f1114;
            --bg-secondary: #181b20;
            --card: #1e2228;
            --card-hover: #252a32;
            --fg: #e8e6e1;
            --fg-muted: #8a8d93;
            --accent: #e8a838;
            --accent-glow: rgba(232, 168, 56, 0.25);
            --success: #4ade80;
            --success-glow: rgba(74, 222, 128, 0.2);
            --danger: #f87171;
            --border: rgba(255,255,255,0.06);
            --radius: 16px;
            --radius-sm: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景氛围层 */
        body::before {
            content: '';
            position: fixed;
            top: -30%; left: -20%;
            width: 80vw; height: 80vw;
            background: radial-gradient(circle, rgba(232,168,56,0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -20%; right: -20%;
            width: 70vw; height: 70vw;
            background: radial-gradient(circle, rgba(74,222,128,0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .app {
            position: relative;
            z-index: 1;
            max-width: 420px;
            margin: 0 auto;
            padding: 0 20px 100px;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* 顶部栏 */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0 12px;
            position: sticky;
            top: 0;
            z-index: 10;
            background: linear-gradient(to bottom, var(--bg) 60%, transparent);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .top-bar h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--fg);
            letter-spacing: -0.3px;
        }
        .top-bar h1 span { color: var(--accent); }
        .streak-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            background: var(--card);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            color: var(--accent);
        }
        .streak-badge i { font-size: 12px; }

        /* 进度区域 */
        .progress-section {
            margin: 8px 0 20px;
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .progress-info .day-label {
            font-size: 13px;
            color: var(--fg-muted);
            font-weight: 400;
        }
        .progress-info .count-label {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: var(--fg);
        }
        .progress-info .count-label em {
            color: var(--accent);
            font-style: normal;
        }
        .progress-track {
            width: 100%;
            height: 6px;
            background: var(--card);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #f0c060);
            border-radius: 3px;
            transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* 卡片容器 */
        .card-container {
            perspective: 1200px;
            margin: 0 0 24px;
            height: 380px;
        }
        .card-flipper {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
        }
        .card-flipper.flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: var(--radius);
            overflow: hidden;
        }

        /* 卡片正面 */
        .card-front {
            background: var(--card);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            position: relative;
        }
        .card-front::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), #f0c060, var(--accent));
        }
        .card-front .word-number {
            position: absolute;
            top: 16px; left: 20px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 12px;
            color: var(--fg-muted);
            background: rgba(255,255,255,0.05);
            padding: 3px 10px;
            border-radius: 10px;
        }
        .card-front .phonetic-tag {
            position: absolute;
            top: 16px; right: 20px;
            font-size: 11px;
            color: var(--accent);
            background: var(--accent-glow);
            padding: 3px 10px;
            border-radius: 10px;
        }
        .card-front .word-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 36px;
            font-weight: 700;
            color: var(--fg);
            text-align: center;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        .card-front .phonetic {
            font-size: 16px;
            color: var(--fg-muted);
            margin-bottom: 24px;
            font-weight: 300;
        }
        .card-front .pos-tag {
            display: inline-block;
            font-size: 13px;
            color: var(--accent);
            background: var(--accent-glow);
            padding: 4px 14px;
            border-radius: 12px;
            margin-bottom: 28px;
            font-weight: 500;
        }
        .card-front .tap-hint {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--fg-muted);
            opacity: 0.6;
        }
        .card-front .tap-hint i {
            font-size: 10px;
            animation: tapPulse 2s ease-in-out infinite;
        }

        /* 卡片背面 */
        .card-back {
            background: var(--card);
            border: 1px solid var(--border);
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            padding: 28px 24px;
            position: relative;
            overflow-y: auto;
        }
        .card-back::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--success), #86efac, var(--success));
        }
        .card-back .back-word {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--fg);
            margin-bottom: 4px;
        }
        .card-back .back-phonetic {
            font-size: 13px;
            color: var(--fg-muted);
            margin-bottom: 16px;
        }
        .card-back .meaning-block {
            background: rgba(255,255,255,0.03);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            margin-bottom: 14px;
            border-left: 3px solid var(--accent);
        }
        .card-back .meaning-label {
            font-size: 11px;
            color: var(--fg-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .card-back .meaning-text {
            font-size: 17px;
            color: var(--fg);
            font-weight: 500;
            line-height: 1.5;
        }
        .card-back .example-block {
            background: rgba(255,255,255,0.03);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            border-left: 3px solid var(--success);
        }
        .card-back .example-label {
            font-size: 11px;
            color: var(--fg-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .card-back .example-en {
            font-size: 14px;
            color: var(--fg);
            line-height: 1.6;
            font-style: italic;
            margin-bottom: 4px;
        }
        .card-back .example-en .highlight {
            color: var(--accent);
            font-style: italic;
            font-weight: 600;
        }
        .card-back .example-zh {
            font-size: 13px;
            color: var(--fg-muted);
            line-height: 1.5;
        }

        /* 掌握标记 */
        .mastered-overlay {
            position: absolute;
            top: 16px; right: 20px;
            z-index: 5;
        }
        .mastered-icon {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: var(--success);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f1114;
            font-size: 14px;
            opacity: 1; /* fixed: was 0 */
            transform: scale(0);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .mastered-icon.show {
            opacity: 1;
            transform: scale(1);
        }

        /* 操作按钮区域 */
        .actions {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .action-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s ease;
            font-family: 'Noto Sans SC', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        .action-btn:active { transform: scale(0.96); }

        .btn-forget {
            background: rgba(248,113,113,0.12);
            color: var(--danger);
            border: 1px solid rgba(248,113,113,0.2);
        }
        .btn-forget:hover { background: rgba(248,113,113,0.2); }

        .btn-know {
            background: rgba(74,222,128,0.12);
            color: var(--success);
            border: 1px solid rgba(74,222,128,0.2);
        }
        .btn-know:hover { background: rgba(74,222,128,0.2); }

        /* 导航按钮 */
        .nav-row {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .nav-btn {
            flex: 1;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--card);
            color: var(--fg);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
            font-family: 'Noto Sans SC', sans-serif;
        }
        .nav-btn:active { background: var(--card-hover); transform: scale(0.97); }
        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        /* 词表概览 */
        .overview-section {
            margin-top: 8px;
        }
        .overview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        .overview-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--fg);
        }
        .overview-stats {
            font-size: 12px;
            color: var(--fg-muted);
        }
        .overview-stats em {
            color: var(--success);
            font-style: normal;
            font-weight: 600;
        }
        .word-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }
        .word-dot {
            aspect-ratio: 1;
            border-radius: 10px;
            background: var(--card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px;
            font-weight: 600;
            color: var(--fg-muted);
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .word-dot:active { transform: scale(0.92); }
        .word-dot.mastered {
            background: rgba(74,222,128,0.15);
            border-color: rgba(74,222,128,0.3);
            color: var(--success);
        }
        .word-dot.current {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        /* 完成弹窗 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            opacity: 1; /* fixed: was 0 */
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px 28px;
            text-align: center;
            max-width: 320px;
            width: 100%;
            transform: scale(0.9) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.show .modal-content {
            transform: scale(1) translateY(0);
        }
        .modal-icon {
            width: 64px; height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #f0c060);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
            color: #0f1114;
        }
        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--fg);
        }
        .modal-desc {
            font-size: 14px;
            color: var(--fg-muted);
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .modal-stats {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 24px;
        }
        .modal-stat {
            text-align: center;
        }
        .modal-stat-val {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 700;
        }
        .modal-stat-val.green { color: var(--success); }
        .modal-stat-val.amber { color: var(--accent); }
        .modal-stat-val.red { color: var(--danger); }
        .modal-stat-label {
            font-size: 11px;
            color: var(--fg-muted);
            margin-top: 2px;
        }
        .modal-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--accent), #d49530);
            color: #0f1114;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Noto Sans SC', sans-serif;
            transition: all 0.2s ease;
        }
        .modal-btn:active { transform: scale(0.97); }

        /* Toast */
        .toast {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: var(--card);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 13px;
            color: var(--fg);
            z-index: 200;
            opacity: 1; /* fixed: was 0 */
            transition: all 0.3s ease;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 动画 */
        @keyframes tapPulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        @keyframes cardEntry {
            from { opacity: 0; transform: translateX(40px) scale(0.95); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }
        .card-entry {
            animation: cardEntry 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes celebratePop {
            0% { transform: scale(0); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* 滚动条 */
        .card-back::-webkit-scrollbar { width: 3px; }
        .card-back::-webkit-scrollbar-track { background: transparent; }
        .card-back::-webkit-scrollbar-thumb { background: var(--fg-muted); border-radius: 3px; }

        /* 减少动画偏好 */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* 发音按钮 */
        .speak-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 40px; height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 16px;
        }
        .speak-btn:active {
            background: var(--accent-glow);
            transform: scale(0.92);
        }

        /* 底部安全区 */
        .safe-bottom {
            height: env(safe-area-inset-bottom, 0);
        }
    </style>
<style id="screenshot-fix">
/* 仅处理滚动懒加载：让 opacity:0 的元素可见，但排除 toast/弹窗 */
.reveal:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.fade-in:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.fade:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.lazy:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.stagger-item:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.animate:not(.toast):not([class*="modal"]):not([class*="overlay"]) {
  opacity: 1 !important;
  visibility: visible !important;
}
/* 特别确保弹窗/侧边栏/Toast 保持隐藏（它们通过其他类控制显示） */
.modal-overlay:not(.show):not(.active),
.confirm-overlay:not(.show):not(.active),
[class*="modal"]:not(.show):not(.active):not([class*="stagger"]),
[class*="overlay"]:not(.show):not(.active):not([class*="scroll"]),
.toast:not(.show),
[id*="toast"]:not(.show):not(.active),
[id*="cart"],
[id*="sidebar"] {
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
}
/* 排除 toast 类，避免强制显示 */
.reveal:not(.toast), .fade-in:not(.toast), .fade:not(.toast), .lazy:not(.toast), .stagger-item:not(.toast), .animate:not(.toast) {
  opacity: 1 !important;
  visibility: visible !important;
}
/* 强制显示主要内容区域（section 下的直接子元素），但排除移动菜单 */
section > div:not(.mobile-menu):not([id*="mobile-menu"]):not([id*="menu"]) {
  opacity: 1 !important;
}
</style></head>
<body>
    <div class="app" id="app">
        <!-- 顶部栏 -->
        <header class="top-bar">
            <h1>IELTS<span>Vocab</span></h1>
            <div class="streak-badge" id="streakBadge">
                <i class="fa-solid fa-fire"></i>
                <span id="streakCount">0</span> 天连续
            </div>
        </header>

        <!-- 进度区 -->
        <section class="progress-section">
            <div class="progress-info">
                <span class="day-label" id="dayLabel">第 1 天</span>
                <span class="count-label">已掌握 <em id="masteredCount">0</em> / 20</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
        </section>

        <!-- 卡片 -->
        <section class="card-container" id="cardContainer">
            <div class="card-flipper" id="cardFlipper" onclick="flipCard()">
                <!-- 正面 -->
                <div class="card-face card-front" id="cardFront">
                    <span class="word-number" id="wordNumber">1 / 20</span>
                    <span class="phonetic-tag" id="posTag">noun</span>
                    <button class="speak-btn" onclick="event.stopPropagation(); speakWord()" aria-label="朗读单词">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                    <div class="word-text" id="wordText">Loading</div>
                    <div class="phonetic" id="phoneticText">/ˈləʊdɪŋ/</div>
                    <div class="tap-hint">
                        <i class="fa-solid fa-hand-pointer"></i>
                        轻触翻转查看释义
                    </div>
                </div>
                <!-- 背面 -->
                <div class="card-face card-back" id="cardBack">
                    <div class="mastered-overlay">
                        <div class="mastered-icon" id="masteredIcon"><i class="fa-solid fa-check"></i></div>
                    </div>
                    <div class="back-word" id="backWord">Loading</div>
                    <div class="back-phonetic" id="backPhonetic">/ˈləʊdɪŋ/</div>
                    <div class="meaning-block">
                        <div class="meaning-label">释义</div>
                        <div class="meaning-text" id="meaningText">加载中</div>
                    </div>
                    <div class="example-block">
                        <div class="example-label">例句</div>
                        <div class="example-en" id="exampleEn">Loading...</div>
                        <div class="example-zh" id="exampleZh">加载中</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 操作按钮 -->
        <div class="actions">
            <button class="action-btn btn-forget" onclick="markWord(false)" aria-label="不认识">
                <i class="fa-solid fa-xmark"></i> 不认识
            </button>

            { word: "surreptitious", phonetic: "/ˌsʌrəpˈtɪʃəs/", pos: "adj.", meaning: "偷偷的，暗中的", exampleEn: "He cast a <b>surreptitious</b> glance at his neighbour's test paper.", exampleZh: "他偷偷地看了一眼邻居的试卷。" },
            { word: "profound", phonetic: "/prəˈfaʊnd/", pos: "adj.", meaning: "深刻的，意义深远的", exampleEn: "The invention of the printing press had a <b>profound</b> impact on civilisation.", exampleZh: "印刷术的发明对文明产生了深远的影响。" },
        ];

        // ===== 状态管理 =====
        const WORDS_PER_DAY = 20;
        let currentDay = 1;
        let currentIndex = 0;
        let todayWords = [];
        let mastered = {}; // wordIndex -> true/false
        let isFlipped = false;
        let completedToday = false;

        // 从 localStorage 恢复状态
        function loadState() {
            try {
                const saved = JSON.parse(localStorage.getItem('ielts_vocab_state') || '{}');
                currentDay = saved.currentDay || 1;
                mastered = saved.mastered || {};
                completedToday = saved.completedToday || false;
                // 检查日期是否变化
                const savedDate = saved.date;
                const today = new Date().toDateString();
                if (savedDate !== today) {
                    // 新的一天
                    const lastDate = savedDate ? new Date(savedDate) : null;
                    if (lastDate) {
                        const diff = Math.floor((new Date(today) - lastDate) / (1000 * 60 * 60 * 24));
                        if (diff === 1) {
                            currentDay = (saved.currentDay || 0) + 1;
                        } else if (diff > 1) {
                            currentDay = 1; // 断了连续打卡
                        }
                    } else {
                        currentDay = 1;
                    }
                    completedToday = false;
                    // 新一天不重置 mastered，因为 mastered 是按词汇索引的
                }
            } catch (e) {
                currentDay = 1;
                mastered = {};
                completedToday = false;
            }
        }

        function saveState() {
            localStorage.setItem('ielts_vocab_state', JSON.stringify({
                currentDay,
                mastered,
                completedToday,
                date: new Date().toDateString(),
                streak: currentDay
            }));
        }

        // 根据天数选择今日单词（简单取模循环，保证每天不同）
        function getTodayWords() {
            const startIdx = ((currentDay - 1) * WORDS_PER_DAY) % allWords.length;
            const words = [];
            for (let i = 0; i < WORDS_PER_DAY; i++) {
                const idx = (startIdx + i) % allWords.length;
                words.push({ ...allWords[idx], globalIdx: idx });
            }
            return words;
        }

        // ===== 渲染 =====
        function render() {
            todayWords = getTodayWords();
            
            // 顶部信息
            document.getElementById('dayLabel').textContent = `第 ${currentDay} 天`;
            document.getElementById('streakCount').textContent = currentDay;

            // 进度
            updateProgress();
            renderCard();
            renderWordGrid();
            updateNavButtons();
        }

        function updateProgress() {
            const count = todayWords.filter(w => mastered[w.globalIdx]).length;
            document.getElementById('masteredCount').textContent = count;
            const pct = Math.round((count / WORDS_PER_DAY) * 100);
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('masteryRate').textContent = pct + '%';
        }

        function renderCard() {
            const word = todayWords[currentIndex];
            if (!word) return;

            // 重置翻转
            isFlipped = false;
            document.getElementById('cardFlipper').classList.remove('flipped');

            // 卡片入场动画
            const flipper = document.getElementById('cardFlipper');
            flipper.classList.remove('card-entry');
            void flipper.offsetWidth; // 强制 reflow
            flipper.classList.add('card-entry');

            // 正面
            document.getElementById('wordNumber').textContent = `${currentIndex + 1} / ${WORDS_PER_DAY}`;
            document.getElementById('posTag').textContent = word.pos;
            document.getElementById('wordText').textContent = word.word;
            document.getElementById('phoneticText').textContent = word.phonetic;

            // 背面
            document.getElementById('backWord').textContent = word.word;
            document.getElementById('backPhonetic').textContent = word.phonetic;
            document.getElementById('meaningText').textContent = word.meaning;
            document.getElementById('exampleEn').innerHTML = word.exampleEn;
            document.getElementById('exampleZh').textContent = word.exampleZh;

            // 掌握图标
            const isMastered = mastered[word.globalIdx];
            const icon = document.getElementById('masteredIcon');
            if (isMastered) {
                icon.classList.add('show');
            } else {
                icon.classList.remove('show');
            }
        }

        function renderWordGrid() {
            const grid = document.getElementById('wordGrid');
            grid.innerHTML = '';
            todayWords.forEach((w, i) => {
                const dot = document.createElement('div');
                dot.className = 'word-dot';
                if (mastered[w.globalIdx]) dot.classList.add('mastered');
                if (i === currentIndex) dot.classList.add('current');
                dot.textContent = i + 1;
                dot.onclick = () => {
                    currentIndex = i;
                    renderCard();
                    renderWordGrid();
                    updateNavButtons();
                    // 滚动到卡片位置
                    document.getElementById('cardContainer').scrollIntoView({ behavior: 'smooth', block: 'center' });
                };
                grid.appendChild(dot);
            });
        }

        function updateNavButtons() {
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === WORDS_PER_DAY - 1;
        }

        // ===== 交互 =====
        function flipCard() {
            isFlipped = !isFlipped;
            document.getElementById('cardFlipper').classList.toggle('flipped', isFlipped);
        }

        function markWord(known) {
            const word = todayWords[currentIndex];
            if (!word) return;

            if (known) {
                mastered[word.globalIdx] = true;
                // 显示掌握图标
                const icon = document.getElementById('masteredIcon');
                icon.classList.add('show');
                icon.style.animation = 'celebratePop 0.4s ease';
                setTimeout(() => icon.style.animation = '', 400);
                showToast(`已掌握: ${word.word}`);
            } else {
                delete mastered[word.globalIdx];
                document.getElementById('masteredIcon').classList.remove('show');
                showToast(`需复习: ${word.word}`);
            }

            saveState();
            updateProgress();
            renderWordGrid();

            // 自动跳下一个
            if (currentIndex < WORDS_PER_DAY - 1) {
                setTimeout(() => {
                    currentIndex++;
                    renderCard();
                    renderWordGrid();
                    updateNavButtons();
                }, known ? 400 : 300);
            } else {
                // 最后一个，检查是否全部完成
                setTimeout(checkComplete, 600);
            }
        }

        function navigate(dir) {
            const next = currentIndex + dir;
            if (next < 0 || next >= WORDS_PER_DAY) return;
            currentIndex = next;
            renderCard();
            renderWordGrid();
            updateNavButtons();
        }

        function speakWord() {
            const word = todayWords[currentIndex];
            if (!word) return;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(word.word);
                utter.lang = 'en-GB';
                utter.rate = 0.85;
                window.speechSynthesis.speak(utter);
            }
        }

        function checkComplete() {
            const knownCount = todayWords.filter(w => mastered[w.globalIdx]).length;
            if (knownCount === WORDS_PER_DAY && !completedToday) {
                completedToday = true;
                saveState();
                showCompleteModal(knownCount, WORDS_PER_DAY - knownCount, 0);
            } else if (currentIndex === WORDS_PER_DAY - 1) {
                const unknownCount = todayWords.filter(w => !mastered[w.globalIdx]).length;
                if (unknownCount > 0) {
                    showToast(`还有 ${unknownCount} 个单词待掌握`);
                }
            }
        }

        function showCompleteModal(known, review, forgot) {
            document.getElementById('modalKnown').textContent = known;
            document.getElementById('modalReview').textContent = review;
            document.getElementById('modalForgot').textContent = forgot;
            document.getElementById('completeModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('completeModal').classList.remove('show');
        }

        // Toast
        let toastTimer;
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
        }

        // 触摸滑动支持
        let touchStartX = 0;
        let touchStartY = 0;
        document.getElementById('cardContainer').addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        document.getElementById('cardContainer').addEventListener('touchend', (e) => {
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            // 只在水平滑动明显时才触发
            if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
                if (dx < 0 && currentIndex < WORDS_PER_DAY - 1) {
                    navigate(1);
                } else if (dx > 0 && currentIndex > 0) {
                    navigate(-1);
                }
            }
        }, { passive: true });

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') navigate(-1);
            else if (e.key === 'ArrowRight') navigate(1);
            else if (e.key === ' ') { e.preventDefault(); flipCard(); }
            else if (e.key === '1') markWord(false);
            else if (e.key === '2') markWord(true);
        });

        // ===== 初始化 =====
        loadState();
        render();
    </script>
</body>
</html>
