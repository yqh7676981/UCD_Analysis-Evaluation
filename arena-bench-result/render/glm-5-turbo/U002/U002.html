<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>聚餐AA记账</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        /* ========== 设计令牌 ========== */
        :root {
            --bg: #FFFBF5;
            --bg-secondary: #FFF4EB;
            --fg: #2C1810;
            --fg-secondary: #7A5C4F;
            --muted: #B8A094;
            --accent: #E8653A;
            --accent-hover: #D45528;
            --accent-light: #FFF0EA;
            --card: #FFFFFF;
            --border: #F0E0D6;
            --success: #2D9F6F;
            --success-light: #E8F8F0;
            --danger: #E84040;
            --danger-light: #FFF0F0;
            --shadow: 0 2px 12px rgba(44,24,16,0.06);
            --shadow-lg: 0 8px 32px rgba(44,24,16,0.10);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
        }

        /* ========== 基础重置 ========== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            position: relative;
        }

        /* ========== 背景装饰 ========== */
        body::before {
            content: '';
            position: fixed;
            top: -120px;
            right: -80px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(232,101,58,0.10) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -100px;
            left: -60px;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(45,159,111,0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        /* ========== 应用容器 ========== */
        .app {
            position: relative;
            z-index: 1;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* ========== 头部 ========== */
        header {
            padding: 20px 20px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255,251,245,0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(240,224,214,0.5);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), #F49D6E);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            box-shadow: 0 3px 12px rgba(232,101,58,0.25);
        }

        header h1 {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: var(--fg);
        }

        .btn-reset {
            background: var(--danger-light);
            color: var(--danger);
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-reset:active {
            transform: scale(0.95);
            background: #FFE0E0;
        }

        /* ========== 主内容区 ========== */
        main {
            flex: 1;
            padding: 0 16px 100px;
            overflow-y: auto;
        }

        /* ========== 统计总览 ========== */
        .summary-strip {
            display: flex;
            gap: 10px;
            padding: 16px 4px 8px;
        }

        .summary-item {
            flex: 1;
            background: var(--card);
            border-radius: var(--radius-sm);
            padding: 14px 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            text-align: center;
        }

        .summary-label {
            font-size: 11px;
            color: var(--muted);
            font-weight: 500;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .summary-value {
            font-size: 22px;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: -0.5px;
        }

        .summary-value.green {
            color: var(--success);
        }

        /* ========== 区块标题 ========== */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 4px 10px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--fg);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-title i {
            color: var(--accent);
            font-size: 14px;
        }

        .section-count {
            font-size: 12px;
            color: var(--muted);
            background: var(--bg-secondary);
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 500;
        }

        /* ========== 参与人区域 ========== */
        .members-area {
            padding: 0 4px;
        }

        .members-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 40px;
        }

        .member-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--card);
            border: 1.5px solid var(--border);
            padding: 7px 12px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 500;
            color: var(--fg);
            animation: chipIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            transition: all 0.2s;
        }

        @keyframes chipIn {
            from { opacity: 0; transform: scale(0.7); }
            to { opacity: 1; transform: scale(1); }
        }

        .member-chip .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .member-chip .remove-btn {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: none;
            background: rgba(184,160,148,0.2);
            color: var(--muted);
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            margin-left: 2px;
        }

        .member-chip .remove-btn:active {
            background: var(--danger-light);
            color: var(--danger);
            transform: scale(0.9);
        }

        .add-member-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .add-member-row input {
            flex: 1;
            height: 42px;
            border: 1.5px solid var(--border);
            border-radius: 22px;
            padding: 0 16px;
            font-size: 14px;
            font-family: inherit;
            background: var(--card);
            color: var(--fg);
            outline: none;
            transition: border-color 0.2s;
        }

        .add-member-row input::placeholder {
            color: var(--muted);
        }

        .add-member-row input:focus {
            border-color: var(--accent);
        }

        .btn-add {
            height: 42px;
            padding: 0 18px;
            border: none;
            border-radius: 22px;
            background: var(--accent);
            color: white;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
            box-shadow: 0 3px 12px rgba(232,101,58,0.2);
            white-space: nowrap;
        }

        .btn-add:active {
            transform: scale(0.96);
            background: var(--accent-hover);
        }

        /* ========== 消费记录列表 ========== */
        .expense-list {
            padding: 0 4px;
        }

        .expense-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 14px 16px;
            margin-bottom: 10px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            transition: transform 0.15s;
            position: relative;
            overflow: hidden;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .expense-card:active {
            transform: scale(0.985);
        }

        .expense-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .expense-info {
            flex: 1;
            min-width: 0;
        }

        .expense-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--fg);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .expense-meta {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .expense-meta .payer-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .expense-amount {
            font-size: 18px;
            font-weight: 900;
            color: var(--fg);
            letter-spacing: -0.5px;
            flex-shrink: 0;
        }

        .expense-amount::before {
            content: '¥';
            font-size: 12px;
            font-weight: 600;
            margin-right: 1px;
        }

        .expense-del {
            position: absolute;
            right: -30px;
            top: 0;
            bottom: 0;
            width: 30px;
            background: var(--danger);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: right 0.25s;
        }

        .expense-card:hover .expense-del,
        .expense-card.swiped .expense-del {
            right: 0;
        }

        /* ========== 空状态 ========== */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
        }

        .empty-state i {
            font-size: 36px;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        .empty-state p {
            font-size: 14px;
            font-weight: 400;
        }

        /* ========== 结算区域 ========== */
        .settle-area {
            padding: 0 4px;
        }

        .settle-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 10px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        .settle-from, .settle-to {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-width: 56px;
        }

        .settle-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            font-weight: 700;
        }

        .settle-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--fg);
            max-width: 60px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .settle-arrow {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            position: relative;
        }

        .settle-arrow .arrow-line {
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--danger), var(--accent));
            border-radius: 1px;
            position: relative;
        }

        .settle-arrow .arrow-line::after {
            content: '';
            position: absolute;
            right: -1px;
            top: 50%;
            transform: translateY(-50%);
            border: 5px solid transparent;
            border-left: 6px solid var(--accent);
        }

        .settle-amount-label {
            font-size: 11px;
            color: var(--muted);
        }

        .settle-amount {
            font-size: 20px;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: -0.5px;
        }

        .settle-amount::before {
            content: '¥';
            font-size: 13px;
            font-weight: 600;
        }

        /* ========== 底部按钮 ========== */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 12px 16px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            background: rgba(255,251,245,0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(240,224,214,0.5);
        }

        .bottom-bar-inner {
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
        }

        .btn-add-expense {
            flex: 1;
            height: 50px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, var(--accent), #F49D6E);
            color: white;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(232,101,58,0.3);
            transition: all 0.2s;
        }

        .btn-add-expense:active {
            transform: scale(0.97);
            box-shadow: 0 2px 12px rgba(232,101,58,0.25);
        }

        .btn-settle {
            height: 50px;
            padding: 0 22px;
            border: none;
            border-radius: 25px;
            background: var(--success);
            color: white;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 16px rgba(45,159,111,0.25);
            transition: all 0.2s;
        }

        .btn-settle:active {
            transform: scale(0.97);
        }

        /* ========== 底部弹窗 ========== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(44,24,16,0.4);
            z-index: 1000;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 1; /* fixed: was 0 */
            pointer-events: none;
            transition: opacity 0.25s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-sheet {
            width: 100%;
            max-width: 480px;
            background: var(--card);
            border-radius: 24px 24px 0 0;
            padding: 8px 20px 28px;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            max-height: 85vh;
            max-height: 85dvh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal-sheet {
            transform: translateY(0);
        }

        .modal-handle {
            width: 36px;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin: 8px auto 16px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 20px;
            color: var(--fg);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--fg-secondary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .form-input {
            width: 100%;
            height: 48px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0 14px;
            font-size: 15px;
            font-family: inherit;
            background: var(--bg);
            color: var(--fg);
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--accent);
        }

        .form-input::placeholder {
            color: var(--muted);
        }

        /* 付款人选择 */
        .payer-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .payer-option {
            padding: 8px 16px;
            border: 1.5px solid var(--border);
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            background: var(--bg);
            color: var(--fg-secondary);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .payer-option .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .payer-option.selected {
            border-color: var(--accent);
            background: var(--accent-light);
            color: var(--accent);
            font-weight: 600;
        }

        /* 分摊人选择 */
        .split-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .split-option {
            padding: 8px 14px;
            border: 1.5px solid var(--border);
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            background: var(--bg);
            color: var(--fg-secondary);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .split-option .check-icon {
            width: 16px;
            height: 16px;
            border: 1.5px solid var(--border);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            color: transparent;
            transition: all 0.15s;
        }

        .split-option.selected {
            border-color: var(--success);
            background: var(--success-light);
            color: var(--success);
        }

        .split-option.selected .check-icon {
            border-color: var(--success);
            background: var(--success);
            color: white;
        }

        .split-all-btn {
            font-size: 13px;
            color: var(--accent);
            background: none;
            border: none;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 8px;
            padding: 4px 0;
        }

        .split-all-btn:active {
            opacity: 0.7;
        }

        .btn-submit {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 26px;
            background: linear-gradient(135deg, var(--accent), #F49D6E);
            color: white;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 4px 20px rgba(232,101,58,0.3);
            transition: all 0.2s;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        /* ========== Toast 提示 ========== */
        .toast-container {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            background: var(--fg);
            color: white;
            padding: 10px 20px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Noto Sans SC', sans-serif;
            box-shadow: var(--shadow-lg);
            animation: toastIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), toastOut 0.3s 1.8s ease-in forwards;
            pointer-events: auto;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-12px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes toastOut {
            to { opacity: 0; transform: translateY(-12px) scale(0.9); }
        }

        /* ========== 确认弹窗 ========== */
        .confirm-overlay {
            position: fixed;
            inset: 0;
            background: rgba(44,24,16,0.45);
            z-index: 1500;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            opacity: 1; /* fixed: was 0 */
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .confirm-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .confirm-box {
            background: var(--card);
            border-radius: var(--radius);
            padding: 28px 24px 20px;
            width: 100%;
            max-width: 300px;
            text-align: center;
            box-shadow: var(--shadow-lg);
            transform: scale(0.9);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .confirm-overlay.active .confirm-box {
            transform: scale(1);
        }

        .confirm-box h3 {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .confirm-box p {
            font-size: 14px;
            color: var(--fg-secondary);
            margin-bottom: 20px;
        }

        .confirm-btns {
            display: flex;
            gap: 10px;
        }

        .confirm-btns button {
            flex: 1;
            height: 44px;
            border: none;
            border-radius: 22px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s;
        }

        .confirm-btns button:active {
            transform: scale(0.96);
        }

        .btn-cancel {
            background: var(--bg-secondary);
            color: var(--fg-secondary);
        }

        .btn-confirm-action {
            background: var(--danger);
            color: white;
        }

        /* ========== 分类图标颜色 ========== */
        .cat-food { background: #FFF0EA; color: #E8653A; }
        .cat-drink { background: #E8F8F0; color: #2D9F6F; }
        .cat-entertainment { background: #FFF3E0; color: #E8A33A; }
        .cat-transport { background: #EBF0FF; color: #5B6FD9; }
        .cat-other { background: #F5F0FF; color: #8B6FC0; }

        /* ========== 平摊人头像色 ========== */
        .avatar-0 { background: linear-gradient(135deg, #E8653A, #F49D6E); }
        .avatar-1 { background: linear-gradient(135deg, #2D9F6F, #6FCF97); }
        .avatar-2 { background: linear-gradient(135deg, #5B6FD9, #8B9FE8); }
        .avatar-3 { background: linear-gradient(135deg, #E8A33A, #F4CC6E); }
        .avatar-4 { background: linear-gradient(135deg, #8B6FC0, #B89FE8); }
        .avatar-5 { background: linear-gradient(135deg, #D94F7A, #F08CA8); }
        .avatar-6 { background: linear-gradient(135deg, #3AB8C1, #6EDDE5); }
        .avatar-7 { background: linear-gradient(135deg, #C1A03A, #E5CF6E); }

        .dot-0 { background: #E8653A; }
        .dot-1 { background: #2D9F6F; }
        .dot-2 { background: #5B6FD9; }
        .dot-3 { background: #E8A33A; }
        .dot-4 { background: #8B6FC0; }
        .dot-5 { background: #D94F7A; }
        .dot-6 { background: #3AB8C1; }
        .dot-7 { background: #C1A03A; }

        /* ========== 消费类别选择 ========== */
        .category-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .category-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg);
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .category-option i {
            font-size: 18px;
        }

        .category-option span {
            font-size: 11px;
            font-weight: 500;
            color: var(--fg-secondary);
        }

        .category-option.selected {
            border-color: var(--accent);
            background: var(--accent-light);
        }

        .category-option.selected span {
            color: var(--accent);
            font-weight: 600;
        }

        /* ========== 无滚动条 ========== */
        main::-webkit-scrollbar,
        .modal-sheet::-webkit-scrollbar {
            display: none;
        }

        main, .modal-sheet {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* ========== 减少动效偏好 ========== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
<style id="screenshot-fix">
/* 仅处理滚动懒加载：让 opacity:0 的元素可见，但排除 toast/弹窗 */
.reveal:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.fade-in:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.fade:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.lazy:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.stagger-item:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.animate:not(.toast):not([class*="modal"]):not([class*="overlay"]) {
  opacity: 1 !important;
  visibility: visible !important;
}
/* 特别确保弹窗/侧边栏/Toast 保持隐藏（它们通过其他类控制显示） */
.modal-overlay:not(.show):not(.active),
.confirm-overlay:not(.show):not(.active),
[class*="modal"]:not(.show):not(.active):not([class*="stagger"]),
[class*="overlay"]:not(.show):not(.active):not([class*="scroll"]),
.toast:not(.show),
[id*="toast"]:not(.show):not(.active),
[id*="cart"],
[id*="sidebar"] {
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
}
/* 排除 toast 类，避免强制显示 */
.reveal:not(.toast), .fade-in:not(.toast), .fade:not(.toast), .lazy:not(.toast), .stagger-item:not(.toast), .animate:not(.toast) {
  opacity: 1 !important;
  visibility: visible !important;
}
/* 强制显示主要内容区域（section 下的直接子元素），但排除移动菜单 */
section > div:not(.mobile-menu):not([id*="mobile-menu"]):not([id*="menu"]) {
  opacity: 1 !important;
}
</style></head>
<body>
    <div class="app">
        <!-- 头部 -->
        <header>
            <div class="header-left">
                <div class="header-icon"><i class="fa-solid fa-utensils"></i></div>
                <h1>聚餐AA记账</h1>
            </div>
            <button class="btn-reset" onclick="confirmReset()" aria-label="重置所有数据">
                <i class="fa-solid fa-rotate-left"></i> 重置
            </button>
        </header>

        <!-- 主内容 -->
        <main>
            <!-- 统计总览 -->
            <div class="summary-strip">
                <div class="summary-item">
                    <div class="summary-label">总消费</div>
                    <div class="summary-value" id="totalAmount">0</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">笔数</div>
                    <div class="summary-value green" id="totalCount">0</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">人均</div>
                    <div class="summary-value green" id="avgAmount">0</div>
                </div>
            </div>

            <!-- 参与人 -->
            <div class="members-area">
                <div class="section-header">
                    <div class="section-title"><i class="fa-solid fa-user-group"></i> 参与人</div>
                    <span class="section-count" id="memberCount">0人</span>
                </div>
                <div class="members-row" id="membersRow"></div>
                <div class="add-member-row">
                    <input type="text" id="memberInput" placeholder="输入姓名，点击添加" maxlength="8" aria-label="添加参与人姓名">
                    <button class="btn-add" onclick="addMember()" aria-label="添加参与人">
                        <i class="fa-solid fa-plus"></i> 添加
                    </button>
                </div>
            </div>

            <!-- 消费记录 -->
            <div class="expense-section">
                <div class="section-header">
                    <div class="section-title"><i class="fa-solid fa-receipt"></i> 消费记录</div>
                    <span class="section-count" id="expenseCount">0笔</span>
                </div>
                <div class="expense-list" id="expenseList">
                    <div class="empty-state" id="expenseEmpty">
                        <i class="fa-solid fa-receipt"></i>
                        <p>还没有消费记录</p>
                        <p>点击下方按钮添加</p>
                    </div>
                </div>
            </div>

            <!-- 结算结果 -->
            <div class="settle-section" id="settleSection" style="display:none;">
                <div class="section-header">
                    <div class="section-title"><i class="fa-solid fa-handshake"></i> 结算方案</div>
                </div>
                <div class="settle-area" id="settleArea"></div>
            </div>
        </main>

        <!-- 底部操作栏 -->
        <div class="bottom-bar">
            <div class="bottom-bar-inner">
                <button class="btn-add-expense" onclick="openExpenseModal()" aria-label="添加消费">
                    <i class="fa-solid fa-plus"></i> 添加消费
                </button>
                <button class="btn-settle" onclick="calculateSettlement()" aria-label="计算结算">
                    <i class="fa-solid fa-calculator"></i> 结算
                </button>
            </div>
        </div>
    </div>

    <!-- 添加消费弹窗 -->
    <div class="modal-overlay" id="expenseModal" role="dialog" aria-modal="true" aria-label="添加消费">
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            <div class="modal-title">添加消费</div>

            <div class="form-group">
                <div class="form-label"><i class="fa-solid fa-tag"></i> 消费类别</div>
                <div class="category-options" id="categoryOptions">
                    <button class="category-option selected" data-cat="food" onclick="selectCategory(this)">
                        <i class="fa-solid fa-bowl-food cat-food"></i>
                        <span>餐饮</span>
                    </button>
                    <button class="category-option" data-cat="drink" onclick="selectCategory(this)">
                        <i class="fa-solid fa-wine-glass cat-drink"></i>
                        <span>酒水</span>
                    </button>
                    <button class="category-option" data-cat="entertainment" onclick="selectCategory(this)">
                        <i class="fa-solid fa-gamepad cat-entertainment"></i>
                        <span>娱乐</span>
                    </button>
                    <button class="category-option" data-cat="transport" onclick="selectCategory(this)">
                        <i class="fa-solid fa-car cat-transport"></i>
                        <span>交通</span>
                    </button>
                    <button class="category-option" data-cat="other" onclick="selectCategory(this)">
                        <i class="fa-solid fa-ellipsis cat-other"></i>
                        <span>其他</span>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <div class="form-label"><i class="fa-solid fa-pen"></i> 消费说明</div>
                <input class="form-input" type="text" id="expenseName" placeholder="如：火锅、KTV" maxlength="20">
            </div>

            <div class="form-group">
                <div class="form-label"><i class="fa-solid fa-yen-sign"></i> 消费金额</div>
                <input class="form-input" type="number" id="expenseAmount" placeholder="请输入金额" min="0.01" step="0.01" inputmode="decimal">
            </div>

            <div class="form-group">
                <div class="form-label"><i class="fa-solid fa-credit-card"></i> 付款人</div>
                <div class="payer-options" id="payerOptions"></div>
            </div>

            <div class="form-group">
                <div class="form-label"><i class="fa-solid fa-people-arrows"></i> 分摊人</div>
                <button class="split-all-btn" onclick="selectAllSplit()">全选 / 取消全选</button>
                <div class="split-options" id="splitOptions"></div>
            </div>

            <button class="btn-submit" onclick="submitExpense()">确认添加</button>
        </div>
    </div>

    <!-- 确认弹窗 -->
    <div class="confirm-overlay" id="confirmOverlay" role="dialog" aria-modal="true">
        <div class="confirm-box">
            <h3 id="confirmTitle">确认操作</h3>
            <p id="confirmMsg">确定要执行此操作吗？</p>
            <div class="confirm-btns">
                <button class="btn-cancel" onclick="closeConfirm()">取消</button>
                <button class="btn-confirm-action" id="confirmBtn" onclick="executeConfirm()">确定</button>
            </div>
        </div>
    </div>

    <!-- Toast 容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        /* ========== 应用状态 ========== */
        let state = {
            members: [],     // 参与人列表
            expenses: [],    // 消费记录列表
            nextId: 1        // 自增ID
        };

        // 当前选择的消费类别
        let selectedCategory = 'food';
        // 当前选择的付款人
        let selectedPayer = null;
        // 当前选择的分摊人
        let selectedSplit = new Set();
        // 确认回调
        let confirmCallback = null;

        /* ========== 类别配置 ========== */
        const CATEGORIES = {
            food: { icon: 'fa-bowl-food', label: '餐饮', cls: 'cat-food' },
            drink: { icon: 'fa-wine-glass', label: '酒水', cls: 'cat-drink' },
            entertainment: { icon: 'fa-gamepad', label: '娱乐', cls: 'cat-entertainment' },
            transport: { icon: 'fa-car', label: '交通', cls: 'cat-transport' },
            other: { icon: 'fa-ellipsis', label: '其他', cls: 'cat-other' }
        };

        /* ========== Toast 提示 ========== */
        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => {
                if (toast.parentNode) toast.parentNode.removeChild(toast);
            }, 2200);
        }

        /* ========== 确认弹窗 ========== */
        function showConfirm(title, msg, callback) {
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmMsg').textContent = msg;
            document.getElementById('confirmOverlay').classList.add('active');
            confirmCallback = callback;
        }

        function closeConfirm() {
            document.getElementById('confirmOverlay').classList.remove('active');
            confirmCallback = null;
        }

        function executeConfirm() {
            if (confirmCallback) confirmCallback();
            closeConfirm();
        }

        /* ========== 参与人管理 ========== */
        function addMember() {
            const input = document.getElementById('memberInput');
            const name = input.value.trim();
            if (!name) {
                showToast('请输入姓名');
                input.focus();
                return;
            }
            if (name.length > 8) {
                showToast('姓名最多8个字符');
                return;
            }
            if (state.members.includes(name)) {
                showToast('该姓名已存在');
                input.focus();
                return;
            }
            if (state.members.length >= 8) {
                showToast('最多添加8位参与人');
                return;
            }
            state.members.push(name);
            input.value = '';
            renderMembers();
            updateSummary();
            showToast(name + ' 已加入');
        }

        function removeMember(name) {
            // 检查是否有关联消费
            const hasExpense = state.expenses.some(e => e.payer === name || e.splitAmong.includes(name));
            if (hasExpense) {
                showConfirm('移除参与人', '该参与人关联了消费记录，移除后相关记录也会删除，确定？', () => {
                    state.expenses = state.expenses.filter(e => e.payer !== name && !e.splitAmong.includes(name));
                    state.members = state.members.filter(m => m !== name);
                    renderMembers();
                    renderExpenses();
                    updateSummary();
                    hideSettlement();
                    showToast(name + ' 已移除');
                });
            } else {
                state.members = state.members.filter(m => m !== name);
                renderMembers();
                updateSummary();
                hideSettlement();
                showToast(name + ' 已移除');
            }
        }

        function getAvatarClass(index) {
            return 'avatar-' + (index % 8);
        }

        function getDotClass(index) {
            return 'dot-' + (index % 8);
        }

        function getMemberIndex(name) {
            return state.members.indexOf(name);
        }

        function renderMembers() {
            const row = document.getElementById('membersRow');
            row.innerHTML = '';
            state.members.forEach((name, i) => {
                const chip = document.createElement('div');
                chip.className = 'member-chip';
                chip.innerHTML = `
                    <span class="dot ${getDotClass(i)}"></span>
                    <span>${name}</span>
                    <button class="remove-btn" onclick="removeMember('${name}')" aria-label="移除${name}">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                `;
                row.appendChild(chip);
            });
            document.getElementById('memberCount').textContent = state.members.length + '人';
        }

        /* ========== 消费管理 ========== */
        function openExpenseModal() {
            if (state.members.length < 2) {
                showToast('至少需要2位参与人');
                return;
            }
            // 重置表单
            selectedCategory = 'food';
            selectedPayer = state.members[0];
            selectedSplit = new Set(state.members);
            document.getElementById('expenseName').value = '';
            document.getElementById('expenseAmount').value = '';

            // 渲染类别选择
            document.querySelectorAll('.category-option').forEach(btn => {
                btn.classList.toggle('selected', btn.dataset.cat === 'food');
            });

            // 渲染付款人选项
            renderPayerOptions();
            // 渲染分摊人选项
            renderSplitOptions();

            // 打开弹窗
            document.getElementById('expenseModal').classList.add('active');
        }

        function closeExpenseModal() {
            document.getElementById('expenseModal').classList.remove('active');
        }

        function selectCategory(btn) {
            document.querySelectorAll('.category-option').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedCategory = btn.dataset.cat;
        }

        function renderPayerOptions() {
            const container = document.getElementById('payerOptions');
            container.innerHTML = '';
            state.members.forEach((name, i) => {
                const btn = document.createElement('button');
                btn.className = 'payer-option' + (name === selectedPayer ? ' selected' : '');
                btn.innerHTML = `<span class="dot ${getDotClass(i)}"></span> ${name}`;
                btn.onclick = () => {
                    selectedPayer = name;
                    renderPayerOptions();
                };
                container.appendChild(btn);
            });
        }

        function renderSplitOptions() {
            const container = document.getElementById('splitOptions');
            container.innerHTML = '';
            state.members.forEach((name, i) => {
                const btn = document.createElement('button');
                btn.className = 'split-option' + (selectedSplit.has(name) ? ' selected' : '');
                btn.innerHTML = `<span class="check-icon"><i class="fa-solid fa-check"></i></span> ${name}`;
                btn.onclick = () => {
                    if (selectedSplit.has(name)) {
                        selectedSplit.delete(name);
                    } else {
                        selectedSplit.add(name);
                    }
                    renderSplitOptions();
                };
                container.appendChild(btn);
            });
        }

        function selectAllSplit() {
            if (selectedSplit.size === state.members.length) {
                selectedSplit.clear();
            } else {
                selectedSplit = new Set(state.members);
            }
            renderSplitOptions();
        }

        function submitExpense() {
            const name = document.getElementById('expenseName').value.trim();
            const amountStr = document.getElementById('expenseAmount').value;
            const amount = parseFloat(amountStr);

            if (!name) {
                showToast('请输入消费说明');
                return;
            }
            if (!amountStr || isNaN(amount) || amount <= 0) {
                showToast('请输入有效金额');
                return;
            }
            if (!selectedPayer) {
                showToast('请选择付款人');
                return;
            }
            if (selectedSplit.size === 0) {
                showToast('请选择至少一位分摊人');
                return;
            }

            const expense = {
                id: state.nextId++,
                category: selectedCategory,
                name: name,
                amount: Math.round(amount * 100) / 100,
                payer: selectedPayer,
                splitAmong: [...selectedSplit]
            };

            state.expenses.push(expense);
            closeExpenseModal();
            renderExpenses();
            updateSummary();
            hideSettlement();
            showToast('已添加：' + name);
        }

        function deleteExpense(id) {
            state.expenses = state.expenses.filter(e => e.id !== id);
            renderExpenses();
            updateSummary();
            hideSettlement();
            showToast('已删除该笔消费');
        }

        function renderExpenses() {
            const list = document.getElementById('expenseList');
            const empty = document.getElementById('expenseEmpty');
            list.innerHTML = '';

            if (state.expenses.length === 0) {
                list.appendChild(createEmptyState());
            } else {
                state.expenses.forEach(exp => {
                    const cat = CATEGORIES[exp.category] || CATEGORIES.other;
                    const payerIdx = getMemberIndex(exp.payer);
                    const card = document.createElement('div');
                    card.className = 'expense-card';
                    card.innerHTML = `
                        <div class="expense-icon ${cat.cls}">
                            <i class="fa-solid ${cat.icon}"></i>
                        </div>
                        <div class="expense-info">
                            <div class="expense-name">${exp.name}</div>
                            <div class="expense-meta">
                                <span class="payer-dot ${getDotClass(Math.max(0, payerIdx))}"></span>
                                ${exp.payer} 付款 · ${exp.splitAmong.length}人分摊
                            </div>
                        </div>
                        <div class="expense-amount">${exp.amount.toFixed(2)}</div>
                        <button class="expense-del" onclick="event.stopPropagation();deleteExpense(${exp.id})" aria-label="删除该笔消费">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    `;

                    // 左滑删除手势支持
                    let startX = 0;
                    let currentX = 0;
                    let isSwiping = false;

                    card.addEventListener('touchstart', (e) => {
                        startX = e.touches[0].clientX;
                        isSwiping = false;
                    }, { passive: true });

                    card.addEventListener('touchmove', (e) => {
                        currentX = e.touches[0].clientX;
                        const diff = startX - currentX;
                        if (diff > 20) {
                            isSwiping = true;
                            card.classList.add('swiped');
                        } else if (diff < -20) {
                            card.classList.remove('swiped');
                        }
                    }, { passive: true });

                    card.addEventListener('touchend', () => {
                        if (!isSwiping) {
                            card.classList.remove('swiped');
                        }
                        // 3秒后自动收起
                        setTimeout(() => {
                            card.classList.remove('swiped');
                        }, 3000);
                    });

                    list.appendChild(card);
                });
            }

            document.getElementById('expenseCount').textContent = state.expenses.length + '笔';
        }

        function createEmptyState() {
            const div = document.createElement('div');
            div.className = 'empty-state';
            div.id = 'expenseEmpty';
            div.innerHTML = `
                <i class="fa-solid fa-receipt"></i>
                <p>还没有消费记录</p>
                <p>点击下方按钮添加</p>
            `;
            return div;
        }

        /* ========== 统计更新 ========== */
        function updateSummary() {
            const total = state.expenses.reduce((sum, e) => sum + e.amount, 0);
            const count = state.expenses.length;
            const avg = state.members.length > 0 ? total / state.members.length : 0;

            document.getElementById('totalAmount').textContent = total.toFixed(0);
            document.getElementById('totalCount').textContent = count;
            document.getElementById('avgAmount').textContent = avg.toFixed(0);
        }

        /* ========== 结算计算 ========== */
        function calculateSettlement() {
            if (state.members.length < 2) {
                showToast('至少需要2位参与人才能结算');
                return;
            }
            if (state.expenses.length === 0) {
                showToast('还没有消费记录');
                return;
            }

            // 计算每个人的净余额
            // 正数 = 应该收钱，负数 = 应该付钱
            const balances = {};
            state.members.forEach(m => { balances[m] = 0; });

            state.expenses.forEach(exp => {
                // 付款人支付了金额
                balances[exp.payer] += exp.amount;
                // 分摊人每人应分摊
                const share = exp.amount / exp.splitAmong.length;
                exp.splitAmong.forEach(m => {
                    balances[m] -= share;
                });
            });

            // 四舍五入处理精度问题
            Object.keys(balances).forEach(m => {
                balances[m] = Math.round(balances[m] * 100) / 100;
            });

            // 贪心算法分配：让欠钱的人给应收的人转账
            const debtors = [];   // 欠钱的
            const creditors = []; // 应收的

            Object.entries(balances).forEach(([name, balance]) => {
                if (balance < -0.01) {
                    debtors.push({ name, amount: -balance });
                } else if (balance > 0.01) {
                    creditors.push({ name, amount: balance });
                }
            });

            // 按金额降序排列
            debtors.sort((a, b) => b.amount - a.amount);
            creditors.sort((a, b) => b.amount - a.amount);

            const transfers = [];
            let i = 0, j = 0;

            while (i < debtors.length && j < creditors.length) {
                const debtor = debtors[i];
                const creditor = creditors[j];
                const transferAmount = Math.round(Math.min(debtor.amount, creditor.amount) * 100) / 100;

                if (transferAmount > 0.01) {
                    transfers.push({
                        from: debtor.name,
                        to: creditor.name,
                        amount: transferAmount
                    });
                }

                debtor.amount = Math.round((debtor.amount - transferAmount) * 100) / 100;
                creditor.amount = Math.round((creditor.amount - transferAmount) * 100) / 100;

                if (debtor.amount < 0.01) i++;
                if (creditor.amount < 0.01) j++;
            }

            // 显示结算结果
            renderSettlement(transfers, balances);
        }

        function renderSettlement(transfers, balances) {
            const section = document.getElementById('settleSection');
            const area = document.getElementById('settleArea');
            section.style.display = 'block';
            area.innerHTML = '';

            if (transfers.length === 0) {
                area.innerHTML = `
                    <div class="empty-state" style="padding:24px 20px;">
                        <i class="fa-solid fa-face-smile" style="color:var(--success);"></i>
                        <p style="color:var(--success);font-weight:600;">账目已清，无需转账</p>
                    </div>
                `;
            } else {
                transfers.forEach((t, idx) => {
                    const fromIdx = getMemberIndex(t.from);
                    const toIdx = getMemberIndex(t.to);
                    const card = document.createElement('div');
                    card.className = 'settle-card';
                    card.style.animationDelay = (idx * 0.08) + 's';
                    card.innerHTML = `
                        <div class="settle-from">
                            <div class="settle-avatar ${getAvatarClass(Math.max(0, fromIdx))}">${t.from.charAt(0)}</div>
                            <div class="settle-name">${t.from}</div>
                        </div>
                        <div class="settle-arrow">
                            <div class="arrow-line"></div>
                            <div class="settle-amount">${t.amount.toFixed(2)}</div>
                        </div>
                        <div class="settle-to">
                            <div class="settle-avatar ${getAvatarClass(Math.max(0, toIdx))}">${t.to.charAt(0)}</div>
                            <div class="settle-name">${t.to}</div>
                        </div>
                    `;
                    area.appendChild(card);
                });
            }

            // 添加各人余额汇总
            const summaryCard = document.createElement('div');
            summaryCard.style.cssText = 'background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-top:10px;box-shadow:var(--shadow);border:1px solid var(--border);';

            let summaryHtml = '<div style="font-size:13px;font-weight:600;color:var(--fg-secondary);margin-bottom:10px;">各人账目明细</div>';
            state.members.forEach((name, i) => {
                const balance = balances[name];
                const isPositive = balance > 0.01;
                const isZero = Math.abs(balance) <= 0.01;
                const color = isZero ? 'var(--muted)' : (isPositive ? 'var(--success)' : 'var(--danger)');
                const sign = isZero ? '' : (isPositive ? '+' : '');
                const label = isZero ? '已平' : (isPositive ? '应收' : '应付');

                summaryHtml += `
                    <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);">
                        <div style="display:flex;align-items:center;gap:6px;">
                            <span class="dot ${getDotClass(i)}" style="width:8px;height:8px;border-radius:50%;display:inline-block;"></span>
                            <span style="font-size:14px;font-weight:500;">${name}</span>
                        </div>
                        <div style="text-align:right;">
                            <span style="font-size:15px;font-weight:700;color:${color};">${sign}${balance.toFixed(2)}</span>
                            <span style="font-size:11px;color:${color};margin-left:4px;">${label}</span>
                        </div>
                    </div>
                `;
            });

            summaryCard.innerHTML = summaryHtml;
            area.appendChild(summaryCard);

            // 滚动到结算区域
            setTimeout(() => {
                section.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }

        function hideSettlement() {
            document.getElementById('settleSection').style.display = 'none';
        }

        /* ========== 重置 ========== */
        function confirmReset() {
            if (state.members.length === 0 && state.expenses.length === 0) {
                showToast('暂无数据需要重置');
                return;
            }
            showConfirm('重置所有数据', '确定要清除所有参与人和消费记录吗？此操作不可撤销。', () => {
                state.members = [];
                state.expenses = [];
                state.nextId = 1;
                renderMembers();
                renderExpenses();
                updateSummary();
                hideSettlement();
                showToast('已重置所有数据');
            });
        }

        /* ========== 事件绑定 ========== */
        // 回车添加参与人
        document.getElementById('memberInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                addMember();
            }
        });

        // 点击遮罩关闭弹窗
        document.getElementById('expenseModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                closeExpenseModal();
            }
        });

        document.getElementById('confirmOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                closeConfirm();
            }
        });

        // 阻止弹窗内部点击冒泡到遮罩
        document.querySelector('.modal-sheet').addEventListener('click', (e) => {
            e.stopPropagation();
        });

        document.querySelector('.confirm-box').addEventListener('click', (e) => {
            e.stopPropagation();
        });

        /* ========== 初始化 ========== */
        function init() {
            renderMembers();
            renderExpenses();
            updateSummary();
        }

        init();
    </script>
</body>
</html>
