<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ff6b6b">
<title>今晚吃啥 🍜</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
  min-height: 100vh;
  padding: 20px 16px 32px;
  color: #333;
  overflow-x: hidden;
}
.container { max-width: 480px; margin: 0 auto; }
.header { text-align: center; margin-bottom: 18px; }
.header h1 {
  font-size: 28px; color: #fff; font-weight: 800;
  text-shadow: 0 2px 8px rgba(255,107,107,0.4); letter-spacing: 1px;
}
.header p { font-size: 13px; color: #fff; opacity: 0.9; margin-top: 4px; }

.wheel-wrap {
  position: relative; width: 300px; height: 300px;
  margin: 10px auto 20px;
  display: flex; align-items: center; justify-content: center;
}
.wheel-wrap::before {
  content: ""; position: absolute; inset: -8px;
  border-radius: 50%;
  background: linear-gradient(45deg, #fff, #ffe5e5);
  box-shadow: 0 10px 40px rgba(255,107,107,0.35);
  z-index: 0;
}
.wheel {
  position: relative; width: 100%; height: 100%;
  border-radius: 50%; overflow: hidden;
  background: #fff;
  transition: transform 4s cubic-bezier(0.17, 0.67, 0.21, 0.99);
  z-index: 1;
}
.wheel svg { display: block; width: 100%; height: 100%; }
.wheel text {
  font-size: 14px; font-weight: 700; fill: #fff;
  pointer-events: none;
}
.pointer {
  position: absolute; top: -6px; left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 16px solid transparent;
  border-right: 16px solid transparent;
  border-top: 28px solid #ff3b3b;
  filter: drop-shadow(0 3px 4px rgba(0,0,0,0.25));
  z-index: 3;
}
.pointer::after {
  content: ""; position: absolute; top: -32px; left: -6px;
  width: 12px; height: 12px; background: #ff3b3b; border-radius: 50%;
}
.center-btn {
  position: absolute; width: 80px; height: 80px;
  border-radius: 50%;
  background: linear-gradient(145deg, #ff6b6b, #ee5253);
  color: #fff; border: 4px solid #fff;
  font-size: 18px; font-weight: 800;
  box-shadow: 0 6px 16px rgba(238,82,83,0.5);
  z-index: 2; cursor: pointer;
  transition: transform 0.15s;
}
.center-btn:active { transform: scale(0.92); }
.center-btn:disabled { opacity: 0.6; cursor: not-allowed; }

.result {
  text-align: center; min-height: 50px;
  margin-bottom: 18px; padding: 12px 16px;
  background: rgba(255,255,255,0.85);
  border-radius: 14px;
  backdrop-filter: blur(10px);
  box-shadow: 0 4px 14px rgba(0,0,0,0.08);
}
.result .label { font-size: 13px; color: #888; }
.result .name {
  font-size: 22px; font-weight: 800; margin-top: 4px;
  color: #ee5253;
  background: linear-gradient(90deg, #ff6b6b, #ff9966);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  min-height: 28px;
}
.result.win .name { animation: pop 0.5s ease; }
@keyframes pop {
  0% { transform: scale(0.5); }
  60% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

.panel {
  background: rgba(255,255,255,0.92);
  border-radius: 18px; padding: 16px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
}
.panel h2 {
  font-size: 16px; color: #444; margin-bottom: 12px;
  display: flex; justify-content: space-between; align-items: center;
}
.count { font-size: 12px; color: #999; font-weight: normal; }

.add-row { display: flex; gap: 8px; margin-bottom: 12px; }
.add-row input {
  flex: 1; padding: 12px 14px; border: 1.5px solid #ffd0d0;
  border-radius: 12px; font-size: 15px; outline: none;
  background: #fff;
  transition: border-color 0.2s;
}
.add-row input:focus { border-color: #ff6b6b; }
.add-row button {
  padding: 0 18px; border: none; border-radius: 12px;
  background: linear-gradient(145deg, #ff6b6b, #ee5253);
  color: #fff; font-size: 15px; font-weight: 600;
  cursor: pointer;
  box-shadow: 0 3px 8px rgba(238,82,83,0.3);
}
.add-row button:active { transform: scale(0.96); }

.list { display: flex; flex-wrap: wrap; gap: 8px; max-height: 200px; overflow-y: auto; padding: 4px 0; }
.tag {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 12px; background: #fff5f5;
  border: 1px solid #ffd0d0; border-radius: 20px;
  font-size: 14px; color: #444;
}
.tag .del {
  width: 18px; height: 18px; border-radius: 50%;
  background: #ffb0b0; color: #fff; border: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; line-height: 1; cursor: pointer;
  padding: 0;
}
.tag .del:active { background: #ff6b6b; }

.empty { text-align: center; color: #aaa; font-size: 13px; padding: 20px 0; width: 100%; }

.actions { display: flex; gap: 8px; margin-top: 12px; }
.actions button {
  flex: 1; padding: 10px; border: 1.5px solid #ffd0d0;
  background: #fff; color: #ee5253; border-radius: 10px;
  font-size: 13px; cursor: pointer;
}
.actions button:active { background: #fff0f0; }

.toast {
  position: fixed; left: 50%; bottom: 40px;
  transform: translateX(-50%) translateY(20px);
  background: rgba(0,0,0,0.8); color: #fff;
  padding: 10px 20px; border-radius: 24px;
  font-size: 14px; opacity: 1; /* fixed: was 0 */
  transition: all 0.3s; pointer-events: none;
  z-index: 99;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
<style id="screenshot-fix">
/* 仅处理滚动懒加载：让 opacity:0 的元素可见，但排除 toast/弹窗 */
.reveal:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.fade-in:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.fade:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.lazy:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.stagger-item:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.animate:not(.toast):not([class*="modal"]):not([class*="overlay"]) {
  opacity: 1 !important;
  visibility: visible !important;
}
/* 特别确保弹窗/侧边栏/Toast 保持隐藏（它们通过其他类控制显示） */
.modal-overlay:not(.show):not(.active),
.confirm-overlay:not(.show):not(.active),
[class*="modal"]:not(.show):not(.active):not([class*="stagger"]),
[class*="overlay"]:not(.show):not(.active):not([class*="scroll"]),
.toast:not(.show),
[id*="toast"]:not(.show):not(.active),
[id*="cart"],
[id*="sidebar"] {
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
}
/* 排除 toast 类，避免强制显示 */
.reveal:not(.toast), .fade-in:not(.toast), .fade:not(.toast), .lazy:not(.toast), .stagger-item:not(.toast), .animate:not(.toast) {
  opacity: 1 !important;
  visibility: visible !important;
}
/* 强制显示主要内容区域（section 下的直接子元素），但排除移动菜单 */
section > div:not(.mobile-menu):not([id*="mobile-menu"]):not([id*="menu"]) {
  opacity: 1 !important;
}
</style></head>
<body>
<div class="container">
  <div class="header">
    <h1>🍜 今晚吃啥</h1>
    <p>转一转，告别选择困难</p>
  </div>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <div class="wheel" id="wheel">
      <svg viewBox="0 0 300 300" id="wheelSvg"></svg>
    </div>
    <button class="center-btn" id="spinBtn">开始</button>
  </div>

  <div class="result" id="result">
    <div class="label">点击"开始"为你抽一个</div>
    <div class="name" id="resultName">？？？</div>
  </div>

  <div class="panel">
    <h2>候选清单 <span class="count" id="count">0 项</span></h2>
    <div class="add-row">
      <input type="text" id="input" placeholder="输入餐厅或菜品" maxlength="10">
      <button id="addBtn">添加</button>
    </div>
    <div class="list" id="list"></div>
    <div class="actions">
      <button id="resetBtn">恢复默认</button>
      <button id="clearBtn">全部清空</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DEFAULT_LIST = ['火锅','烧烤','麻辣烫','米饭','面条','炒菜','寿司','披萨','汉堡','沙拉'];
const COLORS = ['#ff6b6b','#feca57','#48dbfb','#1dd1a1','#ff9ff3','#ee5a6f','#54a0ff','#5f27cd','#ff9966','#00d2d3'];

let items = JSON.parse(localStorage.getItem('eatItems') || 'null') || [...DEFAULT_LIST];
let spinning = false;
let currentRotation = 0;

const $ = id => document.getElementById(id);
const wheelEl = $('wheel');
const svg = $('wheelSvg');
const listEl = $('list');
const inputEl = $('input');
const resultEl = $('result');
const resultName = $('resultName');
const countEl = $('count');
const spinBtn = $('spinBtn');

function save(){ localStorage.setItem('eatItems', JSON.stringify(items)); }

function showToast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove('show'), 1600);
}

function renderList(){
  countEl.textContent = items.length + ' 项';
  if(items.length === 0){
    listEl.innerHTML = '<div class="empty">还没有候选，添加几个吧～</div>';
  } else {
    listEl.innerHTML = items.map((it,i)=>
      `<span class="tag">${escapeHtml(it)}<button class="del" data-i="${i}">×</button></span>`
    ).join('');
  }
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function renderWheel(){
  const n = items.length;
  if(n === 0){
    svg.innerHTML = '<circle cx="150" cy="150" r="150" fill="#eee"/><text x="150" y="158" text-anchor="middle" fill="#aaa" font-size="16">无候选</text>';
    return;
  }
  if(n === 1){
    svg.innerHTML = `<circle cx="150" cy="150" r="150" fill="${COLORS[0]}"/><text x="150" y="158" text-anchor="middle">${escapeHtml(items[0])}</text>`;
    return;
  }
  const cx=150, cy=150, r=150;
  const angle = 360 / n;
  let html = '';
  for(let i=0; i<n; i++){
    const start = i * angle - 90;
    const end = start + angle;
    const sRad = start * Math.PI/180;
    const eRad = end * Math.PI/180;
    const x1 = cx + r * Math.cos(sRad);
    const y1 = cy + r * Math.sin(sRad);
    const x2 = cx + r * Math.cos(eRad);
    const y2 = cy + r * Math.sin(eRad);
    const large = angle > 180 ? 1 : 0;
    const color = COLORS[i % COLORS.length];
    html += `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z" fill="${color}" stroke="#fff" stroke-width="1.5"/>`;
    const tAngle = (start + angle/2) * Math.PI/180;
    const tr = r * 0.65;
    const tx = cx + tr * Math.cos(tAngle);
    const ty = cy + tr * Math.sin(tAngle);
    const rotDeg = start + angle/2 + 90;
    const label = items[i].length > 5 ? items[i].slice(0,5)+'…' : items[i];
    html += `<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle" transform="rotate(${rotDeg} ${tx} ${ty})">${escapeHtml(label)}</text>`;
  }
  svg.innerHTML = html;
}

function addItem(){
  const v = inputEl.value.trim();
  if(!v){ showToast('请输入内容'); return; }
  if(items.includes(v)){ showToast('已存在啦'); return; }
  if(items.length >= 16){ showToast('最多16个'); return; }
  items.push(v);
  inputEl.value = '';
  save(); renderList(); renderWheel();
}

function spin(){
  if(spinning) return;
  if(items.length === 0){ showToast('先添加候选'); return; }
  if(items.length === 1){
    resultName.textContent = items[0];
    resultEl.classList.add('win');
    showToast('只有一个，就它了');
    return;
  }
  spinning = true;
  spinBtn.disabled = true;
  resultEl.classList.remove('win');
  resultName.textContent = '???';

  const n = items.length;
  const angle = 360 / n;
  const winIdx = Math.floor(Math.random() * n);
  const targetAngle = winIdx * angle + angle/2;
  const rounds = 5 + Math.floor(Math.random()*3);
  const finalRot = currentRotation + rounds * 360 + (360 - targetAngle);
  currentRotation = finalRot;
  wheelEl.style.transform = `rotate(${finalRot}deg)`;

  setTimeout(()=>{
    spinning = false;
    spinBtn.disabled = false;
    resultName.textContent = items[winIdx];
    resultEl.classList.add('win');
    if(navigator.vibrate) navigator.vibrate(80);
  }, 4100);
}

listEl.addEventListener('click', e=>{
  if(e.target.classList.contains('del')){
    const i = +e.target.dataset.i;
    items.splice(i,1);
    save(); renderList(); renderWheel();
  }
});

$('addBtn').addEventListener('click', addItem);
inputEl.addEventListener('keydown', e=>{ if(e.key==='Enter') addItem(); });
spinBtn.addEventListener('click', spin);
$('resetBtn').addEventListener('click', ()=>{
  items = [...DEFAULT_LIST];
  save(); renderList(); renderWheel();
  showToast('已恢复默认');
});
$('clearBtn').addEventListener('click', ()=>{
  if(items.length === 0) return;
  items = [];
  save(); renderList(); renderWheel();
  showToast('已清空');
});

renderList();
renderWheel();
</script>
</body>
</html>
