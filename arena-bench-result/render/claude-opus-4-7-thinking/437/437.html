<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ 彩虹待办 · Rainbow Todo</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    background: linear-gradient(-45deg, #ff6b9d, #feca57, #48dbfb, #a29bfe, #1dd1a1);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 20px;
    overflow-x: hidden;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* 漂浮的装饰气泡 */
  .bubble {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0.4;
    animation: float 20s infinite ease-in-out;
    z-index: 0;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) translateX(0) scale(1); }
    25% { transform: translateY(-100px) translateX(50px) scale(1.1); }
    50% { transform: translateY(-50px) translateX(-80px) scale(0.9); }
    75% { transform: translateY(80px) translateX(30px) scale(1.05); }
  }

  .container {
    width: 100%;
    max-width: 600px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    border-radius: 30px;
    padding: 40px;
    box-shadow: 0 25px 70px rgba(0, 0, 0, 0.2),
                0 0 0 1px rgba(255, 255, 255, 0.5) inset;
    position: relative;
    z-index: 1;
    animation: slideUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes slideUp {
    from {
      opacity: 0;
      transform: translateY(60px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  h1 {
    text-align: center;
    font-size: 2.5em;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #ff6b9d, #feca57, #48dbfb, #a29bfe);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: rainbowMove 4s linear infinite;
    font-weight: 800;
  }

  @keyframes rainbowMove {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  .subtitle {
    text-align: center;
    color: #7f8c8d;
    margin-bottom: 30px;
    font-size: 0.95em;
  }

  /* 进度条 */
  .progress-wrapper {
    margin-bottom: 25px;
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 0.85em;
    color: #555;
    font-weight: 600;
  }

  .progress-bar {
    height: 12px;
    background: #f0f0f0;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff6b9d, #feca57, #48dbfb, #1dd1a1);
    background-size: 200% 100%;
    width: 0%;
    border-radius: 20px;
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    animation: shimmer 2s linear infinite;
  }

  @keyframes shimmer {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  /* 输入区域 */
  .input-group {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  #taskInput {
    flex: 1;
    padding: 15px 20px;
    border: 2px solid transparent;
    border-radius: 15px;
    font-size: 1em;
    background: #f8f9fa;
    transition: all 0.3s ease;
    outline: none;
  }

  #taskInput:focus {
    background: #fff;
    border-color: #a29bfe;
    box-shadow: 0 0 0 4px rgba(162, 155, 254, 0.2);
    transform: translateY(-2px);
  }

  #addBtn {
    padding: 15px 25px;
    border: none;
    border-radius: 15px;
    background: linear-gradient(135deg, #ff6b9d, #a29bfe);
    color: white;
    font-size: 1em;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 8px 20px rgba(255, 107, 157, 0.4);
    white-space: nowrap;
  }

  #addBtn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 12px 25px rgba(255, 107, 157, 0.5);
  }

  #addBtn:active {
    transform: translateY(0) scale(0.98);
  }

  /* 过滤器按钮 */
  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .filter-btn {
    padding: 8px 18px;
    border: none;
    border-radius: 20px;
    background: #f0f0f0;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.9em;
    color: #555;
    transition: all 0.3s ease;
  }

  .filter-btn:hover {
    background: #e0e0e0;
    transform: translateY(-2px);
  }

  .filter-btn.active {
    background: linear-gradient(135deg, #48dbfb, #a29bfe);
    color: white;
    box-shadow: 0 6px 15px rgba(72, 219, 251, 0.4);
  }

  /* 任务列表 */
  #taskList {
    list-style: none;
    max-height: 400px;
    overflow-y: auto;
    padding-right: 5px;
  }

  #taskList::-webkit-scrollbar {
    width: 8px;
  }

  #taskList::-webkit-scrollbar-track {
    background: #f0f0f0;
    border-radius: 10px;
  }

  #taskList::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #ff6b9d, #a29bfe);
    border-radius: 10px;
  }

  .task-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 15px 18px;
    margin-bottom: 10px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
    transition: all 0.3s ease;
    animation: taskEnter 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    overflow: hidden;
  }

  .task-item::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 5px;
    background: linear-gradient(180deg, var(--color1, #ff6b9d), var(--color2, #a29bfe));
  }

  @keyframes taskEnter {
    from {
      opacity: 0;
      transform: translateX(-30px) scale(0.9);
    }
    to {
      opacity: 1;
      transform: translateX(0) scale(1);
    }
  }

  @keyframes taskExit {
    to {
      opacity: 0;
      transform: translateX(100px) scale(0.8);
      margin: 0;
      padding: 0;
      height: 0;
    }
  }

  .task-item.removing {
    animation: taskExit 0.4s ease-in forwards;
  }

  .task-item:hover {
    transform: translateX(5px);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
  }

  .checkbox {
    width: 26px;
    height: 26px;
    border: 2.5px solid #ddd;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.3s ease;
    position: relative;
  }

  .checkbox:hover {
    border-color: #a29bfe;
    transform: scale(1.1);
  }

  .checkbox.checked {
    background: linear-gradient(135deg, #1dd1a1, #48dbfb);
    border-color: transparent;
    animation: checkPop 0.4s ease;
  }

  @keyframes checkPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }

  .checkbox.checked::after {
    content: '✓';
    color: white;
    font-weight: bold;
    font-size: 16px;
  }

  .task-text {
    flex: 1;
    font-size: 1em;
    color: #2c3e50;
    word-break: break-word;
    transition: all 0.3s ease;
  }

  .task-item.completed .task-text {
    text-decoration: line-through;
    color: #95a5a6;
    opacity: 0.7;
  }

  .delete-btn {
    background: none;
    border: none;
    color: #e74c3c;
    cursor: pointer;
    font-size: 1.3em;
    padding: 5px 10px;
    border-radius: 8px;
    opacity: 0.6;
    transition: all 0.3s ease;
  }

  .delete-btn:hover {
    opacity: 1;
    background: rgba(231, 76, 60, 0.1);
    transform: rotate(90deg) scale(1.1);
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #95a5a6;
  }

  .empty-state .emoji {
    font-size: 4em;
    margin-bottom: 15px;
    animation: bounce 2s ease-in-out infinite;
    display: inline-block;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  /* 五彩纸屑 */
  .confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    pointer-events: none;
    z-index: 9999;
    animation: confettiFall 1.5s ease-out forwards;
  }

  @keyframes confettiFall {
    0% {
      opacity: 1;
      transform: translateY(0) rotate(0);
    }
    100% {
      opacity: 0;
      transform: translateY(300px) rotate(720deg);
    }
  }

  /* 底部统计 */
  .footer {
    margin-top: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 20px;
    border-top: 2px dashed #eee;
    color: #7f8c8d;
    font-size: 0.9em;
  }

  .clear-btn {
    background: none;
    border: none;
    color: #e74c3c;
    cursor: pointer;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 8px;
    transition: all 0.3s ease;
  }

  .clear-btn:hover {
    background: rgba(231, 76, 60, 0.1);
    transform: scale(1.05);
  }

  @media (max-width: 500px) {
    .container { padding: 25px 20px; }
    h1 { font-size: 2em; }
    .input-group { flex-direction: column; }
  }
</style>
</head>
<body>

<!-- 装饰性气泡 -->
<div class="bubble" style="width:120px;height:120px;background:#ff6b9d;top:10%;left:5%;animation-delay:0s;"></div>
<div class="bubble" style="width:80px;height:80px;background:#feca57;top:20%;right:10%;animation-delay:3s;"></div>
<div class="bubble" style="width:150px;height:150px;background:#48dbfb;bottom:10%;left:15%;animation-delay:6s;"></div>
<div class="bubble" style="width:100px;height:100px;background:#a29bfe;bottom:20%;right:5%;animation-delay:9s;"></div>

<div class="container">
  <h1>🌈 彩虹待办</h1>
  <p class="subtitle">把想法变成行动，一项一项搞定 ✨</p>

  <div class="progress-wrapper">
    <div class="progress-info">
      <span id="progressText">进度 0%</span>
      <span id="taskCount">0 / 0 已完成</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="input-group">
    <input type="text" id="taskInput" placeholder="今天想做点什么呢？🎯" maxlength="80">
    <button id="addBtn">➕ 添加</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">🌟 全部</button>
    <button class="filter-btn" data-filter="active">🔥 进行中</button>
    <button class="filter-btn" data-filter="completed">✅ 已完成</button>
  </div>

  <ul id="taskList"></ul>

  <div class="footer">
    <span id="remainingText">✨ 开始你的一天</span>
    <button class="clear-btn" id="clearBtn">🗑️ 清除已完成</button>
  </div>
</div>

<script>
  const taskInput = document.getElementById('taskInput');
  const addBtn = document.getElementById('addBtn');
  const taskList = document.getElementById('taskList');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  const taskCount = document.getElementById('taskCount');
  const remainingText = document.getElementById('remainingText');
  const clearBtn = document.getElementById('clearBtn');
  const filterBtns = document.querySelectorAll('.filter-btn');

  const colorPairs = [
    ['#ff6b9d', '#feca57'],
    ['#48dbfb', '#a29bfe'],
    ['#1dd1a1', '#48dbfb'],
    ['#feca57', '#ff9ff3'],
    ['#a29bfe', '#ff6b9d'],
    ['#ff9ff3', '#feca57'],
    ['#54a0ff', '#5f27cd'],
  ];

  let tasks = JSON.parse(localStorage.getItem('rainbow-tasks') || '[]');
  let currentFilter = 'all';

  function saveTasks() {
    localStorage.setItem('rainbow-tasks', JSON.stringify(tasks));
  }

  function randomColors() {
    return colorPairs[Math.floor(Math.random() * colorPairs.length)];
  }

  function addTask() {
    const text = taskInput.value.trim();
    if (!text) {
      taskInput.style.animation = 'none';
      setTimeout(() => {
        taskInput.style.animation = 'shake 0.5s';
      }, 10);
      return;
    }
    const colors = randomColors();
    tasks.unshift({
      id: Date.now(),
      text,
      completed: false,
      color1: colors[0],
      color2: colors[1]
    });
    taskInput.value = '';
    saveTasks();
    render();
  }

  function toggleTask(id) {
    const task = tasks.find(t => t.id === id);
    if (task) {
      task.completed = !task.completed;
      if (task.completed) launchConfetti();
      saveTasks();
      render();
    }
  }

  function deleteTask(id) {
    const item = document.querySelector(`[data-id="${id}"]`);
    if (item) {
      item.classList.add('removing');
      setTimeout(() => {
        tasks = tasks.filter(t => t.id !== id);
        saveTasks();
        render();
      }, 400);
    }
  }

  function clearCompleted() {
    const completed = tasks.filter(t => t.completed);
    if (completed.length === 0) return;
    completed.forEach(t => {
      const el = document.querySelector(`[data-id="${t.id}"]`);
      if (el) el.classList.add('removing');
    });
    setTimeout(() => {
      tasks = tasks.filter(t => !t.completed);
      saveTasks();
      render();
    }, 400);
  }

  function render() {
    const filtered = tasks.filter(t => {
      if (currentFilter === 'active') return !t.completed;
      if (currentFilter === 'completed') return t.completed;
      return true;
    });

    taskList.innerHTML = '';

    if (filtered.length === 0) {
      const emojis = { all: '📝', active: '🎉', completed: '💫' };
      const msgs = {
        all: '还没有任务呢，添加一个开始吧',
        active: '太棒了，没有待办任务',
        completed: '还没有完成的任务，加油'
      };
      taskList.innerHTML = `
        <div class="empty-state">
          <div class="emoji">${emojis[currentFilter]}</div>
          <div>${msgs[currentFilter]}</div>
        </div>
      `;
    } else {
      filtered.forEach(task => {
        const li = document.createElement('li');
        li.className = 'task-item' + (task.completed ? ' completed' : '');
        li.dataset.id = task.id;
        li.style.setProperty('--color1', task.color1);
        li.style.setProperty('--color2', task.color2);
        li.innerHTML = `
          <div class="checkbox ${task.completed ? 'checked' : ''}" data-id="${task.id}"></div>
          <div class="task-text">${escapeHtml(task.text)}</div>
          <button class="delete-btn" data-delete="${task.id}">✕</button>
        `;
        taskList.appendChild(li);
      });
    }

    updateProgress();
  }

  function updateProgress() {
    const total = tasks.length;
    const done = tasks.filter(t => t.completed).length;
    const percent = total === 0 ? 0 : Math.round((done / total) * 100);
    progressFill.style.width = percent + '%';
    progressText.textContent = `进度 ${percent}%`;
    taskCount.textContent = `${done} / ${total} 已完成`;

    const remaining = total - done;
    if (total === 0) {
      remainingText.textContent = '✨ 开始你的一天';
    } else if (remaining === 0) {
      remainingText.textContent = '🎊 全部完成了，太棒了';
    } else {
      remainingText.textContent = `🔥 还剩 ${remaining} 项未完成`;
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function launchConfetti() {
    const colors = ['#ff6b9d', '#feca57', '#48dbfb', '#a29bfe', '#1dd1a1', '#ff9ff3'];
    for (let i = 0; i < 30; i++) {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * 100 + 'vw';
      confetti.style.top = Math.random() * 50 + 'vh';
      confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
      confetti.style.animationDelay = Math.random() * 0.3 + 's';
      confetti.style.width = (6 + Math.random() * 8) + 'px';
      confetti.style.height = confetti.style.width;
      confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      document.body.appendChild(confetti);
      setTimeout(() => confetti.remove(), 2000);
    }
  }

  // 事件委托
  taskList.addEventListener('click', (e) => {
    const checkbox = e.target.closest('.checkbox');
    const deleteBtn = e.target.closest('[data-delete]');
    if (checkbox) {
      toggleTask(Number(checkbox.dataset.id));
    } else if (deleteBtn) {
      deleteTask(Number(deleteBtn.dataset.delete));
    }
  });

  addBtn.addEventListener('click', addTask);
  taskInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') addTask();
  });

  clearBtn.addEventListener('click', clearCompleted);

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  // 添加 shake 动画
  const style = document.createElement('style');
  style.textContent = `
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
  `;
  document.head.appendChild(style);

  // 初始化：若本地无数据，添加欢迎示例
  if (tasks.length === 0) {
    const demo = [
      { id: Date.now() + 1, text: '🌅 享受美好的一天', completed: false, color1: '#ff6b9d', color2: '#feca57' },
      { id: Date.now() + 2, text: '💪 完成一个小目标', completed: false, color1: '#48dbfb', color2: '#a29bfe' },
      { id: Date.now() + 3, text: '☕ 喝一杯咖啡', completed: true, color1: '#1dd1a1', color2: '#48dbfb' },
    ];
    tasks = demo;
    saveTasks();
  }

  render();
</script>
</body>
</html>
