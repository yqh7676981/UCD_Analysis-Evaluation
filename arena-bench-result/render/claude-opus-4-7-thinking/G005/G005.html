<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>电子木鱼 · 功德 +1</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", serif;
    background: linear-gradient(160deg, #2c1810 0%, #4a2c1a 35%, #6b4423 70%, #8b6332 100%);
    color: #f5e6c8;
    position: fixed;
  }
  /* 烟雾光晕背景 */
  body::before {
    content: ""; position: absolute; top: 50%; left: 50%;
    width: 120vmin; height: 120vmin; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,200,120,0.15) 0%, rgba(255,180,80,0.05) 40%, transparent 70%);
    border-radius: 50%; pointer-events: none;
    animation: breathe 6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
  }

  .container {
    position: relative; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center;
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
  }

  .header {
    margin-top: 30px; text-align: center; z-index: 2;
  }
  .title {
    font-size: 28px; font-weight: 300; letter-spacing: 8px;
    color: #f5d68a; text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    margin-bottom: 6px;
  }
  .subtitle {
    font-size: 12px; letter-spacing: 4px; color: #c9a876;
    opacity: 0.85;
  }

  .stats {
    margin-top: 24px; display: flex; gap: 14px; z-index: 2;
  }
  .stat-card {
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(245, 214, 138, 0.25);
    border-radius: 14px;
    padding: 10px 18px; min-width: 110px;
    text-align: center;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .stat-label {
    font-size: 11px; color: #c9a876; letter-spacing: 2px; margin-bottom: 4px;
  }
  .stat-value {
    font-size: 22px; color: #f5d68a; font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  /* 木鱼容器 */
  .muyu-wrap {
    flex: 1; width: 100%;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .muyu {
    width: 240px; height: 240px;
    position: relative;
    cursor: pointer;
    transition: transform 0.08s ease-out;
    filter: drop-shadow(0 20px 30px rgba(0,0,0,0.5));
  }
  .muyu.tap { animation: tap 0.18s ease-out; }
  @keyframes tap {
    0% { transform: scale(1); }
    50% { transform: scale(0.92) translateY(4px); }
    100% { transform: scale(1); }
  }

  .muyu svg { width: 100%; height: 100%; display: block; }

  /* +1 功德 浮动文字 */
  .merit-pop {
    position: absolute;
    font-size: 22px; color: #ffe9a8;
    font-weight: 500;
    text-shadow: 0 0 12px rgba(255, 200, 100, 0.8), 0 2px 4px rgba(0,0,0,0.4);
    pointer-events: none;
    animation: pop 1.2s ease-out forwards;
    white-space: nowrap;
    z-index: 5;
  }
  @keyframes pop {
    0%   { opacity: 0; transform: translate(-50%, 0) scale(0.7); }
    20%  { opacity: 1; transform: translate(-50%, -20px) scale(1.1); }
    100% { opacity: 0; transform: translate(-50%, -120px) scale(1); }
  }

  .footer {
    z-index: 2; padding-bottom: 20px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .hint {
    font-size: 12px; color: #c9a876; letter-spacing: 3px;
    opacity: 0.75;
  }
  .controls {
    display: flex; gap: 10px;
  }
  .btn {
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(245, 214, 138, 0.3);
    color: #f5d68a;
    font-size: 12px; letter-spacing: 2px;
    padding: 8px 16px; border-radius: 20px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: all 0.2s;
  }
  .btn:active { background: rgba(245, 214, 138, 0.2); transform: scale(0.96); }

  /* 飘落花瓣 */
  .petal {
    position: absolute; top: -20px;
    width: 8px; height: 8px;
    background: radial-gradient(circle, #ffd9a8, #e8a878);
    border-radius: 50% 0 50% 50%;
    opacity: 0.6;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* 自动模式指示 */
  .auto-indicator {
    display: inline-block; width: 6px; height: 6px;
    border-radius: 50%; background: #ffb84d;
    margin-right: 6px; vertical-align: middle;
    box-shadow: 0 0 8px #ffb84d;
    animation: blink 1s infinite;
    display: none;
  }
  .auto-on .auto-indicator { display: inline-block; }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title">电 子 木 鱼</div>
    <div class="subtitle">心 静 自 然 凉</div>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">敲击次数</div>
      <div class="stat-value" id="totalCount">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">今日功德</div>
      <div class="stat-value" id="todayMerit">0</div>
    </div>
  </div>

  <div class="muyu-wrap" id="muyuWrap">
    <div class="muyu" id="muyu">
      <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="bodyGrad" cx="40%" cy="35%" r="70%">
            <stop offset="0%" stop-color="#d4915a"/>
            <stop offset="40%" stop-color="#a85f2e"/>
            <stop offset="80%" stop-color="#6b3818"/>
            <stop offset="100%" stop-color="#3d1f0c"/>
          </radialGradient>
          <radialGradient id="holeGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#1a0a04"/>
            <stop offset="100%" stop-color="#2d1408"/>
          </radialGradient>
          <linearGradient id="stickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#c9a075"/>
            <stop offset="100%" stop-color="#7a4a25"/>
          </linearGradient>
        </defs>
        <!-- 木鱼底部阴影 -->
        <ellipse cx="120" cy="210" rx="95" ry="10" fill="rgba(0,0,0,0.4)"/>
        <!-- 木鱼主体 -->
        <ellipse cx="120" cy="130" rx="100" ry="78" fill="url(#bodyGrad)"/>
        <!-- 鱼眼凹槽 -->
        <ellipse cx="80" cy="115" rx="14" ry="10" fill="#3d1f0c" opacity="0.6"/>
        <ellipse cx="78" cy="113" rx="6" ry="4" fill="#1a0a04"/>
        <!-- 中央敲击口 -->
        <ellipse cx="135" cy="135" rx="35" ry="8" fill="url(#holeGrad)"/>
        <!-- 鱼鳞纹路 -->
        <path d="M 50 130 Q 70 120 90 130" stroke="#3d1f0c" stroke-width="1.5" fill="none" opacity="0.5"/>
        <path d="M 50 145 Q 70 135 90 145" stroke="#3d1f0c" stroke-width="1.5" fill="none" opacity="0.5"/>
        <path d="M 50 160 Q 70 150 90 160" stroke="#3d1f0c" stroke-width="1.5" fill="none" opacity="0.5"/>
        <!-- 高光 -->
        <ellipse cx="95" cy="90" rx="40" ry="14" fill="rgba(255,220,160,0.25)"/>
        <!-- 鱼尾纹 -->
        <path d="M 200 130 Q 215 110 218 100" stroke="#3d1f0c" stroke-width="2" fill="none" opacity="0.6"/>
        <path d="M 200 130 Q 215 150 218 160" stroke="#3d1f0c" stroke-width="2" fill="none" opacity="0.6"/>
        <!-- 木槌 -->
        <g id="stick" transform="translate(170, 50) rotate(20)">
          <rect x="-3" y="0" width="6" height="50" rx="3" fill="url(#stickGrad)"/>
          <ellipse cx="0" cy="55" rx="10" ry="8" fill="url(#stickGrad)"/>
        </g>
      </svg>
    </div>
  </div>

  <div class="footer">
    <div class="hint" id="hint">轻 触 木 鱼 · 功 德 +1</div>
    <div class="controls">
      <button class="btn" id="autoBtn"><span class="auto-indicator"></span>自动敲击</button>
      <button class="btn" id="muteBtn">🔔 音效</button>
      <button class="btn" id="resetBtn">重置</button>
    </div>
  </div>
</div>

<script>
(function(){
  const muyu = document.getElementById('muyu');
  const muyuWrap = document.getElementById('muyuWrap');
  const totalEl = document.getElementById('totalCount');
  const meritEl = document.getElementById('todayMerit');
  const hintEl  = document.getElementById('hint');
  const autoBtn = document.getElementById('autoBtn');
  const muteBtn = document.getElementById('muteBtn');
  const resetBtn= document.getElementById('resetBtn');
  const stick   = document.getElementById('stick');

  const today = new Date().toDateString();
  const store = JSON.parse(localStorage.getItem('muyuData') || '{}');
  let total = store.total || 0;
  let merit = (store.date === today) ? (store.merit || 0) : 0;
  let muted = false;
  let autoTimer = null;

  totalEl.textContent = total;
  meritEl.textContent = merit;

  function save(){
    localStorage.setItem('muyuData', JSON.stringify({
      total: total, merit: merit, date: today
    }));
  }

  // Web Audio 木鱼音效
  let audioCtx = null;
  function getCtx(){
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
  }
  function playKnock(){
    if (muted) return;
    try {
      const ctx = getCtx();
      if (ctx.state === 'suspended') ctx.resume();
      const now = ctx.currentTime;

      // 主音 - 短促木质声
      const osc1 = ctx.createOscillator();
      const gain1 = ctx.createGain();
      osc1.type = 'triangle';
      osc1.frequency.setValueAtTime(280, now);
      osc1.frequency.exponentialRampToValueAtTime(80, now + 0.15);
      gain1.gain.setValueAtTime(0.6, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc1.connect(gain1).connect(ctx.destination);
      osc1.start(now); osc1.stop(now + 0.3);

      // 高频敲击瞬态
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.type = 'square';
      osc2.frequency.setValueAtTime(1200, now);
      osc2.frequency.exponentialRampToValueAtTime(200, now + 0.05);
      gain2.gain.setValueAtTime(0.15, now);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc2.connect(gain2).connect(ctx.destination);
      osc2.start(now); osc2.stop(now + 0.08);
    } catch(e){}
  }

  // +1 功德飘字
  const messages = ['功德 +1','福报 +1','善哉 善哉','心如止水','阿弥陀佛','功德 +1','无量寿福','禅意盎然'];
  function popMerit(x, y){
    const el = document.createElement('div');
    el.className = 'merit-pop';
    el.textContent = messages[Math.floor(Math.random()*messages.length)];
    const rect = muyuWrap.getBoundingClientRect();
    el.style.left = (x - rect.left) + 'px';
    el.style.top  = (y - rect.top - 30) + 'px';
    muyuWrap.appendChild(el);
    setTimeout(()=> el.remove(), 1200);
  }

  // 花瓣飘落
  function spawnPetal(){
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = (Math.random()*100) + 'vw';
    const dur = 6 + Math.random()*5;
    p.style.animationDuration = dur + 's';
    p.style.transform = 'rotate('+ (Math.random()*360) +'deg)';
    document.body.appendChild(p);
    setTimeout(()=> p.remove(), dur*1000 + 200);
  }
  setInterval(spawnPetal, 1200);

  // 木槌摆动
  function swingStick(){
    stick.style.transition = 'transform 0.08s ease-in';
    stick.style.transform = 'translate(170px, 50px) rotate(45deg)';
    setTimeout(()=>{
      stick.style.transition = 'transform 0.18s ease-out';
      stick.style.transform = 'translate(170px, 50px) rotate(20deg)';
    }, 80);
  }

  function knock(x, y){
    total++; merit++;
    totalEl.textContent = total;
    meritEl.textContent = merit;
    save();

    muyu.classList.remove('tap');
    void muyu.offsetWidth;
    muyu.classList.add('tap');

    swingStick();
    playKnock();
    popMerit(x, y);
  }

  // 触摸/点击事件
  function handleTap(e){
    e.preventDefault();
    let x, y;
    if (e.touches && e.touches[0]) {
      x = e.touches[0].clientX; y = e.touches[0].clientY;
    } else if (e.changedTouches && e.changedTouches[0]) {
      x = e.changedTouches[0].clientX; y = e.changedTouches[0].clientY;
    } else {
      const rect = muyu.getBoundingClientRect();
      x = e.clientX || (rect.left + rect.width/2);
      y = e.clientY || (rect.top + rect.height/2);
    }
    knock(x, y);
  }
  muyu.addEventListener('touchstart', handleTap, {passive:false});
  muyu.addEventListener('click', function(e){
    if (!('ontouchstart' in window)) handleTap(e);
  });

  // 自动敲击
  autoBtn.addEventListener('click', function(){
    if (autoTimer) {
      clearInterval(autoTimer); autoTimer = null;
      autoBtn.classList.remove('auto-on');
      autoBtn.innerHTML = '<span class="auto-indicator"></span>自动敲击';
    } else {
      autoBtn.classList.add('auto-on');
      autoBtn.innerHTML = '<span class="auto-indicator"></span>停止';
      autoTimer = setInterval(function(){
        const rect = muyu.getBoundingClientRect();
        knock(rect.left + rect.width/2, rect.top + rect.height/2);
      }, 800);
    }
  });

  // 静音
  muteBtn.addEventListener('click', function(){
    muted = !muted;
    muteBtn.textContent = muted ? '🔕 静音' : '🔔 音效';
  });

  // 重置
  resetBtn.addEventListener('click', function(){
    if (confirm('确定要重置功德吗？')) {
      total = 0; merit = 0;
      totalEl.textContent = 0;
      meritEl.textContent = 0;
      save();
    }
  });

  // 防止双击缩放
  document.addEventListener('gesturestart', e => e.preventDefault());
  let lastTouchEnd = 0;
  document.addEventListener('touchend', function(e){
    const now = Date.now();
    if (now - lastTouchEnd < 300) e.preventDefault();
    lastTouchEnd = now;
  }, {passive:false});
})();
</script>
</body>
</html>
