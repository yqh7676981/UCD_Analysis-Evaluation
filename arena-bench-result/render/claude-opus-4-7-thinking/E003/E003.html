<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>考研政治刷题</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #c41e3a 0%, #8b0000 100%);
  color: #333;
  min-height: 100vh;
  padding: 12px;
  font-size: 15px;
}
.app {
  max-width: 480px;
  margin: 0 auto;
  background: #fff;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  min-height: calc(100vh - 24px);
  display: flex;
  flex-direction: column;
}
.header {
  background: linear-gradient(135deg, #c41e3a, #a01829);
  color: #fff;
  padding: 16px 18px;
  position: relative;
}
.header h1 {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.header h1::before {
  content: "★";
  color: #ffd700;
}
.progress-info {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 8px;
  opacity: 0.95;
}
.progress-bar {
  height: 6px;
  background: rgba(255,255,255,0.25);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: #ffd700;
  border-radius: 3px;
  transition: width 0.4s ease;
  width: 0%;
}
.content {
  flex: 1;
  padding: 18px;
  overflow-y: auto;
}
.question-card {
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.q-num {
  display: inline-block;
  background: #c41e3a;
  color: #fff;
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 10px;
  margin-bottom: 10px;
  font-weight: 600;
}
.q-text {
  font-size: 16px;
  line-height: 1.6;
  color: #222;
  margin-bottom: 18px;
  font-weight: 500;
}
.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.option {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 13px 14px;
  background: #f7f7f9;
  border: 2px solid transparent;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 15px;
  line-height: 1.5;
  user-select: none;
}
.option:active { transform: scale(0.98); }
.option.selected {
  background: #fff5f5;
  border-color: #c41e3a;
}
.option.correct {
  background: #e8f8ed;
  border-color: #2ecc71;
  color: #1d6e3f;
}
.option.wrong {
  background: #fdecec;
  border-color: #e74c3c;
  color: #a02020;
}
.option-label {
  flex-shrink: 0;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid #ddd;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 13px;
  color: #666;
}
.option.selected .option-label {
  background: #c41e3a;
  border-color: #c41e3a;
  color: #fff;
}
.option.correct .option-label {
  background: #2ecc71;
  border-color: #2ecc71;
  color: #fff;
}
.option.wrong .option-label {
  background: #e74c3c;
  border-color: #e74c3c;
  color: #fff;
}
.option-text { flex: 1; padding-top: 2px; }
.footer {
  padding: 14px 18px;
  border-top: 1px solid #eee;
  background: #fff;
}
.btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  background: linear-gradient(135deg, #c41e3a, #a01829);
  color: #fff;
}
.btn:active { transform: scale(0.98); }
.btn:disabled {
  background: #ccc;
  cursor: not-allowed;
}
.btn.secondary {
  background: #f0f0f0;
  color: #333;
}
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }
/* Result */
.result {
  padding: 24px 18px;
  text-align: center;
  animation: fadeIn 0.4s;
}
.score-circle {
  width: 140px;
  height: 140px;
  margin: 0 auto 16px;
  border-radius: 50%;
  background: conic-gradient(#c41e3a var(--p), #f0f0f0 0);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.score-circle::before {
  content: "";
  position: absolute;
  inset: 10px;
  background: #fff;
  border-radius: 50%;
}
.score-text {
  position: relative;
  z-index: 1;
  text-align: center;
}
.score-num {
  font-size: 36px;
  font-weight: 700;
  color: #c41e3a;
  line-height: 1;
}
.score-label {
  font-size: 12px;
  color: #888;
  margin-top: 4px;
}
.result-tip {
  font-size: 16px;
  color: #333;
  margin-bottom: 20px;
  font-weight: 500;
}
.stats {
  display: flex;
  justify-content: space-around;
  background: #f7f7f9;
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 18px;
}
.stat-item {
  text-align: center;
}
.stat-num {
  font-size: 20px;
  font-weight: 700;
  color: #c41e3a;
}
.stat-label {
  font-size: 12px;
  color: #888;
  margin-top: 4px;
}
.analysis-title {
  font-size: 15px;
  font-weight: 600;
  color: #333;
  margin: 18px 0 10px;
  text-align: left;
  padding-left: 8px;
  border-left: 3px solid #c41e3a;
}
.wrong-item {
  background: #fff;
  border: 1px solid #f0d0d0;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;
  text-align: left;
}
.wrong-q {
  font-size: 14px;
  font-weight: 500;
  color: #333;
  margin-bottom: 8px;
  line-height: 1.5;
}
.wrong-ans {
  font-size: 13px;
  margin-bottom: 4px;
}
.your-ans { color: #e74c3c; }
.correct-ans { color: #2ecc71; }
.explain {
  font-size: 13px;
  color: #666;
  background: #fafafa;
  padding: 8px 10px;
  border-radius: 6px;
  margin-top: 6px;
  line-height: 1.6;
}
.no-wrong {
  text-align: center;
  padding: 30px 16px;
  color: #2ecc71;
  font-size: 15px;
}
.no-wrong .icon { font-size: 40px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>考研政治刷题</h1>
    <div class="progress-info">
      <span id="progressText">第 1 / 10 题</span>
      <span id="scoreText">已答 0 题</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>
  <div class="content" id="content"></div>
  <div class="footer" id="footer"></div>
</div>

<script>
const QUESTIONS = [
  {q:"马克思主义哲学的直接理论来源是（ ）",o:["古希腊罗马哲学","17世纪英国唯物主义哲学","18世纪法国唯物主义哲学","19世纪德国古典哲学"],a:3,e:"马克思主义哲学的直接理论来源是19世纪德国古典哲学，主要批判继承了黑格尔的辩证法和费尔巴哈的唯物主义。"},
  {q:"物质的唯一特性是（ ）",o:["运动","客观实在性","可知性","矛盾性"],a:1,e:"列宁指出，物质的唯一特性是客观实在性，即不依赖于人的意识而独立存在，并能为人的意识所反映。"},
  {q:"实践的最基本形式是（ ）",o:["科学实验","处理社会关系的实践","生产劳动实践","精神生产实践"],a:2,e:"生产劳动实践是人类最基本的实践活动，是决定其他一切实践活动的基础。"},
  {q:"在唯物辩证法看来，发展的实质是（ ）",o:["事物数量的增加","事物的一切运动变化","新事物的产生和旧事物的灭亡","事物根本性质的变化"],a:2,e:"发展的实质是新事物的产生和旧事物的灭亡，新事物代替旧事物的过程。"},
  {q:"剩余价值产生的源泉是（ ）",o:["雇佣工人的剩余劳动","不变资本","可变资本的价值","资本家的经营才能"],a:0,e:"剩余价值是由雇佣工人在剩余劳动时间内创造的、被资本家无偿占有的超过劳动力价值的那部分价值。"},
  {q:"毛泽东思想形成的标志是（ ）",o:["农村包围城市革命道路理论的提出","新民主主义革命理论的完整论述","《实践论》《矛盾论》的发表","党的七大召开"],a:0,e:"以《中国的红色政权为什么能够存在？》《井冈山的斗争》等为标志，毛泽东提出农村包围城市、武装夺取政权的革命道路理论，标志毛泽东思想的初步形成。"},
  {q:"邓小平理论的精髓是（ ）",o:["解放思想、实事求是","和平与发展","一国两制","社会主义本质论"],a:0,e:"解放思想、实事求是是邓小平理论的精髓，是马克思主义中国化各项理论成果的精髓。"},
  {q:"中国特色社会主义最本质的特征是（ ）",o:["共同富裕","以人民为中心","中国共产党领导","改革开放"],a:2,e:"习近平指出，中国共产党领导是中国特色社会主义最本质的特征，是中国特色社会主义制度的最大优势。"},
  {q:"我国社会主义初级阶段的主要矛盾是（ ）",o:["人民日益增长的物质文化需要同落后的社会生产之间的矛盾","人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾","无产阶级和资产阶级之间的矛盾","公有制和私有制之间的矛盾"],a:1,e:"党的十九大报告指出，新时代我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。"},
  {q:"实现中华民族伟大复兴的必由之路是（ ）",o:["改革开放","科教兴国","中国特色社会主义道路","和平发展"],a:2,e:"中国特色社会主义道路是实现社会主义现代化、创造人民美好生活的必由之路，是实现中华民族伟大复兴的必由之路。"}
];

let questions = [], current = 0, answers = [], finished = false;

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startQuiz(){
  questions = shuffle(QUESTIONS);
  current = 0;
  answers = new Array(questions.length).fill(null);
  finished = false;
  render();
}

function selectOption(idx){
  if(finished) return;
  answers[current] = idx;
  render();
}

function nextQ(){
  if(answers[current] === null) return;
  if(current < questions.length - 1){
    current++;
    render();
  } else {
    finished = true;
    renderResult();
  }
}

function prevQ(){
  if(current > 0){ current--; render(); }
}

function render(){
  const q = questions[current];
  const sel = answers[current];
  const answered = answers.filter(a => a !== null).length;
  document.getElementById('progressText').textContent = `第 ${current+1} / ${questions.length} 题`;
  document.getElementById('scoreText').textContent = `已答 ${answered} 题`;
  document.getElementById('progressFill').style.width = ((current+1)/questions.length*100) + '%';

  const labels = ['A','B','C','D'];
  let html = '<div class="question-card">';
  html += `<div class="q-num">第 ${current+1} 题 / 共 ${questions.length} 题</div>`;
  html += `<div class="q-text">${q.q}</div>`;
  html += '<div class="options">';
  q.o.forEach((opt, i) => {
    const cls = sel === i ? 'option selected' : 'option';
    html += `<div class="${cls}" onclick="selectOption(${i})"><div class="option-label">${labels[i]}</div><div class="option-text">${opt}</div></div>`;
  });
  html += '</div></div>';
  document.getElementById('content').innerHTML = html;

  let footerHtml = '<div class="btn-row">';
  if(current > 0){
    footerHtml += '<button class="btn secondary" onclick="prevQ()">上一题</button>';
  }
  const isLast = current === questions.length - 1;
  const disabled = sel === null ? 'disabled' : '';
  footerHtml += `<button class="btn" ${disabled} onclick="nextQ()">${isLast ? '提交答卷' : '下一题'}</button>`;
  footerHtml += '</div>';
  document.getElementById('footer').innerHTML = footerHtml;
}

function renderResult(){
  let correct = 0;
  const wrongs = [];
  questions.forEach((q, i) => {
    if(answers[i] === q.a) correct++;
    else wrongs.push({q, idx: i, your: answers[i]});
  });
  const total = questions.length;
  const score = Math.round(correct / total * 100);
  const percent = (correct / total * 360) + 'deg';

  let tip = '';
  if(score === 100) tip = '满分！理论功底扎实 🏆';
  else if(score >= 80) tip = '表现优秀，继续加油！';
  else if(score >= 60) tip = '基础尚可，仍需巩固';
  else tip = '需要多加练习哦';

  document.getElementById('progressText').textContent = '答题完成';
  document.getElementById('scoreText').textContent = `得分 ${score}`;
  document.getElementById('progressFill').style.width = '100%';

  const labels = ['A','B','C','D'];
  let html = '<div class="result">';
  html += `<div class="score-circle" style="--p:${percent}"><div class="score-text"><div class="score-num">${score}</div><div class="score-label">总分 100</div></div></div>`;
  html += `<div class="result-tip">${tip}</div>`;
  html += `<div class="stats">
    <div class="stat-item"><div class="stat-num">${total}</div><div class="stat-label">总题数</div></div>
    <div class="stat-item"><div class="stat-num" style="color:#2ecc71">${correct}</div><div class="stat-label">答对</div></div>
    <div class="stat-item"><div class="stat-num" style="color:#e74c3c">${wrongs.length}</div><div class="stat-label">答错</div></div>
  </div>`;

  if(wrongs.length === 0){
    html += '<div class="no-wrong"><div class="icon">🎉</div>全部答对，太厉害了！</div>';
  } else {
    html += '<div class="analysis-title">错题解析</div>';
    wrongs.forEach(w => {
      const yourLabel = w.your !== null ? labels[w.your] + '. ' + w.q.o[w.your] : '未作答';
      const correctLabel = labels[w.q.a] + '. ' + w.q.o[w.q.a];
      html += `<div class="wrong-item">
        <div class="wrong-q">${w.idx+1}. ${w.q.q}</div>
        <div class="wrong-ans your-ans">你的答案：${yourLabel}</div>
        <div class="wrong-ans correct-ans">正确答案：${correctLabel}</div>
        <div class="explain">📖 ${w.q.e}</div>
      </div>`;
    });
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
  document.getElementById('footer').innerHTML = '<button class="btn" onclick="startQuiz()">再来一组</button>';
}

startQuiz();
</script>
</body>
</html>
