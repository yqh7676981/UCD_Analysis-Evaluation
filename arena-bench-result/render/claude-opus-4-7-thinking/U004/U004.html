<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>旅行行程规划</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #333;
  min-height: 100vh;
  padding-bottom: 80px;
  font-size: 14px;
}
.app {
  max-width: 480px;
  margin: 0 auto;
  position: relative;
}
.header {
  padding: 24px 20px 28px;
  color: #fff;
  position: relative;
}
.header h1 {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.header p {
  font-size: 13px;
  opacity: 0.9;
}
.trip-info {
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(10px);
  border-radius: 14px;
  padding: 14px;
  margin-top: 16px;
  display: grid;
  gap: 10px;
}
.trip-info input {
  width: 100%;
  background: rgba(255,255,255,0.95);
  border: none;
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 14px;
  outline: none;
  color: #333;
}
.trip-info input::placeholder { color: #aaa; }

.content {
  background: #f5f6fa;
  border-radius: 24px 24px 0 0;
  padding: 20px 16px 24px;
  min-height: 60vh;
}
.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  padding: 0 4px;
}
.section-title h2 {
  font-size: 17px;
  color: #2d3142;
  font-weight: 600;
}
.day-count {
  font-size: 12px;
  color: #667eea;
  background: #eef0ff;
  padding: 4px 10px;
  border-radius: 12px;
  font-weight: 600;
}

.day-card {
  background: #fff;
  border-radius: 16px;
  margin-bottom: 14px;
  overflow: hidden;
  box-shadow: 0 4px 14px rgba(0,0,0,0.05);
  animation: slideUp 0.3s ease;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.day-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
  cursor: pointer;
}
.day-header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.day-num {
  background: rgba(255,255,255,0.25);
  width: 32px;
  height: 32px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13px;
}
.day-title { font-size: 15px; font-weight: 600; }
.day-date { font-size: 11px; opacity: 0.85; margin-top: 2px; }
.day-actions { display: flex; gap: 6px; }
.icon-btn {
  background: rgba(255,255,255,0.2);
  border: none;
  color: #fff;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.icon-btn:active { background: rgba(255,255,255,0.35); }

.day-body {
  padding: 14px 14px 6px;
  display: none;
}
.day-card.open .day-body { display: block; }
.day-card.open .toggle-icon { transform: rotate(180deg); }
.toggle-icon { transition: transform 0.3s; display: inline-block; }

.category {
  margin-bottom: 14px;
}
.category-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: #2d3142;
  margin-bottom: 8px;
}
.cat-icon {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
}
.cat-icon.spot { background: #ffe9d6; }
.cat-icon.trans { background: #d6e9ff; }
.cat-icon.food { background: #ffd6e2; }

.item-list { display: flex; flex-direction: column; gap: 6px; }
.item-row {
  display: flex;
  gap: 6px;
  align-items: center;
}
.item-row input {
  flex: 1;
  border: 1px solid #e8eaf0;
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 13px;
  outline: none;
  background: #fafbfc;
  transition: all 0.2s;
}
.item-row input:focus {
  border-color: #667eea;
  background: #fff;
}
.del-btn {
  background: #fff0f0;
  border: none;
  color: #ff6b6b;
  width: 34px;
  height: 34px;
  border-radius: 10px;
  font-size: 14px;
  cursor: pointer;
  flex-shrink: 0;
}
.del-btn:active { background: #ffe0e0; }

.add-item {
  width: 100%;
  border: 1px dashed #c8cdd9;
  background: transparent;
  border-radius: 10px;
  padding: 8px;
  color: #667eea;
  font-size: 12px;
  cursor: pointer;
  margin-top: 4px;
}
.add-item:active { background: #eef0ff; }

.add-day-btn {
  width: 100%;
  background: #fff;
  border: 2px dashed #667eea;
  color: #667eea;
  padding: 14px;
  border-radius: 14px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 14px;
}
.add-day-btn:active { background: #eef0ff; }

.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #fff;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
  display: flex;
  gap: 10px;
  z-index: 50;
  max-width: 480px;
  margin: 0 auto;
}
.btn {
  flex: 1;
  padding: 13px;
  border-radius: 12px;
  border: none;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.1s;
}
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
}
.btn-secondary {
  background: #eef0ff;
  color: #667eea;
}

.empty {
  text-align: center;
  padding: 40px 20px;
  color: #9ca3af;
}
.empty-icon { font-size: 44px; margin-bottom: 10px; }
.empty p { font-size: 13px; }

/* Modal handbook */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.modal.show { display: flex; animation: fadeIn 0.25s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal-content {
  background: #fff;
  width: 100%;
  max-width: 480px;
  height: 92vh;
  border-radius: 20px 20px 0 0;
  display: flex;
  flex-direction: column;
  animation: slideInUp 0.3s;
}
@keyframes slideInUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid #eef0f4;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-header h3 { font-size: 16px; color: #2d3142; }
.close-btn {
  background: #f5f6fa;
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 16px;
  cursor: pointer;
  color: #666;
}
.handbook {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}
.hb-cover {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
  padding: 28px 20px;
  border-radius: 16px;
  margin-bottom: 20px;
  text-align: center;
}
.hb-cover h2 { font-size: 22px; margin-bottom: 8px; }
.hb-cover .meta { font-size: 13px; opacity: 0.9; }
.hb-day {
  margin-bottom: 22px;
  padding-bottom: 18px;
  border-bottom: 1px dashed #e0e3eb;
}
.hb-day:last-child { border-bottom: none; }
.hb-day-title {
  font-size: 16px;
  color: #2d3142;
  font-weight: 700;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.hb-day-title::before {
  content: '';
  width: 4px;
  height: 16px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  border-radius: 2px;
}
.hb-cat {
  margin-bottom: 10px;
  background: #f9fafc;
  border-radius: 10px;
  padding: 10px 12px;
}
.hb-cat-title {
  font-size: 13px;
  color: #667eea;
  font-weight: 600;
  margin-bottom: 6px;
}
.hb-cat ul { list-style: none; padding: 0; }
.hb-cat li {
  font-size: 13px;
  color: #444;
  padding: 4px 0 4px 16px;
  position: relative;
  line-height: 1.5;
}
.hb-cat li::before {
  content: '';
  position: absolute;
  left: 4px;
  top: 11px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #667eea;
}
.hb-empty { color: #aaa; font-size: 12px; font-style: italic; }

.toast {
  position: fixed;
  top: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.8);
  color: #fff;
  padding: 10px 18px;
  border-radius: 20px;
  font-size: 13px;
  z-index: 200;
  opacity: 1; /* fixed: was 0 */
  transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }
</style>
<style id="screenshot-fix">
/* 仅处理滚动懒加载：让 opacity:0 的元素可见，但排除 toast/弹窗 */
.reveal:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.fade-in:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.fade:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.lazy:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.stagger-item:not(.toast):not([class*="modal"]):not([class*="overlay"]),
.animate:not(.toast):not([class*="modal"]):not([class*="overlay"]) {
  opacity: 1 !important;
  visibility: visible !important;
}
/* 特别确保弹窗/侧边栏/Toast 保持隐藏（它们通过其他类控制显示） */
.modal-overlay:not(.show):not(.active),
.confirm-overlay:not(.show):not(.active),
[class*="modal"]:not(.show):not(.active):not([class*="stagger"]),
[class*="overlay"]:not(.show):not(.active):not([class*="scroll"]),
.toast:not(.show),
[id*="toast"]:not(.show):not(.active),
[id*="cart"],
[id*="sidebar"] {
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
}
/* 排除 toast 类，避免强制显示 */
.reveal:not(.toast), .fade-in:not(.toast), .fade:not(.toast), .lazy:not(.toast), .stagger-item:not(.toast), .animate:not(.toast) {
  opacity: 1 !important;
  visibility: visible !important;
}
/* 强制显示主要内容区域（section 下的直接子元素），但排除移动菜单 */
section > div:not(.mobile-menu):not([id*="mobile-menu"]):not([id*="menu"]) {
  opacity: 1 !important;
}
</style></head>
<body>
<div class="app">
  <div class="header">
    <h1>✈️ 旅行行程规划</h1>
    <p>记录每一天的精彩，生成专属手册</p>
    <div class="trip-info">
      <input type="text" id="tripTitle" placeholder="✏️ 旅行主题（如：日本关西七日游）">
      <input type="text" id="tripDest" placeholder="📍 目的地">
    </div>
  </div>

  <div class="content">
    <div class="section-title">
      <h2>📅 行程安排</h2>
      <span class="day-count" id="dayCount">共 0 天</span>
    </div>

    <div id="daysContainer"></div>

    <button class="add-day-btn" onclick="addDay()">＋ 添加新的一天</button>
  </div>

  <div class="bottom-bar">
    <button class="btn btn-secondary" onclick="saveData()">💾 保存</button>
    <button class="btn btn-primary" onclick="generateHandbook()">📖 生成手册</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>📖 我的旅行手册</h3>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="handbook" id="handbook"></div>
    <div class="bottom-bar" style="position:relative;box-shadow:none;border-top:1px solid #eef0f4;">
      <button class="btn btn-secondary" onclick="closeModal()">关闭</button>
      <button class="btn btn-primary" onclick="exportHandbook()">📤 导出文本</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let days = [];

function uid() { return Date.now() + Math.random().toString(36).substr(2, 5); }

function createDay(date = '') {
  return {
    id: uid(),
    date: date,
    spots: [''],
    trans: [''],
    foods: ['']
  };
}

function addDay() {
  days.push(createDay());
  render();
  setTimeout(() => {
    const cards = document.querySelectorAll('.day-card');
    if (cards.length) cards[cards.length - 1].scrollIntoView({behavior:'smooth', block:'center'});
  }, 50);
}

function deleteDay(id) {
  if (!confirm('确定要删除这一天吗？')) return;
  days = days.filter(d => d.id !== id);
  render();
}

function toggleDay(id) {
  const card = document.querySelector(`[data-day="${id}"]`);
  if (card) card.classList.toggle('open');
}

function updateField(id, field, idx, val) {
  const day = days.find(d => d.id === id);
  if (!day) return;
  if (field === 'date') day.date = val;
  else day[field][idx] = val;
}

function addItem(id, field) {
  const day = days.find(d => d.id === id);
  if (!day) return;
  day[field].push('');
  render(id);
}

function removeItem(id, field, idx) {
  const day = days.find(d => d.id === id);
  if (!day || day[field].length <= 1) {
    if (day) day[field][idx] = '';
    render(id);
    return;
  }
  day[field].splice(idx, 1);
  render(id);
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderItems(id, field, items, placeholder) {
  return items.map((v, i) => `
    <div class="item-row">
      <input type="text" value="${escapeHtml(v)}" placeholder="${placeholder}"
        oninput="updateField('${id}','${field}',${i},this.value)">
      <button class="del-btn" onclick="removeItem('${id}','${field}',${i})">✕</button>
    </div>
  `).join('');
}

function render(openId = null) {
  const container = document.getElementById('daysContainer');
  document.getElementById('dayCount').textContent = `共 ${days.length} 天`;

  if (!days.length) {
    container.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🗺️</div>
        <p>还没有行程，点击下方添加第一天吧</p>
      </div>`;
    return;
  }

  // preserve open states
  const openSet = new Set();
  document.querySelectorAll('.day-card.open').forEach(c => openSet.add(c.dataset.day));
  if (openId) openSet.add(openId);

  container.innerHTML = days.map((d, idx) => `
    <div class="day-card ${openSet.has(d.id) || days.length === 1 ? 'open' : ''}" data-day="${d.id}">
      <div class="day-header" onclick="toggleDay('${d.id}')">
        <div class="day-header-left">
          <div class="day-num">D${idx + 1}</div>
          <div>
            <div class="day-title">第 ${idx + 1} 天</div>
            <div class="day-date">${d.date || '点击展开编辑'}</div>
          </div>
        </div>
        <div class="day-actions" onclick="event.stopPropagation()">
          <button class="icon-btn" onclick="deleteDay('${d.id}')">🗑</button>
          <button class="icon-btn" onclick="toggleDay('${d.id}')"><span class="toggle-icon">▼</span></button>
        </div>
      </div>
      <div class="day-body">
        <div class="category">
          <div class="category-label">📆 日期</div>
          <input type="date" class="item-row" style="width:100%;border:1px solid #e8eaf0;border-radius:10px;padding:10px 12px;font-size:13px;background:#fafbfc;outline:none;"
            value="${escapeHtml(d.date)}"
            oninput="updateField('${d.id}','date',0,this.value)">
        </div>
        <div class="category">
          <div class="category-label"><span class="cat-icon spot">🏛</span>景点安排</div>
          <div class="item-list">${renderItems(d.id, 'spots', d.spots, '如：故宫博物院 09:00-12:00')}</div>
          <button class="add-item" onclick="addItem('${d.id}','spots')">＋ 添加景点</button>
        </div>
        <div class="category">
          <div class="category-label"><span class="cat-icon trans">🚗</span>交通方式</div>
          <div class="item-list">${renderItems(d.id, 'trans', d.trans, '如：地铁2号线 → 王府井站')}</div>
          <button class="add-item" onclick="addItem('${d.id}','trans')">＋ 添加交通</button>
        </div>
        <div class="category">
          <div class="category-label"><span class="cat-icon food">🍜</span>餐厅安排</div>
          <div class="item-list">${renderItems(d.id, 'foods', d.foods, '如：午餐 - 全聚德烤鸭')}</div>
          <button class="add-item" onclick="addItem('${d.id}','foods')">＋ 添加餐厅</button>
        </div>
      </div>
    </div>
  `).join('');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function saveData() {
  const data = {
    title: document.getElementById('tripTitle').value,
    dest: document.getElementById('tripDest').value,
    days: days
  };
  try {
    localStorage.setItem('travel_plan', JSON.stringify(data));
    showToast('✓ 已保存到本地');
  } catch(e) {
    showToast('保存失败');
  }
}

function loadData() {
  try {
    const raw = localStorage.getItem('travel_plan');
    if (!raw) return;
    const data = JSON.parse(raw);
    document.getElementById('tripTitle').value = data.title || '';
    document.getElementById('tripDest').value = data.dest || '';
    days = (data.days || []).map(d => ({
      id: d.id || uid(),
      date: d.date || '',
      spots: d.spots && d.spots.length ? d.spots : [''],
      trans: d.trans && d.trans.length ? d.trans : [''],
      foods: d.foods && d.foods.length ? d.foods : ['']
    }));
  } catch(e) {}
}

function clean(arr) { return arr.filter(s => s && s.trim()); }

function generateHandbook() {
  if (!days.length) {
    showToast('请先添加行程');
    return;
  }
  const title = document.getElementById('tripTitle').value || '我的旅行';
  const dest = document.getElementById('tripDest').value || '';
  const totalDays = days.length;

  let html = `
    <div class="hb-cover">
      <h2>${escapeHtml(title)}</h2>
      <div class="meta">${escapeHtml(dest)} · ${totalDays} 天行程</div>
    </div>
  `;

  days.forEach((d, i) => {
    const spots = clean(d.spots);
    const trans = clean(d.trans);
    const foods = clean(d.foods);
    html += `<div class="hb-day">
      <div class="hb-day-title">第 ${i + 1} 天 ${d.date ? '· ' + escapeHtml(d.date) : ''}</div>`;

    html += `<div class="hb-cat"><div class="hb-cat-title">🏛 景点安排</div>`;
    html += spots.length ? `<ul>${spots.map(s=>`<li>${escapeHtml(s)}</li>`).join('')}</ul>` : `<div class="hb-empty">暂无安排</div>`;
    html += `</div>`;

    html += `<div class="hb-cat"><div class="hb-cat-title">🚗 交通方式</div>`;
    html += trans.length ? `<ul>${trans.map(s=>`<li>${escapeHtml(s)}</li>`).join('')}</ul>` : `<div class="hb-empty">暂无安排</div>`;
    html += `</div>`;

    html += `<div class="hb-cat"><div class="hb-cat-title">🍜 餐厅安排</div>`;
    html += foods.length ? `<ul>${foods.map(s=>`<li>${escapeHtml(s)}</li>`).join('')}</ul>` : `<div class="hb-empty">暂无安排</div>`;
    html += `</div></div>`;
  });

  document.getElementById('handbook').innerHTML = html;
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

function exportHandbook() {
  const title = document.getElementById('tripTitle').value || '我的旅行';
  const dest = document.getElementById('tripDest').value || '';
  let txt = `${title}\n${dest} · 共 ${days.length} 天\n${'='.repeat(28)}\n\n`;
  days.forEach((d, i) => {
    txt += `【第 ${i+1} 天】${d.date ? ' ' + d.date : ''}\n`;
    txt += `🏛 景点：\n${clean(d.spots).map(s=>'  · '+s).join('\n') || '  （无）'}\n`;
    txt += `🚗 交通：\n${clean(d.trans).map(s=>'  · '+s).join('\n') || '  （无）'}\n`;
    txt += `🍜 餐厅：\n${clean(d.foods).map(s=>'  · '+s).join('\n') || '  （无）'}\n\n`;
  });
  const blob = new Blob([txt], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${title}.txt`;
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('✓ 已导出');
}

// init
loadData();
if (!days.length) days.push(createDay());
render();
</script>
</body>
</html>
