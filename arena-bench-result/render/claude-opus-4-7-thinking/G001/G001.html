<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>飞机大战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
#wrap{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:linear-gradient(180deg,#0a0e2a 0%,#1a1f4e 50%,#0a0e2a 100%)}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:15px;font-weight:600;text-shadow:0 0 8px rgba(0,200,255,.6);pointer-events:none;z-index:10}
#hud .item{background:rgba(0,30,60,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:6px 12px;border-radius:20px;border:1px solid rgba(0,200,255,.3)}
#score-num{color:#ffd54a}
#hp-bar{display:inline-block;width:70px;height:8px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden;vertical-align:middle;margin-left:6px}
#hp-fill{height:100%;width:100%;background:linear-gradient(90deg,#ff5252,#ffeb3b,#4caf50);transition:width .3s}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,5,20,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:20;color:#fff;text-align:center;padding:20px}
#overlay h1{font-size:32px;margin-bottom:10px;background:linear-gradient(90deg,#00e5ff,#ffd54a);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:2px}
#overlay p{font-size:14px;color:#9fb;margin-bottom:8px;line-height:1.6}
#overlay .final{font-size:20px;color:#ffd54a;margin:14px 0}
#startBtn{margin-top:18px;padding:14px 42px;font-size:17px;font-weight:700;color:#001833;background:linear-gradient(135deg,#00e5ff,#00b8d4);border:none;border-radius:30px;box-shadow:0 6px 20px rgba(0,200,255,.5);cursor:pointer;letter-spacing:3px}
#startBtn:active{transform:scale(.96)}
.hidden{display:none!important}
.tip{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.45);font-size:11px;z-index:10;pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game"></canvas>
<div id="hud">
<div class="item">得分 <span id="score-num">0</span></div>
<div class="item">HP<span id="hp-bar"><span id="hp-fill"></span></span></div>
</div>
<div class="tip">触摸屏幕拖动 / 方向键移动</div>
<div id="overlay">
<h1>飞机大战</h1>
<p>方向键 或 触摸拖动 控制飞机</p>
<p>自动发射子弹，击落敌机得分</p>
<div class="final hidden" id="finalScore"></div>
<button id="startBtn">开 始</button>
</div>
</div>
<script>
(function(){
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');
const scoreEl=document.getElementById('score-num'),hpFill=document.getElementById('hp-fill');
const overlay=document.getElementById('overlay'),startBtn=document.getElementById('startBtn'),finalScore=document.getElementById('finalScore');
let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
function resize(){W=cvs.clientWidth=window.innerWidth;H=cvs.clientHeight=window.innerHeight;cvs.width=W*DPR;cvs.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
window.addEventListener('resize',resize);resize();

const stars=[];for(let i=0;i<70;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.6+.4,v:Math.random()*1.5+.5});

const player={x:W/2,y:H-100,w:38,h:44,hp:100,cool:0,inv:0};
let bullets=[],enemies=[],particles=[],powerups=[];
let score=0,gameOver=false,running=false,enemyTimer=0,powerTimer=0,level=1,frame=0;
let powerLv=1;

const keys={};
window.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()},{passive:false});
window.addEventListener('keyup',e=>{keys[e.key]=false});

let touching=false,touchOff={x:0,y:0};
cvs.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0],r=cvs.getBoundingClientRect();touching=true;touchOff.x=t.clientX-r.left-player.x;touchOff.y=t.clientY-r.top-player.y},{passive:false});
cvs.addEventListener('touchmove',e=>{e.preventDefault();if(!touching||!running)return;const t=e.touches[0],r=cvs.getBoundingClientRect();player.x=Math.max(player.w/2,Math.min(W-player.w/2,t.clientX-r.left-touchOff.x));player.y=Math.max(player.h/2,Math.min(H-player.h/2,t.clientY-r.top-touchOff.y))},{passive:false});
cvs.addEventListener('touchend',e=>{e.preventDefault();touching=false},{passive:false});

function reset(){
 player.x=W/2;player.y=H-100;player.hp=100;player.cool=0;player.inv=0;
 bullets=[];enemies=[];particles=[];powerups=[];
 score=0;gameOver=false;enemyTimer=0;powerTimer=0;level=1;frame=0;powerLv=1;
 updHUD();
}
function updHUD(){scoreEl.textContent=score;hpFill.style.width=Math.max(0,player.hp)+'%'}

function spawnEnemy(){
 const big=Math.random()<.12+level*.02;
 const fast=!big&&Math.random()<.25;
 const w=big?52:32,h=big?54:34;
 enemies.push({
  x:Math.random()*(W-w)+w/2,y:-h,w:w,h:h,
  vy:big?(1.2+level*.1):(fast?(3.5+level*.2):(2+level*.15)),
  vx:fast?(Math.random()*2-1):0,
  hp:big?6:1,max:big?6:1,big:big,fast:fast,score:big?50:(fast?20:10)
 });
}
function spawnPower(x,y){powerups.push({x,y,vy:1.5,r:12,t:Math.random()<.5?'P':'H'})}

function shoot(){
 if(player.cool>0)return;
 player.cool=Math.max(4,12-powerLv*2);
 if(powerLv===1){bullets.push({x:player.x,y:player.y-22,vx:0,vy:-9,w:4,h:12,c:'#7df'})}
 else if(powerLv===2){bullets.push({x:player.x-7,y:player.y-18,vx:0,vy:-9,w:4,h:12,c:'#7df'});bullets.push({x:player.x+7,y:player.y-18,vx:0,vy:-9,w:4,h:12,c:'#7df'})}
 else{bullets.push({x:player.x,y:player.y-22,vx:0,vy:-10,w:5,h:14,c:'#ffd54a'});bullets.push({x:player.x-10,y:player.y-16,vx:-1.2,vy:-9,w:4,h:12,c:'#7df'});bullets.push({x:player.x+10,y:player.y-16,vx:1.2,vy:-9,w:4,h:12,c:'#7df'})}
}

function explode(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*3+1;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30,c:c||'#ff7'})}}

function update(){
 frame++;
 for(const s of stars){s.y+=s.v;if(s.y>H){s.y=0;s.x=Math.random()*W}}

 if(running&&!gameOver){
  const sp=4.2;
  if(keys.ArrowLeft||keys.a)player.x-=sp;
  if(keys.ArrowRight||keys.d)player.x+=sp;
  if(keys.ArrowUp||keys.w)player.y-=sp;
  if(keys.ArrowDown||keys.s)player.y+=sp;
  player.x=Math.max(player.w/2,Math.min(W-player.w/2,player.x));
  player.y=Math.max(player.h/2,Math.min(H-player.h/2,player.y));

  if(player.cool>0)player.cool--;
  if(player.inv>0)player.inv--;
  shoot();

  enemyTimer--;
  const rate=Math.max(18,50-level*3);
  if(enemyTimer<=0){spawnEnemy();enemyTimer=rate}
  if(score>0&&score>level*150)level++;

  powerTimer--;
  if(powerTimer<=0){powerTimer=600+Math.random()*400}
 }

 for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.vx;b.y+=b.vy;if(b.y<-20||b.x<-20||b.x>W+20)bullets.splice(i,1)}

 for(let i=enemies.length-1;i>=0;i--){
  const e=enemies[i];e.y+=e.vy;e.x+=e.vx;
  if(e.x<e.w/2||e.x>W-e.w/2)e.vx*=-1;
  if(e.y>H+e.h){enemies.splice(i,1);continue}
  if(running&&!gameOver&&player.inv<=0&&Math.abs(e.x-player.x)<(e.w+player.w)/2-6&&Math.abs(e.y-player.y)<(e.h+player.h)/2-6){
   player.hp-=e.big?35:18;player.inv=40;explode(player.x,player.y,'#ff5252',16);
   enemies.splice(i,1);updHUD();
   if(player.hp<=0)endGame();
   continue;
  }
  for(let j=bullets.length-1;j>=0;j--){
   const b=bullets[j];
   if(Math.abs(b.x-e.x)<e.w/2&&Math.abs(b.y-e.y)<e.h/2){
    bullets.splice(j,1);e.hp--;explode(b.x,b.y,'#ffd54a',4);
    if(e.hp<=0){score+=e.score;explode(e.x,e.y,e.big?'#ff7043':'#ffeb3b',e.big?22:10);if(e.big&&Math.random()<.6)spawnPower(e.x,e.y);else if(Math.random()<.06)spawnPower(e.x,e.y);enemies.splice(i,1);updHUD()}
    break;
   }
  }
 }

 for(let i=powerups.length-1;i>=0;i--){
  const p=powerups[i];p.y+=p.vy;
  if(p.y>H+20){powerups.splice(i,1);continue}
  if(running&&!gameOver&&Math.abs(p.x-player.x)<20&&Math.abs(p.y-player.y)<24){
   if(p.t==='P')powerLv=Math.min(3,powerLv+1);
   else player.hp=Math.min(100,player.hp+25);
   updHUD();explode(p.x,p.y,'#0ff',10);powerups.splice(i,1);
  }
 }

 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.95;p.vy*=.95;p.life--;if(p.life<=0)particles.splice(i,1)}
}

function drawPlane(x,y,blink){
 if(blink&&Math.floor(frame/4)%2===0)return;
 ctx.save();ctx.translate(x,y);
 // jet flame
 ctx.fillStyle='rgba(255,180,50,'+(.5+Math.random()*.4)+')';
 ctx.beginPath();ctx.moveTo(-5,18);ctx.lineTo(5,18);ctx.lineTo(0,28+Math.random()*4);ctx.closePath();ctx.fill();
 // wings
 ctx.fillStyle='#2a4a8a';ctx.beginPath();ctx.moveTo(-19,8);ctx.lineTo(-6,2);ctx.lineTo(-6,14);ctx.lineTo(-14,18);ctx.closePath();ctx.fill();
 ctx.beginPath();ctx.moveTo(19,8);ctx.lineTo(6,2);ctx.lineTo(6,14);ctx.lineTo(14,18);ctx.closePath();ctx.fill();
 // body
 ctx.fillStyle='#4a7fd6';ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(8,10);ctx.lineTo(6,18);ctx.lineTo(-6,18);ctx.lineTo(-8,10);ctx.closePath();ctx.fill();
 // cockpit
 ctx.fillStyle='#9be7ff';ctx.beginPath();ctx.ellipse(0,-4,4,7,0,0,Math.PI*2);ctx.fill();
 ctx.restore();
}
function drawEnemy(e){
 ctx.save();ctx.translate(e.x,e.y);
 const c=e.big?'#c62828':(e.fast?'#7e57c2':'#e65100');
 ctx.fillStyle=c;
 if(e.big){
  ctx.beginPath();ctx.moveTo(0,e.h/2);ctx.lineTo(e.w/2,e.h/4);ctx.lineTo(e.w/2-4,-e.h/2);ctx.lineTo(-e.w/2+4,-e.h/2);ctx.lineTo(-e.w/2,e.h/4);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ffeb3b';ctx.fillRect(-3,-6,6,10);
 }else{
  ctx.beginPath();ctx.moveTo(0,e.h/2);ctx.lineTo(e.w/2,0);ctx.lineTo(e.w/3,-e.h/2);ctx.lineTo(-e.w/3,-e.h/2);ctx.lineTo(-e.w/2,0);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,-2,3,0,Math.PI*2);ctx.fill();
 }
 if(e.max>1){const r=e.hp/e.max;ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(-e.w/2,-e.h/2-7,e.w,3);ctx.fillStyle='#0f0';ctx.fillRect(-e.w/2,-e.h/2-7,e.w*r,3)}
 ctx.restore();
}

function render(){
 ctx.fillStyle='rgba(10,14,42,.35)';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#fff';for(const s of stars){ctx.globalAlpha=s.s/2+.3;ctx.fillRect(s.x,s.y,s.s,s.s)}ctx.globalAlpha=1;

 for(const p of particles){ctx.globalAlpha=p.life/30;ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4)}ctx.globalAlpha=1;

 for(const b of bullets){ctx.fillStyle=b.c;ctx.shadowColor=b.c;ctx.shadowBlur=8;ctx.fillRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h);ctx.shadowBlur=0}

 for(const e of enemies)drawEnemy(e);

 for(const p of powerups){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(frame*.05);ctx.fillStyle=p.t==='P'?'#00e5ff':'#ff4081';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=12;ctx.fillRect(-p.r,-p.r,p.r*2,p.r*2);ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.t,0,0);ctx.restore()}

 if(running||gameOver)drawPlane(player.x,player.y,player.inv>0);
}

function loop(){update();render();requestAnimationFrame(loop)}

function endGame(){gameOver=true;running=false;finalScore.textContent='最终得分：'+score;finalScore.classList.remove('hidden');startBtn.textContent='重新开始';overlay.classList.remove('hidden')}
function start(){reset();running=true;overlay.classList.add('hidden');finalScore.classList.add('hidden')}
startBtn.addEventListener('click',start);
startBtn.addEventListener('touchend',e=>{e.preventDefault();start()});

loop();
})();
</script>
</body>
</html>
