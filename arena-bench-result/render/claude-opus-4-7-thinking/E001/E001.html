<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6366f1">
<title>雅思核心词汇打卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;user-select:none;-webkit-user-select:none}
.app{max-width:480px;margin:0 auto;height:100vh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.header{padding:18px 20px 12px;display:flex;justify-content:space-between;align-items:center}
.title{font-size:20px;font-weight:700;letter-spacing:.5px}
.title .em{color:#ffd166}
.date{font-size:12px;opacity:.8;margin-top:2px}
.streak{background:rgba(255,255,255,.18);backdrop-filter:blur(10px);padding:8px 12px;border-radius:14px;font-size:13px;display:flex;align-items:center;gap:5px}
.progress-wrap{padding:0 20px 10px}
.progress-bar{height:8px;background:rgba(255,255,255,.2);border-radius:10px;overflow:hidden;position:relative}
.progress-fill{height:100%;background:linear-gradient(90deg,#ffd166,#ff9a76);border-radius:10px;transition:width .4s ease;width:0}
.progress-info{display:flex;justify-content:space-between;font-size:12px;margin-top:6px;opacity:.9}
.card-area{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 24px;perspective:1500px;position:relative}
.card{width:100%;max-width:340px;height:100%;max-height:440px;position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.2,.2,1);cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:26px 22px;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.15) inset;overflow:hidden}
.front{background:linear-gradient(160deg,#ffffff 0%,#f0f4ff 100%);color:#2d2d4d}
.back{background:linear-gradient(160deg,#1f2257 0%,#3b2c6e 100%);color:#fff;transform:rotateY(180deg)}
.face::before{content:"";position:absolute;top:-50%;right:-30%;width:200px;height:200px;background:radial-gradient(circle,rgba(255,209,102,.3),transparent 70%);border-radius:50%}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.idx{font-size:13px;opacity:.6;font-weight:600}
.tag{font-size:11px;background:rgba(99,102,241,.15);color:#6366f1;padding:4px 10px;border-radius:20px;font-weight:600}
.back .tag{background:rgba(255,209,102,.2);color:#ffd166}
.word-area{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative;z-index:1}
.word{font-size:38px;font-weight:700;letter-spacing:.5px;margin-bottom:8px;background:linear-gradient(120deg,#6366f1,#a855f7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1}
.back .word{background:linear-gradient(120deg,#ffd166,#ff9a76);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-size:30px}
.phonetic{font-size:15px;color:#888;font-style:italic;margin-bottom:14px}
.back .phonetic{color:#bbb}
.speaker{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#a855f7);display:inline-flex;align-items:center;justify-content:center;margin-top:4px;box-shadow:0 6px 16px rgba(99,102,241,.4);transition:transform .15s}
.speaker:active{transform:scale(.9)}
.speaker svg{width:18px;height:18px;fill:#fff}
.hint{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:11px;opacity:.5;letter-spacing:1px}
.def-block{margin-top:10px}
.def-label{font-size:11px;color:#ffd166;font-weight:700;letter-spacing:1.5px;margin-bottom:6px}
.def{font-size:18px;line-height:1.5;margin-bottom:14px;font-weight:500}
.ex-label{font-size:11px;color:#ffd166;font-weight:700;letter-spacing:1.5px;margin-bottom:6px;margin-top:8px}
.ex{font-size:14px;line-height:1.55;opacity:.92;font-style:italic;border-left:3px solid #ffd166;padding-left:10px}
.ex-cn{font-size:13px;line-height:1.55;opacity:.75;margin-top:8px;padding-left:10px}
.controls{padding:14px 20px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{flex:1;height:54px;border:none;border-radius:18px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;font-family:inherit}
.btn:active{transform:scale(.96)}
.btn-side{flex:0 0 54px;background:rgba(255,255,255,.18);backdrop-filter:blur(10px);color:#fff}
.btn-side:disabled{opacity:.35}
.btn-master{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 8px 20px rgba(16,185,129,.4)}
.btn-master.done{background:linear-gradient(135deg,#ffd166,#ff9a76);box-shadow:0 8px 20px rgba(255,154,118,.4)}
.btn svg{width:20px;height:20px}
.dots{display:flex;justify-content:center;gap:5px;padding:0 20px 8px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);transition:all .2s}
.dot.active{background:#ffd166;transform:scale(1.4)}
.dot.mastered{background:#10b981}
.celebrate{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:99;backdrop-filter:blur(8px)}
.celebrate.show{display:flex}
.celebrate-card{background:linear-gradient(160deg,#ffd166,#ff9a76);padding:36px 30px;border-radius:24px;text-align:center;color:#2d2d4d;max-width:300px;width:85%;animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.celebrate-card h2{font-size:24px;margin-bottom:10px}
.celebrate-card p{font-size:14px;margin-bottom:20px;opacity:.8}
.celebrate-card button{background:#2d2d4d;color:#fff;border:none;padding:12px 28px;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.emoji{font-size:48px;margin-bottom:10px}
@media(max-height:700px){.word{font-size:32px}.def{font-size:16px}.face{padding:22px 20px}}
@media(max-height:600px){.card{max-height:380px}.word{font-size:28px}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <div class="title">IELTS <span class="em">打卡</span> 📚</div>
      <div class="date" id="date"></div>
    </div>
    <div class="streak">🔥 <span id="streak">1</span> 天</div>
  </div>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
    <div class="progress-info">
      <span>今日进度</span>
      <span><span id="done">0</span>/20 已掌握</span>
    </div>
  </div>
  <div class="card-area">
    <div class="card" id="card">
      <div class="face front">
        <div class="card-top"><span class="idx" id="idx">1 / 20</span><span class="tag" id="tag1">名词</span></div>
        <div class="word-area">
          <div class="word" id="word">loading</div>
          <div class="phonetic" id="ph">/ˈloʊdɪŋ/</div>
          <div class="speaker" onclick="event.stopPropagation();speak()">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          </div>
        </div>
        <div class="hint">轻触卡片查看释义</div>
      </div>
      <div class="face back">
        <div class="card-top"><span class="idx" id="idx2">1 / 20</span><span class="tag" id="tag2">名词</span></div>
        <div class="def-block">
          <div class="word" id="word2">loading</div>
          <div class="phonetic" id="ph2">/ˈloʊdɪŋ/</div>
          <div class="def-label">释义 DEFINITION</div>
          <div class="def" id="def">...</div>
          <div class="ex-label">例句 EXAMPLE</div>
          <div class="ex" id="ex">...</div>
          <div class="ex-cn" id="excn">...</div>
        </div>
        <div class="hint">再次轻触返回</div>
      </div>
    </div>
  </div>
  <div class="dots" id="dots"></div>
  <div class="controls">
    <button class="btn btn-side" id="prev" onclick="prev()">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </button>
    <button class="btn btn-master" id="master" onclick="toggleMaster()">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
      <span id="mtxt">标记为已掌握</span>
    </button>
    <button class="btn btn-side" id="next" onclick="next()">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
    </button>
  </div>
</div>
<div class="celebrate" id="cel">
  <div class="celebrate-card">
    <div class="emoji">🎉</div>
    <h2>恭喜完成今日打卡！</h2>
    <p>你已掌握全部 20 个雅思核心词汇，明天继续加油！</p>
    <button onclick="closeCel()">太棒了</button>
  </div>
</div>
<script>
const words=[
{w:"abundant",p:"/əˈbʌndənt/",t:"形容词",d:"丰富的；充足的；大量的",e:"The region is abundant in natural resources.",c:"该地区自然资源丰富。"},
{w:"controversy",p:"/ˈkɒntrəvɜːsi/",t:"名词",d:"争议；争论；论战",e:"The new policy has caused great controversy.",c:"新政策引发了巨大争议。"},
{w:"diminish",p:"/dɪˈmɪnɪʃ/",t:"动词",d:"减少；降低；缩小",e:"His influence has diminished over the years.",c:"他的影响力多年来逐渐减弱。"},
{w:"elaborate",p:"/ɪˈlæbərət/",t:"形容词",d:"精心制作的；详尽的；复杂的",e:"She gave an elaborate explanation of the theory.",c:"她对该理论做了详尽的解释。"},
{w:"feasible",p:"/ˈfiːzəbl/",t:"形容词",d:"可行的；可能的；行得通的",e:"It is not feasible to finish the project in a week.",c:"一周内完成项目是不可行的。"},
{w:"genuine",p:"/ˈdʒenjuɪn/",t:"形容词",d:"真正的；真诚的；名副其实的",e:"He showed genuine concern for her safety.",c:"他对她的安全表现出真切的关心。"},
{w:"hypothesis",p:"/haɪˈpɒθəsɪs/",t:"名词",d:"假设；假说；前提",e:"Scientists are testing the hypothesis with experiments.",c:"科学家正用实验来验证这一假说。"},
{w:"inevitable",p:"/ɪnˈevɪtəbl/",t:"形容词",d:"不可避免的；必然发生的",e:"Change is inevitable in modern society.",c:"在现代社会中，变化是不可避免的。"},
{w:"jeopardize",p:"/ˈdʒepədaɪz/",t:"动词",d:"危及；损害；使陷入危险",e:"Don't jeopardize your career for short-term gains.",c:"不要为了短期利益而危及你的职业生涯。"},
{w:"keen",p:"/kiːn/",t:"形容词",d:"热衷的；敏锐的；强烈的",e:"She has a keen interest in classical music.",c:"她对古典音乐有浓厚的兴趣。"},
{w:"legitimate",p:"/lɪˈdʒɪtɪmət/",t:"形容词",d:"合法的；合理的；正当的",e:"He has a legitimate reason to be absent.",c:"他有正当的理由缺席。"},
{w:"manipulate",p:"/məˈnɪpjuleɪt/",t:"动词",d:"操纵；操控；巧妙处理",e:"Politicians often manipulate public opinion.",c:"政客们经常操纵公众舆论。"},
{w:"notorious",p:"/nəʊˈtɔːriəs/",t:"形容词",d:"臭名昭著的；声名狼藉的",e:"The area is notorious for its high crime rate.",c:"那个地区因犯罪率高而臭名昭著。"},
{w:"obstacle",p:"/ˈɒbstəkl/",t:"名词",d:"障碍；阻碍；绊脚石",e:"Language can be a major obstacle to communication.",c:"语言可能是沟通的主要障碍。"},
{w:"persistent",p:"/pəˈsɪstənt/",t:"形容词",d:"坚持不懈的；持续的；顽强的",e:"Her persistent efforts finally paid off.",c:"她坚持不懈的努力终于得到了回报。"},
{w:"qualitative",p:"/ˈkwɒlɪtətɪv/",t:"形容词",d:"质量的；定性的；性质上的",e:"There is a qualitative difference between the two.",c:"两者之间存在质的差别。"},
{w:"reluctant",p:"/rɪˈlʌktənt/",t:"形容词",d:"不情愿的；勉强的；犹豫的",e:"He was reluctant to admit his mistake.",c:"他不愿意承认自己的错误。"},
{w:"sustainable",p:"/səˈsteɪnəbl/",t:"形容词",d:"可持续的；可维持的",e:"We need to develop sustainable energy sources.",c:"我们需要发展可持续的能源。"},
{w:"tremendous",p:"/trəˈmendəs/",t:"形容词",d:"巨大的；极大的；极好的",e:"The team made tremendous progress this year.",c:"该团队今年取得了巨大的进步。"},
{w:"unprecedented",p:"/ʌnˈpresɪdentɪd/",t:"形容词",d:"前所未有的；空前的",e:"The pandemic caused unprecedented disruption.",c:"这场大流行造成了前所未有的破坏。"}
];
const today=new Date().toISOString().slice(0,10);
const KEY="ielts_"+today;
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{idx:0,mastered:[]};
let streak=parseInt(localStorage.getItem("ielts_streak")||"1");
const lastDate=localStorage.getItem("ielts_lastDate");
if(lastDate&&lastDate!==today){
  const d1=new Date(lastDate),d2=new Date(today);
  const diff=Math.round((d2-d1)/86400000);
  streak=diff===1?streak+1:1;
}
localStorage.setItem("ielts_lastDate",today);
localStorage.setItem("ielts_streak",streak);
const card=document.getElementById("card");
card.addEventListener("click",()=>card.classList.toggle("flipped"));
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function render(){
  const i=state.idx,d=words[i];
  document.getElementById("word").textContent=d.w;
  document.getElementById("word2").textContent=d.w;
  document.getElementById("ph").textContent=d.p;
  document.getElementById("ph2").textContent=d.p;
  document.getElementById("def").textContent=d.d;
  document.getElementById("ex").textContent=d.e;
  document.getElementById("excn").textContent=d.c;
  document.getElementById("tag1").textContent=d.t;
  document.getElementById("tag2").textContent=d.t;
  document.getElementById("idx").textContent=(i+1)+" / 20";
  document.getElementById("idx2").textContent=(i+1)+" / 20";
  card.classList.remove("flipped");
  document.getElementById("prev").disabled=i===0;
  document.getElementById("next").disabled=i===19;
  const m=state.mastered.includes(i);
  const mb=document.getElementById("master");
  document.getElementById("mtxt").textContent=m?"已掌握 ✓":"标记为已掌握";
  mb.classList.toggle("done",m);
  const done=state.mastered.length;
  document.getElementById("done").textContent=done;
  document.getElementById("fill").style.width=(done/20*100)+"%";
  const dots=document.getElementById("dots");
  dots.innerHTML="";
  for(let j=0;j<20;j++){
    const dt=document.createElement("div");
    dt.className="dot"+(j===i?" active":"")+(state.mastered.includes(j)?" mastered":"");
    dt.onclick=()=>{state.idx=j;render()};
    dots.appendChild(dt);
  }
  document.getElementById("streak").textContent=streak;
  const dn=new Date();
  document.getElementById("date").textContent=dn.getFullYear()+"年"+(dn.getMonth()+1)+"月"+dn.getDate()+"日";
}
function prev(){if(state.idx>0){state.idx--;save();render()}}
function next(){if(state.idx<19){state.idx++;save();render()}}
function toggleMaster(){
  const i=state.idx,k=state.mastered.indexOf(i);
  if(k>-1)state.mastered.splice(k,1);else state.mastered.push(i);
  save();render();
  if(state.mastered.length===20)setTimeout(()=>document.getElementById("cel").classList.add("show"),300);
  else if(i<19&&k===-1)setTimeout(next,400);
}
function speak(){
  if(!window.speechSynthesis)return;
  const u=new SpeechSynthesisUtterance(words[state.idx].w);
  u.lang="en-US";u.rate=.85;
  speechSynthesis.cancel();speechSynthesis.speak(u);
}
function closeCel(){document.getElementById("cel").classList.remove("show")}
let sx=0;
card.addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
card.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(Math.abs(dx)>60){if(dx<0)next();else prev();e.stopPropagation()}
},{passive:true});
render();
</script>
</body>
</html>
