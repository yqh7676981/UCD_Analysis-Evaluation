<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>火星天气站 · Mars Weather Station</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    background: radial-gradient(ellipse at top, #3d1410 0%, #1a0805 50%, #000000 100%);
    color: #f5d4b0;
    overflow-x: hidden;
    position: relative;
  }

  /* 星空背景 */
  .stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle 3s infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  /* 火星装饰 */
  .mars-planet {
    position: fixed;
    top: -200px;
    right: -200px;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #c1440e, #8b2500, #3d1410);
    box-shadow: inset -40px -40px 80px rgba(0,0,0,0.7), 0 0 100px rgba(193, 68, 14, 0.3);
    opacity: 0.4;
    z-index: 0;
    animation: rotate 120s linear infinite;
  }
  @keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 20px;
  }

  /* 头部 */
  header {
    text-align: center;
    margin-bottom: 40px;
    animation: fadeInDown 1s ease;
  }
  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  header h1 {
    font-size: 2.8rem;
    font-weight: 300;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #ff6b35, #f7931e, #ffcc66);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }
  header p {
    color: #a88670;
    font-size: 0.95rem;
    letter-spacing: 2px;
  }

  /* 位置选择器 */
  .location-selector {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 30px;
    flex-wrap: wrap;
  }
  .location-btn {
    background: rgba(193, 68, 14, 0.15);
    border: 1px solid rgba(247, 147, 30, 0.4);
    color: #f5d4b0;
    padding: 10px 20px;
    border-radius: 25px;
    cursor: pointer;
    font-size: 0.9rem;
    letter-spacing: 1px;
    transition: all 0.3s;
    backdrop-filter: blur(10px);
  }
  .location-btn:hover {
    background: rgba(247, 147, 30, 0.3);
    transform: translateY(-2px);
  }
  .location-btn.active {
    background: linear-gradient(135deg, #c1440e, #f7931e);
    border-color: #ffcc66;
    box-shadow: 0 4px 20px rgba(247, 147, 30, 0.4);
  }

  /* 主要天气卡片 */
  .main-card {
    background: linear-gradient(135deg, rgba(61, 20, 16, 0.7), rgba(26, 8, 5, 0.7));
    border: 1px solid rgba(247, 147, 30, 0.2);
    border-radius: 24px;
    padding: 40px;
    backdrop-filter: blur(20px);
    margin-bottom: 30px;
    animation: fadeIn 1s ease 0.2s both;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .main-info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    align-items: center;
  }
  @media (max-width: 720px) {
    .main-info { grid-template-columns: 1fr; text-align: center; }
  }

  .location-info h2 {
    font-size: 1.8rem;
    font-weight: 400;
    margin-bottom: 8px;
    color: #ffcc66;
  }
  .location-info .sol {
    color: #a88670;
    font-size: 0.95rem;
    margin-bottom: 20px;
  }
  .temp-main {
    font-size: 5rem;
    font-weight: 200;
    color: #ff6b35;
    line-height: 1;
    text-shadow: 0 0 30px rgba(255, 107, 53, 0.3);
  }
  .temp-main span { font-size: 2rem; vertical-align: top; }
  .condition {
    font-size: 1.2rem;
    color: #f5d4b0;
    margin-top: 10px;
    letter-spacing: 1px;
  }

  /* 右侧可视化 */
  .visual-area {
    position: relative;
    height: 260px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .weather-icon {
    width: 200px;
    height: 200px;
    position: relative;
  }
  .sun {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 80px;
    background: radial-gradient(circle, #ffcc66, #f7931e);
    border-radius: 50%;
    box-shadow: 0 0 40px rgba(247, 147, 30, 0.6);
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 40px rgba(247, 147, 30, 0.6); }
    50% { box-shadow: 0 0 60px rgba(247, 147, 30, 0.9); }
  }
  .dust-particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #c1440e;
    border-radius: 50%;
    opacity: 0.7;
    animation: drift 8s linear infinite;
  }
  @keyframes drift {
    0% { transform: translate(0, 0); opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.8; }
    100% { transform: translate(250px, -50px); opacity: 0; }
  }
  .surface {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 60px;
    background: linear-gradient(to bottom, transparent, #8b2500, #3d1410);
    border-radius: 0 0 20px 20px;
  }

  /* 指标网格 */
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
  }
  .metric-card {
    background: linear-gradient(135deg, rgba(61, 20, 16, 0.6), rgba(26, 8, 5, 0.6));
    border: 1px solid rgba(247, 147, 30, 0.15);
    border-radius: 18px;
    padding: 25px;
    backdrop-filter: blur(15px);
    transition: all 0.3s;
    animation: fadeIn 0.8s ease both;
  }
  .metric-card:hover {
    transform: translateY(-5px);
    border-color: rgba(247, 147, 30, 0.4);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .metric-card:nth-child(1) { animation-delay: 0.3s; }
  .metric-card:nth-child(2) { animation-delay: 0.4s; }
  .metric-card:nth-child(3) { animation-delay: 0.5s; }
  .metric-card:nth-child(4) { animation-delay: 0.6s; }

  .metric-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
    color: #a88670;
    font-size: 0.9rem;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .metric-icon {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(247, 147, 30, 0.15);
    border-radius: 8px;
    font-size: 1.1rem;
  }
  .metric-value {
    font-size: 2.2rem;
    font-weight: 300;
    color: #ffcc66;
    line-height: 1;
  }
  .metric-value .unit {
    font-size: 1rem;
    color: #a88670;
    margin-left: 5px;
  }
  .metric-sub {
    margin-top: 10px;
    font-size: 0.85rem;
    color: #a88670;
  }

  /* 风向指示器 */
  .wind-compass {
    width: 60px;
    height: 60px;
    border: 2px solid rgba(247, 147, 30, 0.4);
    border-radius: 50%;
    position: relative;
    margin-top: 10px;
  }
  .wind-arrow {
    position: absolute;
    top: 50%; left: 50%;
    width: 3px;
    height: 25px;
    background: linear-gradient(to top, transparent, #ff6b35);
    transform-origin: bottom center;
    transform: translate(-50%, -100%) rotate(0deg);
    transition: transform 1s ease;
  }
  .compass-n {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.7rem;
    color: #a88670;
  }

  /* 预报区 */
  .forecast {
    background: linear-gradient(135deg, rgba(61, 20, 16, 0.6), rgba(26, 8, 5, 0.6));
    border: 1px solid rgba(247, 147, 30, 0.15);
    border-radius: 18px;
    padding: 25px;
    backdrop-filter: blur(15px);
    animation: fadeIn 1s ease 0.7s both;
  }
  .forecast h3 {
    font-size: 1.1rem;
    font-weight: 400;
    color: #ffcc66;
    margin-bottom: 20px;
    letter-spacing: 1px;
  }
  .forecast-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 15px;
  }
  .forecast-item {
    text-align: center;
    padding: 15px 10px;
    background: rgba(0,0,0,0.2);
    border-radius: 12px;
    transition: all 0.3s;
  }
  .forecast-item:hover {
    background: rgba(247, 147, 30, 0.1);
    transform: scale(1.05);
  }
  .forecast-sol {
    color: #a88670;
    font-size: 0.85rem;
    margin-bottom: 8px;
  }
  .forecast-emoji { font-size: 1.8rem; margin: 8px 0; }
  .forecast-temp {
    color: #f5d4b0;
    font-size: 0.95rem;
  }
  .forecast-temp .high { color: #ff6b35; }
  .forecast-temp .low { color: #8fa9d9; }

  footer {
    text-align: center;
    margin-top: 40px;
    color: #6b5244;
    font-size: 0.8rem;
    letter-spacing: 1px;
  }
  footer .live {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #4ade80;
    border-radius: 50%;
    margin-right: 6px;
    animation: blink 2s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="mars-planet"></div>

<div class="container">
  <header>
    <h1>MARS WEATHER</h1>
    <p>火星气象站 · 实时大气监测系统</p>
  </header>

  <div class="location-selector" id="locationSelector">
    <button class="location-btn active" data-loc="gale">盖尔陨石坑</button>
    <button class="location-btn" data-loc="jezero">杰泽罗陨石坑</button>
    <button class="location-btn" data-loc="elysium">埃律西昂平原</button>
    <button class="location-btn" data-loc="olympus">奥林帕斯山</button>
  </div>

  <div class="main-card">
    <div class="main-info">
      <div class="location-info">
        <h2 id="locName">盖尔陨石坑 · Gale Crater</h2>
        <div class="sol" id="solInfo">Sol 4012 · 火星年 37</div>
        <div class="temp-main"><span id="tempSign">-</span><span id="tempVal">62</span><span>°C</span></div>
        <div class="condition" id="conditionText">晴朗 · 轻微沙尘</div>
      </div>
      <div class="visual-area">
        <div class="weather-icon">
          <div class="sun"></div>
          <div class="dust-particle" style="bottom: 80px; left: 0; animation-delay: 0s;"></div>
          <div class="dust-particle" style="bottom: 100px; left: 0; animation-delay: 2s;"></div>
          <div class="dust-particle" style="bottom: 70px; left: 0; animation-delay: 4s;"></div>
          <div class="dust-particle" style="bottom: 90px; left: 0; animation-delay: 6s;"></div>
          <div class="surface"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="metrics-grid">
    <div class="metric-card">
      <div class="metric-header">
        <div class="metric-icon">🌡️</div>
        <span>温度范围</span>
      </div>
      <div class="metric-value"><span id="tempHigh">-20</span><span class="unit">°C</span></div>
      <div class="metric-sub">最低 <span id="tempLow">-95</span>°C · 昼夜温差极大</div>
    </div>

    <div class="metric-card">
      <div class="metric-header">
        <div class="metric-icon">💨</div>
        <span>风速</span>
      </div>
      <div class="metric-value"><span id="windSpeed">7.2</span><span class="unit">m/s</span></div>
      <div class="wind-compass">
        <span class="compass-n">N</span>
        <div class="wind-arrow" id="windArrow"></div>
      </div>
    </div>

    <div class="metric-card">
      <div class="metric-header">
        <div class="metric-icon">🌫️</div>
        <span>大气压</span>
      </div>
      <div class="metric-value"><span id="pressure">730</span><span class="unit">Pa</span></div>
      <div class="metric-sub">约为地球的 <span id="pressureRatio">0.72</span>%</div>
    </div>

    <div class="metric-card">
      <div class="metric-header">
        <div class="metric-icon">🔴</div>
        <span>大气成分</span>
      </div>
      <div class="metric-value"><span id="co2">95.3</span><span class="unit">% CO₂</span></div>
      <div class="metric-sub">尘埃浓度：<span id="dustLevel">中等</span></div>
    </div>
  </div>

  <div class="forecast">
    <h3>未来 5 个火星日预报</h3>
    <div class="forecast-list" id="forecastList"></div>
  </div>

  <footer>
    <span class="live"></span>
    数据模拟基于火星科学实验室 (MSL) · 最后更新 <span id="updateTime"></span>
  </footer>
</div>

<script>
  // 生成星星
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 100; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.width = Math.random() * 2 + 1 + 'px';
    star.style.height = star.style.width;
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 3 + 's';
    starsContainer.appendChild(star);
  }

  // 火星位置数据
  const locations = {
    gale: {
      name: '盖尔陨石坑 · Gale Crater',
      sol: 4012, marsYear: 37,
      temp: -62, tempHigh: -20, tempLow: -95,
      condition: '晴朗 · 轻微沙尘',
      wind: 7.2, windDir: 135,
      pressure: 730, co2: 95.3, dust: '中等'
    },
    jezero: {
      name: '杰泽罗陨石坑 · Jezero Crater',
      sol: 1345, marsYear: 37,
      temp: -58, tempHigh: -15, tempLow: -88,
      condition: '多云 · 可见冰晶',
      wind: 5.8, windDir: 210,
      pressure: 745, co2: 95.1, dust: '较低'
    },
    elysium: {
      name: '埃律西昂平原 · Elysium Planitia',
      sol: 2100, marsYear: 37,
      temp: -70, tempHigh: -25, tempLow: -100,
      condition: '沙尘暴来袭',
      wind: 15.4, windDir: 315,
      pressure: 680, co2: 95.5, dust: '极高'
    },
    olympus: {
      name: '奥林帕斯山 · Olympus Mons',
      sol: 4012, marsYear: 37,
      temp: -85, tempHigh: -45, tempLow: -120,
      condition: '高海拔稀薄 · 寒冷',
      wind: 22.1, windDir: 45,
      pressure: 72, co2: 96.2, dust: '极低'
    }
  };

  const conditions = ['晴朗 · 轻微沙尘', '多云 · 可见冰晶', '沙尘暴来袭', '高层卷云', '晨雾弥漫', '清澈无云'];
  const emojis = ['☀️', '🌤️', '🌪️', '☁️', '🌫️', '✨'];

  function updateWeather(locKey) {
    const data = locations[locKey];
    document.getElementById('locName').textContent = data.name;
    document.getElementById('solInfo').textContent = `Sol ${data.sol} · 火星年 ${data.marsYear}`;
    document.getElementById('tempSign').textContent = data.temp < 0 ? '-' : '';
    document.getElementById('tempVal').textContent = Math.abs(data.temp);
    document.getElementById('conditionText').textContent = data.condition;
    document.getElementById('tempHigh').textContent = data.tempHigh;
    document.getElementById('tempLow').textContent = data.tempLow;
    document.getElementById('windSpeed').textContent = data.wind.toFixed(1);
    document.getElementById('windArrow').style.transform = `translate(-50%, -100%) rotate(${data.windDir}deg)`;
    document.getElementById('pressure').textContent = data.pressure;
    document.getElementById('pressureRatio').textContent = (data.pressure / 101325 * 100).toFixed(2);
    document.getElementById('co2').textContent = data.co2;
    document.getElementById('dustLevel').textContent = data.dust;

    // 生成预报
    const forecastList = document.getElementById('forecastList');
    forecastList.innerHTML = '';
    for (let i = 1; i <= 5; i++) {
      const idx = Math.floor(Math.random() * conditions.length);
      const high = data.tempHigh + Math.floor(Math.random() * 10 - 5);
      const low = data.tempLow + Math.floor(Math.random() * 10 - 5);
      const item = document.createElement('div');
      item.className = 'forecast-item';
      item.innerHTML = `
        <div class="forecast-sol">Sol ${data.sol + i}</div>
        <div class="forecast-emoji">${emojis[idx]}</div>
        <div class="forecast-temp"><span class="high">${high}°</span> / <span class="low">${low}°</span></div>
      `;
      forecastList.appendChild(item);
    }
  }

  // 位置切换
  document.querySelectorAll('.location-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.location-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updateWeather(btn.dataset.loc);
    });
  });

  // 更新时间
  function updateTime() {
    const now = new Date();
    document.getElementById('updateTime').textContent =
      now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  setInterval(updateTime, 1000);
  updateTime();

  // 初始化
  updateWeather('gale');

  // 模拟实时数据抖动
  setInterval(() => {
    const windSpeed = document.getElementById('windSpeed');
    const current = parseFloat(windSpeed.textContent);
    const jitter = (Math.random() - 0.5) * 0.4;
    windSpeed.textContent = Math.max(0, current + jitter).toFixed(1);
  }, 3000);
</script>

</body>
</html>
