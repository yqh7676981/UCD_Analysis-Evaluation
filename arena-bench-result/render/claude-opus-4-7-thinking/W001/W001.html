<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#6366f1" />
<title>待办清单</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
    color: #1f2937;
    overflow: hidden;
  }
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    background: #f3f4f6;
    position: relative;
  }
  header {
    padding: 20px 20px 16px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
    z-index: 5;
  }
  header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .stats {
    display: flex;
    gap: 12px;
    margin-top: 10px;
    font-size: 13px;
    opacity: 0.92;
  }
  .stats span b { font-weight: 700; margin-right: 3px; }

  .input-area {
    padding: 14px 16px;
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .input-row {
    display: flex;
    gap: 8px;
  }
  .input-row input {
    flex: 1;
    height: 44px;
    padding: 0 14px;
    font-size: 15px;
    border: 1.5px solid #e5e7eb;
    border-radius: 12px;
    background: #f9fafb;
    outline: none;
    transition: all 0.2s;
  }
  .input-row input:focus {
    border-color: #6366f1;
    background: #fff;
  }
  .add-btn {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    font-size: 24px;
    font-weight: 300;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s;
  }
  .add-btn:active { transform: scale(0.92); }

  .priority-row {
    display: flex;
    gap: 8px;
  }
  .priority-row button {
    flex: 1;
    height: 36px;
    border: 1.5px solid #e5e7eb;
    background: #fff;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    color: #6b7280;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .priority-row button .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  .priority-row button[data-p="high"] .dot { background: #ef4444; }
  .priority-row button[data-p="mid"]  .dot { background: #f59e0b; }
  .priority-row button[data-p="low"]  .dot { background: #10b981; }

  .priority-row button.active {
    border-color: transparent;
    color: #fff;
  }
  .priority-row button.active[data-p="high"] { background: #ef4444; }
  .priority-row button.active[data-p="mid"]  { background: #f59e0b; }
  .priority-row button.active[data-p="low"]  { background: #10b981; }
  .priority-row button.active .dot { background: #fff; }

  .list-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px 20px;
    -webkit-overflow-scrolling: touch;
  }
  .empty {
    text-align: center;
    margin-top: 60px;
    color: #9ca3af;
    font-size: 14px;
  }
  .empty .icon {
    font-size: 56px;
    margin-bottom: 12px;
    opacity: 0.6;
  }

  .todo-item {
    background: #fff;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    border-left: 4px solid #d1d5db;
    animation: slideIn 0.25s ease-out;
    transition: opacity 0.3s, transform 0.3s;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .todo-item.high { border-left-color: #ef4444; }
  .todo-item.mid  { border-left-color: #f59e0b; }
  .todo-item.low  { border-left-color: #10b981; }

  .checkbox {
    width: 24px;
    height: 24px;
    border: 2px solid #d1d5db;
    border-radius: 50%;
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    background: #fff;
  }
  .checkbox::after {
    content: "";
    width: 10px;
    height: 6px;
    border-left: 2px solid #fff;
    border-bottom: 2px solid #fff;
    transform: rotate(-45deg) scale(0);
    margin-top: -2px;
    transition: transform 0.2s;
  }
  .todo-item.done .checkbox {
    background: linear-gradient(135deg, #10b981, #059669);
    border-color: transparent;
  }
  .todo-item.done .checkbox::after { transform: rotate(-45deg) scale(1); }

  .text {
    flex: 1;
    font-size: 15px;
    line-height: 1.4;
    word-break: break-all;
    color: #1f2937;
  }
  .priority-tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 6px;
    margin-top: 4px;
    display: inline-block;
    font-weight: 500;
  }
  .priority-tag.high { background: #fee2e2; color: #dc2626; }
  .priority-tag.mid  { background: #fef3c7; color: #d97706; }
  .priority-tag.low  { background: #d1fae5; color: #059669; }

  .todo-item.done .text {
    text-decoration: line-through;
    color: #9ca3af;
  }
  .todo-item.done {
    background: #f9fafb;
    opacity: 0.75;
  }

  .delete {
    width: 32px;
    height: 32px;
    border: none;
    background: transparent;
    color: #9ca3af;
    font-size: 20px;
    cursor: pointer;
    border-radius: 8px;
    flex-shrink: 0;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .delete:active {
    background: #fee2e2;
    color: #ef4444;
    transform: scale(0.9);
  }

  .list-wrap::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>📝 我的待办</h1>
      <div class="stats">
        <span>共 <b id="totalCount">0</b> 项</span>
        <span>已完成 <b id="doneCount">0</b> 项</span>
      </div>
    </header>

    <div class="input-area">
      <div class="input-row">
        <input id="taskInput" type="text" placeholder="添加新任务..." maxlength="60" />
        <button class="add-btn" id="addBtn" aria-label="添加">+</button>
      </div>
      <div class="priority-row" id="priorityRow">
        <button data-p="high"><span class="dot"></span>高</button>
        <button data-p="mid" class="active"><span class="dot"></span>中</button>
        <button data-p="low"><span class="dot"></span>低</button>
      </div>
    </div>

    <div class="list-wrap" id="listWrap">
      <div class="empty" id="emptyTip">
        <div class="icon">🌿</div>
        <div>暂无任务，添加一个开始吧</div>
      </div>
    </div>
  </div>

<script>
(function () {
  const STORAGE_KEY = 'mobile_todo_list_v1';
  const input = document.getElementById('taskInput');
  const addBtn = document.getElementById('addBtn');
  const priorityRow = document.getElementById('priorityRow');
  const listWrap = document.getElementById('listWrap');
  const emptyTip = document.getElementById('emptyTip');
  const totalCount = document.getElementById('totalCount');
  const doneCount = document.getElementById('doneCount');

  const PRIORITY_LABEL = { high: '高优先级', mid: '中优先级', low: '低优先级' };
  const PRIORITY_WEIGHT = { high: 0, mid: 1, low: 2 };

  let todos = [];
  let currentPriority = 'mid';

  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) todos = JSON.parse(saved);
  } catch (e) { todos = []; }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(todos)); } catch (e) {}
  }

  function sortTodos() {
    todos.sort((a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      if (!a.done && !b.done) {
        const w = PRIORITY_WEIGHT[a.priority] - PRIORITY_WEIGHT[b.priority];
        if (w !== 0) return w;
      }
      return a.createdAt - b.createdAt;
    });
  }

  function render() {
    sortTodos();
    listWrap.innerHTML = '';
    if (todos.length === 0) {
      listWrap.appendChild(emptyTip);
    } else {
      todos.forEach(t => {
        const item = document.createElement('div');
        item.className = 'todo-item ' + t.priority + (t.done ? ' done' : '');
        item.dataset.id = t.id;

        const cb = document.createElement('div');
        cb.className = 'checkbox';
        cb.addEventListener('click', () => toggleDone(t.id));

        const wrap = document.createElement('div');
        wrap.className = 'text';
        const txt = document.createElement('div');
        txt.textContent = t.text;
        wrap.appendChild(txt);
        if (!t.done) {
          const tag = document.createElement('span');
          tag.className = 'priority-tag ' + t.priority;
          tag.textContent = PRIORITY_LABEL[t.priority];
          wrap.appendChild(tag);
        }

        const del = document.createElement('button');
        del.className = 'delete';
        del.innerHTML = '✕';
        del.setAttribute('aria-label', '删除');
        del.addEventListener('click', () => removeTodo(t.id));

        item.appendChild(cb);
        item.appendChild(wrap);
        item.appendChild(del);
        listWrap.appendChild(item);
      });
    }
    totalCount.textContent = todos.length;
    doneCount.textContent = todos.filter(t => t.done).length;
  }

  function addTodo() {
    const text = input.value.trim();
    if (!text) {
      input.focus();
      return;
    }
    todos.push({
      id: Date.now() + '_' + Math.random().toString(36).slice(2, 7),
      text: text,
      priority: currentPriority,
      done: false,
      createdAt: Date.now()
    });
    input.value = '';
    save();
    render();
  }

  function toggleDone(id) {
    const t = todos.find(x => x.id === id);
    if (!t) return;
    t.done = !t.done;
    save();
    render();
  }

  function removeTodo(id) {
    const idx = todos.findIndex(x => x.id === id);
    if (idx > -1) {
      todos.splice(idx, 1);
      save();
      render();
    }
  }

  addBtn.addEventListener('click', addTodo);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') addTodo();
  });

  priorityRow.addEventListener('click', e => {
    const btn = e.target.closest('button[data-p]');
    if (!btn) return;
    priorityRow.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPriority = btn.dataset.p;
  });

  render();
})();
</script>
</body>
</html>
