<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>心情日记本</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:linear-gradient(160deg,#fceabb 0%,#f8b6cf 50%,#a6c8ff 100%);color:#3a3a4a;min-height:100vh;padding-bottom:80px;overflow-x:hidden}
.app{max-width:480px;margin:0 auto;padding:20px 18px 0}
.header{text-align:center;padding:14px 0 18px}
.header h1{font-size:22px;font-weight:600;color:#444;letter-spacing:1px}
.header .date{font-size:13px;color:#777;margin-top:4px}
.card{background:rgba(255,255,255,0.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 6px 22px rgba(180,140,180,0.15)}
.card h2{font-size:16px;font-weight:600;margin-bottom:14px;color:#555}
.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mood{aspect-ratio:1;border-radius:16px;border:2px solid transparent;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;font-size:13px;color:#666;user-select:none}
.mood:active{transform:scale(0.94)}
.mood .emoji{font-size:30px;margin-bottom:4px}
.mood.active{border-color:#ff8fb1;box-shadow:0 4px 14px rgba(255,143,177,0.35);background:#fff7fb}
.mood[data-mood="happy"].active{border-color:#ffb84d;box-shadow:0 4px 14px rgba(255,184,77,0.4);background:#fff8eb}
.mood[data-mood="calm"].active{border-color:#7dd3a8;box-shadow:0 4px 14px rgba(125,211,168,0.4);background:#effaf3}
.mood[data-mood="anxious"].active{border-color:#b39ddb;box-shadow:0 4px 14px rgba(179,157,219,0.4);background:#f5f1fb}
.mood[data-mood="sad"].active{border-color:#7eb6e8;box-shadow:0 4px 14px rgba(126,182,232,0.4);background:#eef5fb}
textarea{width:100%;min-height:110px;border:none;border-radius:14px;background:#fafafa;padding:14px;font-size:15px;font-family:inherit;color:#444;resize:none;outline:none;line-height:1.6}
textarea::placeholder{color:#bbb}
.save-btn{width:100%;margin-top:14px;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,#ff8fb1,#ffb88c);color:#fff;font-size:16px;font-weight:600;letter-spacing:2px;cursor:pointer;box-shadow:0 6px 16px rgba(255,143,177,0.35);transition:transform .15s}
.save-btn:active{transform:scale(0.97)}
.save-btn:disabled{opacity:0.5;cursor:not-allowed}
.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;justify-content:space-around;padding:10px 0 calc(10px + env(safe-area-inset-bottom));border-top:1px solid rgba(0,0,0,0.05);z-index:10}
.tab{flex:1;text-align:center;padding:6px;cursor:pointer;color:#999;font-size:11px;transition:color .2s}
.tab .ic{font-size:22px;display:block;margin-bottom:2px}
.tab.active{color:#ff7aa2}
.view{display:none;animation:fadeIn .3s}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.entry{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.entry .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.entry .em{font-size:24px}
.entry .dt{font-size:12px;color:#999}
.entry .tx{font-size:14px;color:#555;line-height:1.6;word-wrap:break-word}
.empty{text-align:center;padding:40px 20px;color:#aaa;font-size:14px}
.empty .ic{font-size:48px;display:block;margin-bottom:10px;opacity:0.5}
.stats-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.stat-box{background:#fff;border-radius:14px;padding:12px;text-align:center}
.stat-box .num{font-size:24px;font-weight:700;color:#ff7aa2}
.stat-box .lbl{font-size:12px;color:#888;margin-top:4px}
.bar-chart{margin-top:8px}
.bar-row{margin-bottom:14px}
.bar-row .lab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;color:#555}
.bar-row .lab .l{display:flex;align-items:center;gap:6px}
.bar-bg{height:10px;background:#f0f0f0;border-radius:5px;overflow:hidden}
.bar-fill{height:100%;border-radius:5px;transition:width .8s ease;width:0}
.toast{position:fixed;top:30px;left:50%;transform:translateX(-50%) translateY(-100px);background:rgba(50,50,60,0.92);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:100;transition:transform .3s;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
.month-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.month-nav button{background:#fff;border:none;width:34px;height:34px;border-radius:50%;font-size:18px;color:#666;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.06)}
.month-nav span{font-size:15px;font-weight:600;color:#555}
</style>
</head>
<body>
<div class="app">
<div class="header">
<h1>🌸 心情日记本</h1>
<div class="date" id="todayDate"></div>
</div>

<div class="view active" id="viewWrite">
<div class="card">
<h2>今天的心情是？</h2>
<div class="moods" id="moods">
<div class="mood" data-mood="happy"><span class="emoji">😊</span><span>开心</span></div>
<div class="mood" data-mood="calm"><span class="emoji">😌</span><span>平静</span></div>
<div class="mood" data-mood="anxious"><span class="emoji">😰</span><span>焦虑</span></div>
<div class="mood" data-mood="sad"><span class="emoji">😢</span><span>低落</span></div>
</div>
</div>
<div class="card">
<h2>今天发生了什么？</h2>
<textarea id="noteText" placeholder="写下此刻的想法，留住这一天的故事..."></textarea>
<button class="save-btn" id="saveBtn">保 存 今 日</button>
</div>
</div>

<div class="view" id="viewHistory">
<div class="card">
<h2>📖 我的日记</h2>
<div id="entryList"></div>
</div>
</div>

<div class="view" id="viewStats">
<div class="card">
<div class="month-nav">
<button id="prevM">‹</button>
<span id="monthLabel"></span>
<button id="nextM">›</button>
</div>
<div class="stats-summary">
<div class="stat-box"><div class="num" id="totalDays">0</div><div class="lbl">本月记录天数</div></div>
<div class="stat-box"><div class="num" id="topMood">-</div><div class="lbl">最常见心情</div></div>
</div>
<h2>本月心情分布</h2>
<div class="bar-chart" id="barChart"></div>
</div>
</div>
</div>

<div class="tabs">
<div class="tab active" data-view="viewWrite"><span class="ic">✍️</span>记录</div>
<div class="tab" data-view="viewHistory"><span class="ic">📖</span>日记</div>
<div class="tab" data-view="viewStats"><span class="ic">📊</span>统计</div>
</div>

<div class="toast" id="toast"></div>

<script>
const MOODS={happy:{label:'开心',emoji:'😊',color:'#ffb84d'},calm:{label:'平静',emoji:'😌',color:'#7dd3a8'},anxious:{label:'焦虑',emoji:'😰',color:'#b39ddb'},sad:{label:'低落',emoji:'😢',color:'#7eb6e8'}};
const STORAGE_KEY='moodDiary_v1';
let selectedMood=null;
let currentMonth=new Date();

function loadData(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}}catch(e){return{}}}
function saveData(d){localStorage.setItem(STORAGE_KEY,JSON.stringify(d))}
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(d){const w=['日','一','二','三','四','五','六'];return (d.getMonth()+1)+'月'+d.getDate()+'日 星期'+w[d.getDay()]}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}

document.getElementById('todayDate').textContent=fmtDate(new Date());

// Load today's entry if exists
function loadToday(){
  const data=loadData();
  const k=dateKey(new Date());
  if(data[k]){
    selectedMood=data[k].mood;
    document.getElementById('noteText').value=data[k].text||'';
    document.querySelectorAll('.mood').forEach(m=>{
      m.classList.toggle('active',m.dataset.mood===selectedMood);
    });
  }
}

document.querySelectorAll('.mood').forEach(el=>{
  el.addEventListener('click',()=>{
    selectedMood=el.dataset.mood;
    document.querySelectorAll('.mood').forEach(m=>m.classList.remove('active'));
    el.classList.add('active');
  });
});

document.getElementById('saveBtn').addEventListener('click',()=>{
  if(!selectedMood){toast('请先选择一个心情吧');return}
  const text=document.getElementById('noteText').value.trim();
  if(!text){toast('写点什么再保存吧');return}
  const data=loadData();
  const k=dateKey(new Date());
  data[k]={mood:selectedMood,text:text,time:Date.now()};
  saveData(data);
  toast('✓ 已保存');
});

// Tabs
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    const v=t.dataset.view;
    document.getElementById(v).classList.add('active');
    if(v==='viewHistory')renderHistory();
    if(v==='viewStats')renderStats();
  });
});

function renderHistory(){
  const data=loadData();
  const keys=Object.keys(data).sort().reverse();
  const list=document.getElementById('entryList');
  if(keys.length===0){list.innerHTML='<div class="empty"><span class="ic">📭</span>还没有日记，去写第一篇吧</div>';return}
  list.innerHTML=keys.map(k=>{
    const e=data[k];const m=MOODS[e.mood]||{};
    const [y,mo,d]=k.split('-');
    return '<div class="entry"><div class="top"><span class="em">'+m.emoji+'</span><span class="dt">'+y+'/'+mo+'/'+d+' · '+m.label+'</span></div><div class="tx">'+escapeHtml(e.text)+'</div></div>';
  }).join('');
}

function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function renderStats(){
  const data=loadData();
  const y=currentMonth.getFullYear(),mo=currentMonth.getMonth();
  document.getElementById('monthLabel').textContent=y+'年'+(mo+1)+'月';
  const counts={happy:0,calm:0,anxious:0,sad:0};
  let total=0;
  Object.keys(data).forEach(k=>{
    const [ky,km]=k.split('-').map(Number);
    if(ky===y&&km===mo+1){counts[data[k].mood]=(counts[data[k].mood]||0)+1;total++;}
  });
  document.getElementById('totalDays').textContent=total;
  let top='-',topN=0;
  Object.keys(counts).forEach(m=>{if(counts[m]>topN){topN=counts[m];top=MOODS[m].emoji+MOODS[m].label}});
  document.getElementById('topMood').textContent=total?top:'-';
  const bar=document.getElementById('barChart');
  bar.innerHTML=Object.keys(MOODS).map(m=>{
    const c=counts[m]||0;
    const pct=total?Math.round(c/total*100):0;
    return '<div class="bar-row"><div class="lab"><span class="l">'+MOODS[m].emoji+' '+MOODS[m].label+'</span><span>'+c+'天 · '+pct+'%</span></div><div class="bar-bg"><div class="bar-fill" style="background:'+MOODS[m].color+'" data-w="'+pct+'"></div></div></div>';
  }).join('');
  setTimeout(()=>{bar.querySelectorAll('.bar-fill').forEach(b=>{b.style.width=b.dataset.w+'%'})},50);
}

document.getElementById('prevM').addEventListener('click',()=>{currentMonth.setMonth(currentMonth.getMonth()-1);renderStats()});
document.getElementById('nextM').addEventListener('click',()=>{currentMonth.setMonth(currentMonth.getMonth()+1);renderStats()});

loadToday();
</script>
</body>
</html>
