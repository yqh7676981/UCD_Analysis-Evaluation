<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ClassNotes — 课堂笔记</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#ffffff;--sidebar:#fbfbfa;--border:#e9e9e7;--text:#37352f;
  --muted:#9b9a97;--hover:#efefee;--active:#e8e7e4;--accent:#2383e2;
  --tag-bg:#e8f0fe;--tag-text:#1967d2;--shadow:0 1px 3px rgba(15,15,15,.08);
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);height:100vh;overflow:hidden;font-size:14px;line-height:1.6}
.app{display:flex;height:100vh}

/* Sidebar */
.sidebar{width:260px;background:var(--sidebar);border-right:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:14px 14px 8px;display:flex;align-items:center;gap:8px}
.logo{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,#2383e2,#6f5dd4);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px}
.logo-text{font-weight:600;font-size:15px}
.search-box{margin:6px 10px 10px;padding:6px 10px;background:#efefed;border-radius:6px;
  display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.search-box input{border:none;outline:none;background:transparent;flex:1;color:var(--text);font-size:13px}
.sidebar-section{padding:4px 8px;margin-top:4px}
.section-title{display:flex;align-items:center;justify-content:space-between;
  padding:4px 8px;color:var(--muted);font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:.5px}
.section-title button{background:none;border:none;color:var(--muted);cursor:pointer;
  font-size:16px;padding:2px 6px;border-radius:4px;line-height:1}
.section-title button:hover{background:var(--hover);color:var(--text)}
.category-list{list-style:none}
.category{border-radius:4px;margin:1px 0}
.cat-header{display:flex;align-items:center;padding:4px 8px;cursor:pointer;
  border-radius:4px;gap:4px;user-select:none}
.cat-header:hover{background:var(--hover)}
.cat-header.active{background:var(--active)}
.caret{width:16px;height:16px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:10px;transition:transform .15s}
.cat-header.expanded .caret{transform:rotate(90deg)}
.cat-icon{font-size:15px;margin-right:2px}
.cat-name{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-actions{display:none;gap:2px}
.cat-header:hover .cat-actions{display:flex}
.cat-actions button{background:none;border:none;color:var(--muted);cursor:pointer;
  padding:2px 4px;border-radius:3px;font-size:13px;line-height:1}
.cat-actions button:hover{background:#dcdcd9;color:var(--text)}
.notes-list{list-style:none;margin-left:18px}
.note-item{display:flex;align-items:center;padding:4px 8px;border-radius:4px;
  cursor:pointer;gap:6px;font-size:13.5px;color:#4a4a45}
.note-item:hover{background:var(--hover)}
.note-item.active{background:var(--active);color:var(--text);font-weight:500}
.note-item .note-icon{color:var(--muted);font-size:13px}
.note-item .note-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-item .del-btn{display:none;background:none;border:none;color:var(--muted);
  cursor:pointer;padding:0 4px;border-radius:3px}
.note-item:hover .del-btn{display:block}
.note-item .del-btn:hover{background:#dcdcd9;color:#d14}

.sidebar-footer{margin-top:auto;padding:10px;border-top:1px solid var(--border);
  color:var(--muted);font-size:12px;display:flex;justify-content:space-between}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:44px;border-bottom:1px solid var(--border);display:flex;
  align-items:center;padding:0 20px;gap:12px;font-size:13px;color:var(--muted)}
.breadcrumb{display:flex;align-items:center;gap:6px}
.breadcrumb span{cursor:pointer}
.breadcrumb span:hover{color:var(--text)}
.top-actions{margin-left:auto;display:flex;gap:6px}
.top-actions button{background:none;border:none;color:var(--muted);
  padding:6px 10px;border-radius:4px;cursor:pointer;font-size:13px}
.top-actions button:hover{background:var(--hover);color:var(--text)}

.editor{flex:1;overflow-y:auto;padding:60px 96px 100px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;color:var(--muted);text-align:center}
.empty-state .emoji{font-size:56px;margin-bottom:16px}
.empty-state h2{font-weight:600;color:var(--text);margin-bottom:8px}
.empty-state button{margin-top:16px;padding:8px 16px;background:var(--accent);
  color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px}

.note-cover{font-size:56px;margin-bottom:8px;cursor:pointer;display:inline-block;
  padding:4px 8px;border-radius:6px}
.note-cover:hover{background:var(--hover)}
.note-title-input{width:100%;font-size:40px;font-weight:700;border:none;outline:none;
  background:transparent;color:var(--text);padding:4px 0;margin-bottom:8px;font-family:inherit}
.note-title-input::placeholder{color:#d9d9d6}
.meta-row{display:flex;gap:24px;margin-bottom:8px;font-size:13px;color:var(--muted)}
.meta-item{display:flex;align-items:center;gap:10px}
.meta-label{min-width:60px}
.meta-value{color:var(--text)}
.meta-value input,.meta-value select{border:none;outline:none;background:transparent;
  font:inherit;color:var(--text);padding:2px 6px;border-radius:4px}
.meta-value input:hover,.meta-value select:hover{background:var(--hover)}

.tags-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:20px}
.tag{background:var(--tag-bg);color:var(--tag-text);padding:2px 8px;border-radius:3px;
  font-size:12px;display:inline-flex;align-items:center;gap:4px}
.tag .x{cursor:pointer;opacity:.6}
.tag .x:hover{opacity:1}
.tag-input{border:1px dashed var(--border);background:transparent;padding:2px 8px;
  border-radius:3px;font-size:12px;outline:none;width:80px}
.tag-input:focus{border-color:var(--accent)}

hr.divider{border:none;border-top:1px solid var(--border);margin:16px 0 24px}

.toolbar{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--border);
  padding:6px 0;display:flex;gap:2px;margin-bottom:16px;z-index:5}
.toolbar button{background:none;border:none;padding:6px 10px;border-radius:4px;
  cursor:pointer;color:var(--text);font-size:14px;min-width:32px}
.toolbar button:hover{background:var(--hover)}
.toolbar .sep{width:1px;background:var(--border);margin:4px 2px}

.content-area{min-height:300px;outline:none;font-size:16px;line-height:1.7;color:#37352f}
.content-area:empty:before{content:attr(data-placeholder);color:#d9d9d6;pointer-events:none}
.content-area h1{font-size:1.875em;font-weight:700;margin:24px 0 8px}
.content-area h2{font-size:1.5em;font-weight:600;margin:20px 0 6px}
.content-area h3{font-size:1.25em;font-weight:600;margin:16px 0 4px}
.content-area p{margin:4px 0}
.content-area ul,.content-area ol{margin:4px 0 4px 28px}
.content-area blockquote{border-left:3px solid var(--text);padding-left:14px;
  margin:8px 0;color:#4a4a45}
.content-area code{background:rgba(135,131,120,.15);padding:2px 5px;border-radius:3px;
  font-family:"SF Mono",Consolas,monospace;font-size:.9em;color:#eb5757}
.content-area pre{background:#f7f6f3;padding:12px 16px;border-radius:6px;
  font-family:"SF Mono",Consolas,monospace;font-size:.9em;overflow-x:auto;margin:8px 0}
.content-area a{color:var(--accent);text-decoration:underline}
.content-area mark{background:#fff3b8;padding:0 2px;border-radius:2px}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d3d3d0;border-radius:5px;border:2px solid var(--sidebar)}
::-webkit-scrollbar-track{background:transparent}

@media(max-width:768px){
  .sidebar{width:220px}
  .editor{padding:40px 24px 80px}
  .note-title-input{font-size:30px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">📘</div>
      <div class="logo-text">ClassNotes</div>
    </div>
    <div class="search-box">
      <span>🔍</span>
      <input id="searchInput" placeholder="搜索笔记...">
    </div>
    <div class="sidebar-section">
      <div class="section-title">
        <span>我的课程</span>
        <button id="addCategoryBtn" title="添加课程">＋</button>
      </div>
      <ul id="categoryList" class="category-list"></ul>
    </div>
    <div class="sidebar-footer">
      <span id="noteCount">0 篇笔记</span>
      <span id="exportBtn" style="cursor:pointer">导出</span>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="breadcrumb" id="breadcrumb"><span>📖 课堂笔记</span></div>
      <div class="top-actions">
        <button id="newNoteBtn">＋ 新笔记</button>
      </div>
    </div>
    <div class="editor" id="editor">
      <div class="empty-state" id="emptyState">
        <div class="emoji">📝</div>
        <h2>欢迎使用 ClassNotes</h2>
        <p>选择左侧的课程开始记笔记，或创建新的课程分类。</p>
        <button id="getStartedBtn">创建第一篇笔记</button>
      </div>
    </div>
  </main>
</div>

<script>
// ============= 数据层 =============
const STORAGE_KEY = 'classnotes_data_v1';
const defaultData = {
  categories: [
    {id:'c1',name:'数学',icon:'🧮',expanded:true,notes:[
      {id:'n1',title:'函数与极限',cover:'📐',date:new Date().toISOString().slice(0,10),
       teacher:'张老师',tags:['重点','期中'],
       content:'<h1>函数与极限</h1><h2>1. 函数的定义</h2><p>设 D 是非空实数集，若存在对应法则 f，使得对于 D 中每一个 x，都有唯一确定的 y 与之对应。</p><h2>2. 极限的性质</h2><ul><li>唯一性</li><li>有界性</li><li>保号性</li></ul><blockquote>重点记忆三大性质！</blockquote>'}
    ]},
    {id:'c2',name:'英语',icon:'🌐',expanded:false,notes:[
      {id:'n2',title:'Unit 1 - Academic Writing',cover:'✍️',date:new Date().toISOString().slice(0,10),
       teacher:'Ms. Lee',tags:['作业'],
       content:'<h1>Academic Writing</h1><p>Key phrases:</p><ul><li><mark>In conclusion</mark></li><li><mark>Furthermore</mark></li></ul>'}
    ]},
    {id:'c3',name:'物理',icon:'⚛️',expanded:false,notes:[]},
    {id:'c4',name:'计算机',icon:'💻',expanded:false,notes:[]}
  ],
  currentNoteId:'n1'
};

let data = load();
function load(){
  try{const s=localStorage.getItem(STORAGE_KEY);return s?JSON.parse(s):JSON.parse(JSON.stringify(defaultData))}
  catch(e){return JSON.parse(JSON.stringify(defaultData))}
}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}
function uid(){return 'id'+Date.now()+Math.random().toString(36).slice(2,7)}

// ============= 渲染侧边栏 =============
const categoryList = document.getElementById('categoryList');
const noteCountEl = document.getElementById('noteCount');

function renderSidebar(filter=''){
  categoryList.innerHTML='';
  let total=0;
  data.categories.forEach(cat=>{
    const filteredNotes = filter
      ? cat.notes.filter(n=>n.title.toLowerCase().includes(filter)||
          (n.content||'').toLowerCase().includes(filter)||
          (n.tags||[]).some(t=>t.toLowerCase().includes(filter)))
      : cat.notes;
    if(filter && filteredNotes.length===0 && !cat.name.toLowerCase().includes(filter)) return;
    total+=cat.notes.length;
    const li=document.createElement('li');
    li.className='category';
    const header=document.createElement('div');
    header.className='cat-header'+(cat.expanded||filter?' expanded':'');
    header.innerHTML=`<span class="caret">▶</span><span class="cat-icon">${cat.icon}</span>
      <span class="cat-name">${escapeHtml(cat.name)}</span>
      <span class="cat-actions">
        <button title="新建笔记" data-act="add">＋</button>
        <button title="重命名" data-act="rename">✎</button>
        <button title="删除" data-act="del">×</button>
      </span>`;
    header.onclick=(e)=>{
      const act=e.target.dataset.act;
      if(act==='add'){e.stopPropagation();addNote(cat.id);return}
      if(act==='rename'){e.stopPropagation();renameCategory(cat.id);return}
      if(act==='del'){e.stopPropagation();deleteCategory(cat.id);return}
      cat.expanded=!cat.expanded;save();renderSidebar(filter);
    };
    li.appendChild(header);
    if(cat.expanded||filter){
      const ul=document.createElement('ul');
      ul.className='notes-list';
      filteredNotes.forEach(note=>{
        const nli=document.createElement('li');
        nli.className='note-item'+(note.id===data.currentNoteId?' active':'');
        nli.innerHTML=`<span class="note-icon">${note.cover||'📄'}</span>
          <span class="note-title">${escapeHtml(note.title||'无标题')}</span>
          <button class="del-btn" title="删除">×</button>`;
        nli.onclick=(e)=>{
          if(e.target.classList.contains('del-btn')){e.stopPropagation();deleteNote(cat.id,note.id);return}
          data.currentNoteId=note.id;save();renderAll();
        };
        ul.appendChild(nli);
      });
      li.appendChild(ul);
    }
    categoryList.appendChild(li);
  });
  noteCountEl.textContent=total+' 篇笔记';
}

function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

// ============= 分类操作 =============
function addCategory(){
  const name=prompt('课程名称：');
  if(!name)return;
  const icons=['📘','📗','📕','📙','📓','🧮','🌐','⚛️','💻','🎨','🎵','🏛️','🧬','📜','🗺️'];
  const icon=icons[Math.floor(Math.random()*icons.length)];
  data.categories.push({id:uid(),name,icon,expanded:true,notes:[]});
  save();renderSidebar();
}
function renameCategory(cid){
  const cat=data.categories.find(c=>c.id===cid);
  const name=prompt('重命名课程：',cat.name);
  if(name){cat.name=name;save();renderSidebar();renderEditor()}
}
function deleteCategory(cid){
  if(!confirm('确定删除该课程及其所有笔记？'))return;
  data.categories=data.categories.filter(c=>c.id!==cid);
  save();renderAll();
}

// ============= 笔记操作 =============
function addNote(cid){
  const cat=data.categories.find(c=>c.id===cid);
  const note={id:uid(),title:'新笔记',cover:'📄',
    date:new Date().toISOString().slice(0,10),teacher:'',tags:[],content:''};
  cat.notes.push(note);cat.expanded=true;
  data.currentNoteId=note.id;save();renderAll();
  setTimeout(()=>{const t=document.querySelector('.note-title-input');if(t){t.focus();t.select()}},50);
}
function deleteNote(cid,nid){
  if(!confirm('删除该笔记？'))return;
  const cat=data.categories.find(c=>c.id===cid);
  cat.notes=cat.notes.filter(n=>n.id!==nid);
  if(data.currentNoteId===nid)data.currentNoteId=null;
  save();renderAll();
}
function findCurrentNote(){
  for(const c of data.categories){
    const n=c.notes.find(x=>x.id===data.currentNoteId);
    if(n)return{cat:c,note:n};
  }return null;
}

// ============= 渲染编辑器 =============
const editor=document.getElementById('editor');
const breadcrumb=document.getElementById('breadcrumb');

function renderEditor(){
  const ctx=findCurrentNote();
  if(!ctx){
    editor.innerHTML=`<div class="empty-state"><div class="emoji">📝</div>
      <h2>欢迎使用 ClassNotes</h2>
      <p>选择左侧的课程开始记笔记，或创建新的课程分类。</p>
      <button onclick="quickStart()">创建第一篇笔记</button></div>`;
    breadcrumb.innerHTML='<span>📖 课堂笔记</span>';
    return;
  }
  const {cat,note}=ctx;
  breadcrumb.innerHTML=`<span>${cat.icon} ${escapeHtml(cat.name)}</span><span>›</span><span>${escapeHtml(note.title||'无标题')}</span>`;
  editor.innerHTML=`
    <span class="note-cover" id="coverBtn" title="更换封面">${note.cover||'📄'}</span>
    <input class="note-title-input" id="titleInput" placeholder="无标题笔记" value="${escapeHtml(note.title||'')}">
    <div class="meta-row">
      <div class="meta-item"><span class="meta-label">📅 日期</span>
        <span class="meta-value"><input type="date" id="dateInput" value="${note.date||''}"></span></div>
      <div class="meta-item"><span class="meta-label">👤 教师</span>
        <span class="meta-value"><input type="text" id="teacherInput" placeholder="添加教师" value="${escapeHtml(note.teacher||'')}"></span></div>
      <div class="meta-item"><span class="meta-label">📚 课程</span>
        <span class="meta-value">${cat.icon} ${escapeHtml(cat.name)}</span></div>
    </div>
    <div class="tags-row" id="tagsRow"></div>
    <hr class="divider">
    <div class="toolbar">
      <button data-cmd="formatBlock" data-val="h1" title="标题1"><b>H1</b></button>
      <button data-cmd="formatBlock" data-val="h2" title="标题2"><b>H2</b></button>
      <button data-cmd="formatBlock" data-val="h3" title="标题3"><b>H3</b></button>
      <button data-cmd="formatBlock" data-val="p" title="正文">¶</button>
      <span class="sep"></span>
      <button data-cmd="bold" title="加粗"><b>B</b></button>
      <button data-cmd="italic" title="斜体"><i>I</i></button>
      <button data-cmd="underline" title="下划线"><u>U</u></button>
      <button data-cmd="strikeThrough" title="删除线"><s>S</s></button>
      <button data-cmd="hiliteColor" data-val="#fff3b8" title="高亮">🖍</button>
      <span class="sep"></span>
      <button data-cmd="insertUnorderedList" title="列表">•</button>
      <button data-cmd="insertOrderedList" title="编号">1.</button>
      <button data-cmd="formatBlock" data-val="blockquote" title="引用">❝</button>
      <button data-cmd="formatBlock" data-val="pre" title="代码块">&lt;/&gt;</button>
      <span class="sep"></span>
      <button data-cmd="createLink" title="链接">🔗</button>
      <button data-cmd="removeFormat" title="清除格式">⌫</button>
    </div>
    <div class="content-area" id="contentArea" contenteditable="true"
      data-placeholder="开始写下你的课堂笔记... 输入 / 可快速插入元素">${note.content||''}</div>`;
  renderTags(note);
  bindEditorEvents(note);
}

function renderTags(note){
  const row=document.getElementById('tagsRow');
  if(!row)return;
  row.innerHTML=`<span class="meta-label" style="color:var(--muted);font-size:13px">🏷️ 标签</span>`+
    (note.tags||[]).map((t,i)=>`<span class="tag">${escapeHtml(t)}<span class="x" data-i="${i}">×</span></span>`).join('')+
    `<input class="tag-input" id="tagInput" placeholder="添加标签...">`;
  row.querySelectorAll('.x').forEach(x=>x.onclick=()=>{
    note.tags.splice(+x.dataset.i,1);save();renderTags(note);
  });
  const ti=document.getElementById('tagInput');
  ti.onkeydown=(e)=>{
    if(e.key==='Enter'&&ti.value.trim()){
      note.tags=note.tags||[];note.tags.push(ti.value.trim());
      save();renderTags(note);setTimeout(()=>document.getElementById('tagInput').focus(),10);
    }
  };
}

function bindEditorEvents(note){
  const titleInput=document.getElementById('titleInput');
  titleInput.oninput=()=>{note.title=titleInput.value;save();
    breadcrumb.querySelectorAll('span')[2].textContent=note.title||'无标题';
    renderSidebar(document.getElementById('searchInput').value.toLowerCase());
  };
  document.getElementById('dateInput').onchange=(e)=>{note.date=e.target.value;save()};
  document.getElementById('teacherInput').oninput=(e)=>{note.teacher=e.target.value;save()};
  document.getElementById('coverBtn').onclick=()=>{
    const emojis=['📄','📐','📘','✏️','🧠','💡','⭐','🔬','🎯','📊','🗒️','📝','🧪','🎓'];
    note.cover=emojis[Math.floor(Math.random()*emojis.length)];
    save();renderAll();
  };
  const content=document.getElementById('contentArea');
  content.oninput=()=>{note.content=content.innerHTML;save();
    renderSidebar(document.getElementById('searchInput').value.toLowerCase());
  };
  document.querySelectorAll('.toolbar button').forEach(b=>{
    b.onmousedown=(e)=>e.preventDefault();
    b.onclick=()=>{
      const cmd=b.dataset.cmd;let val=b.dataset.val||null;
      if(cmd==='createLink'){val=prompt('链接地址：','https://');if(!val)return}
      document.execCommand(cmd,false,val);
      note.content=content.innerHTML;save();
    };
  });
}

// ============= 全局事件 =============
function renderAll(){renderSidebar(document.getElementById('searchInput').value.toLowerCase());renderEditor()}
function quickStart(){
  if(data.categories.length===0){addCategory();return}
  addNote(data.categories[0].id);
}
document.getElementById('addCategoryBtn').onclick=addCategory;
document.getElementById('newNoteBtn').onclick=()=>{
  const ctx=findCurrentNote();
  const cid=ctx?ctx.cat.id:(data.categories[0]&&data.categories[0].id);
  if(cid)addNote(cid);else addCategory();
};
document.getElementById('searchInput').oninput=(e)=>renderSidebar(e.target.value.toLowerCase());
document.getElementById('exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='classnotes-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  URL.revokeObjectURL(url);
};

// 键盘快捷键
document.addEventListener('keydown',(e)=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save();
    const tip=document.createElement('div');
    tip.textContent='✓ 已保存';
    tip.style.cssText='position:fixed;top:20px;right:20px;background:#2383e2;color:#fff;padding:8px 16px;border-radius:6px;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)';
    document.body.appendChild(tip);setTimeout(()=>tip.remove(),1200);
  }
});

renderAll();
