<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>解压泡泡 - 戳爆它们</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
html, body { width: 100%; height: 100%; overflow: hidden; touch-action: none; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
body {
  background: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 50%, #0f0524 100%);
  position: relative;
}
#stage { position: fixed; inset: 0; overflow: hidden; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.bubble {
  position: absolute;
  border-radius: 50%;
  cursor: pointer;
  pointer-events: auto;
  will-change: transform;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.2) 40%, transparent 70%),
              radial-gradient(circle at 70% 70%, var(--c2), var(--c1));
  box-shadow: inset -8px -8px 20px rgba(0,0,0,0.15),
              inset 6px 6px 15px rgba(255,255,255,0.4),
              0 0 25px var(--glow),
              0 4px 15px rgba(0,0,0,0.2);
  animation: wobble 3s ease-in-out infinite;
}
.bubble::before {
  content: '';
  position: absolute; top: 15%; left: 20%;
  width: 30%; height: 30%;
  background: radial-gradient(circle, rgba(255,255,255,0.85), transparent 70%);
  border-radius: 50%;
  filter: blur(2px);
}
@keyframes wobble {
  0%,100% { transform: scale(1) rotate(0deg); }
  50% { transform: scale(1.05) rotate(3deg); }
}
.header {
  position: fixed; top: 0; left: 0; right: 0;
  padding: 14px 20px;
  display: flex; justify-content: space-between; align-items: center;
  z-index: 100;
  background: linear-gradient(180deg, rgba(0,0,0,0.4), transparent);
  color: #fff;
}
.title { font-size: 16px; font-weight: 600; letter-spacing: 1px; text-shadow: 0 2px 8px rgba(255,100,200,0.5); }
.score {
  font-size: 14px;
  background: rgba(255,255,255,0.12);
  padding: 6px 14px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.2);
}
.score b { color: #ffd166; font-size: 18px; margin-left: 6px; }
.footer {
  position: fixed; bottom: 0; left: 0; right: 0;
  padding: 16px;
  display: flex; gap: 10px; justify-content: center;
  z-index: 100;
}
.btn {
  flex: 1; max-width: 140px;
  padding: 12px 18px;
  border: none; border-radius: 24px;
  font-size: 14px; font-weight: 600;
  color: #fff; cursor: pointer;
  background: linear-gradient(135deg, #ff6b9d, #c06ee5);
  box-shadow: 0 4px 15px rgba(192,110,229,0.4);
  transition: transform 0.15s;
}
.btn:active { transform: scale(0.94); }
.btn.muted { background: linear-gradient(135deg, #555, #333); }
.tip {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  color: rgba(255,255,255,0.5);
  font-size: 14px;
  text-align: center;
  pointer-events: none;
  letter-spacing: 2px;
  animation: fadeIn 1s;
}
.tip.hide { display: none; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.combo {
  position: fixed;
  pointer-events: none;
  font-weight: 900;
  font-size: 32px;
  color: #fff;
  text-shadow: 0 0 20px #ff6b9d, 0 2px 6px rgba(0,0,0,0.5);
  z-index: 50;
  animation: comboPop 0.8s ease-out forwards;
}
@keyframes comboPop {
  0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; }
  30% { transform: translate(-50%, -20px) scale(1.3); opacity: 1; }
  100% { transform: translate(-50%, -80px) scale(1); opacity: 0; }
}
</style>
</head>
<body>
<div class="header">
  <div class="title">✨ 解压泡泡</div>
  <div class="score">已戳爆<b id="score">0</b></div>
</div>
<div id="stage"></div>
<canvas id="particles"></canvas>
<div class="tip" id="tip">点击泡泡 释放压力</div>
<div class="footer">
  <button class="btn" id="boomBtn">💥 全部炸裂</button>
  <button class="btn" id="soundBtn">🔊 音效开</button>
</div>

<script>
(function(){
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const tip = document.getElementById('tip');
  const boomBtn = document.getElementById('boomBtn');
  const soundBtn = document.getElementById('soundBtn');

  let W = window.innerWidth, H = window.innerHeight;
  let DPR = Math.min(window.devicePixelRatio || 1, 2);
  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  resize();
  window.addEventListener('resize', resize);

  const colors = [
    ['#ff6b9d','#ffc1d6','#ff6b9d'],
    ['#7ad7f0','#c5f0fb','#7ad7f0'],
    ['#ffd166','#ffe9a8','#ffd166'],
    ['#a78bfa','#d6c8ff','#a78bfa'],
    ['#6ee7b7','#bff5dc','#6ee7b7'],
    ['#fb7185','#ffc1c8','#fb7185'],
    ['#60a5fa','#bfdbfe','#60a5fa']
  ];

  const bubbles = new Set();
  let score = 0;
  let soundOn = true;
  let firstPop = false;

  // Audio
  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
    }
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playPop(size){
    if(!soundOn) return;
    ensureAudio();
    if(!audioCtx) return;
    const now = audioCtx.currentTime;
    // tonal pop
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const baseFreq = 600 + Math.random()*400 - size*2;
    osc.type = 'sine';
    osc.frequency.setValueAtTime(baseFreq*2, now);
    osc.frequency.exponentialRampToValueAtTime(baseFreq*0.4, now+0.12);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.35, now+0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, now+0.18);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now); osc.stop(now+0.2);

    // noise burst
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate*0.08, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1 - i/data.length);
    const noise = audioCtx.createBufferSource();
    noise.buffer = buf;
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.15, now);
    ng.gain.exponentialRampToValueAtTime(0.0001, now+0.09);
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1500;
    noise.connect(filter).connect(ng).connect(audioCtx.destination);
    noise.start(now);
  }

  function rand(a,b){ return a + Math.random()*(b-a); }

  function spawnBubble(){
    if(bubbles.size > 22) return;
    const size = rand(48, 92);
    const color = colors[Math.floor(Math.random()*colors.length)];
    const el = document.createElement('div');
    el.className = 'bubble';
    el.style.width = el.style.height = size+'px';
    el.style.setProperty('--c1', color[0]);
    el.style.setProperty('--c2', color[1]);
    el.style.setProperty('--glow', color[2]);
    const x = rand(10, W - size - 10);
    const y = H + size;
    el.style.left = x+'px';
    el.style.top = y+'px';
    el.style.animationDelay = (-Math.random()*3)+'s';

    const obj = {
      el, x, y, size, color,
      vx: rand(-0.3, 0.3),
      vy: rand(-1.4, -2.6),
      sway: rand(0.5, 1.5),
      swayPhase: Math.random()*Math.PI*2,
      alive: true
    };
    bubbles.add(obj);

    const pop = (ev) => {
      if(!obj.alive) return;
      ev.preventDefault(); ev.stopPropagation();
      popBubble(obj);
    };
    el.addEventListener('touchstart', pop, {passive:false});
    el.addEventListener('mousedown', pop);

    stage.appendChild(el);
  }

  function popBubble(obj){
    if(!obj.alive) return;
    obj.alive = false;
    bubbles.delete(obj);
    const rect = obj.el.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    spawnParticles(cx, cy, obj.color, obj.size);
    playPop(obj.size);
    score++;
    scoreEl.textContent = score;
    showCombo(cx, cy);
    if(!firstPop){ firstPop = true; tip.classList.add('hide'); }
    // remove element with quick scale
    obj.el.style.transition = 'transform 0.12s, opacity 0.12s';
    obj.el.style.transform = 'scale(1.6)';
    obj.el.style.opacity = '0';
    setTimeout(()=> obj.el.remove(), 130);
  }

  function showCombo(x,y){
    const labels = ['POP!','BOOM!','啵~','爽!','💥','痛快','解压','棒'];
    const c = document.createElement('div');
    c.className = 'combo';
    c.textContent = labels[Math.floor(Math.random()*labels.length)];
    c.style.left = x+'px';
    c.style.top = (y-10)+'px';
    document.body.appendChild(c);
    setTimeout(()=> c.remove(), 800);
  }

  // Particles
  const particles = [];
  function spawnParticles(x, y, color, size){
    const count = Math.floor(size/3) + 14;
    for(let i=0;i<count;i++){
      const a = Math.random()*Math.PI*2;
      const sp = rand(2, 7);
      particles.push({
        x, y,
        vx: Math.cos(a)*sp,
        vy: Math.sin(a)*sp - 1,
        life: 1,
        decay: rand(0.018, 0.035),
        r: rand(2, 5),
        color: color[Math.floor(Math.random()*color.length)]
      });
    }
    // ring
    for(let i=0;i<18;i++){
      const a = (i/18)*Math.PI*2;
      const sp = rand(4, 6);
      particles.push({
        x, y,
        vx: Math.cos(a)*sp,
        vy: Math.sin(a)*sp,
        life: 1,
        decay: 0.04,
        r: rand(1.5, 3),
        color: '#ffffff'
      });
    }
  }

  function tick(){
    // update bubbles
    for(const b of bubbles){
      b.swayPhase += 0.04;
      b.x += b.vx + Math.sin(b.swayPhase)*b.sway*0.3;
      b.y += b.vy;
      if(b.y < -b.size - 20){
        b.alive = false;
        b.el.remove();
        bubbles.delete(b);
        continue;
      }
      b.el.style.left = b.x+'px';
      b.el.style.top = b.y+'px';
    }

    // particles
    ctx.clearRect(0,0,W,H);
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.18;
      p.vx *= 0.98;
      p.life -= p.decay;
      if(p.life <= 0){ particles.splice(i,1); continue; }
      ctx.globalAlpha = Math.max(0,p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI*2);
      ctx.fill();
      // glow
      ctx.globalAlpha = Math.max(0,p.life)*0.4;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life * 2.2, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(tick);
  }
  tick();

  // spawn loop
  setInterval(spawnBubble, 600);
  for(let i=0;i<6;i++) setTimeout(spawnBubble, i*200);

  // Boom all
  boomBtn.addEventListener('click', ()=>{
    ensureAudio();
    let delay = 0;
    for(const b of Array.from(bubbles)){
      setTimeout(()=> popBubble(b), delay);
      delay += 40;
    }
  });

  // Sound toggle
  soundBtn.addEventListener('click', ()=>{
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '🔊 音效开' : '🔇 音效关';
    soundBtn.classList.toggle('muted', !soundOn);
    if(soundOn) ensureAudio();
  });

  // Unlock audio on first touch
  document.addEventListener('touchstart', ensureAudio, {once:true});
  document.addEventListener('mousedown', ensureAudio, {once:true});

  // Prevent context menu / double-tap zoom
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('contextmenu', e => e.preventDefault());
})();
</script>
</body>
</html>
